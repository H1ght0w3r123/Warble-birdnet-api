// Face/beak colour customization was dropped when the avatar moved to real
// illustrated art (the beak is baked into the body art as a fixed colour
// in every variant) - body is the only recolorable part now, so there's no
// part-toggle needed, just the one swatch row.
// Relative luminance of a hex swatch, for deciding what colour a mark laid
// on top of it has to be.
function swatchLuminance(hex) {
  const v = i => {
    const c = parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16) / 255;
    return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * v(0) + 0.7152 * v(1) + 0.0722 * v(2);
}

// The endless swatch strip. The palette is laid down SWATCH_COPIES times
// end to end and the view kept on the middle copy: when a swipe settles
// anywhere outside it, the strip jumps back by exactly one copy's width. Every
// copy is identical and the jump is a whole number of swatches, so the snap
// point and the picture are the same before and after - the child never sees
// it. Five copies leave a copy and a half of runway either side, more than a
// hard fling covers before it settles.
// Built once per visit. A tap only moves the tick; rebuilding the strip on
// every tap would throw it back to the start under the child's finger.
const SWATCH_COPIES = 5;

// The distance from one swatch to the next. offsetLeft rounds to whole
// pixels and the real spacing is fractional (29.44px on a 320px phone), so
// measuring one gap was up to half a pixel out - and that error, multiplied
// forty-odd swatches to reach the middle copy, opened the strip one colour
// off. Measured across the whole strip the rounding is shared out ninety ways.
function swatchPitch(wheel) {
  const b = wheel.children;
  return b.length > 1 ? (b[b.length - 1].offsetLeft - b[0].offsetLeft) / (b.length - 1) : 0;
}

// Keep the view on the middle copy. No module state: the settle timer lives on
// the element, so a strip thrown away by a re-render takes its timer with it.
function loopSwatches(wheel) {
  const pitch = swatchPitch(wheel);
  if (!pitch) return;
  const copy = AVATAR_SWATCHES.length * pitch;
  const mid = Math.floor(SWATCH_COPIES / 2);
  if (wheel.scrollLeft < (mid - 0.5) * copy) wheel.scrollLeft += copy;
  else if (wheel.scrollLeft >= (mid + 0.5) * copy) wheel.scrollLeft -= copy;
}

// Open with the child's colour in the middle of the nine (the fifth slot).
// The strip has no width until it is laid out, so wait a frame if it has not
// been yet - but only while it is still on the page.
function centreSwatch(wheel, hex, tries) {
  if (!wheel.isConnected) return;
  const pitch = swatchPitch(wheel);
  if (!pitch) {
    if ((tries || 0) < 20) requestAnimationFrame(() => centreSwatch(wheel, hex, (tries || 0) + 1));
    return;
  }
  const i = Math.max(0, AVATAR_SWATCHES.findIndex(sw => sw.hex === hex));
  const mid = Math.floor(SWATCH_COPIES / 2);
  wheel.scrollLeft = (mid * AVATAR_SWATCHES.length + i - 4) * pitch;
}

function renderSwatchRows() {
  const wheel = document.getElementById('colorWheel');
  if (!wheel) return;
  const current = (currentProfile.avatar_body || '').toUpperCase();

  if (wheel.dataset.built !== String(AVATAR_SWATCHES.length)) {
    wheel.innerHTML = '';
    const mid = Math.floor(SWATCH_COPIES / 2);
    for (let copy = 0; copy < SWATCH_COPIES; copy++) {
      AVATAR_SWATCHES.forEach(({ hex, name }) => {
        const btn = document.createElement('button');
        btn.className = 'color-swatch';
        btn.dataset.hex = hex;
        btn.style.background = hex;
        btn.style.borderColor = '#fff';
        btn.setAttribute('aria-label', name + ' feathers');
        // Only the middle copy is real to a screen reader or the Tab key;
        // the rest are scenery for the loop.
        if (copy !== mid) { btn.tabIndex = -1; btn.setAttribute('aria-hidden', 'true'); }
        btn.onclick = () => {
          const cost = colourCost(hex);
          if (cost) return trySpecialColour(hex, name, cost);
          colourPreview = null;
          if ((currentProfile.avatar_body || '').toUpperCase() === hex) { renderDressUpPreview(); return; }
          currentProfile.avatar_body = hex;
          flashAvatar('tint');
          saveAvatarColors();
        };
        wheel.appendChild(btn);
      });
    }
    wheel.dataset.built = String(AVATAR_SWATCHES.length);
    wheel.addEventListener('scroll', () => {
      clearTimeout(wheel._settle);
      wheel._settle = setTimeout(() => loopSwatches(wheel), 140);
    }, { passive: true });
    wheel.addEventListener('scrollend', () => loopSwatches(wheel));
    centreSwatch(wheel, current);
  }

  // The tick sits ON the swatch, so its colour comes from the swatch. White
  // on the white swatch would not be there at all; this picks whichever of
  // ink or white that swatch can actually carry. Every copy of the chosen
  // colour carries it, so it is ticked wherever the strip has scrolled to.
  wheel.querySelectorAll('.color-swatch').forEach(btn => {
    btn.classList.toggle('special', !!colourCost(btn.dataset.hex));
    const on = btn.dataset.hex === current;
    btn.classList.toggle('is-on', on);
    btn.setAttribute('aria-pressed', String(on));
    btn.style.color = on ? (swatchLuminance(btn.dataset.hex) > 0.55 ? 'var(--ink)' : '#fff') : '';
  });
}

// Bird species picker: a fixed, non-scrolling white circle (the real
// avatar, full colour, colour wheel arched over it) sits on top of an
// independently-scrolling track of silhouettes. Unlike the earlier
// version, the track is built ONCE per Dress Up visit and never rebuilt -
// selection only ever toggles a class and swaps which button is hidden
// behind the circle, so a bird already mid-transition keeps moving
// continuously as part of the same strip rather than popping between
// states. That continuity is also what makes the loop and the circle-drag
// below possible: both just manipulate scrollLeft/classes on stable DOM.
//
// Endless loop: the species list is repeated three times back to back.
// Normal scrolling happens inside the middle copy; once the settled
// position drifts into the first or third copy, we silently (no
// animation - scrollLeft assignment is instant) jump scrollLeft by one
// copy-width to land on the pixel-identical spot in the middle copy, then
// re-find the centred button there. Since every copy is visually
// identical this jump is imperceptible - it just gives room to keep
// scrolling in the same direction forever.
const SPECIES_LOOP_COPIES = 3;
let speciesScrollSettleTimer = null;
let speciesScrollRAF = null;
let activeSpeciesBtn = null;

// The chevrons drive the same strip a swipe does, rather than setting the
// species directly: scrolling it is what commits a choice, updates the
// preview and saves, so both routes go through exactly one code path. The
// endless three-copy loop keeps rewrapping to the middle copy, so there is
// always a button one step either side of the active one to scroll to.
function stepSpecies(dir) {
  const track = document.getElementById('speciesTrack');
  if (!track) return;
  const btns = [...track.querySelectorAll('.species-silhouette-btn')];
  const i = btns.indexOf(activeSpeciesBtn);
  const next = btns[(i < 0 ? 0 : i) + dir];
  if (!next) return;
  next.scrollIntoView({ inline: 'center', block: 'nearest',
                        behavior: reducedMotion() ? 'auto' : 'smooth' });
}

function initDressUpAvatarPicker() {
  const track = document.getElementById('speciesTrack');
  const circle = document.querySelector('#dressUpAvatarStage .avatar-frame');
  if (!track) return;
  activeSpeciesBtn = null;

  let html = '';
  for (let copy = 0; copy < SPECIES_LOOP_COPIES; copy++) {
    html += AVATAR_SPECIES.map(sp => `
      <button class="species-silhouette-btn" data-species="${sp.id}" aria-label="Switch to ${sp.name}">
        <img src="/static/avatar/silhouette_${sp.id}.webp" alt="">
      </button>`).join('');
  }
  track.innerHTML = html;

  track.querySelectorAll('.species-silhouette-btn').forEach(btn => {
    btn.onclick = () => btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  });
  track.addEventListener('scroll', onSpeciesTrackScroll, { passive: true });

  // Jump straight to the middle copy's instance of the saved species, with
  // no animation, before anything is visible - the very first render
  // shouldn't visibly scroll in from the edge. This sets activeSpeciesBtn
  // directly rather than through markActiveButton, since the species here
  // already matches currentProfile and markActiveButton's job is reacting
  // to a *change* - the actual preview/swatches render is done explicitly
  // below regardless, so it can't be skipped the way it was before.
  const current = currentProfile.avatar_species || 'default';
  const startIdx = Math.max(0, AVATAR_SPECIES.findIndex(sp => sp.id === current));
  const middleCopyButtons = track.querySelectorAll('.species-silhouette-btn');
  const startBtn = middleCopyButtons[AVATAR_SPECIES.length + startIdx];
  if (startBtn) {
    startBtn.scrollIntoView({ inline: 'center', block: 'nearest' });
    setActiveSilhouette(startBtn);
    updateSpeciesTrackVisuals(track);
  }

  if (circle) setupCircleDragBridge(track, circle);

  renderDressUpPreview();
  renderSwatchRows();
}

function onSpeciesTrackScroll() {
  // Two separate concerns, deliberately on different cadences:
  // - which button is hidden (is-current) needs to track the scroll in
  //   real time, every frame, so the outgoing bird visibly slides away as
  //   part of the same continuous motion as everything else, rather than
  //   staying invisible for the whole swipe and only reappearing once
  //   things stop moving.
  // - actually committing the selection (updating the profile, re-
  //   rendering the coloured avatar, saving to the server) stays
  //   debounced to settle, so the main avatar doesn't flicker through
  //   every bird you scroll past and the server isn't hit mid-swipe.
  if (!speciesScrollRAF) {
    speciesScrollRAF = requestAnimationFrame(() => {
      speciesScrollRAF = null;
      const track = document.getElementById('speciesTrack');
      if (!track) return;
      const centred = findCentredSpeciesButton(track);
      if (centred) setActiveSilhouette(centred);
    });
  }
  clearTimeout(speciesScrollSettleTimer);
  speciesScrollSettleTimer = setTimeout(onSpeciesTrackSettled, 130);
}

function findCentredSpeciesButton(track) {
  return updateSpeciesTrackVisuals(track);
}

// Scales every silhouette by how close it is to the fixed circle - 90% at
// rest, growing smoothly to 100% (matching the selected bird's own size)
// as it approaches centre, shrinking back to 90% as it moves away. Runs
// on the same per-frame cadence as the hidden/visible handoff, and
// returns whichever button is currently closest to centre so callers
// don't need a second pass over the DOM.
const SPECIES_SCALE_REST = 0.9;
const SPECIES_SCALE_DISTANCE = 85; // px of travel over which the scale fully settles

function updateSpeciesTrackVisuals(track) {
  const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
  let best = null, bestDist = Infinity;
  track.querySelectorAll('.species-silhouette-btn').forEach(btn => {
    const r = btn.getBoundingClientRect();
    const dist = Math.abs((r.left + r.width / 2) - mid);
    const t = Math.min(1, dist / SPECIES_SCALE_DISTANCE);
    btn.style.transform = `scale(${1 - (1 - SPECIES_SCALE_REST) * t})`;
    if (dist < bestDist) { bestDist = dist; best = btn; }
  });
  return best;
}

function onSpeciesTrackSettled() {
  const track = document.getElementById('speciesTrack');
  if (!track) return;
  const centred = findCentredSpeciesButton(track);
  if (centred) {
    setActiveSilhouette(centred);          // no-op if the RAF loop above already set it
    commitSpeciesSelection(centred.dataset.species);
  }
  rewrapToMiddleCopy(track, centred);
}

// Endless-loop rewrap. Deliberately NOT scrollWidth/SPECIES_LOOP_COPIES:
// the track has large left/right padding (so the first/last species can
// still scroll to centre), which is outside all three copies but still
// counted in scrollWidth - dividing that total by 3 overstates a single
// copy's actual width, so the jump landed short, off by exactly the
// padding's share of the error. That's what was causing the mismatch:
// the "same" bird one copy over wasn't actually behind the circle after
// the jump, silhouettes stopped lining up with the species that ended up
// selected, and skipped/repeated ones could appear to flash by.
// Measuring the exact offset between the centred button and its literal
// counterpart n items over sidesteps the padding entirely - it's a
// precise, self-correcting distance with no assumptions baked in.
function rewrapToMiddleCopy(track, centred) {
  if (!centred) return;
  const buttons = track.querySelectorAll('.species-silhouette-btn');
  const idx = Array.prototype.indexOf.call(buttons, centred);
  const n = AVATAR_SPECIES.length;
  const copyIndex = Math.floor(idx / n);       // 0, 1, or 2 of the 3 copies
  const middleCopyIndex = Math.floor(SPECIES_LOOP_COPIES / 2); // 1
  if (copyIndex === middleCopyIndex) return;   // already in the safe middle copy

  const counterpart = buttons[idx + (middleCopyIndex - copyIndex) * n];
  if (!counterpart) return;
  track.scrollLeft += counterpart.getBoundingClientRect().left - centred.getBoundingClientRect().left;

  // We jumped copies - re-anchor the active-button reference to the
  // physically different (but visually identical) node now behind the
  // circle. Same species either way, so this never re-commits.
  const recentred = findCentredSpeciesButton(track);
  if (recentred) setActiveSilhouette(recentred);
}

// Purely visual: which DOM button (not just which species id, since the
// same species exists in all three loop copies) is hidden behind the
// circle right now. Safe to call every frame - it never touches the
// profile or the server.
function setActiveSilhouette(btn) {
  if (activeSpeciesBtn === btn) return;
  if (activeSpeciesBtn) activeSpeciesBtn.classList.remove('is-current');
  activeSpeciesBtn = btn;
  activeSpeciesBtn.classList.add('is-current');
}

// The actual selection: only called once scrolling has settled.
function commitSpeciesSelection(id) {
  const lock = avatarLock(id);
  const el = document.getElementById('dressUpPreview');
  if (lock) {
    // A bird still to find: shown as its dark shape with how to find it.
    // Nothing is saved - the bird they were wearing stays theirs.
    const sp = AVATAR_SPECIES.find(x => x.id === id);
    if (el) {
      el.innerHTML = avatarSvg(currentProfile.avatar_body, 252, null, false, id) +
        '<span class="bird-lock big" aria-hidden="true">?</span>';
      el.classList.add('locked-bird');
    }
    setDressUpHint(`${lock.hint.replace(/ to unlock$/, '')} to become ${/^[aeiou]/i.test(sp.name) ? 'an' : 'a'} ${sp.name}!`);
    return;
  }
  if (el && el.classList.contains('locked-bird')) {
    el.classList.remove('locked-bird');
    setDressUpHint('');
    if (currentProfile.avatar_species === id) { renderDressUpPreview(); return; }
    el.innerHTML = '';
  }
  if (currentProfile.avatar_species === id) return;
  const from = currentProfile.avatar_species;
  currentProfile.avatar_species = id;
  swapAvatar(from, id);
  updateNavAvatarIcon();
  saveSpeciesSelection(id);
}

// Which way the new bird came in: the shorter way round the looping
// carousel from the old one. 1 = from the right, -1 = from the left.
function speciesDirection(from, to) {
  const n = AVATAR_SPECIES.length;
  const a = AVATAR_SPECIES.findIndex(sp => sp.id === from);
  const b = AVATAR_SPECIES.findIndex(sp => sp.id === to);
  if (a < 0 || b < 0) return 1;
  let d = ((b - a) % n + n) % n;
  if (d > n / 2) d -= n;
  return d < 0 ? -1 : 1;
}

// Every picture a bird is drawn from, fetched before it slides in, so it
// never arrives half-drawn. Gives up waiting after 1.5s - a slow network
// gets a bird that finishes painting in place rather than no bird.
function preloadBird(species) {
  const bird = protoBird(species);
  const files = [];
  bird.stack.forEach(l => { files.push(l.f); if (l.wash) files.push(l.wash); });
  const all = Promise.all(files.map(f => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = res;
    im.src = bird.dir + f;
  })));
  return Promise.race([all, new Promise(res => setTimeout(res, 1500))]);
}

// The bird swap in the Hoot-tique (CSS and order of events under .swap-out).
// avatarSwapGen is bumped by every swap and every plain re-render, so a step
// from an older swap that fires late does nothing.
let avatarSwapGen = 0;
function swapAvatar(from, to) {
  const el = document.getElementById('dressUpPreview');
  if (!el) return;
  const html = avatarSvg(currentProfile.avatar_body, 252, currentProfile.equipped, false, to);
  const oldSvg = el.querySelector('.swap-in svg') || el.querySelector(':scope > svg');
  const gen = ++avatarSwapGen;
  if (!oldSvg || reducedMotion()) { el.innerHTML = html; return; }
  const live = () => gen === avatarSwapGen && el.isConnected;

  el.classList.remove('pop', 'tint', 'catch');
  el.style.setProperty('--dir', speciesDirection(from, to));
  const make = (cls, content) => {
    const d = document.createElement('div');
    d.className = cls;
    if (typeof content === 'string') d.innerHTML = content; else d.appendChild(content);
    return d;
  };
  const inn = make('swap-in', html);
  const out = make('swap-out leaving', oldSvg);
  // Caught mid-swap already? Keep the accessories hanging where they are
  // rather than snapping them back to full size first.
  const wasFalling = !!el.querySelector('.swap-acc');
  // Just the accessories, lifted out of a copy of the new bird: keeping its
  // svg element and outer group means they sit exactly where they will land, and
  // dropping the bird's own layers and recolouring filters keeps this third
  // picture cheap to draw.
  const accSvg = inn.firstElementChild.cloneNode(true);
  accSvg.querySelector('defs')?.remove();
  accSvg.querySelectorAll(':scope > g > g:not(.av-acc)').forEach(g => g.remove());
  const acc = make('swap-acc falling', accSvg);
  if (wasFalling) acc.style.animationDuration = '0s';
  el.replaceChildren(inn, out, acc);

  // The new bird follows the old one out by a beat, and waits for its
  // pictures if they aren't in yet - the accessories hang there meanwhile.
  const followed = new Promise(res => setTimeout(res, 50));
  Promise.all([followed, preloadBird(to)]).then(() => {
    if (!live()) return;
    inn.classList.add('arriving');
    // Spring the accessories back so they land as the bird does: the catch
    // starts 60ms into the 260ms slide and lasts 200ms.
    setTimeout(() => {
      if (!live()) return;
      acc.style.animationDuration = '';
      acc.classList.replace('falling', 'caught');
    }, 60);
    setTimeout(() => {
      if (!live()) return;
      // Back to the plain SVG a normal render leaves, then the dip.
      el.replaceChildren(inn.firstElementChild);
      flashAvatar('catch');
    }, 270);
  });
}

async function saveSpeciesSelection(speciesId) {
  const formData = new FormData();
  formData.append('avatar_species', speciesId);
  try { await fetch('/profile', { method: 'POST', body: formData }); } catch (e) { /* ok to fail quietly */ }
}

// Lets a drag that starts on the circle itself move the carousel, even
// though the circle is a separate fixed element sitting on top of the
// scrolling track rather than part of it.
function setupCircleDragBridge(track, circle) {
  if (circle.dataset.dragBound) return;
  circle.dataset.dragBound = '1';
  circle.style.touchAction = 'pan-y';
  let dragging = false, startX = 0, startScrollLeft = 0, moved = false;

  circle.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX;
    startScrollLeft = track.scrollLeft;
    circle.setPointerCapture(e.pointerId);
  });
  circle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;
    track.scrollLeft = startScrollLeft - dx;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      const centred = findCentredSpeciesButton(track);
      if (centred) centred.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  };
  circle.addEventListener('pointerup', endDrag);
  circle.addEventListener('pointercancel', endDrag);
}

async function loadProfileLocations() {
  const listEl = document.getElementById('locationsList');
  if (!listEl) return;
  try {
    const res = await fetch('/locations');
    const data = await res.json();
    const locations = data.locations || [];
    if (locations.length === 0) {
      listEl.innerHTML = `<div class="collection-empty">No locations named yet</div>`;
      return;
    }
    listEl.innerHTML = locations.map(loc => `
      <div class="location-row" data-id="${loc.id}">
        <a class="location-row-name location-map-link"
           href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}#map=16/${loc.lat}/${loc.lng}"
           target="_blank" rel="noopener">${icon('pin')} <span class="location-name-text">${loc.name}</span></a>${loc.spots > 1 ? `<span class="location-spots">${loc.spots} spots</span>` : ''}
        <span class="location-row-actions">
          <button class="location-edit-btn" data-id="${loc.id}">Edit</button>
          <button class="location-delete-btn" data-id="${loc.id}" aria-label="Delete ${loc.name}">${icon('close')}</button>
        </span>
      </div>
    `).join('');
    listEl.querySelectorAll('.location-edit-btn').forEach(btn => {
      btn.onclick = () => editLocationPrompt(parseInt(btn.dataset.id, 10), listEl);
    });
    listEl.querySelectorAll('.location-delete-btn').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('.location-row');
        const name = row.querySelector('.location-name-text').textContent;
        if (!confirm(`Forget the name "${name}"? The place stays, it just becomes unnamed again.`)) return;
        try {
          await fetch(`/locations/${btn.dataset.id}/delete`, { method: 'POST' });
          loadProfileLocations();
        } catch (e) { /* leave the list as-is if it fails */ }
      };
    });
  } catch (e) {
    listEl.innerHTML = `<div class="collection-empty">Couldn't load locations right now.</div>`;
  }
}

function editLocationPrompt(id, listEl) {
  const row = listEl.querySelector(`.location-row[data-id="${id}"]`);
  if (!row) return;
  const currentName = row.querySelector('.location-name-text').textContent;
  row.innerHTML = `
    <input type="text" class="location-input" style="margin:0;flex:1;padding:6px 10px;" value="${currentName}" id="editInput${id}">
    <button class="location-edit-btn" id="saveEdit${id}">Save</button>
  `;
  document.getElementById(`saveEdit${id}`).onclick = async () => {
    const newName = document.getElementById(`editInput${id}`).value.trim();
    if (!newName) return;
    const formData = new FormData();
    formData.append('name', newName);
    try {
      await fetch(`/locations/${id}/rename`, { method: 'POST', body: formData });
    } catch (e) { /* ok to fail quietly */ }
    loadProfileLocations();
  };
}

// Circular arrow and shuffle, drawn rather than lettered - the brief wants
// these to read as utilities, and two words at the widest point of the
// screen read as the main thing to do.
const CHEVRON_L_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>`;
const CHEVRON_R_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>`;
const RESET_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>`;
const SHUFFLE_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h3.5l3 4"/><path d="M14.5 17H18"/><path d="M3 18h3.5l7-12H18"/><path d="M16 3.5 19 6l-3 2.5"/><path d="M16 14.5 19 17l-3 2.5"/></svg>`;

// The entrance. The shop opens: this tab's own contents - the shop, the
// swatches, the selectors, all of it - are not there yet, and the sign
// arrives big and centred in the space they will fill, bumps twice, then
// flies up onto the shop's top rail as the rest of it bumps into view
// behind. Nothing outside the tab is touched: the top bar and the nav stay
// lit throughout.
//
// The sign that flies is a COPY, fixed to the page, not the one on the
// shop. The real one never moves or resizes, so no part of this touches
// layout: the flyer's whole job is to travel from the middle of the screen
// to wherever the real one happens to be sitting, which is measured rather
// than assumed - so it still lands correctly at 320px, at 430px, or if the
// sign is moved on the shop again.
const HOOT_ENTRANCE = {
  appear: 180,     // fade up from small
  bump1:  240,     // a small one
  spin:   520,     // one clockwise turn
  read:  1000,     // sign holds still with the tagline under it, long enough
                   // for a child (or the grown-up reading it out) to get
                   // through it - the line is fully up for about 1.8s of this
  bump2:  300,     // then a bigger one
  travel: 740,     // fly up onto the shop
};
// It plays on every visit, so a tap anywhere above the nav skips straight
// to the finished shop rather than making a child sit through it again.

// Leaving the tab part-way through has to take the entrance with it,
// otherwise the greeting hangs over whatever screen you went to until its
// timer runs out. setActiveTab calls this on every navigation - including,
// via renderIdle, once while this file is still being evaluated, which is
// why there is no module-level state here to clear: `let` at this point in
// the file would not be initialised yet and reading it would throw.
// Nothing needs clearing anyway. The hand-over below closes over its own
// greeting, flyer and sign, so a timer left running from an abandoned
// entrance removes nodes that are already detached and toggles a class on a
// wrapper that is no longer on the page. It cannot reach into a later one.
function endHootEntrance() {
  document.querySelectorAll('.hoot-greet, .hoot-flyer, .hoot-skip').forEach(el => el.remove());
}

function playHootEntrance() {
  endHootEntrance();
  const sign = document.getElementById('hootSign');
  const body = document.getElementById('hootBody');
  if (!sign || !body) return;

  const reveal = () => { sign.style.visibility = ''; body.classList.remove('arriving'); };

  // Reduced motion gets the finished screen, with nothing to sit through.
  if (reducedMotion()) { reveal(); return; }

  // Measured with the wrapper still untransformed, so this is where the
  // sign comes to rest - not where it happens to be mid-bump.
  const target = sign.getBoundingClientRect();
  if (!target.width) { reveal(); return; }

  // Big, but not so big the sign falls apart: the artwork is 314px wide, so
  // 230 CSS px is already a 2.2x upscale on a 3x screen. Past that the
  // carved edges visibly soften.
  const bigW = Math.min(230, window.innerWidth * 0.74);
  const bigH = bigW * (target.height / target.width);
  const centreX = window.innerWidth / 2;
  const centreY = window.innerHeight * 0.42;

  const flyer = document.createElement('img');
  flyer.src = sign.currentSrc || sign.src;
  flyer.alt = '';
  flyer.className = 'hoot-flyer';
  flyer.style.width = bigW + 'px';
  flyer.style.left = (centreX - bigW / 2) + 'px';
  flyer.style.top = (centreY - bigH / 2) + 'px';
  document.body.appendChild(flyer);

  const greet = document.createElement('div');
  greet.className = 'hoot-greet';
  greet.textContent = 'Where every bird leaves looking fly!';
  greet.style.top = (centreY + bigH / 2 + 22) + 'px';
  document.body.appendChild(greet);

  // Where it has to end up, relative to where it starts.
  const dx = (target.left + target.width / 2) - centreX;
  const dy = (target.top + target.height / 2) - centreY;
  const k = target.width / bigW;

  const t = HOOT_ENTRANCE;
  const total = t.appear + t.bump1 + t.spin + t.read + t.bump2 + t.travel;
  const at = ms => ms / total;   // keyframe offsets are fractions of the whole

  const tAppear = t.appear;
  const tBump1 = tAppear + t.bump1;
  const tSpin = tBump1 + t.spin;
  const tRead = tSpin + t.read;
  const tBump2 = tRead + t.bump2;

  // A small bump, a clockwise turn, then a bigger bump, then it leaves.
  // rotate() in the plane of the screen rather than rotateY: a wide wordmark
  // turning on its vertical axis spends most of the turn edge-on and
  // unreadable, where a flat spin stays legible the whole way round.
  // The rotation stays at 360deg from there on, which is the identity, so it
  // has no effect on the bump or the travel that follow it.
  const flyerAnim = flyer.animate([
    { offset: 0,            opacity: 0, transform: 'translate(0px,0px) scale(0.8) rotate(0deg)', easing: 'ease-out' },
    { offset: at(tAppear),  opacity: 1, transform: 'translate(0px,0px) scale(1) rotate(0deg)', easing: 'ease-out' },
    { offset: at(tAppear + t.bump1 * 0.42), opacity: 1, transform: 'translate(0px,0px) scale(1.07) rotate(0deg)', easing: 'ease-in-out' },
    { offset: at(tBump1),   opacity: 1, transform: 'translate(0px,0px) scale(1) rotate(0deg)', easing: 'cubic-bezier(.5,0,.5,1)' },
    { offset: at(tSpin),    opacity: 1, transform: 'translate(0px,0px) scale(1) rotate(360deg)', easing: 'ease-in-out' },
    // While the tagline is up the sign doesn't freeze: one slow, small
    // breath, so the screen still feels alive without pulling the eye off
    // the words.
    { offset: at(tSpin + t.read * 0.5), opacity: 1, transform: 'translate(0px,0px) scale(1.03) rotate(360deg)', easing: 'ease-in-out' },
    { offset: at(tRead),    opacity: 1, transform: 'translate(0px,0px) scale(1) rotate(360deg)', easing: 'ease-out' },
    { offset: at(tRead + t.bump2 * 0.42),   opacity: 1, transform: 'translate(0px,0px) scale(1.17) rotate(360deg)', easing: 'ease-in-out' },
    { offset: at(tBump2),   opacity: 1, transform: 'translate(0px,0px) scale(1) rotate(360deg)', easing: 'cubic-bezier(.55,0,.25,1)' },
    { offset: 1,            opacity: 1, transform: `translate(${dx}px,${dy}px) scale(${k}) rotate(360deg)` },
  ], { duration: total, fill: 'both' });

  // The greeting waits for the spin to finish. A wide sign turning in the
  // plane of the screen sweeps a box far taller than it is at rest - at 45
  // degrees this one reaches 124px either side of its centre against 46px
  // standing still - so any line close enough underneath to read as its
  // subtitle gets swept straight through. Rather than push the line 90px
  // clear and leave it stranded, it arrives once the sign is level again,
  // stays up for the whole read, and is gone by the time the sign has
  // finished its last bump - before the sign leaves and the shop arrives.
  const greetAnim = greet.animate([
    { offset: 0, opacity: 0 },
    { offset: at(tSpin), opacity: 0, transform: 'translateY(6px)', easing: 'ease-out' },
    { offset: at(tSpin + 260), opacity: 1, transform: 'translateY(0)' },
    { offset: at(tRead), opacity: 1 },
    { offset: at(tBump2), opacity: 0 },
    { offset: 1, opacity: 0 },
  ], { duration: total, easing: 'linear', fill: 'both' });

  // The shop comes up as the sign starts travelling, so the two read as one
  // move rather than two, and lands exactly when the sign does - any later
  // and the sign would be handing over to a wrapper still mid-bump, which
  // would put the real one a pixel or two off where the flyer stopped.
  reveal();
  const bodyAnim = body.animate([
    { opacity: 0, transform: 'scale(0.93)' },
    { opacity: 1, transform: 'scale(1.035)', offset: 0.74 },
    { opacity: 1, transform: 'scale(1)' },
  ], { duration: t.travel, delay: tBump2, easing: 'cubic-bezier(.3,.8,.4,1)', fill: 'backwards' });

  // A clear layer over the tab (not the nav) catches a tap to skip. It also
  // stops that tap landing on a swatch or button in the still-invisible
  // shop underneath.
  const skip = document.createElement('div');
  skip.className = 'hoot-skip';
  document.body.appendChild(skip);

  // Hand over: the real sign appears exactly where the flyer stopped, and
  // the flyer and the greeting are taken back out of the page. Runs once,
  // whether the entrance ran its course or was tapped through.
  sign.style.visibility = 'hidden';
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    clearTimeout(timer);
    [flyerAnim, greetAnim, bodyAnim].forEach(a => { try { a.finish(); } catch (e) { /* gone */ } });
    sign.style.visibility = '';
    flyer.remove();
    greet.remove();
    skip.remove();
  };
  skip.addEventListener('pointerdown', finish);
  const timer = setTimeout(finish, total);
}

// One helper for all three, so they cannot fight: re-adding a class that is
// already there does not restart a CSS animation, which is why this takes it
// off and forces a reflow before putting it back.
function flashAvatar(kind) {
  const el = document.getElementById('dressUpPreview');
  if (!el || reducedMotion()) return;
  el.classList.remove('pop', 'tint', 'catch');
  void el.offsetWidth;
  el.classList.add(kind);
}

// A handful of sparks off the frame's edge, for putting something on. Kept
// to the frame's own box so they cannot land on the nav or the carousel.
function sparkleAvatar() {
  const wrap = document.querySelector('.avatar-frame-wrap');
  if (!wrap || reducedMotion()) return;
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'hoot-spark';
    s.textContent = '\u2728';
    s.style.left = (18 + Math.random() * 64) + '%';
    s.style.top = (20 + Math.random() * 50) + '%';

}

// Randomise: a complete look out of what the player actually owns. Each
// category independently gets one of its owned items or nothing, so a child
// with three hats and no shoes gets a hat and bare feet rather than a
// half-applied outfit or an empty one.
async function randomiseOutfit() {
  const owned = accessoryCatalog.filter(a => a.owned);
  if (!owned.length) { setDressUpHint('Buy something first!'); return; }
  const picked = {};
  dressUpCategories.forEach(cat => {
    const mine = owned.filter(a => a.category === cat.id);
    if (!mine.length) return;
    // A one-in-four chance of leaving a slot empty, so it does not always
    // come back wearing absolutely everything.
    picked[cat.id] = Math.random() < 0.25 ? null : mine[Math.floor(Math.random() * mine.length)].id;
  });
  currentProfile.equipped = picked;
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  flashAvatar('pop');
  sparkleAvatar();
  setDressUpHint('How about this?');
  for (const [category, id] of Object.entries(picked)) {
    const formData = new FormData();
    formData.append('category', category);
    if (id) formData.append('accessory_id', id);
    try { await fetch('/accessories/equip', { method: 'POST', body: formData }); }
    catch (e) { /* local state already updated */ }
  }
}

async function resetAllAccessories() {
  const worn = Object.entries(currentProfile.equipped || {}).filter(([, id]) => id);
  if (!worn.length) { setDressUpHint('Nothing to take off'); return; }

  currentProfile.equipped = {};
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  setDressUpHint('Took everything off');

  // Clear each slot server-side. Items stay owned - this only unequips.
  for (const [category] of worn) {

    formData.append('category', category);
    try { await fetch('/accessories/equip', { method: 'POST', body: formData }); }
    catch (e) { /* local state already updated */ }
  }
}

function renderCarousel() {
  const wrap = document.getElementById('carouselWrap');
  if (!wrap) return;
  // Cheapest first, so the carousel reads as a ladder - what you can afford
  // now at the front, what you're saving for further along.
  const items = accessoryCatalog
    .filter(a => a.category === selectedCategory)
    .sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name));
  if (items.length === 0) {
    wrap.innerHTML = `<div class="collection-empty">Nothing here yet</div>`;
    return;
  }
  wrap.innerHTML = items.map(a => {
    const isEquipped = currentProfile.equipped && currentProfile.equipped[a.category] === a.id;
    const canAfford = currentFeatherTotal >= a.cost;
    const isOpen = expandedItemId === a.id;
    // Ownership/selection now read entirely from the frame colour (see
    // .carousel-item.unowned / .equipped), so owned items carry no
    // price badge at all - only unowned ones, tucked in a corner instead
    // of taking a full text row.
    const priceBadge = a.owned
      ? ''
      : `<div class="carousel-item-price-badge ${canAfford ? 'affordable' : 'unaffordable'}"><img class="feather-icon" src="/static/feather.webp" alt=""> ${a.cost}</div>`;

    // Only unowned items expand - an owned one just toggles on and off, so
    // there's nothing to confirm.
    const action = (isOpen && !a.owned)
      ? `<button class="item-buy-btn ${canAfford ? '' : 'cant-afford'}" data-buy="${a.id}">
           ${canAfford ? 'Buy' : `${Math.round(a.cost - currentFeatherTotal)} more`}
         </button>`
      : '';

    return `
      <div class="carousel-item ${a.owned ? 'owned' : 'unowned'} ${isEquipped ? 'equipped' : ''} ${isOpen ? 'expanded' : ''}"
           data-id="${a.id}" data-owned="${a.owned}" data-category="${a.category}"
           data-cost="${a.cost}" data-name="${a.name}">
        <div class="item-icon-wrap"><svg viewBox="${a.tile_viewbox}" width="100%" height="100%">${a.svg}</svg></div>
        ${priceBadge}
        ${action}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.carousel-item').forEach(el => {
    el.onclick = (e) => {
      // The buy button has its own handler; don't let the tile's tap collapse
      // the card out from under it.
      if (e.target.closest('.item-buy-btn')) return;
      const owned = el.dataset.owned === 'true';
      if (owned) {
        handleAccessoryTap(el.dataset.id, true, el.dataset.category,
                           parseInt(el.dataset.cost, 10), el.dataset.name);
      } else {
        expandedItemId = expandedItemId === el.dataset.id ? null : el.dataset.id;
        renderCarousel();
      }
    };
  });

  wrap.querySelectorAll('.item-buy-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const el = btn.closest('.carousel-item');
      buyAccessory(el.dataset.id, el.dataset.category,
                   parseInt(el.dataset.cost, 10), el.dataset.name);
    };
  });
}

async function buyAccessory(accessoryId, category, cost, name) {
  if (currentFeatherTotal < cost) {
    setDressUpHint(`Not enough feathers yet — ${Math.round(cost - currentFeatherTotal)} more to go`);
    return;
  }
  try {
    const res = await fetch(`/accessories/${accessoryId}/purchase`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      const item = accessoryCatalog.find(a => a.id === accessoryId);
      if (item) item.owned = true;
      // The new total already includes any trophy the purchase won; those
      // feathers arrive separately, with their own moment.
      currentFeatherTotal = data.new_total - (data.trophy_feathers || 0);
      animateFeatherCount(currentFeatherTotal);
      // Bought, not worn - tap it again to put it on.
      expandedItemId = null;
      setDressUpHint(`Bought ${name} — tap it to wear it`);
      renderCarousel();
      celebrateTrophies(data.newly_earned_trophies, document.getElementById('dressUpPreview'), data.rank_up);
    } else {
      setDressUpHint("That didn't work — try again");
    }
  } catch (e) { /* fail quietly, nothing to update */ }
}

async function handleAccessoryTap(accessoryId, owned, category, cost, name) {
  // Only ever called for owned items now - buying goes through buyAccessory()
  // from the expanded tile's Buy button.

  // Already owned - tap toggles wearing it in its category's slot.
  if (!currentProfile.equipped) currentProfile.equipped = {};
  const currentlyWorn = currentProfile.equipped[category] === accessoryId;
  const newValue = currentlyWorn ? null : accessoryId;
  currentProfile.equipped[category] = newValue;
  setDressUpHint(currentlyWorn ? `Took off ${name}` : `Wearing ${name}`);
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  // Taking something off is not an event; putting something on is.
  flashAvatar('pop');
  if (!currentlyWorn) sparkleAvatar();
  try {
    const formData = new FormData();
    formData.append('category', category);
    if (newValue) formData.append('accessory_id', newValue);
    await fetch('/accessories/equip', { method: 'POST', body: formData });
  } catch (e) { /* local state's already updated, ok if the save fails silently */ }
}

// The level shows on the trophy's base, so the carousel communicates
// progress at a glance, not just earned/not: the leaves sitting in its three
// carved sockets, and then how many of them have turned gold. It is a
// property of the artwork - the level picks the picture and there is
// nothing to draw (TROPHY_PICTURE, below).
// Measured at the sizes the carousel actually draws (130, 101 and 73px), the
// leaves stay separable at every one of them - a blob count of the green
// comes back as exactly 1, 2 and 3. Under simulated deuteranopia the filled
// and empty sockets fall to 1.31:1 in luminance, so the colour is doing most
// of the work; what saves it is that the empty sockets are carved and stay
// visible as structure regardless.
// All twenty-one emblems are carved art now, one file per trophy key, so
// there is no fallback left to keep. The drawn SVG set that used to live
// here is gone with it.
// Seven levels now, on the same carved base: level 1 shows the three sockets
// empty (trophy-l0), levels 2-4 fill them with green leaves (l1-l3), and
// levels 5-7 turn the leaves gold one at a time (l5-l7, made from l3 by
// recolouring each leaf through a gold ramp so the carving shows through).
// A trophy not yet earned also uses l0, greyed out by the carousel.
const TROPHY_PICTURE = ['l0', 'l0', 'l1', 'l2', 'l3', 'l5', 'l6', 'l7'];
// The shadow and the light are only shown on the Awards stump, under the
// spotlight (see .trophy-lit); the light is masked to the cup's own shape.
function trophyArt(trophy) {
  const level = Math.max(0, Math.min(7, trophy.level || 0));
  const dim = trophy.earned ? '' : ' style="opacity:.45"';
  const cup = `/static/trophy-${TROPHY_PICTURE[level]}-v1.webp`;
  return `<div class="trophy-art" style="--cup:url('${cup}')">
    <span class="trophy-shadow"></span>
    <img class="trophy-svg" src="${cup}" alt="">
    <img class="trophy-emblem" src="/static/emblem-${trophy.key}-v1.webp" alt=""${dim}>
    <span class="trophy-light"></span>
  </div>`;
}

// Changing pack: the deck on screen gathers itself into a pile, the new
// pack's cards take its place as a pile, and that pile fans out again.
async function goToPack(i) {
  if (i === selectedPack) return;
  const hasDeck = document.querySelector('#cardCarousel .fan-card');
  if (!reducedMotion() && hasDeck) {
    const closed = await animateDeck(0, DECK_CLOSE_MS);
    if (!closed) return;            // another pack was picked mid-way
  }
  selectedPack = i;
  selectedCard = middleCard(allPacksRaw[i]);
  renderPackSelector();
  if (reducedMotion()) { stopDeckAnimation(1); renderSelectedPack(); return; }
  stopDeckAnimation(0);
  renderSelectedPack();
  animateDeck(1, DECK_OPEN_MS);
}

const DECK_CLOSE_MS = 200;
const DECK_OPEN_MS = 520;
// The two moves share each window: closing spends the first half on size,
// the second on position; opening spends DECK_OPEN_SPLIT of it on position,
// the rest on size.
const DECK_OPEN_SPLIT = 0.55;
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const easeOut = t => 1 - (1 - t) * (1 - t);
// Out quickly, then a slight overshoot as the cards land in their places.
const deckOpenEase = t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);

// Animate the deck closed (to 0) or open (to 1) over `ms`, as two separate
// movements. Closing: the cards first grow to the front card's size where
// they stand, then slide in behind it into a pile. Opening: the pile first
// slides out into the deck's places at that full size, then the cards
// shrink back to their own sizes. Resolves true once done, false if it was
// interrupted (a newer animation, a finger on the deck, or the deck
// leaving the page).
function animateDeck(to, ms) {
  const token = ++deckAnimToken;
  const t0 = performance.now();
  // phase(t, a, b): how far through the stretch of time from a to b we are
  const phase = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  return new Promise(resolve => {
    const step = (now) => {
      if (token !== deckAnimToken) { resolve(false); return; }
      const carousel = document.getElementById('cardCarousel');
      const cards = carousel ? Array.from(carousel.querySelectorAll('.fan-card')) : [];
      if (!cards.length) { deckPos = deckSize = 1; resolve(false); return; }
      const t = Math.min(1, (now - t0) / ms);
      if (to === 0) {
        deckSize = 1 - easeInOut(phase(t, 0, 0.5));
        deckPos = 1 - easeInOut(phase(t, 0.5, 1));
      } else {
        deckPos = deckOpenEase(phase(t, 0, DECK_OPEN_SPLIT));
        deckSize = easeOut(phase(t, DECK_OPEN_SPLIT, 1));
      }
      carousel.classList.remove('settling');
      layoutCarousel(cards);
      if (t < 1) requestAnimationFrame(step);
      else { deckPos = deckSize = to; layoutCarousel(cards); resolve(true); }
    };
    requestAnimationFrame(step);
  });
}

// End any deck animation where it stands and set the deck outright:
// 1 fanned out, 0 a pile.
function stopDeckAnimation(spread) {
  deckAnimToken++;
  deckPos = deckSize = spread;
}

// Shrink a pack's blurb until it fits on its one line.
function fitBlurb(b) {
  if (!b) return;

  while (b.scrollWidth > b.clientWidth && size > 9) {
    size -= 0.5;
    b.style.fontSize = size + 'px';
  }
}

// One dot per card in the pack: filled once found, and the one you're
// looking at sits slightly larger. Replaces the old "x of 10 cards found"
