// Every place a bird has been heard, from the pin button on its card. Built
// from the sightings already loaded for the card. A sighting saved without a
// place name is grouped as one unnamed spot rather than dropped. Like the
// card, a tap anywhere goes back to it.
function renderBirdPlaces(commonName, back) {
  const matches = allSightingsRaw.filter(s => s.common_name === commonName);
  const places = new Map();
  matches.forEach(m => {
    const key = m.location_name || '';
    const at = new Date(m.created_at);
    const p = places.get(key) || { name: key, count: 0, first: at, last: at };
    p.count++;
    if (at < p.first) p.first = at;
    if (at > p.last) p.last = at;
    places.set(key, p);
  });
  const rows = [...places.values()].sort((a, b) => b.count - a.count || b.last - a.last);
  const day = d => d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const when = p => p.count === 1 ? `Heard on ${day(p.first)}`
    : `First ${day(p.first)} · last ${day(p.last)}`;
  stage.innerHTML = `
    <div class="woodframe detail-wood" data-bird-detail>
    <div class="detail-card bird-card">
      <div class="places-body">
        <div class="places-title">Where you've heard the ${birdName(commonName)}</div>
        <div class="places-sub">${rows.length === 1 ? 'One place' : `${rows.length} places`} · ${matches.length === 1 ? 'once' : `${matches.length} times`} in all</div>
        ${rows.map(p => `
          <div class="place-row">
            <img class="place-pin" src="/static/btn-pin-v1.webp" alt="">
            <div class="place-text">
              <div class="place-name ${p.name ? '' : 'unnamed'}">${p.name || 'A spot with no name'}</div>
              <div class="place-when">${when(p)}</div>
            </div>
            <div class="place-count">${p.count}<small>${p.count === 1 ? 'time' : 'times'}</small></div>
          </div>`).join('')}
        <div class="places-hint">Tap anywhere to go back</div>
      </div>
    </div>
    </div>`;
  setDetailBack(back);
}

// The bird card has no Back button: a tap anywhere that isn't something to
// press goes back to wherever the card was opened from (My Flock, or the
// Collections deck with its spin). The trophy card and the places list use
// the same mechanism - anything marked data-bird-detail. birdDetailBack is set by renderBirdDetail
// and only acted on while a bird card is actually showing.
let birdDetailBack = null, detailShownAt = 0;
function setDetailBack(fn) {
  birdDetailBack = fn;
  detailShownAt = performance.now();
}
document.addEventListener('click', (e) => {
  if (!birdDetailBack || !document.querySelector('[data-bird-detail]')) return;
  // The tap that OPENED the card lands here too. With a mouse it arrives on
  // the tile the new screen has since replaced, so anything no longer on the
  // page is ignored. On a phone, though, a screen opened from pointerup (the
  // trophy row) is already showing when the tap's click is sent, and the
  // click lands on it - so a click in the first moment after a card opens is
  // ignored too. Nobody taps to leave within half a second of arriving.
  if (!e.target.isConnected) return;
  if (performance.now() - detailShownAt < 450) return;
  if (e.target.closest('button, a, label, input, select, textarea, [role="button"], .bottom-nav, .top-profile-btn')) return;
  const back = birdDetailBack;
  birdDetailBack = null;   // one tap, one trip back
  back();
});

// Which collection pack a bird is in, as its badge under the name. The packs
// are already in memory if Collections has been opened; otherwise they're
// fetched once. Birds outside Warble's hundred aren't in any pack, so they
// simply get no badge.
async function showDetailPack(commonName) {
  if (!allPacksRaw.length) {
    try { allPacksRaw = (await (await fetch('/collector-packs')).json()).packs || []; }
    catch (e) { return; }
  }
  const el = document.getElementById('detailPack');
  if (!el) return;   // moved on to another screen while the packs loaded
  let packAt = -1, cardAt = -1;
  allPacksRaw.forEach((p, i) => {
    const j = p.birds.findIndex(b => b.common_name === commonName);
    if (j >= 0) { packAt = i; cardAt = j; }
  });
  if (packAt < 0) return;
  const p = allPacksRaw[packAt];
  const rare = p.birds[cardAt].rarity === 'Rare';
  const badge = `/static/pack-${p.art}-badge-v2.webp`;
  // The badge goes first, before the heard-count disc that's already there.
  el.insertAdjacentHTML('afterbegin', `<button class="detail-pack-btn ${rare ? 'rare' : ''}" style="--badge:url('${badge}')"
      aria-label="${p.name} collection - which card is this?"><img src="${badge}" alt=""></button>`);
  // The badge reveals which collection the card belongs to; tapping that
  // line opens the collection with this bird's card at the front.
  const note = document.getElementById('packNote');
  note.querySelector('p').innerHTML = `<button class="pack-note-go ${rare ? 'rare' : ''}">
      ${p.name} Collection: ${rare ? 'Rare' : 'Common'}</button>`;
  el.querySelector('.detail-pack-btn').onclick = () => toggleBadgeNote('packNote');
  note.querySelector('.pack-note-go').onclick = () => {
    selectedPack = packAt;
    selectedCard = cardAt;
    renderHabitats({ keepCard: true });
  };
}

// 'Heard 8 times. First heard 27 September 2025.' - or, for a bird heard
// just the once, 'Heard once, on 28 August 2026.' matches is newest first.
function heardLine(matches) {
  const first = new Date(matches[matches.length - 1].created_at)
    .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  return matches.length === 1 ? `Heard once, on ${first}.`
    : `Heard ${matches.length} times. First heard ${first}.`;
}

// The badges in the bird card's top row each reveal a line underneath. Only
// one is open at a time: opening one closes the others, and tapping the same
// badge again closes it.
function toggleBadgeNote(noteId) {
  const note = document.getElementById(noteId);
  if (!note) return;
  const opening = !note.classList.contains('show');
  document.querySelectorAll('.badge-note.show').forEach(n => n.classList.remove('show'));
  if (opening) note.classList.add('show');
}

// Photos the child took themselves, appended to the hero photo strip after
// the Wikipedia photo (or blank placeholder) that's always slide one. The
// strip only actually scrolls once there's something to scroll to - with
// zero self-taken photos it looks exactly like the single static photo it
// used to be. Re-fetched fresh each time the detail card opens rather than
// carried on the sighting objects, since a photo can be added at any point
// and there's no cache-invalidation path from other screens back into
// allSightingsRaw.
async function loadBirdPhotos(commonName) {
  const strip = document.getElementById('detailPhotoStrip');
  if (!strip) return;
  try {
    const res = await fetch(`/species/${encodeURIComponent(commonName)}/photos`);
    const data = await res.json();
    strip.querySelectorAll('.my-photo-slide').forEach(el => el.remove());
    (data.photos || []).forEach(p => {
      const img = document.createElement('img');
      img.className = 'detail-photo my-photo-slide';
      img.src = p.photo_data;
      strip.appendChild(img);
    });
    setupPhotoDots(strip, strip.children.length);
  } catch (e) { /* strip just shows the Wikipedia photo if this fails */ }
}

// One dot per slide, only shown once there's more than one - a photo can be
// added while the card's already open, so this runs fresh every time
// loadBirdPhotos does rather than once at card-open.
function setupPhotoDots(strip, count) {
  const dotsEl = document.getElementById('detailPhotoDots');
  if (!dotsEl) return;
  if (count <= 1) { dotsEl.innerHTML = ''; return; }
  dotsEl.innerHTML = Array.from({ length: count }, (_, i) =>
    `<span class="detail-photo-dot ${i === 0 ? 'active' : ''}"></span>`).join('');
  const dots = dotsEl.querySelectorAll('.detail-photo-dot');
  const updateActive = () => {
    const idx = Math.round(strip.scrollLeft / strip.clientWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  };
  // The strip element itself persists across repeated loadBirdPhotos calls
  // within one card-open session (only its children are swapped) - binding
  // more than once would fire updateActive() multiple times per scroll.
  if (!strip.dataset.dotsBound) {
    strip.addEventListener('scroll', () => requestAnimationFrame(updateActive));
    strip.dataset.dotsBound = '1';
  }
}

// Kept full-frame (not centre-cropped to a square, unlike the avatar photo)
// since these are meant to look like an actual photo the child took, not an
// icon. Longest side capped at 900px and re-encoded as JPEG before upload -
// a multi-megabyte phone photo would be far too heavy to store as a data URL
// otherwise, but 900px is generous enough to still look good full-width.
function handleBirdPhotoChosen(file, commonName) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      saveBirdPhoto(commonName, canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => alert("Sorry, that image couldn't be read.");
    img.src = reader.result;
  };
  reader.onerror = () => alert("Sorry, that image couldn't be read.");
  reader.readAsDataURL(file);
}

async function saveBirdPhoto(commonName, dataUrl) {
  const formData = new FormData();
  formData.append('photo', dataUrl);
  try {
    await fetch(`/species/${encodeURIComponent(commonName)}/photos`, { method: 'POST', body: formData });
    await loadBirdPhotos(commonName);
    // Scroll straight to the photo that was just added, so adding one feels
    // immediate rather than needing a manual swipe to go find it.
    const strip = document.getElementById('detailPhotoStrip');
    if (strip) strip.scrollTo({ left: strip.scrollWidth, behavior: 'smooth' });
  } catch (e) { alert("Sorry, that photo couldn't be saved right now."); }
}

let currentlyPlayingAudio = null;
let currentlyPlayingBtn = null;
let currentlyPlayingLabel = `${PAINTED_PLAY} Hear its call`;

function stopAnyPlayingAudio() {
  if (currentlyPlayingAudio) {
    currentlyPlayingAudio.pause();
    currentlyPlayingAudio.currentTime = 0;
  }
  if (currentlyPlayingBtn) {
    // A picture button turns into a stop button while it plays, then back.
    if (currentlyPlayingBtn.classList.contains('photo-icon-btn')) {
      currentlyPlayingBtn.classList.remove('playing');
      if (currentlyPlayingBtn.dataset.playHtml) currentlyPlayingBtn.innerHTML = currentlyPlayingBtn.dataset.playHtml;
      currentlyPlayingBtn.setAttribute('aria-label', 'Hear its call');
    }
    else currentlyPlayingBtn.innerHTML = currentlyPlayingLabel;
    currentlyPlayingBtn.disabled = false;
  }
  currentlyPlayingAudio = null;
  currentlyPlayingBtn = null;
}

function playBirdCall(url, btnEl) {
  if (!url) return;

  // Tapping the button while it's already playing stops it. The button used
  // to show a pause icon but was disabled, so the pause was unclickable.
  if (currentlyPlayingBtn === btnEl && currentlyPlayingAudio) {
    stopAnyPlayingAudio();
    return;
  }

  stopAnyPlayingAudio(); // only one call plays at a time
  const audio = new Audio(url);
  currentlyPlayingAudio = audio;
  currentlyPlayingBtn = btnEl;
  if (btnEl.classList.contains('photo-icon-btn')) {
    btnEl.classList.add('playing');
    btnEl.dataset.playHtml = btnEl.innerHTML;
    btnEl.innerHTML = PAINTED_STOP_DISC;
    btnEl.setAttribute('aria-label', 'Stop');
  } else {
    currentlyPlayingLabel = btnEl.innerHTML;
    btnEl.innerHTML = `${icon('pause')} Stop`;
  }
  audio.play().catch(() => stopAnyPlayingAudio());
  audio.onended = () => stopAnyPlayingAudio();
}

// Every screen change (any render*() function) fully replaces stage's

// Mirrors STAT_LABELS in birds.py. Kept in a fixed order so the bars
// always read the same way down every card.
const STAT_LABELS = { size: 'Size', speed: 'Speed', population: 'Population',
                     song: 'Song', brains: 'Brains' };

function buildStatBars(bird) {
  if (!bird || !bird.ratings) return '';
  const rows = Object.entries(STAT_LABELS).map(([key, label]) => {
    const v = bird.ratings[key] ?? 0;
    return `
      <div class="tt-row">
        <span class="tt-label">${label}</span>
        <span class="tt-bar"><span class="tt-fill" style="width:${v}%"></span></span>
        <span class="tt-num">${v}</span>
      </div>`;
  }).join('');
  return `
    <div class="tt-block">
      <div class="tt-title">Compared to all 100 birds</div>
      ${rows}
    </div>`;
}

// Every bird carries these four, so no card is ever missing them.
function buildCoreTiles(bird) {
  if (!bird) return '';
  const weight = bird.weight_g >= 1000
    ? `${(bird.weight_g / 1000).toFixed(1)}kg` : `${bird.weight_g}g`;
  const measures = [
    [icon('weight'), weight, 'Weight'],
    [icon('length'), `${bird.length_cm}cm`, 'Length'],
  ];
  // Wingspan: tip to tip with the wings stretched out.
  if (bird.wingspan_cm) measures.push([icon('wingspan'), `${bird.wingspan_cm}cm`, 'Wingspan']);
  const words = [
    [icon('habitat'), bird.habitat, 'Habitat'],
    [icon('diet'), bird.diet, 'Diet'],
  ];
  // One row each, the full width of the card: the icon and what it is
  // first, then the answer - long answers ("Woodland edges and gardens")
  // get the whole line instead of a third of it.
  return `<div class="fact-list">${[...measures, ...words].map(([pic, value, label]) => `
    <div class="fact-row">
      <span class="fact-icon">${pic}</span>
      <span class="fact-label">${label}</span>
      <span class="fact-value">${value}</span>
    </div>`).join('')}</div>`;
}

// Everything a recording won besides its birds, as moments, in the order
// the server paid them: packs, challenges (and the week), trophies, rank.
// Shared by the Done screen and the "no birds" one, since a quiet session
// can win a trophy too. Takes the session's state and clears it, so a
// screen re-rendered later can't celebrate the same things twice; the
// returned function plays them, and its promise settles when they're done.
function takeSessionMoments() {
  const packs = sessionPacks, challenges = sessionChallenges, week = sessionWeekBonus;
  const trophies = newlyEarnedTrophies, rank = sessionRankUp;
  sessionPacks = []; sessionChallenges = []; sessionWeekBonus = 0;
  newlyEarnedTrophies = []; sessionRankUp = null; sessionBonuses = []; sessionFeatherTotal = 0;
  return (from) => {
    packs.forEach(p => celebratePack(p, from));
    celebrateChallenges(challenges, week, from);
    celebrateTrophies(trophies, from, rank);
    return momentQueue;
  };
}

    ${avatarBanners}
    <div class="done-feathers-slot">

            <button class="done-shop-disc" id="shopNextBtn" aria-label="Spend your feathers in the Hoot-tique">${avatarSvg(currentProfile.avatar_body, 70, currentProfile.equipped, false, currentProfile.avatar_species)}</button>

  stage.querySelectorAll('.avatar-banner').forEach(el => { el.onclick = renderDressUp; });

  scheduleDoneLeafBurst(stage.querySelector('.done-avatar'));

  // Bound immediately rather than only after collecting - the button sits
  // underneath the feathers message from the start (opacity 0, pointer-
  // events off), so there's nothing to wire up later, just a class to add.
  document.getElementById('againBtn').onclick = startRecording;

  const featherEl = document.getElementById('doneFeathers');
  document.getElementById('shopNextBtn').onclick = renderDressUp;
  // Then the rest of what was won, one moment at a time, and only then
  // what's next - so going again never cuts a celebration short.
  const slot = stage.querySelector('.done-feathers-slot');
  const afterFeathers = () => moments(slot).then(() => {
    refreshFeathers();   // reconcile against the server once animations finish
    showDoneNext();

  if (!total) {
    featherEl.classList.add('collected');

      // Another go is only offered once the feathers have been collected,
      // so it isn't possible to leave the session's reward on the table.
      featherEl.classList.add('collected');
      afterFeathers();
    });
  };

  sessionNewAvatars = [];
}

// Well-done messages. The specific ones are checked first so a genuinely
// notable session gets a message that reflects it, rather than a generic one.
const DONE_MESSAGES = {
  rare:    ['Wow, a rare one!', 'Something special!', 'What a sound!', 'That was rare!'],
  big:     ['What a haul!', 'So many birds!', 'The birds love you!', 'A brilliant warble!'],
  allNew:  ['All new birds!', 'Every one a first!', 'What a discovery!'],
  someNew: ['New bird alert!', 'One for the collection!', 'Great ears!', 'Something new!'],
  one:     ['One good bird!', 'Heard one!', 'Nice listening!', 'Got one!'],
  general: ['Nice warble!', 'Well done!', 'Great listening!', 'Lovely warbling!',
            'Good ears!', 'Brilliant!', 'What a listener!', 'Top warbling!'],
};

function pickDoneMessage(count, newCount, tierCounts) {
  let pool;
  if (tierCounts['Rare']) pool = DONE_MESSAGES.rare;
  else if (count >= 5) pool = DONE_MESSAGES.big;
  else if (newCount && newCount === count) pool = DONE_MESSAGES.allNew;
  else if (newCount) pool = DONE_MESSAGES.someNew;
  else if (count === 1) pool = DONE_MESSAGES.one;
  else pool = DONE_MESSAGES.general;
  return pool[Math.floor(Math.random() * pool.length)];
}

let currentLat = null, currentLng = null, newlyEarnedTrophies = [];
let sessionRankUp = null, sessionNewAvatars = [];   // also won by the last recording
// What the device actually granted for the mic. Constraints are requests,
// not guarantees, so this is worth being able to see without a USB cable.
let lastMicSettings = null;
let currentProfile = { name: 'Explorer', avatar_id: 'robin' };
let needsLocationName = false, sessionLat = null, sessionLng = null, sessionLocationName = null;
// Places already named that have a spot near this new one (from /record).
let sessionNearbyPlaces = [];

function requestGpsPosition() {
  // Fire-and-forget — recording shouldn't wait on this. If it fails or
  // times out, currentLat/currentLng stay null and the backend falls
  // back to a default location — worth knowing that's a real fallback
  // to a fixed point, not "somewhere near you", if this keeps failing.
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      console.log(`GPS fix: ${currentLat}, ${currentLng} (accuracy: ~${Math.round(pos.coords.accuracy)}m)`);
      // GPS is fire-and-forget, so the recording screen has usually already
      // rendered by now with an empty location line - fill it in once we
      // actually know where we are. No-ops if we're not on that screen.
      loadRecordingLocation();
    },
    (err) => {
      console.log('GPS unavailable, using default location:', err.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

async function startRecording() {
  try {
    // Can now be reached directly from the Done / No-birds screens via the
    // mic button, not just from Home - so make sure the Home tab reads as
    // active rather than leaving whatever tab was highlighted before.
    setActiveTab('home');
    // Home is top-aligned now that it carries cards below the mic, and every
    // screen in the recording flow - listening, saving, the results pile, the
    // reveal - is centred and had been relying on Home to leave this off.
    stage.classList.remove('top-aligned');
    // Not taken away - blurred back, like every screen that is not Home.
    // The tree and the badges are the thing to look at here.
    setSceneFocus(false);
    requestGpsPosition();
    // { audio: true } accepts the browser's voice-call defaults: noise
    // suppression, echo cancellation and automatic gain control all on. Those
    // are tuned for speech and actively strip sustained non-speech sound -
    // which is exactly what birdsong is. Quiet or distant birds get filtered
    // out before BirdNET ever sees them. All three are turned off here to get
    // the rawest audio the device will give us.
    //
    // echoCancellation:false matters more than it looks: on Chrome, AGC can't
    // be disabled by the autoGainControl constraint alone - echo cancellation
    // has to go too, or gain control stays on regardless.
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        noiseSuppression: false,
        echoCancellation: false,
        autoGainControl: false,
        channelCount: 1,
      },
    });

    // Log what the device actually granted - constraints are requests, not
    // guarantees, and some devices silently ignore them.
    const settings = stream.getAudioTracks()[0]?.getSettings?.() || {};
    lastMicSettings = settings;
    try { localStorage.setItem('warbleMicSettings', JSON.stringify(settings)); } catch (e) {}
    console.log('Mic settings:', {
      noiseSuppression: settings.noiseSuppression,
      echoCancellation: settings.echoCancellation,
      autoGainControl: settings.autoGainControl,
      sampleRate: settings.sampleRate,
    });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    recordSeconds = 0;
    renderRecording();
    startEqualizer(stream);
    startLivePreviewLoop(stream);
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  } catch (e) {
    renderMicBlocked(e && e.name);
  }
}

// The first time, Warble says why before the phone asks: the browser's own

// --- Live audio-reactive equalizer, driven by real microphone volume ---
// Also drives a genuine "a bird was heard!" flash during recording -
// backed by real, filtered identification (the same NBN Atlas
// plausibility check /analyze-session uses), not just raw volume, so
// a live flash reliably means something that should also show up in
// the final result. Species names still aren't shown live - only
// that a real one was heard - keeping the reveal for after Stop.
let eqAudioContext = null, eqAnalyser = null, eqAnimationId = null;

// Centre of the 200x210 viewBox (was 80,72 for the old 160x190 canopy) -
// used to derive each cluster's outward push direction during a rustle.
// v2 redesign: centre of the 380x452 viewBox (was 100,105 for 200x210).
const TREE_CX = 190, TREE_CY = 226;
// Individual leaf sprites (painted, matching the canopy's redesigned style)
// swapped in for spawnFallingLeaves() - replaces the old flat LEAF_COLORS
// polygon-fill approach now that the canopy itself is illustrated rather
// than flat-shaded facets.
const LEAF_SPRITES = ['/static/tree-leaf1-v2.webp', '/static/tree-leaf2-v2.webp', '/static/tree-leaf3-v2.webp', '/static/tree-leaf4-v2.webp'];
let treeShards = [], fallingLeaves = [], activeRustle = null, lastFrameTime = 0;
// Tracks how loud things have been recently, so the quiver scales to the
// actual environment. Without this the design's numbers - tuned in a demo
// against a synthetic signal - produce well under 1 degree of rotation from
// a real phone mic in a quiet garden, which is invisible.
let binCeiling = 40;
// Multiplies each cluster's per-facet amplitude (4.6-5.2 deg, set on the
// 6 canopy clusters after the hand-painted redesign replaced the old
// 59-facet procedural canopy). Lower than the old placeholder tree's 3.2:
// each cluster is a much bigger mass than an individual facet was, so the
// same angular rotation sweeps a visibly larger arc - this keeps the
// quiver reading as a shimmer rather than a wobble. Tune after watching it
// live against a real mic.
const QUIVER_GAIN = 2.3;

function startEqualizer(stream) {
  eqAudioContext = new (window.AudioContext || window.webkitAudioContext)();
  eqAnalyser = eqAudioContext.createAnalyser();
  eqAnalyser.fftSize = 64;
  eqAudioContext.createMediaStreamSource(stream).connect(eqAnalyser);
  const bins = new Uint8Array(eqAnalyser.frequencyBinCount);

  // Each canopy cluster carries its own pivot, frequency bin and amplitude,
  // baked into the SVG by the design. Cache them once rather than re-reading
  // attributes 6 times every frame. (Was 59 facets pre-redesign; the
  // hand-painted canopy trades facet-level granularity for a much richer
  // illustrated look - see the design brief for why.)
  treeShards = Array.from(document.querySelectorAll('[data-cluster]')).map((el, i) => {
    const p = el.getAttribute('data-pivot').split(',').map(Number);
    const nx = p[0] - TREE_CX, ny = p[1] - TREE_CY;
    const len = Math.hypot(nx, ny) || 1;
    return {
      el, px: p[0], py: p[1], nx: nx / len, ny: ny / len,
      bin: +el.getAttribute('data-bin'), amp: +el.getAttribute('data-amp'),
      phase: i * 0.73, lvl: 0,
    };
  });
  fallingLeaves = [];
  activeRustle = null;
  lastFrameTime = 0;
  binCeiling = 40;   // reset per recording, don't carry a loud session into a quiet one

  function draw(now) {
    if (!eqAnalyser) return;
    const t = now / 1000;
    const dt = Math.min(0.05, (now - (lastFrameTime || now)) / 1000);
    lastFrameTime = now;
    eqAnalyser.getByteFrequencyData(bins);

    // Adapt to the current environment: track the loudest bin, rising fast and
    // decaying slowly, and scale against that. A quiet garden and a noisy
    // street both produce visible movement, rather than the tree only reacting
    // to shouting. The floor stops near-silence being amplified into noise.
    let frameMax = 0;
    for (let i = 0; i < bins.length; i++) if (bins[i] > frameMax) frameMax = bins[i];
    binCeiling += (frameMax - binCeiling) * (frameMax > binCeiling ? 0.25 : 0.015);
    const ceiling = Math.max(binCeiling, 26);

    const breath = 1.4;               // idle motion so it's never fully dead
    const r = activeRustle;
    const rAge = r ? t - r.t : 999;
    if (r && rAge > 2.2) activeRustle = null;

    for (const s of treeShards) {
      // LEVEL 1 - quiver: proportional to this facet's own frequency band,
      // with a fast attack and slow release so it breathes rather than flickers.
      const raw = Math.pow(Math.min(1, bins[s.bin] / ceiling), 1.25);
      s.lvl += (raw - s.lvl) * (raw > s.lvl ? 0.32 : 0.07);
      let a = breath * Math.sin(t * 1.63 + s.phase) + s.lvl * s.amp * QUIVER_GAIN;
      let ox = 0, oy = 0;

      // LEVEL 2 - rustle: a wave leaving the landing point at 456px/s. Each
      // facet fires as the wave reaches it, so the tree moves in sequence and
      // has a visible direction - which is what distinguishes it from quiver.
      // Speed/falloff/push scaled ~1.9x for the 380x452 viewBox (was 240,
      // 190, 7 for the old 200x210 one) to keep the same relative timing and
      // reach across the now-bigger canopy.
      if (r) {
        const d = Math.hypot(s.px - r.ox, s.py - r.oy);
        const tt = rAge - d / 456;
        if (tt > 0 && tt < 1.2) {
          const fall = Math.max(0.3, 1 - d / 361);
          const dir = (s.px - r.ox) >= 0 ? 1 : -1;
          const env = Math.exp(-tt / 0.2) * Math.sin(Math.PI * 2 * 4.2 * tt);
          a += 24 * fall * dir * env;
          const push = 13 * fall * Math.exp(-tt / 0.24) * Math.sin(Math.PI * 2 * 4.2 * tt);
          ox = s.nx * push; oy = s.ny * push;
        }
      }

      s.el.setAttribute('transform',
        `rotate(${a.toFixed(2)},${s.px},${s.py}) translate(${ox.toFixed(2)},${oy.toFixed(2)}) ` +
        `translate(${s.px},${s.py}) scale(1.02) translate(${-s.px},${-s.py})`);
    }

    // Leaves shaken loose by a rustle - the "consequence" cue.
    for (let i = fallingLeaves.length - 1; i >= 0; i--) {
      const l = fallingLeaves[i];
      const age = t - l.born;
      if (age > l.life) { l.el.remove(); fallingLeaves.splice(i, 1); continue; }
      l.vy += 34 * dt;
      l.x += (l.vx + Math.sin(t * l.sway * 3 + l.ph) * 9) * dt;
      l.y += l.vy * dt;
      l.rot += l.spin * dt;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)},${l.y.toFixed(1)}) rotate(${l.rot.toFixed(0)})`);
      l.el.setAttribute('opacity', String(Math.max(0, 1 - Math.pow(age / l.life, 3))));
    }

    eqAnimationId = requestAnimationFrame(draw);
  }
  eqAnimationId = requestAnimationFrame(draw);
}

function fireDetectionHaptic() {
  // Short, kid-friendly buzz for the moment a new bird is found. Silently
  // does nothing on devices/browsers without vibration support (e.g. iOS
  // Safari) rather than erroring.
  if (navigator.vibrate) navigator.vibrate(80);
}

function fireTreeRustle() {
  if (!treeShards.length) return;
  // With 6 large clusters instead of 59 tiny facets there's no longer a
  // meaningful "interior vs edge" distinction to filter on - any cluster
  // makes a fine landing point, the directional wave logic below does the
  // rest of the work of making it read as something landing and spreading.
  const s = treeShards[Math.floor(Math.random() * treeShards.length)];
  activeRustle = { t: performance.now() / 1000, ox: s.px, oy: s.py };
  spawnFallingLeaves(s.px, s.py);
}

function spawnFallingLeaves(x, y) {
  const layer = document.getElementById('leaves');
  if (!layer) return;
  for (let i = 0; i < 13; i++) {
    // Illustrated leaf sprite instead of a flat-fill polygon, matching the
    // redesigned canopy. Each sprite is placed as an 8x8-centred image (x/y
    // = -4) so translate(x,y) in the physics loop below positions it by its
    // own centre, same convention the old polygon (centred at 0,0) used.
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    el.setAttribute('href', LEAF_SPRITES[i % LEAF_SPRITES.length]);
    // Scaled up for the 380x452 viewBox (was 7-10 for the old 200x210 one) -
    // keeps leaf particles the same relative size against the bigger canopy.
    const size = 13 + Math.random() * 6;
    el.setAttribute('x', -size / 2); el.setAttribute('y', -size / 2);
    el.setAttribute('width', size); el.setAttribute('height', size);
    layer.appendChild(el);
    fallingLeaves.push({
      el, x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 12,
      vx: (Math.random() - 0.5) * 22, vy: -10 - Math.random() * 14,
      rot: Math.random() * 360, spin: (Math.random() - 0.5) * 260,
      sway: 1.4 + Math.random() * 2.2, ph: Math.random() * 6.3,
      born: performance.now() / 1000, life: 1.5 + Math.random() * 0.7,
    });
  }
}

function stopEqualizer() {
  if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
  eqAnimationId = null;
  if (eqAudioContext) { eqAudioContext.close(); eqAudioContext = null; }
  eqAnalyser = null;
}

// --- Demo quiver, for the settings > Animation Preview debug screen ---
// Drives the exact same per-cluster rotate/rustle/leaf-fall logic as the
// real recording-screen equalizer above, but feeds it a synthetic wandering
// "volume" per cluster instead of real mic data - so this never needs
// microphone permission just to look at the animation. Kept as a separate
// function rather than sharing draw() with startEqualizer(), since that one
// is wired tightly to a real AudioContext/analyser and forcing a fake-data
// path through it risked the real recording animation for a debug feature.
let demoAnimId = null;
function startDemoQuiver() {
  stopDemoQuiver();
  treeShards = Array.from(document.querySelectorAll('[data-cluster]')).map((el, i) => {
    const p = el.getAttribute('data-pivot').split(',').map(Number);
    const nx = p[0] - TREE_CX, ny = p[1] - TREE_CY;
    const len = Math.hypot(nx, ny) || 1;
    return {
      el, px: p[0], py: p[1], nx: nx / len, ny: ny / len,
      bin: +el.getAttribute('data-bin'), amp: +el.getAttribute('data-amp'),
      phase: i * 0.73, lvl: 0, demoTarget: Math.random(),
    };
  });
  fallingLeaves = [];
  activeRustle = null;
  lastFrameTime = 0;

  function draw(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - (lastFrameTime || now)) / 1000);
    lastFrameTime = now;
    const breath = 1.4;
    const r = activeRustle;
    const rAge = r ? t - r.t : 999;
    if (r && rAge > 2.2) activeRustle = null;

    for (const s of treeShards) {
      // Synthetic level: a slow random walk toward a wandering target,
      // standing in for a real frequency bin's rise-and-fall.
      if (Math.random() < 0.02) s.demoTarget = Math.random();
      s.lvl += (s.demoTarget - s.lvl) * (s.demoTarget > s.lvl ? 0.1 : 0.04);
      let a = breath * Math.sin(t * 1.63 + s.phase) + s.lvl * s.amp * QUIVER_GAIN;
      let ox = 0, oy = 0;

      if (r) {
        const d = Math.hypot(s.px - r.ox, s.py - r.oy);
        const tt = rAge - d / 456;
        if (tt > 0 && tt < 1.2) {
          const fall = Math.max(0.3, 1 - d / 361);
          const dir = (s.px - r.ox) >= 0 ? 1 : -1;
          const env = Math.exp(-tt / 0.2) * Math.sin(Math.PI * 2 * 4.2 * tt);
          a += 24 * fall * dir * env;
          const push = 13 * fall * Math.exp(-tt / 0.24) * Math.sin(Math.PI * 2 * 4.2 * tt);
          ox = s.nx * push; oy = s.ny * push;
        }
      }

      s.el.setAttribute('transform',
        `rotate(${a.toFixed(2)},${s.px},${s.py}) translate(${ox.toFixed(2)},${oy.toFixed(2)}) ` +
        `translate(${s.px},${s.py}) scale(1.02) translate(${-s.px},${-s.py})`);
    }

    for (let i = fallingLeaves.length - 1; i >= 0; i--) {
      const l = fallingLeaves[i];
      const age = t - l.born;
      if (age > l.life) { l.el.remove(); fallingLeaves.splice(i, 1); continue; }
      l.vy += 34 * dt;
      l.x += (l.vx + Math.sin(t * l.sway * 3 + l.ph) * 9) * dt;
      l.y += l.vy * dt;
      l.rot += l.spin * dt;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)},${l.y.toFixed(1)}) rotate(${l.rot.toFixed(0)})`);
      l.el.setAttribute('opacity', String(Math.max(0, 1 - Math.pow(age / l.life, 3))));
    }

    demoAnimId = requestAnimationFrame(draw);
  }
  demoAnimId = requestAnimationFrame(draw);
}
function stopDemoQuiver() {
  if (demoAnimId) cancelAnimationFrame(demoAnimId);
  demoAnimId = null;
}

// --- Live preview loop: repeatedly checks short clips against the
// same filtered /identify endpoint used elsewhere, so a live flash
// and the final result are answering the same question, not two
// separate ones that could disagree. ---
let livePreviewActive = false;

function startLivePreviewLoop(stream) {
  livePreviewActive = true;
  captureLiveChunk(stream);
}

function stopLivePreviewLoop() {
  livePreviewActive = false;
}

function captureLiveChunk(stream) {
  if (!livePreviewActive) return;
  let chunkRecorder;
  try {
    chunkRecorder = new MediaRecorder(stream);
  } catch (e) {
    return; // if this fails, live preview just doesn't run — recording itself is unaffected
  }
  const chunkParts = [];
  chunkRecorder.ondataavailable = e => chunkParts.push(e.data);
  chunkRecorder.onstop = () => {
    const blob = new Blob(chunkParts, { type: 'audio/webm' });
    checkLiveChunk(blob);
    if (livePreviewActive) captureLiveChunk(stream);
  };
  chunkRecorder.start();
  setTimeout(() => {
    if (chunkRecorder.state !== 'inactive') chunkRecorder.stop();
  }, 3500);
}

async function checkLiveChunk(blob) {
  try {
    const formData = new FormData();
    formData.append('file', blob, 'chunk.webm');
    if (currentLat !== null && currentLng !== null) {
      formData.append('lat', currentLat);
      formData.append('lng', currentLng);
    }
    const res = await fetch('/identify', { method: 'POST', body: formData });
    if (!res.ok) return;
    const data = await res.json();
    (data.detections || []).forEach(d => {
      if (!liveBadgedSpecies.has(d.common_name)) {
        liveBadgedSpecies.add(d.common_name);
        liveDetectedBirds.push({
          tier: d.tier,
          common_name: d.common_name,
          scientific_name: d.scientific_name,
          confidence: d.confidence,
          is_new: d.is_new,
          pack_color: d.pack_color,
        });
        renderLiveBirdStack();
        // Fire the rustle and haptic buzz on the same frame the badge
        // appears, so all three read as one event rather than separate things.
        fireTreeRustle();
        fireDetectionHaptic();
      }
    });
  } catch (e) { /* a missed preview chunk doesn't matter, just skip it */ }
}

function stopRecording() {
  clearInterval(recordTimerInterval);
  stopEqualizer();
  stopLivePreviewLoop();
  mediaRecorder.onstop = async () => {
    // Only show anything if the request is actually slow - otherwise the
    // recording screen stays put and the reveal follows immediately.
    const slowTimer = setTimeout(renderSaving, 700);
    try {
      // The recording audio is no longer uploaded - identification already
      // happened live during recording. This call only enriches and saves
      // what was found, so it's a small JSON payload rather than an audio
      // upload, and returns much faster.
      const formData = new FormData();
      if (currentLat !== null && currentLng !== null) {
        formData.append('lat', currentLat);
        formData.append('lng', currentLng);
      }
      formData.append('live_detections', JSON.stringify(liveDetectedBirds));
      formData.append('duration_s', recordSeconds);   // Empty Nester needs a full minute
      const res = await fetch('/analyze-session', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      sessionResults = sortForReveal(data.detections || []);
      sessionBonuses = data.bonuses || [];
      sessionFeatherTotal = data.total_feathers_this_session || 0;
      sessionPacks = data.packs_completed || [];
      sessionChallenges = data.challenges_done || [];
      sessionWeekBonus = data.week_bonus || 0;
      newlyEarnedTrophies = data.newly_earned_trophies || [];
      sessionRankUp = data.rank_up || null;
      sessionNewAvatars = data.new_avatars || [];
      sessionNewAvatars.forEach(a => {
        if (currentProfile.avatars && currentProfile.avatars[a.id]) currentProfile.avatars[a.id].unlocked = true;
      });
      needsLocationName = data.needs_location_name || false;
      sessionNearbyPlaces = data.nearby_places || [];
      sessionLocationName = data.location_name || null;
      sessionLat = data.lat;
      sessionLng = data.lng;
      cardIndex = 0;
      renderSessionResults();
    } catch (e) {
      renderError(e.message || 'Something went wrong talking to the server.');
    } finally {
      // finally, not the success path - a non-ok response throws above, which
      // would otherwise leave the timer pending and flash "Saving..." over the
      // error message a moment later.
      clearTimeout(slowTimer);
    }
  };
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
}

// dawn / day / dusk / night. The gradient background has always used these
// bands; the painted scenes now pick their variant from the same four, so a
// scene and the fallback gradient can never disagree about the time.
function timeBand() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 8) return 'dawn';
  if (hour >= 8 && hour < 17) return 'day';
  if (hour >= 17 && hour < 21) return 'dusk';
  return 'night';
}

// The thumbnails show each scene at the CURRENT time of day, so what you are
// choosing between is what you will actually get right now rather than four
// pictures of the morning.
function renderScenePicker() {
  const grid = document.getElementById('sceneGrid');
  if (!grid) return;
  const band = timeBand();
  const chosen = (currentProfile && currentProfile.home_scene) || 'none';
  grid.innerHTML = HOME_SCENES.map(sc => `
    <button class="scene-pick ${chosen === sc.id ? 'on' : ''}" data-scene="${sc.id}"
            aria-pressed="${chosen === sc.id}">
      <img src="${sceneUrl(sc.id, band)}" alt="${sc.name}">
      <span class="scene-pick-tick">${PAINTED_TICK}</span>
      <span class="scene-pick-name">${sc.name}</span>
    </button>`).join('') + `
    <button class="scene-pick none ${chosen === 'none' ? 'on' : ''}" data-scene="none"
            aria-pressed="${chosen === 'none'}">
      <span class="scene-pick-tick">${PAINTED_TICK}</span>
      <span class="scene-pick-name">No picture</span>
    </button>`;

  grid.querySelectorAll('[data-scene]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.scene;
      currentProfile.home_scene = id;
      grid.querySelectorAll('[data-scene]').forEach(b => {
        const on = b.dataset.scene === id;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', String(on));
      });
      // The scene is behind Settings too, so the choice can be shown for
      // real the moment it is made - blurred, as this screen always is.
      setSceneFocus(false);
      // Warm the full-size image now, while the child is still in Settings,
      // so Home is not a blank gradient for a moment when they go back.
      if (id !== 'none') new Image().src = sceneUrl(id, timeBand());
      const formData = new FormData();
      formData.append('home_scene', id);
      try { await fetch('/profile', { method: 'POST', body: formData }); } catch (e) { /* ok to fail quietly */ }
    };
  });
}

function applyTimeOfDayBackground() {
  document.body.classList.add('time-' + timeBand());
}

const HOME_SCENES = [
  { id: 'garden', name: 'Garden' },
  { id: 'river',  name: 'River' },
  { id: 'coast',  name: 'Coast' },
  { id: 'meadow', name: 'Meadow' },
];
const sceneUrl = (id, band) => `/static/scene-${id}-${band}-v2.webp`;

// The scene is behind every screen now, but only Home gets it in focus.
// Everywhere else it racks out to a heavy blur so the lists and grids of
// cards have something calm to sit on rather than a picture competing with
// them. Called with false from setActiveTab for anything that is not Home.
// The CSS sizes this in lvh, which is the viewport at its largest. Where lvh
// is not understood it falls back to vh, which a phone changes as the address
// bar comes and goes - so remember the tallest viewport seen and hold the
// layer at that. It can grow once, on the first scroll, and never shrink.
// What actually scrolls is #scroller, not the window - the pane stops at the
// top of the nav bar so that content never passes behind it. Everything that
// used to reach for window.scrollTo or window.scrollY goes through here.
const scroller = () => document.getElementById('scroller');

// The pane's bottom edge is the nav bar's top edge, so the bar's real height
// has to be published rather than guessed. Measured, not hardcoded: the old
// hardcoded 64px was already 3px wrong, and the icons have since grown 40%.
function syncNavHeight() {
  const nav = document.querySelector('.bottom-nav');
  if (!nav) return;
  document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
}
syncNavHeight();
window.addEventListener('resize', syncNavHeight);
window.addEventListener('orientationchange', () => setTimeout(syncNavHeight, 350));

let sceneMaxHeight = 0;
function sizeSceneLayer() {
  const el = document.getElementById('sceneBg');
  if (!el || CSS.supports('height', '100lvh')) return;
  sceneMaxHeight = Math.max(sceneMaxHeight, window.innerHeight);
  el.style.height = sceneMaxHeight + 'px';
}
// Turning the phone gives a genuinely different viewport, so start again.
window.addEventListener('orientationchange', () => {
  sceneMaxHeight = 0;
  setTimeout(sizeSceneLayer, 350);
});
window.addEventListener('resize', sizeSceneLayer);

// focused: true on Home, false on every other screen. The scene shows
// either way - it is only the focus that changes - so the one thing that
// still hides it entirely is having picked "No picture".
function setSceneFocus(focused) {
  const el = document.getElementById('sceneBg');
  if (!el) return;
  const scene = currentProfile && currentProfile.home_scene;
  if (!scene || scene === 'none' || !HOME_SCENES.some(s => s.id === scene)) {
    el.classList.remove('on');
    document.body.classList.remove('scene-on', 'scene-blurred');
    return;
  }
  const url = sceneUrl(scene, timeBand());
  // The picture lives on #sceneBg::before, which a pseudo-element cannot be
  // handed directly - so it comes through a custom property, which does
  // inherit into one. Only written when it actually changes, so re-rendering
  // a screen does not make the scene flicker through a reload.
  if (el.dataset.url !== url) {
    el.style.setProperty('--scene-img', `url('${url}')`);
    el.dataset.url = url;
  }
  sizeSceneLayer();
  el.classList.add('on');
  document.body.classList.add('scene-on');
  document.body.classList.toggle('scene-blurred', !focused);
}

// --- What's new, and first-play tutorials ---------------------------------
// The server remembers both (/whats-new): which tutorial bubbles have been
// closed, and for each area whether something has turned up since the child
// last looked - a new bird, a trophy level, something the feathers now
// cover, a challenge done, the joke, a game level. Areas are cleared by
// visiting them (markSeen), never by time passing.
let tutorialsSeen = null;     // names of tutorials already closed
let whatsNew = {};            // area -> true while something there is unseen
let whatsNewGen = 0;          // a reply older than the latest mark is dropped
const NAV_CUE_TABS = { habitats: 'navHabitats', collection: 'navCollection',
                       trophies: 'navTrophies', dressup: 'navDressUp' };
// Home itself never lights up; the three things on it do.
const HOME_CUE_ITEMS = { challenges: 'challengeCard', joke: 'jokeMini', game: 'gameMini' };

async function refreshWhatsNew() {
  const gen = ++whatsNewGen;
  try {
    const d = await (await fetch('/whats-new')).json();
    // Tutorials only ever get added to, so any reply can be merged in -
    // including one that missed a bubble closed while it was on its way.
    tutorialsSeen = new Set([...(d.tutorials || []), ...(tutorialsSeen || [])]);
    if (gen !== whatsNewGen) return;   // a newer ask, or a markSeen, landed meanwhile
    whatsNew = d.new || {};
  } catch (e) {
    // Offline or a server error: no cues, and no tutorials rather than
    // every tutorial at once.
    if (!tutorialsSeen) tutorialsSeen = new Set(Object.keys(TUTORIALS));
  }
  paintNewCues();
}
let whatsNewReady = refreshWhatsNew();
// The welcome (bird, colour, name) comes before every tutorial: decided once
// the profile has loaded, further down the file.
let welcomeDecided = null, welcomeOpen = false;

function paintNewCues() {
  for (const [area, id] of Object.entries(NAV_CUE_TABS)) {
    const el = document.getElementById(id);
    // The tab you're on is being looked at, so it never glows.
    if (el) el.classList.toggle('has-new', !!whatsNew[area] && !el.classList.contains('active'));
  }
  for (const [area, id] of Object.entries(HOME_CUE_ITEMS)) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('has-new', !!whatsNew[area]);
  }
}

// The child has looked at an area: what's in it now stops being new.
async function markSeen(area) {
  whatsNewGen++;
  whatsNew[area] = false;
  paintNewCues();
  try { await fetch(`/seen/${area}`, { method: 'POST' }); } catch (e) {}
}

// Every tutorial, by name. Each is a few steps; a step lights up its

let tutorialOpen = null;      // the one showing, if any

// Show a tutorial the first time its screen is used. Waits `delay` ms for
// the screen to settle (cards dealing out), then quietly does nothing if
// it has been seen, another is up, or there's nothing on screen to point
// at yet - in which case it's still unseen, and comes back next visit.
async function showTutorial(name, delay = 0, ready = null) {
  await whatsNewReady;
  if (welcomeDecided) await welcomeDecided;
  if (welcomeOpen) return;
  if (tutorialOpen || !tutorialsSeen || tutorialsSeen.has(name)) return;
  // ready(): something the screen has to finish first (the Hoot-tique's
  // entrance). Given up on after ten seconds - it'll be back next visit.
  for (let waited = 0; ready && !ready(); waited += 150) {
    if (waited > 10000) return;
    await new Promise(r => setTimeout(r, 150));
  }
  if (delay) await new Promise(r => setTimeout(r, delay));
  if (tutorialOpen || tutorialsSeen.has(name)) return;
  const steps = TUTORIALS[name].filter(st => tutorialRect(st));
  if (!steps.length) return;
  openTutorial(name, steps);
}

function tutorialTargets(step) {
  const t = step.target;
  if (typeof t === 'function') return [t()].filter(Boolean);
  const sels = Array.isArray(t) ? t : [t];
  return sels.flatMap(sel => step.all ? [...document.querySelectorAll(sel)]
                                      : [document.querySelector(sel)]).filter(Boolean);
}

// The box round a step's target(s) on screen, or null if there's nothing
// visible to show.
function tutorialRect(step) {
  const rects = tutorialTargets(step).map(el => el.getBoundingClientRect())
    .filter(r => r.width > 0 && r.height > 0);
  if (!rects.length) return null;
  const l = Math.min(...rects.map(r => r.left)), t = Math.min(...rects.map(r => r.top));
  const r = Math.max(...rects.map(r => r.right)), b = Math.max(...rects.map(r => r.bottom));
  return { left: l, top: t, right: r, bottom: b, width: r - l, height: b - t };
}

// Read something out in the phone's own voice, for children who can't read
// yet. `btn` (the speaker disc) wobbles while it talks.
function speakAloud(text, btn) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB'; u.rate = 0.92; u.pitch = 1.1;
    const voice = speechSynthesis.getVoices().find(v => /^en[-_]GB/i.test(v.lang));
    if (voice) u.voice = voice;
    if (btn) {
      u.onend = u.onerror = () => btn.classList.remove('speaking');
      btn.classList.add('speaking');
    }
    speechSynthesis.speak(u);
  } catch (e) {}
}

const SPEAKER_SVG = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
  <path d="M3 9.5h3.6L11.5 5v14l-4.9-4.5H3z"/>
  <path d="M15 8.6a4.6 4.6 0 0 1 0 6.8M17.6 6a8.2 8.2 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
</svg>`;

function openTutorial(name, steps) {
  const veil = document.createElement('div');
  veil.className = 'tut-veil';
  veil.setAttribute('role', 'dialog');
  veil.setAttribute('aria-modal', 'true');
  const canSpeak = 'speechSynthesis' in window;
  veil.innerHTML = `
    <div class="tut-hole"></div>
    <span class="tut-tail none"></span>
    <div class="tut-bubble woodframe">
      <div class="tut-inner">
        <p class="tut-text" aria-live="polite"></p>
        <div class="tut-actions">
          ${canSpeak ? `<button class="tut-speak" aria-label="Read it to me">${SPEAKER_SVG}</button>` : '<span></span>'}
          <span class="tut-dots">${steps.length > 1 ? steps.map(() => '<span class="tut-dot"></span>').join('') : ''}</span>
          <button class="tut-ok"></button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(veil);
  const hole = veil.querySelector('.tut-hole');
  const tail = veil.querySelector('.tut-tail');
  const bubble = veil.querySelector('.tut-bubble');
  const text = veil.querySelector('.tut-text');
  const ok = veil.querySelector('.tut-ok');
  const speak = veil.querySelector('.tut-speak');
  let i = 0;

  const place = () => {
    const r = tutorialRect(steps[i]);
    if (!r) return close(false);   // the screen changed under us
    const pad = 8, vw = innerWidth, vh = innerHeight;
    // A round light for a round thing (the mic, the stop and play discs),
    // a rounded box for everything else.
    const only = tutorialTargets(steps[i]);
    const radius = getComputedStyle(only[0]).borderRadius;
    const round = only.length === 1 && Math.abs(r.width - r.height) < 14 &&
      (radius.endsWith('%') ? parseFloat(radius) >= 50 : parseFloat(radius) >= r.width / 2 - 1);
    hole.style.left = `${r.left - pad}px`;
    hole.style.top = `${r.top - pad}px`;
    hole.style.width = `${r.width + pad * 2}px`;
    hole.style.height = `${r.height + pad * 2}px`;
    hole.style.borderRadius = round ? '50%' : '18px';
    // Below the lit box if it fits, else above, else over the lower part
    // of the screen with no tail.
    const bw = bubble.offsetWidth, bh = bubble.offsetHeight, gap = 18;
    const below = r.bottom + pad + gap, above = r.top - pad - gap - bh;
    let top, dir;
    if (below + bh <= vh - 8) { top = below; dir = 'up'; }
    else if (above >= 8) { top = above; dir = 'down'; }
    else { top = Math.max(8, vh - bh - 24); dir = 'none'; }
    const cx = r.left + r.width / 2;
    const left = Math.max(16, Math.min(vw - 16 - bw, cx - bw / 2));
    bubble.style.left = `${left}px`;
    bubble.style.top = `${top}px`;
    tail.className = `tut-tail ${dir}`;
    tail.style.left = `${Math.max(left + 22, Math.min(left + bw - 34, cx - 12))}px`;
    tail.style.top = dir === 'up' ? `${top - 12}px` : `${top + bh}px`;
  };

  const show = () => {
    text.textContent = steps[i].text;
    ok.textContent = i < steps.length - 1 ? 'Next' : 'Got it!';
    veil.querySelectorAll('.tut-dot').forEach((d, k) => d.classList.toggle('on', k === i));
    stopSpeaking();
    place();
  };

  const stopSpeaking = () => {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); } catch (e) {}
    if (speak) speak.classList.remove('speaking');
  };

  // Things move under the veil - pictures load, the deck settles - so the
  // lit box follows its target for as long as the bubble is up.
  const follow = setInterval(place, 250);
  const onResize = () => place();
  addEventListener('resize', onResize);

  function close(done) {
    clearInterval(follow);
    removeEventListener('resize', onResize);
    stopSpeaking();
    veil.remove();
    tutorialOpen = null;
    if (!done) return;
    tutorialsSeen.add(name);
    fetch(`/tutorial-seen/${name}`, { method: 'POST' }).catch(() => {});
  }

  ok.onclick = () => { if (++i < steps.length) show(); else close(true); };
  if (speak) speak.onclick = () => { stopSpeaking(); speakAloud(steps[i].text, speak); };
  tutorialOpen = { name, close };
  show();
}

// Eighteen feather colours, nine on screen at a time in a loop that never
// ends. Four are lifted straight off the birds themselves, so a child can
// paint one bird in another's colours and have it actually match: the orange
// and blue are the Kingfisher's body and eye flash, the green is the Parrot's
// flight feather, the red is the Cardinal's.
// The order here does not matter - the list is sorted round the colour wheel
// just below, so a new colour only needs adding, not placing.
const AVATAR_SWATCHES = [
  { hex: '#000000', name: 'Black' },
  { hex: '#FFFFFF', name: 'White' },
  { hex: '#9CAF88', name: 'Sage' },
  { hex: '#F96A1C', name: 'Orange' },      // Kingfisher body
  { hex: '#0197B8', name: 'Blue' },        // Kingfisher eye flash and tail
  { hex: '#6DAA44', name: 'Green' },       // Parrot flight feather
  { hex: '#F91E27', name: 'Red' },         // Cardinal face mask and body
  { hex: '#F2C94C', name: 'Yellow' },
  { hex: '#E87EA1', name: 'Pink' },
  { hex: '#8B5A2B', name: 'Brown' },
  { hex: '#B5D334', name: 'Lime' },
  { hex: '#2E8B57', name: 'Emerald' },
  { hex: '#3CC8C0', name: 'Aqua' },
  { hex: '#2F5FD0', name: 'Royal blue' },
  { hex: '#1F2A6B', name: 'Navy' },
  { hex: '#B9A6E0', name: 'Lavender' },
  { hex: '#7B3FB5', name: 'Purple' },
  { hex: '#D0309A', name: 'Magenta' },
].sort((a, b) => swatchHueKey(a.hex) - swatchHueKey(b.hex));

// Where a colour sits going round the spectrum. The wheel is turned so the
// reds just short of 360 count as the start, not the end, and the two with no
// hue at all - white, then black - are parked after pink. So the loop runs
// red, orange, brown, yellow ... purple, magenta, pink, white, black and back
// round to red. A function declaration, so it is hoisted above the sort.
function swatchHueKey(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
  const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
  if (d < 0.08) return 400 + (1 - max);            // white 400, black 401
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h *= 60;
  if (h < 0) h += 360;
  return h >= 345 ? h - 360 : h;
}

// --- Layered prototype (Classic v1) -----------------------------------------
// The new artwork is four complete layers - body, two wings, head - each drawn
// on the same 1000x1000 canvas in its final position, plus a wash mask per
// layer marking which pixels take the child's colour. Nothing is pre-baked:
// the colour is applied live by an SVG filter, so a swatch tap is instant and
// there are no per-colour files at all.
//
// The art sits 7.9 units higher on its canvas than the accessory grid expects
// - measured, its crown is at y 0.1 and its feet at y 89.0, against the grid's
// 8 and 96.9 - so the whole bird is nudged down by that much. Height and
// silhouette width already match to a tenth of a unit, so nothing is scaled.
// Each bird's art is drawn on its own 1000x1000 canvas and needs nudging down
// so its feet land on the grid's ground line at y 96.9. shiftY is 96.9 minus
// wherever that bird's art actually ends - measured, not guessed.
//
// They are all grown 20%. The layered art is as tall as the old birds but
// narrower, because those wings stuck out to x 13 and 87 where these tuck in,
// so at 1.0 they read small.
//
// Every bird names its own stack, back to front, because the deliveries are
// not all the same shape: Classic paints its feet into the body, the Cardinal
// gives them their own layers, and the Parrot adds a hidden underlay behind
// everything (so a lifted head or an open wing has something to sit against)
// and a fixed face overlay above its washable head.
//   grp  where the layer goes: 'under' behind the torso, 'torso' with the
//        body, 'wingL'/'wingR' in the groups that rotate at the shoulders,
//        'over' above the torso where the head lives.
//   wash the mask marking which of that layer's pixels take the child's
//        colour. Omit it and the layer never recolours.
const PROTO_BIRDS = {
  classic: { dir: '/static/avatar/classic/', shiftY: 5.0, scale: 1.2, stack: [
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
  ]},
  cardinal: { dir: '/static/avatar/cardinal/', shiftY: 4.9, scale: 1.2, stack: [
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso', wash: 'wash-body.webp' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
  ]},
  parrot: { dir: '/static/avatar/parrot/', shiftY: 4.8, scale: 1.2, wingY: 51.0, stack: [
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'over' },
  ]},
  // The only bird with a tail, and the only one whose washable head is just the
  // crown - a Kingfisher's blue cap sits over a fixed orange face.
  kingfisher: { dir: '/static/avatar/kingfisher/', shiftY: 4.9, scale: 1.2, wingY: 49.3, stack: [
    { f: 'tail.webp',   grp: 'under' },
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'over' },
  ]},
  // The one bird whose wings sit IN FRONT of its head. Lifted, the shoulder
  // end of each wing swings in across the facial disc - about 4,000 pixels of
  // overlap at the dance's 45 degrees - and the artist wants the wing on top
  // there. So the head and face go in the torso group, drawn before the wings.
  // The cost is that the head joins the body's 0.6-unit dance wiggle, which
  // the other birds' heads sit out.
  owl: { dir: '/static/avatar/owl/', shiftY: 4.8, scale: 1.2, wingY: 51.0, stack: [
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'head.webp',   grp: 'torso', wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
  ]},
  // Built like the Owl - wings in front of the head, so the head and face go
  // in the torso group - with a tail behind the feet like the Kingfisher.
  duckling: { dir: '/static/avatar/duckling/', shiftY: 4.9, scale: 1.2, wingY: 51.0, stack: [
    { f: 'tail.webp',   grp: 'under' },
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'head.webp',   grp: 'torso', wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
  ]},
  // Flippers instead of wings, head on top of them like the Classic. The body
  // washes too, but only the grey sides - its mask fades to nothing across
  // the white belly, so the belly stays white in every colour. The breast runs
  // lower than anyone else's (y88.5 against 80.4), by design: it hides the
  // tops of the legs.
  penguin: { dir: '/static/avatar/penguin/', shiftY: 4.9, scale: 1.2, wingY: 52.0, stack: [
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso', wash: 'wash-body.webp' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'over' },
  ]},
  // Took the Bluebird's place in the cast. Built like the Parrot - wings under
  // the head, a fixed overlay on top - where the overlay carries the red crest
  // as well as the face, and a dark tail behind the feet. The cream spots on
  // each wing move with it but never wash (the mask weight is zero there).
  woodpecker: { dir: '/static/avatar/woodpecker/', shiftY: 4.8, scale: 1.2, wingY: 51.0, stack: [
    { f: 'tail.webp',   grp: 'under' },
    { f: 'foot-l.webp', grp: 'under' },
    { f: 'foot-r.webp', grp: 'under' },
    { f: 'body.webp',   grp: 'torso' },
    { f: 'wing-l.webp', grp: 'wingL', wash: 'wash-wing-l.webp' },
    { f: 'wing-r.webp', grp: 'wingR', wash: 'wash-wing-r.webp' },
    { f: 'head.webp',   grp: 'over',  wash: 'wash-head.webp' },
    { f: 'face.webp',   grp: 'over' },
  ]},
};

function protoBird(species) {
  return PROTO_BIRDS[species] || PROTO_BIRDS.classic;
}

// Shift the art down onto the grid, then grow it about the point its feet
// stand on (50, 96.9) so however big it gets it never sinks through the rug.
function protoTransform(bird) {
  const t = `translate(0,${bird.shiftY})`;
  if (bird.scale === 1) return t;
  return `translate(50 96.9) scale(${bird.scale}) translate(-50 -96.9) ${t}`;
}
let protoUid = 0;

// 0 -> 0, 0.5 -> the swatch, 1 -> 1. A straight two-piece ramp through the
// swatch, which keeps the painted highlights and shadow instead of flattening
// the plumage to one flat colour the way a plain fill would.
function protoWashFilter(id, hex) {
  // hex arrives with the leading '#' already stripped, so the channels start
  // at 0, 2 and 4 - not 1, 3 and 5.
  const c = n => (parseInt(hex.slice(n, n + 2), 16) / 255).toFixed(4);
  return `<filter id="${id}" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 ${c(0)} 1"/>
        <feFuncG type="table" tableValues="0 ${c(2)} 1"/>
        <feFuncB type="table" tableValues="0 ${c(4)} 1"/>
      </feComponentTransfer>
    </filter>`;
}

function protoAvatarSvg(body, size, equipped, dancing, accessoryLayers, heldLayer, species, shoesLayer, lift, crest) {
  const bird = protoBird(species);
  const d = bird.dir;
  // Every instance gets its own ids: the nav icon and the big preview are both
  // on the page at once, and url(#id) would otherwise resolve to whichever was
  // written first.
  const u = 'p' + (++protoUid);
  const hex = (body || '#9CAF88').replace('#', '').toUpperCase();
  const img = (file, extra) => `<image xlink:href="${d}${file}" href="${d}${file}" x="0" y="0" width="100" height="100" preserveAspectRatio="none"${extra || ''}/>`;
  const maskId = i => `${u}m${i}`;

  // The plain layer, then a washed copy of the same layer laid over it through
  // the mask - so the fixed parts show the original paint, only the plumage
  // takes the colour, and the mask's own soft edge blends the two.
  const plain = (lay, i) => img(lay.f) +
    (lay.wash ? `<g mask="url(#${maskId(i)})">${img(lay.f, ` filter="url(#${u}f)"`)}</g>` : '');
  // Under most hats the head and face are cut by the bird's crest mask, so
  // the crest doesn't show through the hat. Body, wings and feet never are.
  const draw = (lay, i) => (crest && (lay.f === 'head.webp' || lay.f === 'face.webp'))
    ? `<g mask="url(#${u}crest)">${plain(lay, i)}</g>` : plain(lay, i);
  const of = grp => bird.stack.map((lay, i) => lay.grp === grp ? draw(lay, i) : '').join('');

  const masks = bird.stack.map((lay, i) => lay.wash
    ? `<mask id="${maskId(i)}" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">${img(lay.wash)}</mask>`
    : '').join('');

  const pivot = bird.wingY ? `--wing-y:${bird.wingY}px;` : '';
  // Skates raise everything - bird, shoes and every accessory - by the same
  // amount. The lift is in the bird's art units, so it scales with the bird.
  const up = lift ? `translate(0,${(-lift * bird.scale).toFixed(2)})` : '';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="overflow:visible;${pivot}" class="avatar-layered ${dancing ? 'avatar-dancing' : ''}">
    <defs>
      ${protoWashFilter(u + 'f', hex)}
      ${masks}
      ${crest ? `<mask id="${u}crest" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100"><image xlink:href="${crest}" href="${crest}" x="0" y="0" width="100" height="100" preserveAspectRatio="none"/></mask>` : ''}
    </defs>
    <g transform="${up}">
    <g transform="${protoTransform(bird)}">${of('under')}</g>
    <g class="av-acc"><g class="av-shoes" transform="${protoTransform(bird)}">${shoesLayer || ''}</g></g>
    <g transform="${protoTransform(bird)}">
      <g class="av-torso">
        ${of('torso')}
        <g class="av-wing-l">${of('wingL')}</g>
        <g class="av-wing-r">${of('wingR')}</g>
      </g>
      ${of('over')}
    </g>
    <g class="av-acc"><g class="av-face">
    ${accessoryLayers}
    <g class="av-held">${heldLayer}</g>
    </g></g>
    </g>
  </svg>`;
}

function avatarSvg(body, size, equipped, dancing, species) {
  equipped = equipped || {};
  // Held items ride with the right wing, so they're pulled out of the normal
  // layer stack and animated alongside it. Everything else layers as usual.
  // Only the layered birds need the shift; the legacy art below is the very
  // thing the accessories were drawn to fit.
  const layer = cat => {
    const art = (equipped[cat] && accessorySvgCache[equipped[cat]]) ? accessorySvgCache[equipped[cat]] : '';
    const dy = PROTO_ONLY ? (ACCESSORY_SHIFT_Y[cat] || 0) : 0;
    return (art && dy) ? `<g transform="translate(0,${dy})">${art}</g>` : art;
  };
  const accessoryLayers = ACCESSORY_LAYER_ORDER.filter(cat => cat !== 'held').map(layer).join('');
  const heldLayer = layer('held');

  // Prototype: the layered Classic is the only bird for now, whatever species
  // happens to be stored against the profile.
  // Footwear goes BETWEEN the feet and the body on the layered birds - over
  // the toes, under the breast - so a boot looks worn rather than stuck on
  // the front of the bird. Shoes are drawn in the bird's own art space (the
  // 1000px canvas its feet were drawn on, in 0-100 units) and sized with it,
  // so they land on the feet whatever size the bird is shown at.
  // Note for the legacy renderer below: these coordinates are bird-art
  // coordinates, so shoes would sit wrong on the old birds.
  if (PROTO_ONLY) {
    // The hats are fitted to each bird separately, on the bird's own art
    // canvas, so they go inside the bird's shift-and-scale like the shoes do.
    // Most also come with a mask that hides the bird's crest or tuft, which
    // would otherwise poke up through the hat.
    const birdKey = PROTO_BIRDS[species] ? species : 'classic';
    const fit = equipped.hats && accessoryFitCache[equipped.hats];
    const hatLayer = cat => (cat === 'hats' && fit)
      ? `<g transform="${protoTransform(protoBird(species))}"><image xlink:href="/static/accessories/hats/${birdKey}/${fit.art}.webp" href="/static/accessories/hats/${birdKey}/${fit.art}.webp" x="0" y="0" width="100" height="100"/></g>`
      : layer(cat);
    const rest = ACCESSORY_LAYER_ORDER.filter(cat => cat !== 'held' && cat !== 'shoes').map(hatLayer).join('');
    const lift = (equipped.shoes && accessoryLiftCache[equipped.shoes]) || 0;
    const crest = fit && fit.crest ? `/static/accessories/hats/crest-${birdKey}.webp` : null;
    return protoAvatarSvg(body, size, equipped, dancing, rest, heldLayer, species, layer('shoes'), lift, crest);
  }

  // Real illustrated art (Warble art pass 04), replacing the old flat
  // vector shapes. Body and wings are recolorable: each swatch has its own
  // pre-baked pair (body_<hex>.webp / wing_<hex>.webp), produced by
  // extracting a normalized shading map from the neutral-toned source art
  // and overlay-blending it onto the swatch colour - so every colour keeps
  // the same painted highlights and shadow, not a flat tint. The beak is
  // baked into the body art as a fixed orange in every variant (colour
  // customization for face/beak was dropped - body colour only now), so
  // there's no separate face/beak layer to draw. Wing and leg are single
  // assets, mirrored for the opposite side via a scale(-1,1) transform on
  // the inner <image> - the .av-wing-l/.av-leg-l wrapper still gets its
  // own transform-origin from the dancing CSS untouched by that mirror.
  //
  // Species (added in the bird-selector pass): 'default' is the original
  // plain bird and keeps the old unprefixed filenames untouched
  // (body_<hex>.webp). Every other species has its own asset triplet -
  // body_<species>_<hex>.webp / wing_<species>_<hex>.webp / leg_<species>.webp
  // - built the same way (luminance-preserving overlay blend per swatch),
  // so the same colour wheel works for all of them; legs aren't recoloured
  // for any species, default included.
  const hex = (body || '#9CAF88').replace('#', '').toUpperCase();
  const sp = (species && species !== 'default') ? species : null;
  const bodyImg = sp ? `/static/avatar/body_${sp}_${hex}.webp` : `/static/avatar/body_${hex}.webp`;
  const wingImg = sp ? `/static/avatar/wing_${sp}_${hex}.webp` : `/static/avatar/wing_${hex}.webp`;
  const legImg = sp ? `/static/avatar/leg_${sp}.webp` : `/static/avatar/leg.webp`;
  const L = sp ? SPECIES_LAYOUT[sp] : null;
  const bodyW = L ? L.bodyW : 60, bodyX = L ? L.bodyX : 20;
  const wingW = L ? L.wingW : 18;
  const legW = L ? L.legW : 12;
  const wingRX = L && L.wingX ? L.wingX : 69;  // right wing's inner (body-side) edge
  const wingLX = 100 - wingRX;                 // mirrored left counterpart
  const wingY = L && L.wingY ? L.wingY : 57.5;

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="overflow:visible;" class="${dancing ? 'avatar-dancing' : ''}">
    <g class="av-leg-l">
    <image xlink:href="${legImg}" href="${legImg}" x="36" y="84" width="${legW}" height="12.9" transform="scale(-1,1) translate(-84,0)"/>
    </g>
    <g class="av-leg-r">
    <image xlink:href="${legImg}" href="${legImg}" x="52" y="84" width="${legW}" height="12.9"/>
    </g>
    <g class="av-torso">
    <image xlink:href="${bodyImg}" href="${bodyImg}" x="${bodyX}" y="8" width="${bodyW}" height="83.8"/>
    <g class="av-wing-l">
    <image xlink:href="${wingImg}" href="${wingImg}" x="${wingLX}" y="${wingY}" width="${wingW}" height="29.5" transform="scale(-1,1) translate(-${2 * wingLX},0)"/>
    </g>
    <g class="av-wing-r">
    <image xlink:href="${wingImg}" href="${wingImg}" x="${wingRX}" y="${wingY}" width="${wingW}" height="29.5"/>
    </g>
    </g>
    <g class="av-face">
    ${accessoryLayers}
    <g class="av-held">${heldLayer}</g>
    </g>
  </svg>`;
}

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `warble-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { alert("Couldn't export right now."); }
  };

  const RESET_COPY = {
    dressup:    ['Reset Dress Up?', 'All bought items are forgotten and your bird is undressed. Feathers and colours are kept.'],
    feathers:   ['Reset feathers?', 'Your feather balance goes back to zero. Items you already own are kept.'],
    sightings:  ['Reset birds, habitats and trophies?', 'Every bird, warble, named place, trophy and weekly bonus is deleted. Feathers and Dress Up items are kept.'],
    everything: ['Reset EVERYTHING?', 'The whole app goes back to how it was the first time you opened it. Birds, trophies, feathers, Dress Up, your name and photo - all of it.'],
  };

  document.getElementById('replayTutorialsBtn').onclick = async (e) => {
    const btn = e.currentTarget;
    try {
      const res = await fetch('/reset/tutorials', { method: 'POST' });
      if (!res.ok) throw new Error('reset failed');
      tutorialsSeen = null;   // forget them here too, not just on the server
      await refreshWhatsNew();
      stage.classList.remove('top-aligned');
      renderWelcome();        // from the very beginning: bird, colour, name
    } catch (err) { btn.textContent = "Couldn't do that - tap to retry"; }
  };

  // Only the buttons with a scope: "Download my data" shares the look but
  // not the job, and used to be caught by this and break.
  stage.querySelectorAll('.reset-btn[data-scope]').forEach(btn => {
    btn.onclick = async () => {
      const scope = btn.dataset.scope;
      const [title, detail] = RESET_COPY[scope];
      if (!confirm(`${title}\n\n${detail}\n\nThis cannot be undone.`)) return;
      // Full reset asks twice - it's the one there's no recovering from.
      if (scope === 'everything' && !confirm('Really wipe everything? Last chance.')) return;

      btn.disabled = true;
      btn.textContent = 'Resetting...';
      try {
        const res = await fetch(`/reset/${scope}`, { method: 'POST' });
        if (!res.ok) throw new Error('reset failed');
        // Reload rather than patching state by hand - far too many caches
        // (profile, accessories, collection, feathers) would otherwise be
        // left holding data that no longer exists.
        location.reload();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Reset failed - tap to retry';
      }
    };
  });
}

// Photos are shrunk to 240px square and re-encoded as JPEG before upload.
// They're stored as a data URL in the database, so sending a multi-megabyte
// phone photo straight up would be far too heavy - this lands around 15-25KB.
function handlePhotoChosen(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 240;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      // Centre-crop to a square so it fills the circular frame without squashing
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIZE, SIZE);
      savePhoto(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => alert("Sorry, that image couldn't be read.");
    img.src = reader.result;
  };
  reader.onerror = () => alert("Sorry, that image couldn't be read.");
  reader.readAsDataURL(file);
}
