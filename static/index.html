<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warble</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk:#2D1B69; --dusk-mid:#3D2A85;
    --terra:#E8845C; --terra-dk:#B85A36;
    --parch:#F5EDD6; --parch-dk:#E9DDBE;
    --disc-cream:#FBEAD1;   /* the face of the wooden play/share/pin discs */
    /* Gold means rare (--rare below) and nothing else; the trophy leaves
       turning gold are painted. --sun is only for the warm foot of the sky
       gradients. Selected, finished and progress are green (--sage); every
       glow is cream (--glow, as r,g,b); feather amounts are feather blue,
       --feather on cream and --feather-lt on a scene. See the design
       language in CLAUDE.md. */
    --sun:#F2C94C;
    --glow:251,234,209;
    /* Brown ink on cream: --ink-brown for words, --ink-soft for small labels
       and notes, var(--wood-edge) for names and titles. --cream-lt is a box
       sitting inside a cream card (fact tiles, sheet options). */
    --ink-brown:#4A2408; --ink-soft:#8A5A30; --cream-lt:#FFF6E6;
    /* The carved wood rim, for anything with a cream face: put it after the
       face as the border-box layers and give the element a transparent
       border - background: linear-gradient(var(--disc-cream),var(--disc-cream))
       padding-box, var(--wood-rim); border:3px solid transparent; */
    /* One solid wood colour: the grain stripes and the light-to-dark
       gradient read as banding on a phone screen. */
    --wood-rim: linear-gradient(#D87A38, #D87A38) border-box;
    --feather:#1A6FB0; --feather-lt:#9AD6FF;
    --sage:#7EC8A4; --sage-dk:#3F7C5C;
    --mist:#C4BFDF; --mist-dk:#8E87B8;
    --rose:#E87EA1; --ink:#1A1128;
    /* Rare is a bright, fully saturated gold - the treasure colour. */
    --rare:#FFC300; --rare-dk:#C79600;
    /* Sampled off the collector card frame art (card-frame-v7.webp) so the
       CSS-drawn frames on My Flock sit in the same wood as the painted ones
       on the pack cards: --wood is its lit face, --wood-edge its shadowed
       outer edge. */
    --wood:#D87A38; --wood-lit:#E59450; --wood-dk:#B8632A; --wood-edge:#743206;
    /* Where a bird photo gets cropped from. Every window in the app is wider
       than it is tall, so object-fit:cover crops top and bottom - between 16%
       and 63% of the photo's height depending on how the photo was shot. The
       default, centre, takes the middle band, and a bird's head is above the
       middle of its body, so centre is the one crop that reliably loses the
       head. Biased up to keep it. 30% rather than 0 because a bird photo
       usually has some sky or branch above the bird, and cropping hard to the
       top gives you that instead.

       35% is measured, not picked: crops from 31% to 39% all score the same
       and it is the middle of that window. Above 40% the high-framed photos
       start losing their heads again, below 31% the low-framed ones do.
       Across seven windows and eight framings it takes head losses from 9 to
       4, and the 4 left are a bird sitting in the bottom fifth of the frame,
       which a centre crop loses too - no single crop point saves those. */
    --bird-crop:50% 35%;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{overflow-x:hidden;}
  /* The page does not scroll: #scroller does. Everything that moves lives
     inside it, and it stops at the top of the nav bar - so the only thing
     ever behind the nav is the scene, which is what lets the nav be
     transparent. Before this, the bird grid slid underneath and the labels
     landed on cream card faces at 1.17:1. */
  body{
    font-family:'Poppins',sans-serif;
    color:#fff;
    height:100vh; height:100lvh;
    overflow:hidden;
    transition:background 1.2s ease;
  }
  /* lvh for the same reason #sceneBg uses it: a phone hides its address bar
     as you scroll, and a pane sized in vh would change height mid-scroll and
     drag the crop line with it. */
  #scroller{
    position:fixed; top:0; left:0; right:0; bottom:var(--nav-h, 64px);
    overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 16px 20px;
    -webkit-overflow-scrolling:touch;
  }

  /* --- Time-of-day backgrounds, applied globally, every screen --- */
  body.time-dawn{background:linear-gradient(180deg,#3D2A85 0%,#8C6BB0 45%,#F0A868 75%,#F6C98A 100%);}
  body.time-day{background:linear-gradient(180deg,var(--dusk-mid) 0%,var(--mist) 45%,var(--sage) 80%,var(--sun) 100%);}
  body.time-dusk{background:linear-gradient(180deg,var(--dusk) 0%,var(--rose) 45%,var(--terra) 75%,var(--sun) 100%);}
  body.time-night{background:linear-gradient(180deg,var(--ink) 0%,var(--dusk) 60%,var(--dusk-mid) 100%);}

  /* --- The painted scene, behind every screen ---------------------------
     A fixed layer at z-index -1: above the gradient body background, which
     the canvas paints below everything, and below every bit of content,
     which is all either in flow or positioned later. Fixed rather than
     scrolled, so the scene sits still while the cards move over it.
     Three layers, because the blur has to reach the picture without
     touching anything else: the element itself holds position and size,
     ::before is the picture and carries the blur, ::after is the scrim. */
  #sceneBg{
    position:fixed; left:0; right:0; top:0; z-index:-1; pointer-events:none;
    opacity:0; transition:opacity .45s ease;
    /* The blurred plate is scaled up past the edges of this box; clip it
       here so it cannot paint outside the viewport. */
    overflow:hidden;
    /* lvh, not vh. On a phone the address bar slides away as you scroll, and
       that changes the viewport height - so a layer sized in vh resizes
       mid-scroll, and because the image is sized with cover, resizing it
       rescales the picture. The scene visibly zoomed while you scrolled.
       lvh is the viewport at its LARGEST, with the bar retracted, so the
       layer is one fixed size and the bar coming and going moves nothing.
       The vh line above stays for browsers that do not know lvh - they get
       today's behaviour rather than a broken layout. */
    height:100vh;
    height:100lvh;
    /* Promoted onto the compositor. A fixed layer that the browser repaints
       every frame drifts against the content on a phone while the page
       scrolls and the address bar animates - it is painted from the last
       frame's scroll offset, so it lags and reads as the scene sliding up
       with the cards. One that lives on the compositor is pinned there and
       cannot lag, which is what these three lines buy. */
    transform:translateZ(0);
    will-change:transform;
    backface-visibility:hidden;
  }
  #sceneBg.on{opacity:1;}
  /* The picture. Sharp is the resting state, so a first paint on Home shows
     a sharp scene rather than racking into focus on every app launch.
     blur(0px), not none: a filter only animates into another filter with
     the same functions in the same order, so both ends have to be spelled
     out the same way. */
  #sceneBg::before{
    content:''; position:absolute; inset:0;
    background-image:var(--scene-img, none);
    background-position:center bottom; background-size:cover; background-repeat:no-repeat;
    filter:blur(0px) saturate(1);
    transition:filter .55s ease, transform .55s ease;
    /* No transform here, deliberately - not even scale(1). An identity
       transform still promotes this to its own composited layer, and that
       layer resampled its own right-hand edge: one device-pixel column down
       the side of the screen, up to 24/255 out. Invisible in a screenshot
       until you diff it against the version before this change, which is
       how it was found. With the property absent on Home the picture paints
       straight onto the page as it always did, and "none" interpolates to
       scale(1.22) perfectly well, so the animation is unaffected. */
  }
  /* Every screen that is not Home. The scale is not decoration: a blurred
     layer samples the transparent space beyond its own edges, so at its
     true size the picture would fade out around the rim and let the purple
     gradient show through as a soft border. Scaling it up by 22% pushes
     that rim outside the viewport - at 390px wide that is 43px of margin
     against a 16px blur, which is 2.7 standard deviations, so the edge you
     can actually see is 99.6% opaque. It doubles as the small push-in a
     real lens gives you when it racks out of focus. */
  /* Only just out of focus (3px, down from 16px): enough to sit the screen's
     content in front of the scene, not enough to lose the hills. The scrim
     and the text shadows below carry the legibility. */
  body.scene-blurred #sceneBg::before{
    filter:blur(3px) saturate(1.45);
    transform:scale(1.22);
  }
  /* The scrim is what makes the white type survive a bright midday sky, and
     its shape is measured rather than judged by eye. "Get out there" and the
     line under it sit at 42-47% down the screen, which is where the first
     attempt made the scrim LIGHTEST - white on a sunlit meadow came out at
     1.7:1 there, against the 4.5:1 that text needs. The band around them is
     now 0.57, which is what it takes to hold a bright sky down to 4.5.
     The window that stays open is 20-34%, above the heading and behind the
     sky, which is the part of these paintings worth seeing. */
  #sceneBg::after{
    content:''; position:absolute; inset:0;
    /* background-color paints underneath background-image, so this is one
       flat wash below the shaped scrim rather than a fourth layer. It is
       transparent on Home and comes up on the blurred screens, where the
       extra saturation would otherwise fight the cards sitting on top.
       A colour animates; the gradient stops above it could not.
       The blurred state also fades the whole scrim to 0.82, so the veil is
       lighter overall rather than a wash piled on top of a scrim at full
       strength. Together these leave about 0.37 of darkening where the
       gradient is thinnest, against 0.54 before - roughly a third less.
       Both numbers are measured. Every screen was rendered against all
       sixteen pictures three times - as shipped, with text-shadow off, and
       with the glyphs transparent - so the exact glyph mask comes from the
       shadowless pair and the contrast is read against the ring of pixels
       touching each letterform in the shipped render. The worst run of type
       on any blurred screen against any sky sits at 2.72 here; at the old,
       darker setting it was 2.32, because the type had almost no shadow to
       help it. Home, whose scrim was tuned for it specifically, is 4.51. */
    background-color:rgba(26,17,40,0);
    opacity:1;
    transition:background-color .55s ease, opacity .55s ease;
    background-image:linear-gradient(180deg,
      rgba(26,17,40,0.66) 0%,  rgba(26,17,40,0.32) 20%,
      rgba(26,17,40,0.26) 34%, rgba(26,17,40,0.57) 42%,
      rgba(26,17,40,0.60) 52%, rgba(26,17,40,0.45) 64%,
      rgba(26,17,40,0.54) 80%, rgba(26,17,40,0.68) 100%);
  }
  body.scene-blurred #sceneBg::after{background-color:rgba(26,17,40,0.26); opacity:0.82;}
  /* Belt and braces over the scrim: a shadow keeps a glyph readable where it
     lands on a highlight the gradient could not know about. Only when a
     scene is up - on the plain gradient it just makes the type muddy.
     The list past the first two is every run of type that sits straight on
     the picture with no card under it, found by rendering each screen twice
     - once normally, once with every glyph made transparent - and diffing.
     They all used to be safe because the only thing behind them was a dark
     purple gradient; on a dawn sky at 75% white they were the two screens
     that went backwards when the veil was lightened. text-shadow inherits,
     so putting it on the container covers the spans inside it. */
  body.scene-on .stage-label, body.scene-on .stage-sub,
  body.scene-on .back-btn, body.scene-on .collection-title,
  body.scene-on .collection-count, body.scene-on .profile-section-title,
  body.scene-on .reset-note, body.scene-on .stat-empty,
  body.scene-on .flock-stats, body.scene-on .pack-tally,
  body.scene-on .pack-more,
  body.scene-on .pack-blurb, body.scene-on .fan-caption, body.scene-on .pack-empty,
  body.scene-on .hub-label, body.scene-on .nav-tab, body.scene-on .sg-navbtn,
  body.scene-on .joke-setup, body.scene-on .joke-punch, body.scene-on .joke-locked,
  body.scene-on .trophy-caption-name, body.scene-on .trophy-caption-next{
    /* Four stacked shadows, not one. A single soft shadow reads as a shadow
       but does almost nothing for legibility - measured, it moved the worst
       run from 1.91 to 1.89. What small light type on a bright photograph
       needs is a scrim it carries with it, so the first three are tight and
       nearly opaque and build up into a dark collar right against the
       letterform; the fourth is the wide soft one that stops the whole block
       looking cut out. */
    text-shadow:0 0 2px rgba(26,17,40,0.95), 0 0 4px rgba(26,17,40,0.85),
                0 1px 3px rgba(26,17,40,0.92), 0 2px 12px rgba(26,17,40,0.5);
  }
  /* Nothing here animates for anyone who has asked for that: the scene
     arrives at whichever focus the screen calls for. */
  @media (prefers-reduced-motion: reduce){
    #sceneBg, #sceneBg::before, #sceneBg::after{transition:none;}
  }

  /* Settings picker */
  .scene-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; width:100%; margin-top:4px;}
  .scene-pick{
    position:relative; border:none; padding:0; cursor:pointer; overflow:hidden;
    border-radius:14px; aspect-ratio:3/4; background:var(--parch-dk);
    box-shadow:0 2px 7px rgba(26,17,40,0.25);
  }
  .scene-pick img{width:100%; height:100%; object-fit:cover; display:block;}
  .scene-pick.none{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg,var(--dusk-mid),var(--sun));
  }
  .scene-pick-name{
    position:absolute; left:0; right:0; bottom:0; padding:12px 4px 5px;
    font-family:'Poppins'; font-weight:900; font-size:10.5px; color:#fff; text-align:center;
    background:linear-gradient(180deg,rgba(26,17,40,0),rgba(26,17,40,0.78));
  }
  /* A tick as well as the ring, so the choice is not carried by colour alone */
  .scene-pick.on{outline:3px solid var(--sage); outline-offset:-3px;}
  .scene-pick-tick{
    position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
    background:none; font-size:22px;
    display:none; align-items:center; justify-content:center;
  }
  .scene-pick.on .scene-pick-tick{display:flex;}

  .top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;position:relative;}
  .top-actions{display:flex;align-items:center;gap:8px;}
  /* Feathers and the birder rank, side by side: what the child has, and who
     they are. The rank is just its badge - the number in its wreath - and
     taps open the ladder. */
  .top-left{display:flex;align-items:center;gap:6px;}
  .top-rank{border:none;background:none;padding:0;cursor:pointer;display:flex;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.35));}
  .top-rank[hidden]{display:none;}
  .top-settings-btn{background:transparent;border:none;border-radius:50%;width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:none;}
  .top-settings-btn svg{width:23px;height:23px;}
  .top-settings-btn img{width:100%;height:100%;object-fit:contain;display:block;}
  .top-profile-btn{background:var(--disc-cream);border:none;border-radius:50%;width:40px;height:40px;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);}
  .top-profile-btn svg{width:24px;height:24px;}
  .feathers{display:flex;align-items:center;gap:6px;padding:6px 2px;font-family:'Poppins';font-weight:900;font-size:17px;color:var(--feather-lt);text-shadow:0 1px 3px rgba(0,0,0,0.35);}
  /* Shared feather icon - height:1em means it always matches whatever
     font-size its context has, so one image works inline at every size
     this shows up at (top bar counter, challenge rewards, price tags,
     the flying particle animation) without per-site sizing. */
  .feather-icon{height:1em; width:auto; vertical-align:-0.15em; display:inline-block;}
  /* A painted icon standing in a line of text, sized by that text - so it
     drops into the same places its emoji stand-in did. */
  .ico{height:1.15em; width:auto; vertical-align:-0.2em; display:inline-block;}
  /* The carved "?" on the sign of a trophy not won yet stands for a whole
     name, so it is drawn bigger than an icon in a line of words. */
  .trophy-caption-name .ico{height:1.9em; vertical-align:-0.45em;}
  /* The rank badge sits right after the count, so nothing here may change
     width while it counts: the digits are all one width (tabular), the
     number keeps room for its longest value (animateFeatherCount), and the
     pop is the feather alone, not the whole counter. */
  #featherCount{display:inline-block; font-variant-numeric:tabular-nums; text-align:left;}
  .feathers.feather-pop .feather-icon{animation:featherPop 0.32s ease;}
  @keyframes featherPop{0%{transform:scale(1);}45%{transform:scale(1.28);}100%{transform:scale(1);}}
  .top-wordmark{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    height:30px; pointer-events:none;
  }
  .home-wordmark{
    height:90px; margin-bottom:22px;
  }

  .stage{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;margin-top:16px;}

  /* --- Bottom tab navigation, fixed, present on every screen ---
     The white slab is gone and a single white hairline says where the bar
     starts. The drop shadow went with the slab - it was a shadow cast onto
     the content by a solid bar, and there is no solid bar now.
     It is not fully transparent, though, and the reason is measured. With
     no fill at all, My Flock's bird grid scrolls underneath and the labels
     land on the cream card faces: white type on rgb(245,237,214) is 1.17:1,
     which is invisible. Over a cream card it takes about 0.55 of ink to
     reach 4.5:1, so the gradient runs from nothing at the hairline to 0.68
     at the very bottom where the labels sit. On Home, where the scene is
     dark down there anyway, it reads as no bar at all; on the busy screens
     it gives the type a floor. */
  .bottom-nav{
    position:fixed; bottom:0; left:0; width:100%;
    background:linear-gradient(180deg,
      rgba(26,17,40,0) 0%, rgba(26,17,40,0.22) 34%,
      rgba(26,17,40,0.56) 70%, rgba(26,17,40,0.68) 100%);
    display:flex; justify-content:space-around; align-items:center;
    padding:3px 4px calc(3px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid rgba(255,255,255,0.65); z-index:20;
  }
  /* flex:1 on every slot (with the Home circle fixed) is what actually
     centres Home. Previously the empty void slot was only as wide as its
     padding while the real tabs sized to their labels, so the left side was
     much narrower than the right and Home sat off-centre. */
  /* White, not --mist-dk. That muted purple was picked to sit on a white
     bar; with the bar gone the labels sit on the scene, so they take the
     same treatment as every other run of naked type - white, and in the
     body.scene-on shadow list below. */
  .nav-tab{
    display:flex; flex-direction:column; align-items:center; gap:1px;
    background:none; border:none; cursor:pointer; padding:1px 3px;
    color:#fff; font-family:'Poppins'; font-size:9px; font-weight:700;
    flex:1 1 0; min-width:0;
  }
  .nav-tab.active{color:var(--sage);}
  /* Every label stays on one line. The Dress Up tab used to say "The
     Hoot-tique", which needed smaller type and still wrapped on a 320px
     phone; as "Hoot-tique" it fits at the same size as the rest. */
  .nav-tab > span:last-child{white-space:nowrap;}
  .nav-tab .nav-icon-svg{width:39.8px; height:39.8px; color:#fff;}
  .nav-tab.active .nav-icon-svg{color:var(--sage);}
  /* The whole bar came down 20%: icons 49.8 -> 39.8, the Home badge
     96.6 -> 77.3 and its lift with it, the padding round them, and the
     labels as far as they could go and stay readable. The wrap matches the
     icon exactly rather than padding around it. Nothing depends on how tall
     the bar is: its real height is measured and published as --nav-h, so
     every screen above it gets the space back automatically. */
  .nav-icon-wrap{
    display:flex; align-items:center; justify-content:center;
    width:39.8px; height:39.8px; border-radius:50%;
    transition:background-color .15s;
  }
  /* Stronger than the 0.18 it was: that was tuned against a flat white bar,
     and on a photograph it disappeared. */
  .nav-tab.active .nav-icon-wrap{background:rgba(232,132,92,0.34);}

  /* --- Home gets a raised, circular treatment as the primary tab --- */
  /* 96.6 -> 77.3 with the rest of the bar, and the lift that keeps it
     riding proud of the bar scaled with it, -35 -> -28. */
  .nav-tab.home-tab{
    flex:0 0 77.3px;
    width:77.3px; height:77.3px; border-radius:50%;
    background:transparent; margin-top:-28px; gap:0;
    box-shadow:none;
    justify-content:center;
  }
  /* The new birdhouse badge is a complete circular illustration (its own
     wood-ring border and bevel baked in), same treatment as the mic badge:
     no coloured background or drop-shadow on the tab itself, image fills
     the tab's own box via object-fit rather than riding at a smaller size
     inside a flat terracotta circle. */
  .nav-tab.home-tab .nav-icon-svg{width:100%; height:100%; color:#fff;}
  .nav-tab.home-tab span:last-child{display:none;}

  /* --- Idle / Recording --- */
  .mic-btn{
    width:108px;height:108px;border-radius:50%;
    background:transparent; color:#fff; font-size:68px;
    border:none; box-shadow:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; transition:transform .1s; position:relative; z-index:1;
  }
  .mic-btn:active{transform:translateY(4px);}
  /* The stop button on the listening screen: the painted stop disc, a touch
     bigger than the old blue circle because its wooden rim takes some of it. */
  .mic-btn.recording{width:92px;height:92px;margin-top:16px;
    filter:drop-shadow(0 4px 6px rgba(26,17,40,0.35));}
  .mic-btn.recording:active{transform:scale(.92);}
  /* The new mic asset is a complete circular badge (its own wood-ring
     border and 3D bevel baked into the artwork) rather than a small glyph
     that rides on a coloured button - so the button itself goes background:
     none/no box-shadow, and the image fills the button's full box instead
     of being sized off font-size like the old icon-on-button approach. */
  .mic-icon{width:100%; height:100%; object-fit:contain; display:block;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

  /* --- Home: the mic breathing ----------------------------------------
     Only the idle Home mic gets this. .mic-btn is shared with the small
     "go again" button on the reveal screen, which must not breathe while a
     child is deciding whether to record. */
  .mic-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
  @keyframes micBreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
  .mic-alive .mic-icon{animation:micBreathe 2.6s ease-in-out infinite;}
  /* Pressed: the breathing stops dead and the mic dips, so the tap is
     answered before the listening screen has even loaded. */
  .mic-wrap.pressed .mic-icon{animation:none;transform:scale(.9);transition:transform .1s ease;}

  /* --- Home cards ------------------------------------------------------
     One shared shell. Here Now and Challenge are the two things worth
     looking at after the mic; the tip and joke are a lighter strip under
     them rather than two more of the same. */
  .home-card{
    width:100%; margin-top:14px; border:none; padding:0; cursor:pointer;
    border-radius:20px; text-align:left; display:block;
    box-shadow:0 6px 16px rgba(26,17,40,0.28);
    transition:transform .12s ease;
  }
  .home-card:active{transform:scale(.982);}
  .home-card-eyebrow{
    display:flex; align-items:center; gap:7px;
    font-family:'Poppins'; font-weight:900; font-size:11px; letter-spacing:.09em;
    text-transform:uppercase;
  }
  .home-card-eyebrow .spacer{margin-left:auto;}

  /* Here Now: sky rather than parchment - this is the one card about being
     outside, and it has to look different from a list of things to do. */
  .herenow-card{
    position:relative; overflow:hidden; padding:15px 16px 14px;
    background:linear-gradient(135deg,#4FB8B0 0%,#3B82C4 62%,#4A5FA0 100%);
    color:#fff;
  }
  .herenow-card .home-card-eyebrow{color:rgba(255,255,255,0.88);}
  .herenow-head{
    font-family:'Poppins'; font-weight:900; font-size:19px; line-height:1.2;
    margin:7px 0 5px; overflow-wrap:anywhere;
  }
  .herenow-sub{
    font-size:12.5px; color:rgba(255,255,255,0.9); line-height:1.35;
    display:flex; align-items:center; gap:5px;
  }
  .herenow-birds{
    position:absolute; right:-6px; top:8px; width:120px; height:62px;
    opacity:.5; pointer-events:none;
  }
  @keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(-7px,-5px);}}
  .herenow-birds .b1{animation:drift 7s ease-in-out infinite;}
  .herenow-birds .b2{animation:drift 9s ease-in-out infinite .8s;}
  .herenow-birds .b3{animation:drift 8s ease-in-out infinite 1.6s;}

  /* Tip and joke: a light strip, deliberately not a third and fourth card. */
  /* --- Home: the mic and the three things round it ---------------------
     Joke Of The Day, Weekly Challenges and Guess The Song get an equal
     share: the same disc, the same size, just a name under it and no box.
     They sit on a circle round the mic's centre - lower left, straight
     below, lower right - so together they make a U that follows its curve.
     --R is that circle's radius, measured to the middle of each disc; the
     side two sit 58 degrees either side of straight down, which works out
     at (105.2px, 65.7px) from the centre.

     The hub stretches to fill the screen down to the nav bar, and the U
     drops into whatever room that leaves (--drop): 60% of the spare height,
     up to 160px. On a tall phone it sits well down the screen; on a short
     one, where there's no spare room, it stays snug under the mic. */
  .home-greeting{margin-top:0;}

  /* --- Birder rank seals (rankSeal in the script) --------------------------
     A wood-rimmed cream disc with the rank's number, and a wreath of the
     painted leaf that grows a pair per rank; gold for the top two. --s is
     the seal's size; everything inside is a share of it. */
  .rank-seal{position:relative; display:inline-block; flex:0 0 auto; width:var(--s); height:var(--s);}
  .rank-seal > img{position:absolute; width:44%; height:44%; pointer-events:none;
    filter:drop-shadow(0 calc(var(--s) * .012) calc(var(--s) * .02) rgba(26,17,40,.35));}
  .rank-seal.gold > img{filter:url(#gold-filter) drop-shadow(0 calc(var(--s) * .012) calc(var(--s) * .02) rgba(26,17,40,.35));}
  .rank-face{position:absolute; inset:21%; border-radius:50%; display:grid; place-items:center;
    background:linear-gradient(var(--disc-cream), var(--disc-cream)) padding-box, var(--wood-rim);
    border:max(2px, calc(var(--s) * .045)) solid transparent;
    box-shadow:0 calc(var(--s) * .03) calc(var(--s) * .07) rgba(26,17,40,.35);
    font-family:'Poppins'; font-weight:900; font-size:calc(var(--s) * .27); line-height:1; color:var(--wood-edge);}
  .rank-seal.painted > img{position:static; width:100%; height:100%; object-fit:contain; filter:none;}
  /* A rank still to come: there, but grey, like a trophy not yet won. */
  .rank-seal.locked{filter:grayscale(1); opacity:.5;}

  /* --- The ladder, over Awards (openRankLadder) --------------------------- */
  .rank-sheet-veil{position:fixed; inset:0; z-index:900; display:grid; place-items:center; padding:16px;
    padding-bottom:calc(var(--nav-h, 64px) + 12px);
    background:rgba(26,17,40,0.55); animation:awardsVeilIn .25s ease both;}
  .rank-sheet-veil.closing{opacity:0; transition:opacity .2s ease;}
  .rank-sheet{--frame:5px; --inner:16px; width:100%; max-width:360px; max-height:100%; display:flex;
    box-shadow:0 18px 40px rgba(10,6,20,0.55), 0 4px 10px rgba(10,6,20,0.35);
    animation:trophyCardHover .38s cubic-bezier(.2,1.25,.45,1) both;}
  .rank-sheet-inner{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--disc-cream);
    border-radius:var(--inner); padding:14px 14px 10px;}
  .rank-sheet-head{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .rank-sheet-title{font-family:'Poppins'; font-weight:900; font-size:20px; color:var(--wood-edge);}
  /* The painted cross is its own little wooden disc. */
  .rank-sheet-close{flex:0 0 auto; display:grid; place-items:center; cursor:pointer; padding:0; border:none; background:none;
    color:var(--wood-edge); font-size:18px;}
  .rank-sheet-close .ico{width:28px; height:28px;}
  .rank-sheet-msg{font-family:'Poppins'; font-weight:400; font-size:13px; line-height:1.4; color:var(--ink-brown); margin:4px 0 10px;}
  .rank-ladder{overflow-y:auto; min-height:0; display:flex; flex-direction:column; gap:6px; padding-bottom:4px;}
  .rank-row{display:flex; align-items:center; gap:12px; padding:6px 10px 6px 6px; border-radius:14px; background:var(--cream-lt);}
  .rank-row-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .rank-row-name{font-family:'Poppins'; font-weight:900; font-size:16px; color:var(--wood-edge);}
  .rank-row-at{font-family:'Poppins'; font-weight:700; font-size:11.5px; color:var(--ink-soft);}
  .rank-row.ahead .rank-row-name{color:var(--ink-soft);}
  /* Where the child is now: green, the colour of selected and of progress. */
  .rank-row.here{background:rgba(126,200,164,0.28); box-shadow:inset 0 0 0 2.5px var(--sage);}
  .rank-row.here .rank-row-at{color:var(--sage-dk);}
  .rank-row-bar{display:block; height:8px; border-radius:4px; margin-top:3px; background:rgba(116,50,6,0.14); overflow:hidden;}
  .rank-row-bar span{display:block; height:100%; border-radius:4px; background:var(--sage);}
  .rank-row-tick{flex:0 0 auto;}
  .rank-row-tick .ico{width:24px; height:24px;}
  @media (prefers-reduced-motion: reduce){ .rank-sheet-veil, .rank-sheet{animation:none;} }
  .home-hub{
    position:relative; width:100%; margin-top:20px;
    --mic:130px; --disc:68px; --R:124px; --side-x:105.2px; --side-y:65.7px;
    /* top of the mic to the bottom of the lowest name, with no drop */
    --hub-min:calc(var(--mic) / 2 + var(--R) + var(--disc) / 2 + 42px);
    flex:1 0 auto; min-height:var(--hub-min);
  }
  .home-hub .mic-wrap{position:absolute; left:50%; top:0; transform:translateX(-50%);}
  /* The Home mic only, 20% bigger than the shared .mic-btn size. */
  .home-hub .mic-btn{width:var(--mic); height:var(--mic);}
  .hub-item{
    position:absolute; width:100px; padding:0; border:none; background:none; cursor:pointer;
    left:calc(50% + var(--x) - 50px);
    /* % here is the hub's height, so the drop grows with the free space */
    --drop:clamp(0px, (100% - var(--hub-min)) * 0.6, 160px);
    top:calc(var(--mic) / 2 + var(--y) - var(--disc) / 2 + var(--drop));
    display:flex; flex-direction:column; align-items:center; gap:5px;
    font-family:'Poppins'; color:#fff; -webkit-tap-highlight-color:transparent;
  }
  .hub-left{--x:calc(-1 * var(--side-x)); --y:var(--side-y);}
  /* The middle one is under the mic, with nothing either side of its name,
     so "Weekly Challenges" gets room to stay on one line. */
  .hub-mid{--x:0px; --y:var(--R); width:150px; margin-left:-25px;}
  .hub-right{--x:var(--side-x); --y:var(--side-y);}
  .hub-icon{
    position:relative; width:var(--disc); height:var(--disc); display:block;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.35)); transition:transform .12s ease;
  }
  .hub-icon img{width:100%; height:100%; display:block;}
  .hub-item:active .hub-icon{transform:scale(.92);}
  .hub-label{font-weight:900; font-size:13px; line-height:1.15; text-align:center;}
  /* "Not yet" (the joke before today's first listen, the game before ten
     birds): the disc goes the same grey as an unheard collector card. */
  .hub-item.locked .hub-icon{filter:grayscale(1) brightness(.85) drop-shadow(0 3px 5px rgba(0,0,0,0.35));}
  .hub-item.locked .hub-label{opacity:.75;}
  /* How many of this week's challenges are done, on the disc's shoulder. */
  .hub-badge{
    position:absolute; top:-4px; right:-12px; min-width:30px; padding:3px 6px;
    border-radius:11px; background:var(--sage); color:var(--ink);
    font-weight:900; font-size:12px; line-height:1; text-align:center;
    box-shadow:0 2px 4px rgba(26,17,40,0.35); text-shadow:none;
  }
  .hub-badge:empty{display:none;}
  .hub-badge.done{background:var(--sage);}

  /* --- Something new is waiting here ---------------------------------
     A nav tab (or one of the three things on Home) wears a soft cream halo
     and a little painted leaf on its shoulder, hanging by its stem, that
     twitches now and then - until the child goes and looks. Kept quiet on
     purpose: a nudge, not an alarm. */
  .nav-icon-wrap{position:relative;}
  .nav-tab.has-new .nav-icon-wrap{animation:newHalo 3s ease-in-out infinite;}
  @keyframes newHalo{
    0%,100%{box-shadow:0 0 8px 2px rgba(var(--glow),0.28);}
    50%{box-shadow:0 0 14px 5px rgba(var(--glow),0.5);}
  }
  .hub-item.has-new .hub-icon{animation:hubNewHalo 3s ease-in-out infinite;}
  @keyframes hubNewHalo{
    0%,100%{filter:drop-shadow(0 3px 5px rgba(0,0,0,0.35)) drop-shadow(0 0 6px rgba(var(--glow),0.45));}
    50%{filter:drop-shadow(0 3px 5px rgba(0,0,0,0.35)) drop-shadow(0 0 12px rgba(var(--glow),0.75));}
  }
  /* The leaf (the tree's own falling-leaf sprite) stands up off the
     icon's top-right rim like a sprout. In the picture the stem is at the
     top left (31% 26%) and the leaf runs down to the right, so it's turned
     about the stem until the tip points up and a little outward; the stem
     is then planted on the rim. It holds still, then flicks. */
  .nav-tab.has-new .nav-icon-wrap::after, .hub-item.has-new .hub-icon::after{
    content:''; position:absolute; width:34px; height:34px; left:22px; top:-4px; z-index:1;
    background:url('/static/tree-leaf1-v2.webp') center / contain no-repeat;
    filter:drop-shadow(0 1px 2px rgba(26,17,40,0.45));
    transform-origin:31% 26%; --stand:-118deg; transform:rotate(var(--stand));
    animation:leafTwitch 2.6s ease-in-out infinite;
  }
  .hub-item.has-new .hub-icon::after{width:42px; height:42px; left:43px; top:-3px;}
  /* The challenges disc wears its tally on that shoulder, so its leaf
     sprouts from the tally's far end instead of covering the count. */
  #challengeCard.has-new .hub-icon::after{left:61px; top:-13px;}
  /* Still for most of the cycle, then a quick flick and settle - like a
     leaf catching a breath of wind. */
  @keyframes leafTwitch{
    0%,70%,100%{transform:rotate(var(--stand));}
    75%{transform:rotate(calc(var(--stand) - 22deg));}
    80%{transform:rotate(calc(var(--stand) + 16deg));}
    85%{transform:rotate(calc(var(--stand) - 9deg));}
    90%{transform:rotate(calc(var(--stand) + 4deg));}
  }

  /* --- Before the first listen, and if the microphone is refused ------- */
  .mic-intro{display:flex; flex-direction:column; align-items:center; gap:10px; max-width:340px; text-align:center;}
  .mic-intro-icon{width:118px; height:118px; filter:drop-shadow(0 6px 12px rgba(0,0,0,0.35));}
  .mic-intro-icon.off{filter:grayscale(1) brightness(.85) drop-shadow(0 6px 12px rgba(0,0,0,0.35));}
  .mic-intro-title-row{display:flex; align-items:center; gap:10px;}
  .mic-intro .stage-sub{max-width:320px;}
  .mic-intro-grownup{font-family:'Poppins'; font-weight:700; font-size:13px; color:rgba(255,255,255,0.9);
    background:rgba(26,17,40,0.28); border-radius:12px; padding:8px 12px; margin:4px 0 8px;}
  .mic-intro .tut-ok{min-width:160px;}

  /* --- Welcome: bird, colour, name ------------------------------------
     Full screen: the top bar and nav step aside until it's done. */
  body.welcome-on .top, body.welcome-on .bottom-nav{visibility:hidden;}
  .welcome{width:100%; max-width:380px; margin:0 auto; display:flex; flex-direction:column; align-items:center;
    gap:14px; padding-top:4px;}
  .welcome-top{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%;}
  .welcome-dots{display:flex; gap:6px;}
  .welcome-dots .tut-dot{background:rgba(255,255,255,0.35);}
  .welcome-dots .tut-dot.on{background:var(--sage);}
  .welcome-eyebrow{font-family:'Poppins'; font-weight:700; font-size:14px; color:var(--disc-cream); letter-spacing:.02em;}
  .welcome-title-row{display:flex; align-items:center; gap:10px;}
  .welcome-title{margin:0; font-family:'Poppins'; font-weight:900; font-size:clamp(24px, 7vw, 30px); color:#fff; text-align:center;
    text-shadow:0 2px 0 var(--wood-edge), 0 4px 12px rgba(26,17,40,0.5);}
  .welcome-me{width:150px; height:150px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 42%, var(--disc-cream), #F2D3A6 70%);
    box-shadow:0 0 0 6px var(--wood), 0 0 0 9px var(--wood-edge), 0 8px 18px rgba(0,0,0,0.35); overflow:hidden;}
  .welcome-birds{display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; width:100%;}
  .welcome-bird-btn{aspect-ratio:1; border:none; padding:0; border-radius:50%; cursor:pointer; display:grid; place-items:center;
    background:var(--disc-cream); box-shadow:0 0 0 3px var(--wood), 0 3px 6px rgba(0,0,0,0.3);
    transition:transform .12s ease, box-shadow .12s ease; overflow:hidden;}
  .welcome-bird-btn.on{transform:scale(1.08); box-shadow:0 0 0 3px var(--sage), 0 0 14px 4px rgba(var(--glow),0.7);}
  /* A bird still to find: its shape, dark, with a question mark - found by
     hearing the real thing outside. */
  .welcome-bird-btn{position:relative;}
  .welcome-bird-btn.locked svg{filter:brightness(0) opacity(.45);}
  .welcome-bird-btn.locked{background:#E9DCC4; cursor:default;}
  .bird-lock{position:absolute; right:6%; bottom:6%; width:22px; height:22px; border-radius:50%; z-index:1;
    display:grid; place-items:center; background:var(--wood); color:#fff; border:2px solid var(--disc-cream);
    font-family:'Poppins'; font-weight:900; font-size:13px; line-height:1;}
  .welcome-bird-btn.nudge{animation:birdNudge .35s ease;}
  @keyframes birdNudge{25%{transform:translateX(-4px);} 75%{transform:translateX(4px);}}
  .welcome-swatches{display:grid; grid-template-columns:repeat(5, 1fr); gap:12px; width:100%; max-width:260px;}
  .welcome-swatch{aspect-ratio:1; border-radius:50%; border:3px solid rgba(255,255,255,0.85); background:var(--sw);
    cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.35); transition:transform .12s ease;}
  .welcome-swatch.on{transform:scale(1.15); border-color:var(--sage); box-shadow:0 0 0 3px var(--wood-edge), 0 0 12px 3px rgba(var(--glow),0.8);}
  .welcome-name{max-width:280px; text-align:center; font-size:20px;}
  .welcome-hint{font-family:'Poppins'; font-weight:700; font-size:13px; color:rgba(255,255,255,0.9); margin-top:-6px;}
  .welcome-actions{display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; max-width:320px; margin-top:4px;}
  .welcome-back{border:none; background:none; color:#fff; font-family:'Poppins'; font-weight:700; font-size:15px;
    padding:10px 6px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}
  @media (prefers-reduced-motion: reduce){ .welcome-bird-btn, .welcome-swatch{transition:none;} }

  /* --- Tutorial bubbles ----------------------------------------------
     The screen dims, the thing being explained stays lit inside a cream
     ring, and a speech bubble in the app's wood and cream points at it.
     The dim is one huge shadow round the lit hole, so the hole is just a
     box that can glide from one step's target to the next. */
  .tut-veil{position:fixed; inset:0; z-index:1000; touch-action:none;}
  .tut-hole{
    position:fixed; border-radius:18px; pointer-events:none;
    box-shadow:0 0 0 200vmax rgba(20,12,40,0.62), 0 0 0 3px rgba(var(--glow),0.95), 0 0 18px 6px rgba(var(--glow),0.5);
    transition:left .3s ease, top .3s ease, width .3s ease, height .3s ease, border-radius .3s ease;
  }
  .tut-bubble{
    --frame:5px; --inner:14px; position:fixed; width:min(320px, calc(100vw - 32px));
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    transition:left .3s ease, top .3s ease; animation:tutIn .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes tutIn{from{transform:scale(.85); opacity:0;} to{transform:none; opacity:1;}}
  .tut-inner{background:var(--disc-cream); border-radius:var(--inner); padding:14px 14px 12px;}
  .tut-text{margin:0; font-family:'Poppins'; font-weight:900; font-size:17px; line-height:1.3;
    color:var(--wood-edge); text-align:center;}
  .tut-actions{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px;}
  /* Read it to me: the plain wooden disc with a speaker carved in. */
  .tut-speak{
    width:44px; height:44px; flex:0 0 auto; border:none; padding:0; cursor:pointer;
    background:url('/static/btn-blank-v1.webp') center / contain no-repeat;
    filter:drop-shadow(0 2px 4px rgba(45,27,105,0.3));
    display:flex; align-items:center; justify-content:center; color:#B4561B;
  }
  .tut-speak svg{width:22px; height:22px;}
  .tut-speak.speaking{animation:tutSpeak .9s ease-in-out infinite;}
  @keyframes tutSpeak{50%{transform:scale(1.1);}}
  .tut-dots{display:flex; gap:6px; justify-content:center; flex:1;}
  .tut-dot{width:8px; height:8px; border-radius:50%; background:rgba(116,50,6,0.25);}
  .tut-dot.on{background:var(--sage-dk);}
  .tut-ok{
    flex:0 0 auto; min-width:104px; padding:11px 18px; border:none; border-radius:30px; cursor:pointer;
    font-family:'Poppins'; font-weight:900; font-size:16px;
  }
  .tut-ok:focus{outline:none;}
  .tut-ok:focus-visible{outline:3px solid var(--sage); outline-offset:2px;}
  /* The tail: a wooden point on whichever side faces the lit thing. */
  .tut-tail{position:fixed; width:0; height:0; border:12px solid transparent; pointer-events:none;
    transition:left .3s ease, top .3s ease;}
  .tut-tail.up{border-bottom-color:var(--wood-lit); border-top-width:0;}
  .tut-tail.down{border-top-color:var(--wood-dk); border-bottom-width:0;}
  .tut-tail.none{display:none;}
  @media (prefers-reduced-motion: reduce){
    .nav-tab.has-new .nav-icon-wrap{animation:none; box-shadow:0 0 10px 3px rgba(var(--glow),0.4);}
    .hub-item.has-new .hub-icon{animation:none; filter:drop-shadow(0 3px 5px rgba(0,0,0,0.35)) drop-shadow(0 0 8px rgba(var(--glow),0.6));}
    .nav-tab.has-new .nav-icon-wrap::after, .hub-item.has-new .hub-icon::after{animation:none;}
    .tut-hole, .tut-bubble, .tut-tail{transition:none; animation:none;}
    .tut-speak.speaking{animation:none;}
  }

  /* --- Guess the Song ----------------------------------------------------
     Deliberately plain: a readout, one big play button, a grid of the
     child's own birds. Tiles are the My Flock wood frame, made square. */
  .sg-sub{font-size:13px; color:rgba(255,255,255,0.85); margin:2px 0 16px; text-align:center;}
  .sg-levels{display:flex; flex-direction:column; gap:9px; width:100%; max-width:360px; margin:0 auto;}
  /* Each level is a card like the rest of the app: the My Flock wooden
     frame round a panel in the cream of the wooden discs. */
  .sg-level{
    --frame:5px; --inner:12px; border:none; cursor:pointer; text-align:left;
    width:100%; display:block; font:inherit; transition:transform .12s ease;
  }
  .sg-level-inner{
    position:relative; display:flex; align-items:center; gap:12px;
    background:var(--disc-cream); border-radius:var(--inner); padding:9px 12px 9px 10px;
  }
  .sg-level:active{transform:scale(.97);}
  /* Locked: the same grey "not yet" as an unheard collector card. */
  .sg-level.locked{filter:grayscale(1) brightness(.9); cursor:default;}
  .sg-level.locked:active{transform:none;}
  /* The level number is carved into the plain wooden disc, exactly like
     the times-heard disc on the bird card (.heard-disc). */
  .sg-level-num{
    position:relative; width:46px; height:46px; flex:0 0 auto;
    background:url('/static/btn-blank-v1.webp') center / contain no-repeat;
    filter:drop-shadow(0 3px 5px rgba(45,27,105,0.28));
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins'; font-weight:900; font-size:21px; line-height:1; color:#B4561B;
    text-shadow:0 1px 0 rgba(255,255,255,0.7), 0 -1px 0 rgba(90,36,5,0.25);
  }
  .sg-level-lock{position:absolute; right:-4px; bottom:-3px; font-size:15px; line-height:1;}
  .sg-level-name{font-family:'Poppins'; font-weight:900; font-size:18px; display:block; color:var(--wood-edge);}
  .sg-level-need{font-family:'Poppins'; font-weight:700; font-size:12px; display:block;
    color:var(--wood-dk);}
  /* The level to play next breathes and glows cream, like the front trophy. */
  .sg-level.invite{animation:sgLevelInvite 1.6s ease-in-out infinite;}
  @keyframes sgLevelInvite{
    0%,100%{transform:scale(1);
      box-shadow:0 2px 5px rgba(26,17,40,0.3), 0 0 0 0 rgba(var(--glow),0);}
    50%{transform:scale(1.035);
      box-shadow:0 2px 5px rgba(26,17,40,0.3), 0 0 0 2px rgba(var(--glow),0.9), 0 0 20px 5px rgba(var(--glow),0.65);}
  }
  .sg-note{font-size:13px; color:#fff; text-align:center; margin-top:16px; line-height:1.4;}
  /* Stars: gold when earned, an empty outline-ish dim star when not. On the
     end screen they pop in one after another (--d staggers them). */
  .sg-stars{display:inline-flex; align-items:center; gap:3px; line-height:1;}
  .sg-star{width:30px; height:30px; display:block; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3));}
  /* A star not won yet gets the app's usual "not yet": grey and dimmed. */
  .sg-star:not(.on){filter:grayscale(1) brightness(.8); opacity:.5;}
  .sg-level-stars{margin-left:auto; flex:0 0 auto;}
  /* End screen: three grey sockets, and each star won drops into its socket
     in turn - overshooting, settling, with a cream ring bursting out behind
     it. --d staggers them. */
  .sg-end-stars{gap:10px; margin:10px 0 8px;}
  .sg-slot{position:relative; width:68px; height:68px;}
  .sg-slot:nth-child(2){transform:translateY(-12px);}
  .sg-end-stars .sg-star{width:68px; height:68px;}
  .sg-end-stars .sg-star.on{position:absolute; inset:0; z-index:2;
    animation:sgStarPop .65s cubic-bezier(.25,1.5,.5,1) both; animation-delay:var(--d);
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.35)) drop-shadow(0 0 10px rgba(var(--glow),0.5));}
  @keyframes sgStarPop{
    0%{transform:scale(2.2) rotate(-25deg); opacity:0;}
    55%{transform:scale(.88) rotate(6deg); opacity:1;}
    100%{transform:scale(1) rotate(0); opacity:1;}
  }
  .sg-burst{position:absolute; inset:-6px; z-index:1; border-radius:50%; pointer-events:none;
    border:4px solid var(--disc-cream); opacity:0;
    animation:sgBurst .7s ease-out forwards; animation-delay:calc(var(--d) + .3s);}
  @keyframes sgBurst{
    0%{transform:scale(.6); opacity:.95;}
    100%{transform:scale(1.7); opacity:0; border-width:1px;}
  }
  .sg-message{font-family:'Poppins'; font-weight:700; font-size:14px; color:#fff; margin:4px 0 22px; text-align:center;}

  .sg-round{width:100%; display:flex; flex-direction:column; align-items:center;}
  .sg-head{
    font-family:'Poppins'; font-weight:900; font-size:13px; letter-spacing:.06em;
    text-transform:uppercase; color:#fff; margin-bottom:12px;
  }
  .photo-icon-btn.sg-play{width:88px; height:88px;}
  .photo-icon-btn.sg-play.invite{animation:trophyInvite 1.6s ease-in-out infinite;}
  .sg-prompt{font-family:'Poppins'; font-weight:700; font-size:14px; color:#fff;
    margin:10px 0 8px; min-height:20px; text-align:center;}
  /* The ten seconds, drained left to right once the song has finished. */
  .sg-timer{width:100%; max-width:300px; height:8px; border-radius:4px;
    background:rgba(255,255,255,0.18); overflow:hidden; margin-bottom:14px;}
  /* The last five seconds: the whole bar throbs, twice a second, with a
     red glow. The track pulses rather than the fill, because the fill's
     transform is already busy draining it. */
  .sg-timer.urgent{animation:sgTimerUrgent .5s ease-in-out infinite;}
  @keyframes sgTimerUrgent{
    0%,100%{transform:scaleY(1); box-shadow:0 0 0 0 rgba(229,72,59,0);}
    50%{transform:scaleY(1.75); box-shadow:0 0 12px 3px rgba(229,72,59,0.75);}
  }
  .sg-timer-fill{height:100%; width:100%; background:var(--sage); border-radius:4px;
    transform-origin:left center; transform:scaleX(1);}
  .sg-timer-fill.running{transition:transform linear; transform:scaleX(0);
    animation:sgTimerColour linear forwards;}
  /* Green while there's plenty of time, through orange, to red at
     the end. Runs for the same fifteen seconds as the drain (the duration is
     set on both in startSongGameTimer). */
  @keyframes sgTimerColour{
    0%{background:var(--sage);}
    55%{background:#F08A3C;}
    100%{background:#E5483B;}
  }
  .sg-grid{display:grid; gap:10px; width:100%; max-width:360px; justify-content:center;}
  /* Small phones (set by fitSongGameGrid): less room round the cards. */
  .sg-round.tight .sg-head{margin-bottom:6px;}
  .sg-round.tight .photo-icon-btn.sg-play{width:64px; height:64px;}
  .sg-round.tight .sg-prompt{margin:6px 0 5px;}
  .sg-round.tight .sg-timer{margin-bottom:9px;}
  .sg-round.tight .sg-grid{gap:7px;}
  .sg-round.tight .sg-result{margin-top:6px;}
  .sg-round.tight .sg-navbtn.sg-back{margin-top:4px;}
  .sg-round.tight .sg-navbtn.sg-back img{width:44px; height:44px;}
  /* --tile-max is set by fitSongGameGrid when the round doesn't fit the
     screen, shrinking the cards just enough; unset, they take their room. */
  .sg-grid.cols2{grid-template-columns:repeat(2, minmax(0, var(--tile-max, 160px)));}
  .sg-grid.cols3{grid-template-columns:repeat(3, minmax(0, var(--tile-max, 1fr)));}
  .sg-tile{--frame:4px; --inner:9px; border:none; cursor:pointer; text-align:center;
    display:flex; flex-direction:column; transition:transform .12s ease, opacity .25s ease, filter .25s ease;}
  .sg-tile:disabled{cursor:default;}
  .sg-tile.waiting{opacity:.6;}
  .sg-tile:not(:disabled):active{transform:scale(.95);}
  .sg-tile img, .sg-tile .sg-blank{
    width:100%; aspect-ratio:1; object-fit:cover; object-position:var(--bird-crop);
    display:block; background:var(--parch-dk); border-radius:var(--inner) var(--inner) 0 0;
  }
  .sg-tile img.stock{filter:url(#watercolor-filter) saturate(1.25) contrast(0.94);}
  .sg-blank{display:flex; align-items:center; justify-content:center; font-size:30px;}
  .sg-name{font-family:'Poppins'; font-size:11.5px; font-weight:700; padding:6px 4px; color:var(--ink-brown);
    line-height:1.2; background:var(--parch); border-radius:0 0 var(--inner) var(--inner);
    flex:1; display:flex; align-items:center; justify-content:center;
    /* In a small card a long name breaks with a hyphen ("Yellow-hammer")
       rather than wherever it runs out of room. */
    overflow-wrap:break-word; -webkit-hyphens:auto; hyphens:auto;}
  .sg-own{position:absolute; top:calc(var(--frame) + 4px); left:calc(var(--frame) + 4px); z-index:3;
    font-size:12px; line-height:1; background:rgba(26,17,40,0.55); border-radius:8px; padding:3px 4px;}
  /* Feedback: the right bird glows green, a wrong pick shakes and fades. */
  .sg-tile.right{box-shadow:0 0 0 3px var(--sage), 0 0 18px 4px rgba(126,200,164,0.85);
    animation:sgRight .5s ease;}
  /* A wrong pick greys its photo and name, not the whole tile, so the
     cross that lands on it stays red. */
  .sg-tile.wrong{animation:sgWrong .4s ease;}
  .sg-tile.wrong .sg-photo > img:not(.sg-mark), .sg-tile.wrong .sg-blank, .sg-tile.wrong .sg-name{
    filter:grayscale(.8) brightness(.8);}
  .sg-photo{position:relative; display:block;}
  /* The tick or cross, big in the middle of the photo, bouncing in. */
  .sg-tile .sg-photo img.sg-mark{
    position:absolute; left:50%; top:50%; width:54%; height:auto; aspect-ratio:1;
    max-width:84px; border-radius:50%; background:none; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(0,0,0,0.45));
    transform:translate(-50%,-50%); z-index:4;
    animation:sgMarkIn .45s cubic-bezier(.25,1.6,.5,1) both;
  }
  .sg-tile .sg-photo img.sg-mark.tick{animation-delay:.08s;}
  @keyframes sgMarkIn{
    from{transform:translate(-50%,-50%) scale(0) rotate(-25deg); opacity:0;}
    to{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1;}
  }
  .sg-tile.out{opacity:.45;}
  @keyframes sgRight{0%{transform:scale(1);} 45%{transform:scale(1.07);} 100%{transform:scale(1);}}
  @keyframes sgWrong{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .sg-result{font-family:'Poppins'; font-weight:900; font-size:16px; color:#fff;
    min-height:24px; margin-top:12px; text-align:center;}
  /* End of a level: three painted discs in a row - back to levels, retry,
     next level - each with its name underneath. */
  .sg-endnav{display:flex; justify-content:center; align-items:flex-start; gap:18px; margin-top:4px;}
  .sg-navbtn{border:none; background:none; padding:0; cursor:pointer; width:88px;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    font-family:'Poppins'; font-weight:900; font-size:13px; line-height:1.15; color:#fff; text-align:center;}
  .sg-navbtn img{width:72px; height:72px; display:block; transition:transform .12s ease;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));}
  .sg-navbtn:active img{transform:scale(.92);}
  /* The same left-arrow disc as the end screen, under the bird cards during
     a round - smaller, to leave the cards their room. */
  .sg-navbtn.sg-back{margin:12px auto 0; gap:4px; font-size:12px;}
  .sg-navbtn.sg-back img{width:52px; height:52px;}
  /* Next level not open yet: the same grey "not yet" as everywhere else. */
  .sg-navbtn.locked{cursor:default; opacity:.75;}
  .sg-navbtn.locked img{filter:grayscale(1) brightness(.85) drop-shadow(0 3px 6px rgba(0,0,0,0.35));}
  .sg-navbtn.locked:active img{transform:none;}
  /* Next level open: it breathes and glows cream once the stars have landed,
     like the level to play next on the levels page. */
  .sg-navbtn.invite img{animation:sgNavInvite 1.6s ease-in-out 1.4s infinite;}
  @keyframes sgNavInvite{
    0%,100%{transform:scale(1); filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35));}
    50%{transform:scale(1.1); filter:drop-shadow(0 3px 6px rgba(0,0,0,0.35)) drop-shadow(0 0 12px rgba(var(--glow),0.95));}
  }
  @media (prefers-reduced-motion: reduce){
    .sg-timer.urgent{animation:none; box-shadow:0 0 10px 2px rgba(229,72,59,0.75);}
    .sg-play.invite, .sg-level.invite, .sg-navbtn.invite img, .sg-tile.right, .sg-tile.wrong, .sg-end-stars .sg-star.on,
    .sg-tile .sg-photo img.sg-mark{animation:none;}
    .sg-burst{display:none;}
  }

  @media (prefers-reduced-motion: reduce){
    .mic-alive .mic-icon,
    .herenow-birds .b1, .herenow-birds .b2, .herenow-birds .b3{animation:none;}
  }
  .stage-label{margin-top:22px;font-family:'Poppins';font-weight:700;font-size:16px;color:#fff;text-align:center;}
  .stage-sub{margin-top:6px;font-size:13px;color:rgba(255,255,255,0.85);text-align:center;}
  .timer{font-family:'Poppins';font-weight:700;font-size:22px;color:#fff;margin-top:14px;}

  /* --- Warbling Tips --- */
  .season-row{display:flex;align-items:center;gap:10px;background:var(--disc-cream);border-radius:12px;padding:10px 13px;margin-bottom:6px;}
  .season-row.season-away{background:rgba(255,255,255,0.45);}
  .season-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--mist);}
  .season-here .season-dot{background:var(--sage);}
  .season-leaving .season-dot{background:var(--terra);}
  .season-arriving .season-dot{background:var(--sage);}
  .season-name{flex:1;font-family:'Poppins';font-weight:700;font-size:12.5px;color:var(--wood-edge);min-width:0;}
  .season-away .season-name{color:var(--ink-soft);}
  .season-label{font-family:'Poppins';font-weight:700;font-size:10.5px;color:var(--ink-soft);flex-shrink:0;}
  .season-leaving .season-label{color:var(--terra-dk);}
  .season-row.tappable{cursor:pointer;}
  .season-row.tappable:active{opacity:0.8;}
  .season-chevron{color:var(--ink-soft);font-size:14px;flex-shrink:0;margin-left:2px;}

  /* --- Migrator card: a real map (Wikimedia Commons "Continents vide
     couleurs", CC BY-SA 3.0/GFDL, cropped to Europe/Africa/Middle East),
     with each species' route drawn on top as an absolutely-positioned SVG
     overlay sharing the image's own pixel dimensions (560x780) - so the
     overlay's coordinates line up with the image with no separate
     projection math on this end, just CSS stacking. */
  .migration-title{font-family:'Poppins';font-weight:900;font-size:22px;color:#fff;text-align:center;}
  .migration-subtitle{font-size:12.5px;color:rgba(255,255,255,0.82);text-align:center;margin-top:2px;margin-bottom:14px;}
  .migration-map-panel{width:100%;max-width:280px;margin:0 auto;position:relative;background:var(--disc-cream);border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,0.25);}
  .migration-map-img{display:block;width:100%;}
  .migration-map-overlay{position:absolute;inset:0;width:100%;height:100%;}
  .migration-credit{font-size:9.5px;color:rgba(255,255,255,0.55);text-align:center;margin-top:6px;}
  .migration-credit a{color:rgba(255,255,255,0.7);}
  .migration-destination{font-family:'Poppins';font-weight:900;font-size:17px;color:var(--disc-cream);text-align:center;margin-top:14px;}
  .migration-fact{font-size:13px;line-height:1.55;color:rgba(255,255,255,0.92);text-align:center;margin-top:8px;padding:0 8px;}
  /* Weekly Challenges: each one is a card like the rest of the app - the
     My Flock wooden frame round a panel in the discs' cream. A finished one
     gets a green tick and a full green bar. */
  /* Compact enough that all six cards fit on a phone screen without
     scrolling: one line for the challenge, one for its bar and count. */
  .challenge-card{--frame:4px; --inner:10px; width:100%; margin-bottom:8px;}
  .challenge-inner{background:var(--disc-cream); border-radius:var(--inner); padding:8px 12px 9px;}
  .challenge-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .challenge-text{font-family:'Poppins';font-weight:700;font-size:13.5px;line-height:1.25;
    color:var(--wood-edge);display:flex;align-items:center;gap:8px;}
  /* Bigger than the line it sits on, so it overhangs a little rather than
     making a finished card taller - all six still fit without scrolling. */
  .challenge-tick{flex:0 0 auto;width:24px;height:24px;display:block;margin:-4px 0;
    filter:drop-shadow(0 1px 2px rgba(26,17,40,0.35));}
  .challenge-feathers{font-family:'Poppins';font-weight:900;font-size:13px;color:var(--feather);flex-shrink:0;
    display:flex;align-items:center;gap:3px;}
  .challenge-meter{display:flex;align-items:center;gap:9px;margin-top:6px;}
  .challenge-bar{flex:1;height:7px;background:rgba(116,50,6,0.14);border-radius:4px;overflow:hidden;}
  .challenge-bar-fill{height:100%;background:var(--sage);border-radius:4px;transition:width .5s ease;}
  .challenge-progress{font-family:'Poppins';font-weight:700;font-size:11px;color:var(--wood-dk);
    flex:0 0 auto;white-space:nowrap;}
  /* The prize card: the week's only feathers, so it leads and stands out a
     little - a green edge inside the frame (finished is green) and a bigger
     feather count. */
  /* Set apart from the five below it: a wider gap, and a darker, warmer
     cream than theirs. */
  .challenge-card.all-bonus{margin-bottom:24px;}
  .challenge-card.all-bonus .challenge-inner{background:#F1D3A1; box-shadow:inset 0 0 0 2px var(--sage-dk);}
  .challenge-card.all-bonus .challenge-feathers{font-size:17px;}
  /* The four shortcuts sit on an arc beneath the mic rather than as four
     full-width stacked tiles, which dominated the screen. Positions are set
     per-button with --x/--y so the arc is defined in one place. */
  .tip-card{width:100%;background:var(--disc-cream);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:10px;}
  .tip-icon{font-size:22px;flex-shrink:0;}
  .tip-title{font-family:'Poppins';font-weight:700;font-size:13px;color:var(--wood-edge);margin-bottom:3px;}
  .tip-text{font-size:12.5px;line-height:1.5;color:var(--ink-brown);}
  /* The same card, but a button: on the no-birds screen it is the way
     through to the rest of the tips, which is otherwise a dead end now that
     Home no longer carries one. */
  .nobirds-tip{
    border:none; cursor:pointer; text-align:left; max-width:340px;
    margin-top:22px; transition:transform .12s ease;
    box-shadow:0 4px 12px rgba(26,17,40,0.22);
  }
  .nobirds-tip:active{transform:scale(.98);}
  .tip-more{
    font-family:'Poppins'; font-weight:700; font-size:11.5px;
    color:var(--wood-edge); margin-top:7px;
  }
  /* --- Joke of the Day ---------------------------------------------------
     No card: the joke sits straight on the scene, big, and spread down the
     screen. The setup at the top, then the painted question mark where the
     punchline will land - the two share one spot so nothing jumps when it
     arrives. */
  .joke-stage{
    flex:1 0 auto; width:100%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:34px;
    padding:6px 4px 40px; text-align:center; font-family:'Poppins';
  }
  .joke-setup{font-weight:900; font-size:clamp(24px, 7.2vw, 31px); line-height:1.25; color:#fff;}
  .joke-setup.giggle{animation:jokeGiggle .5s ease;}
  .joke-spot{position:relative; width:100%; min-height:130px;
    display:flex; align-items:center; justify-content:center;}
  .joke-reveal{
    position:relative; width:112px; height:112px; padding:0; border:none; background:none;
    cursor:pointer; filter:drop-shadow(0 5px 9px rgba(0,0,0,0.35));
    animation:trophyInvite 1.6s ease-in-out infinite;
  }
  .joke-reveal img{width:100%; height:100%; display:block;}
  /* The drama, in three beats. 1: the question mark winds up - a shake that
     grows. 2: it bursts, throwing a cream ring and sparks. 3: the punchline
     bounces in where it was. */
  .joke-reveal.windup{animation:jokeWindup .6s ease-in both;}
  .joke-reveal.burst{animation:jokeBurst .28s ease-out forwards;}
  @keyframes jokeWindup{
    0%{transform:scale(1) rotate(0);}
    20%{transform:scale(1.05) rotate(-8deg);}
    40%{transform:scale(1.1) rotate(9deg);}
    60%{transform:scale(1.15) rotate(-11deg);}
    80%{transform:scale(1.2) rotate(12deg);}
    100%{transform:scale(1.25) rotate(0);}
  }
  @keyframes jokeBurst{to{transform:scale(1.7) rotate(25deg); opacity:0;}}
  .joke-ring{position:absolute; left:50%; top:50%; width:120px; height:120px; margin:-60px 0 0 -60px;
    border-radius:50%; border:8px solid var(--disc-cream); pointer-events:none;
    box-shadow:0 0 14px rgba(var(--glow),0.8); animation:jokeRing .6s ease-out forwards;}
  @keyframes jokeRing{from{transform:scale(.5); opacity:1;} to{transform:scale(2.4); opacity:0; border-width:1px;}}
  .joke-spark{position:absolute; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px;
    box-shadow:0 0 8px rgba(var(--glow),0.85);
    border-radius:50%; background:var(--spark, var(--disc-cream)); pointer-events:none;
    animation:jokeSpark .75s cubic-bezier(.15,.7,.4,1) forwards;}
  @keyframes jokeSpark{
    from{transform:translate(0,0) scale(1); opacity:1;}
    to{transform:translate(var(--dx), var(--dy)) scale(.3); opacity:0;}
  }
  .joke-punch{
    font-weight:900; font-size:clamp(27px, 8vw, 34px); line-height:1.2; color:var(--disc-cream);
    /* Gold alone disappears into a dusk sky, so it's carved out with a dark
       wood edge and a soft shadow, like the wordmark. */
    text-shadow:0 2px 0 var(--wood-edge), 0 -1px 0 var(--wood-edge), 2px 0 0 var(--wood-edge),
      -2px 0 0 var(--wood-edge), 0 4px 12px rgba(26,17,40,0.55);
    animation:jokePunchIn .7s cubic-bezier(.2,1.7,.45,1) both;
  }
  @keyframes jokePunchIn{
    from{transform:scale(.2) rotate(-10deg); opacity:0;}
    to{transform:scale(1) rotate(0); opacity:1;}
  }
  @keyframes jokeGiggle{
    0%,100%{transform:translateY(0);} 25%{transform:translateY(-4px) rotate(-1deg);}
    50%{transform:translateY(0);} 75%{transform:translateY(-3px) rotate(1deg);}
  }
  .joke-locked-icon{width:96px; height:96px; filter:grayscale(1) brightness(.85) drop-shadow(0 4px 8px rgba(0,0,0,0.35));}
  .joke-locked{font-weight:900; font-size:clamp(19px, 5.6vw, 23px); line-height:1.3; color:#fff;}
  @media (prefers-reduced-motion: reduce){
    .joke-reveal, .joke-reveal.windup, .joke-punch, .joke-setup.giggle{animation:none;}
  }

  /* --- Card --- */
  .card-wrap{width:100%;display:flex;flex-direction:column;align-items:center;}
  .progress{font-family:'Poppins';font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-bottom:14px;animation:statFadeUp 0.35s ease both;}
  /* The new-bird moment at full size: a carved wood frame round a cream
     face, like every card. A rare bird's frame is gold instead. */
  .card{
    width:100%; max-width:300px; border-radius:20px;
    overflow:hidden; box-shadow:0 12px 30px rgba(45,27,105,0.18);
    background:linear-gradient(var(--disc-cream), var(--disc-cream)) padding-box, var(--wood-rim);
    border:6px solid transparent;
    animation:cardReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    transform-style:preserve-3d;
  }
  /* A Rare find gets a violet halo as well as the border, so it announces
     itself before the tier label is even read. */
  .collector-strip{margin-top:12px;padding-top:11px;border-top:1px dashed var(--parch-dk);}
  .collector-label{font-family:'Poppins';font-weight:700;font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .collector-pips{display:flex;gap:5px;justify-content:center;}
  .pack-chip{display:inline-block;background:var(--parch-dk);color:var(--wood-edge);font-family:'Poppins';font-weight:700;font-size:10.5px;padding:4px 12px;border-radius:12px;}
  /* Same bleed-through mistake as the emoji fix below: opacity on the whole
     .fan-card lets the page behind it show through the frame's own
     transparent bits. An "away" bird is always also unfound, so fold the
     dimming into that filter instead of using opacity. */
  .fan-card.unfound.away{filter:grayscale(1) brightness(.75);}
  /* Inset to the frame art's cream nameplate rather than the card box, so it
     sits on the panel instead of running out over the painted wood border. */
  .fan-away{position:absolute;z-index:3;left:2.83px;width:60.33px;bottom:3.56px;box-sizing:border-box;border-radius:0 0 3px 3px;background:var(--dusk);color:#fff;font-family:'Poppins';font-weight:700;font-size:6.5px;text-align:center;padding:2px 1px;}
  /* The seasonal ribbon sits over the bottom of the nameplate, so give the
     name less room on those cards rather than letting it run underneath. */
  .fan-card.away .fan-name{height:25px;}
  .season-surprise{background:#FFF6E6;border:2px solid var(--wood);border-radius:10px;padding:7px 10px;margin-top:10px;font-family:'Poppins';font-weight:700;font-size:11px;color:var(--wood-edge);}
  /* Rare cards: a gold band across the bottom of the bird window, a gold
     trim round the whole card, and the pack mark in the corners in gold.
     The band sits under the frame layer (z-index 1, after the photo) and runs
     a little wider and lower than the window, like the photo does, so the
     painted wood trims its edges. Visible part: 8.5px tall, full width. */
  .fan-rare{position:absolute;z-index:1;left:1.43px;width:63.06px;top:53px;height:9.5px;
    padding-bottom:1px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#FFE58A 0%,#F2C230 45%,#C99312 100%);
    color:#5A3B00;font-family:'Poppins';font-weight:900;font-size:5.6px;letter-spacing:.18em;
    box-shadow:0 -0.5px 0 rgba(90,59,0,.35);}
  /* --sheen is how far the card is from the middle of the deck, in card
     places (set by layoutCarousel, following the finger mid-drag). It slides
     a white glint across the gold trim, the opposite way to the card, the
     way a reflection of a fixed light would. Registered so it can ease along
     with the card when the deck snaps to a stop. */
  @property --sheen{syntax:'<number>';inherits:true;initial-value:0;}
  .fan-card.rare::before{
    content:'';position:absolute;inset:0;z-index:4;pointer-events:none;
    border-radius:5px;padding:1.8px;
    background:
      linear-gradient(110deg,transparent 36%,rgba(255,250,225,.55) 43%,#fff 48.5%,#fff 51.5%,rgba(255,250,225,.55) 57%,transparent 64%)
        calc(50% + var(--sheen) * 40%) 0 / 300% 100% no-repeat,
      linear-gradient(135deg,#FFF0A8 0%,#E9B52C 30%,#B07D0E 55%,#F6D063 78%,#B88412 100%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
  }
  .fan-card.rare .fan-badge{
    background:linear-gradient(135deg,#F8D25A 0%,#D9A21B 50%,#A9740A 100%);
    filter:drop-shadow(0 0 .3px rgba(90,59,0,.6));
  }
  .collector-pip{
    flex:1; font-family:'Poppins'; font-weight:700; font-size:9.5px; padding:4px 0;
    border-radius:12px; border:2px solid var(--tier-color); color:var(--ink-soft);
    opacity:.4; text-align:center;
  }
  .collector-pip.got{background:var(--tier-color);color:#fff;opacity:1;}
  .collector-pip.got:nth-child(3){color:var(--ink);}
  .card.rare-card{box-shadow:0 12px 34px rgba(255,195,0,0.6), 0 0 0 6px rgba(255,195,0,0.2);
    background:linear-gradient(var(--disc-cream), var(--disc-cream)) padding-box,
      linear-gradient(135deg,#FFF0A8 0%,#E9B52C 30%,#B07D0E 55%,#F6D063 78%,#B88412 100%) border-box;}
  /* White text on bright gold is 1.6:1 - unreadable. Ink is 11.3:1. */
  @keyframes cardReveal{
    0%{transform:scale(0.35) rotateY(180deg); opacity:0;}
    60%{transform:scale(1.06) rotateY(0deg); opacity:1;}
    100%{transform:scale(1) rotateY(0deg); opacity:1;}
  }
  .card-photo{width:100%;height:200px;object-fit:cover;object-position:var(--bird-crop);background:var(--parch-dk);display:block;filter:url(#watercolor-filter) saturate(1.25) contrast(0.94);}
  .card-body{padding:16px 18px 20px;}
  .card-name{font-family:'Poppins';font-weight:900;font-size:22px;color:var(--wood-edge);}
  .card-sci{font-size:12px;font-style:italic;color:var(--ink-soft);margin-top:2px;}
  .card-tags{display:flex;gap:8px;margin-top:10px;animation:statFadeUp 0.4s ease 0.45s both;}
  .tag{font-family:'Poppins';font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;}
  /* Worded and coloured like a moment's kicker: the reveal card is the
     new-bird moment at full size. */
  .tag.new{background:var(--disc-cream); color:var(--wood-edge); font-weight:900; font-size:12px;
    box-shadow:inset 0 0 0 2px var(--wood);}
  .tag.dup{background:var(--parch-dk); color:var(--ink-soft);}
  .feather-row{display:flex;align-items:center;gap:6px;margin-top:14px;font-family:'Poppins';font-weight:700;font-size:15px;color:var(--feather);animation:statFadeUp 0.4s ease 0.6s both;}
  /* Heard again the same day: no feathers, said plainly rather than "+0". */
  .feather-row.none{font-size:12.5px;color:var(--ink-soft);}
  @keyframes statFadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* --- Session Results: the fanned, unrevealed hand of cards --- */
  .results-title{font-family:'Poppins';font-weight:900;font-size:24px;color:#fff;text-align:center;animation:statFadeUp 0.4s ease both;}
  .results-sub{font-size:13px;color:rgba(255,255,255,0.85);text-align:center;margin-top:6px;animation:statFadeUp 0.4s ease 0.1s both;}
  .silhouette-row{display:flex;justify-content:center;align-items:flex-end;margin-top:30px;min-height:110px;}
  .silhouette-card{
    position:relative;
    width:64px; height:94px; border-radius:12px;
    background:linear-gradient(var(--disc-cream), var(--disc-cream)) padding-box, var(--wood-rim);
    border:4px solid transparent;
    margin-left:-20px; box-shadow:0 6px 14px rgba(0,0,0,0.18);
    display:flex; align-items:center; justify-content:center; font-size:22px;
    animation:cardReveal 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .silhouette-card:first-child{margin-left:0;}
  .reveal-hint{font-family:'Poppins';font-weight:700;font-size:12px;color:rgba(255,255,255,0.9);margin-top:22px;text-align:center;animation:statFadeUp 0.4s ease 0.3s both;}
  .silhouette-card.tappable{cursor:pointer;animation:cardReveal 0.5s cubic-bezier(0.34,1.56,0.64,1) both, revealPulse 1.6s ease-in-out 0.8s infinite;}
  @keyframes revealPulse{0%,100%{box-shadow:0 6px 14px rgba(0,0,0,0.18);}50%{box-shadow:0 6px 22px rgba(var(--glow),0.75);}}
  .collect-hint{font-family:'Poppins';font-weight:700;font-size:12px;color:rgba(255,255,255,0.9);text-align:center;margin-top:16px;min-height:16px;animation:statFadeUp .4s ease both;}
  .card.collectable{cursor:pointer;animation:collectGlow 1.8s ease-in-out infinite;}
  @keyframes collectGlow{
    0%,100%{box-shadow:0 12px 30px rgba(45,27,105,0.18);}
    50%{box-shadow:0 12px 34px rgba(var(--glow),0.85);}
  }
  .flying-feather{position:fixed;z-index:960;font-size:20px;pointer-events:none;will-change:transform,opacity;}
  /* The moment - every reward's celebration (celebrate() in the script):
     a wood-framed cream card with the reward's picture on a disc, what
     happened over what it was, and its feathers. It pops in on MOMENT.arrive
     (the duration is set from the script, so the timing lives in one place)
     and is flown home by the script. */
  .moment{--frame:4px; --inner:14px; position:fixed; z-index:950; cursor:pointer;
    width:max-content; max-width:min(320px, calc(100vw - 24px)); box-shadow:0 8px 22px rgba(0,0,0,0.42);
    animation:momentIn 350ms cubic-bezier(.34,1.56,.64,1) both; will-change:transform,opacity;}
  @keyframes momentIn{from{transform:scale(.4); opacity:0;} to{transform:none; opacity:1;}}
  .moment-inner{display:flex; align-items:center; gap:11px; padding:9px 14px 9px 9px;
    background:var(--disc-cream); border-radius:var(--inner);}
  .moment-icon{flex:0 0 auto; width:48px; height:48px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 50% 40%, #FFF6E6, #F2D3A6 75%); box-shadow:inset 0 0 0 2px rgba(116,50,6,0.22);}
  .moment-icon img{width:38px; height:38px; object-fit:contain;}
  .moment-num{font-family:'Poppins'; font-weight:900; font-size:24px; color:var(--wood-edge);}
  .moment-text{display:flex; flex-direction:column; min-width:0;}
  .moment-kicker{font-family:'Poppins'; font-weight:900; font-size:16px; line-height:1.15; color:var(--wood-edge);}
  .moment-name{font-family:'Poppins'; font-weight:700; font-size:12.5px; line-height:1.25; color:#4A2408; opacity:.8;}
  .moment-feathers{display:flex; align-items:center; gap:4px; flex:0 0 auto; margin-left:2px;
    font-family:'Poppins'; font-weight:900; font-size:18px; color:var(--feather);}
  .moment-feathers .feather-icon{width:20px; height:20px;}
  /* The full-size moment (celebrate({big:true})): the same card, in the
     middle of the screen, the picture large above the words. */
  /* .woodframe, further down, is position:relative; the moment is fixed to
     the screen, so it says so with the extra weight to win. */
  .moment.woodframe{position:fixed;}
  .moment.moment-big{max-width:min(330px, calc(100vw - 32px)); --frame:6px; --inner:18px;
    box-shadow:0 0 0 100vmax rgba(26,17,40,0.5), 0 14px 34px rgba(0,0,0,0.5);}
  .moment-big .moment-inner{flex-direction:column; gap:4px; padding:16px 20px 18px; text-align:center;}
  .moment-art{display:block; margin-bottom:4px;}
  .moment-big .moment-kicker{font-size:15px; text-transform:uppercase; letter-spacing:.04em;}
  .moment-big .moment-name{font-family:'Poppins'; font-weight:900; font-size:24px; line-height:1.15; color:var(--wood-edge); opacity:1;}
  .moment-ladder{display:flex; justify-content:center; gap:3px; margin-top:12px;}
  .moment-step{display:inline-grid; border-radius:50%;}
  .moment-step.now{box-shadow:0 0 0 2.5px var(--sage); animation:stepNow .6s cubic-bezier(.34,1.56,.64,1) .45s both;}
  @keyframes stepNow{from{transform:scale(.4);}}
  .moment-next{font-family:'Poppins'; font-weight:700; font-size:12.5px; color:var(--ink-soft); margin-top:8px;}
  @media (prefers-reduced-motion: reduce){ .moment{animation:none;} .moment-step.now{animation:none;} }
  .burst-leaf{position:fixed;z-index:290;pointer-events:none;width:12px;height:12px;margin:-6px 0 0 -6px;will-change:transform,opacity;}
  .origami-flyer{position:fixed;z-index:300;pointer-events:none;width:96px;height:96px;will-change:transform,opacity;}
  .origami{display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.35));}
  /* Wings beat as it flies - each on its own timing so it isn't a rigid
     cut-out sliding across the screen. */
  /* transform-box must be pinned to view-box. Left to the engine's default
     the origin can resolve against each wing's OWN bounding box, which puts
     the pivot at opposite ends of the two wings - one swings hugely, the
     other barely moves. That was the single-flapping-wing bug. */
  .ori-wing-l, .ori-wing-r{transform-box:view-box;transform-origin:50px 52px;}
  .ori-wing-l{animation:oriFlapL .3s ease-in-out infinite;}
  .ori-wing-r{animation:oriFlapR .3s ease-in-out infinite;}
  /* A big beat - the wings fold right up and past level, so it reads as
     flapping rather than a gentle wobble. */
  @keyframes oriFlapL{0%{transform:rotate(-34deg) scaleY(.42);}50%{transform:rotate(12deg) scaleY(1.06);}100%{transform:rotate(-34deg) scaleY(.42);}}
  @keyframes oriFlapR{0%{transform:rotate(34deg) scaleY(.42);}50%{transform:rotate(-12deg) scaleY(1.06);}100%{transform:rotate(34deg) scaleY(.42);}}
  .nav-pop{animation:navPop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes navPop{0%,100%{transform:scale(1);}40%{transform:scale(1.28);}}
  /* --- Done --- */
  .done-icon{width:120px;display:block;margin:0 auto;}
  .done-title{font-family:'Poppins';font-weight:900;font-size:22px;color:#fff;margin-top:10px;}
  .done-sub{color:rgba(255,255,255,0.85);font-size:14px;margin-top:6px;text-align:center;}
  .again-btn{
    margin-top:24px; padding:15px 34px;
    background:var(--dusk); color:#fff; font-family:'Poppins'; font-weight:700; font-size:15px;
    border:none; border-radius:30px; box-shadow:0 4px 0 var(--dusk-mid); cursor:pointer;
  }
  /* The "go again" variant: a round mic button that starts a new recording
     straight away, rather than a text button that returns to Home first.
     Same transparent/no-shadow treatment as .mic-btn above - the badge
     artwork carries its own circular border and bevel. */
  .again-btn.mic-again-btn{
    margin-top:12px;
    width:84px; height:84px; padding:0; border-radius:50%;
    background:transparent; box-shadow:none;
    font-size:30px; display:flex; align-items:center; justify-content:center;
    transition:transform .1s;
  }
  .again-btn.mic-again-btn:active{transform:translateY(4px);}
  .error{color:#FFD9D2;font-size:13px;margin-top:14px;text-align:center;max-width:320px;}
