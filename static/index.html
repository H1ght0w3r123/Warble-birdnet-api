// --- The listening scene -----------------------------------------------------
// A see-through foreground - a garden path between fences, 1127 x 1396 - with
// the singing tree standing at the far end of the path, behind it. Measured
// on the path picture: pathX/pathY is where the path meets the grass at the
// back, which is where the tree's roots go. The tree is drawn on its own
// 380 x 452 canvas: its roots meet the ground at (196, 410), and its canopy
// is 374 wide, which is made TREE_SPAN of the path picture's width.
const LISTEN_PATH = { w: 1127, h: 1396, pathX: 563, pathY: 975 };
const LISTEN_TREE = { w: 380, h: 452, rootX: 196, rootY: 410, canopy: 374, top: 33 };
const TREE_SPAN = 0.86;
const LISTEN_SLIP = 0.16;

// Everything is placed from the bottom up: the path picture's foot rests on
// the nav bar, the stop button stands on the path just clear of the raised
// Home button, the tree at the path's far end, and above the tree, top
// down: the place name, the timer, then the bird badges.
// It is always full width. When the screen is short, the foot of the path
// slides down behind the nav bar to make room above the tree, up to
// LISTEN_SLIP of the picture's height. Only a very short phone, where even
// that isn't enough, makes the scene shrink.
function layoutListening() {
  const scene = document.getElementById('recScene');
  const pane = document.getElementById('scroller');
  if (!scene || !pane) return;
  const P = LISTEN_PATH, T = LISTEN_TREE;
  const vw = window.innerWidth;
  const navTop = pane.getBoundingClientRect().bottom;
  const topBar = (document.querySelector('.top')?.getBoundingClientRect().bottom || 60) + 6;
  const k = TREE_SPAN * P.w / T.canopy;              // tree units -> path units
  const treeTopY = P.pathY - (T.rootY - T.top) * k;  // canopy top, in path units
  const above = 20 + 30 + 56 + 10;                    // place, timer, badges, gap - px
  const full = vw * 1.06 / P.w;
  const fits = (navTop - topBar - above) / (P.h * (1 - LISTEN_SLIP) - treeTopY);
  const sc = Math.min(full, fits);
  const w = P.w * sc, h = P.h * sc;
  const left = (vw - w) / 2;
  // Bottom on the nav bar, unless that leaves too little room above: then
  // down, by just enough, behind it.
  const short = topBar + above - (navTop - h + treeTopY * sc);
  const top = navTop - h + Math.max(0, short);
  Object.assign(scene.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' });

  const tw = T.w * k * sc, th = T.h * k * sc;
  Object.assign(document.getElementById('recTreeWrap').style, {
    left: (P.pathX * sc - T.rootX * k * sc) + 'px', top: (P.pathY * sc - T.rootY * k * sc) + 'px',
    width: tw + 'px', height: th + 'px',
  });

  const canopyTop = top + treeTopY * sc;
  const stack = document.getElementById('liveBirdStack');
  if (stack) stack.style.top = (canopyTop - 10 - 56) + 'px';
  const timer = document.getElementById('timer');
  if (timer) timer.style.top = (canopyTop - 10 - 56 - 30) + 'px';
  const where = document.getElementById('recLocation');
  if (where) where.style.top = (canopyTop - 10 - 56 - 30 - 20) + 'px';

  // The Home button rises above the nav bar, so measure its top.
  const home = document.querySelector('.home-tab');
  const floor = Math.min(navTop, home ? home.getBoundingClientRect().top : navTop) - 8;
  const stop = document.getElementById('stopBtn');
  if (stop) stop.style.top = (floor - stop.offsetHeight) + 'px';
}
window.addEventListener('resize', () => { if (document.getElementById('recScene')) layoutListening(); });

function renderRecording() {
  liveDetectedBirds = [];
  liveBadgedSpecies = new Set();
  stage.innerHTML = `
    <div class="rec-column">
      <div class="live-bird-stack" id="liveBirdStack"></div>
      <div class="rec-scene" id="recScene">
        <div class="rec-tree-wrap" id="recTreeWrap">${treeSvgMarkup()}</div>
        <img class="rec-path" src="/static/listen-path-v1.webp" alt="">
      </div>
      <div class="rec-location" id="recLocation"></div>
      <button class="mic-btn recording" id="stopBtn" aria-label="Stop"><img class="mic-icon" src="/static/stop-v1.webp" alt=""></button>
      <div class="timer" id="timer">0:00</div>
    </div>
  `;
  document.getElementById('stopBtn').onclick = stopRecording;
  layoutListening();
  loadRecordingLocation();
  showTutorial('listening', 400);
}

async function loadRecordingLocation() {
  const el = document.getElementById('recLocation');
  if (!el || currentLat === null || currentLng === null) return;
  try {
    const res = await fetch(`/where-am-i?lat=${currentLat}&lng=${currentLng}`);
    const data = await res.json();
    // Element may be gone if recording stopped while this was in flight
    const target = document.getElementById('recLocation');
    if (target && data.name) target.textContent = `Listening in ${data.name}`;
  } catch (e) { /* no location line is fine - just leave it empty */ }
}

// The same two-hue bird bust used for the Profile icon, reused for the
// live detection badges so they read as "a bird" in Warble's own style
// rather than a generic emoji.
// The fixed two-hue bird bust used by the top-bar profile button, kept here
// so it can be restored after a photo is cleared.
const PROFILE_BIRD_SVG = '<svg viewBox="0 0 24 24" color="#8E87B8"><path d="M4.6 21.6 L4.6 15.4 L9.4 11.2 L19.2 11.2 L19.2 21.6 Z" fill="#C4BFDF"/><circle cx="14.6" cy="7.6" r="5" fill="#8E87B8"/><path d="M19.2 5.9 L23.4 7.9 L19.2 9.9 Z" fill="#8E87B8"/><circle cx="13.4" cy="6.6" r="1.5" fill="#fff"/><path d="M9.4 11.2 L14.4 11.2 L9.4 16 Z" fill="#8E87B8"/></svg>';

const BADGE_BIRD_IMG = '<img src="/static/live-bird-v2.webp" alt="">';

// Rare first. Anything else - Common, or a bird outside Warble's hundred
// with no tier at all - sorts together, because they now look the same.
// Rare leading also keeps the gold off its neighbours: a badge's glow paints
// over the badges declared before it, and there are none before the first.
const TIER_ORDER = { Rare: 0 };
let liveDetectedBirds = [];
let liveBadgedSpecies = new Set();

function renderLiveBirdStack() {
  const el = document.getElementById('liveBirdStack');
  if (!el) return;
  // Rare birds to the front, everything else in the order it was heard.
  const sorted = [...liveDetectedBirds].sort((a, b) => (TIER_ORDER[a.tier] ?? 1) - (TIER_ORDER[b.tier] ?? 1));
  el.innerHTML = sorted.map((bird, i) => {
    const t = sessionTier(bird.tier);
    // Duration and a negative delay (so it starts already mid-cycle rather
    // than every badge launching from the same pose) both vary by position,
    // the same trick used for the dancing avatar's wings - it's what makes
    // a row of badges read as independently jittering rather than one badge
    // copy-pasted sideways.
    // Around half a second a cycle, varied slightly per badge and started
    // mid-cycle, so a row hums rather than pulsing as one block.
    const dur = (0.46 + (i % 4) * 0.05).toFixed(2);
    const delay = (-(i % 5) * 0.11).toFixed(2);
    return `<div class="live-bird-badge ${bird.tier === 'Rare' ? 'rare' : ''}">
      <div class="badge-jitter" style="animation-duration:${dur}s; animation-delay:${delay}s;">${BADGE_BIRD_IMG}</div>
    </div>`;
  }).join('');
}

// No "listening back" step any more - identification already happened live
// during the recording, so stopping just posts a small JSON payload and gets
// the enrichment back. On a good connection that's imperceptible, and the
// reveal appears straight away.
//
// This is kept only as a safety net for a slow or flaky connection, shown
// after a short delay rather than immediately, so it never flashes up on a
// normal session. The wording is honest about what's actually happening.
function renderSaving() {
  stage.innerHTML = `
    <div class="stage-label">Just a moment...</div>
    <div class="stage-sub">Saving what you heard</div>
  `;
}

function renderError(message) {
  stage.innerHTML = `
    <div class="stage-label">Hmm, that didn't work</div>
    <div class="error">${message}</div>
    <button class="again-btn" id="retryBtn">Try again</button>
  `;
  document.getElementById('retryBtn').onclick = renderIdle;
}

function renderSessionResults() {
  if (sessionResults.length === 0) {
    renderNoBirds();
    return;
  }

  const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
  const timeStr = `${m}:${s.toString().padStart(2, '0')}`;
  const locationLine = sessionLocationName ? ` at ${sessionLocationName}` : '';

  const silhouettes = sessionResults.map((bird, i) => {
    const t = sessionTier(bird.tier);
    const angle = (i % 2 === 0 ? -1 : 1) * (5 + i * 2);
    // Front-to-back, so the first card - the one that's tappable and reveals
    // next - sits on TOP of the pack. Without an explicit z-index the DOM
    // order wins and it ends up buried at the back, which is backwards.
    const z = sessionResults.length - i;
    return `<div class="silhouette-card ${t.cls}" style="--tier-color:${t.color}; transform:rotate(${angle}deg); z-index:${z}; animation-delay:${(i * 0.08).toFixed(2)}s;"><span style="opacity:0.35;filter:grayscale(1);">${PAINTED_BIRD}</span></div>`;
  }).join('');

  stage.innerHTML = `
    <div class="results-title">You heard ${sessionResults.length} bird${sessionResults.length === 1 ? '' : 's'}!</div>
    <div class="results-sub">${timeStr} session${locationLine}</div>
    <div class="silhouette-row">${silhouettes}</div>
    <div class="reveal-hint">Tap the first card to reveal</div>
  `;
  // The first (frontmost) card is the tap target, so the gesture matches the
  // instruction rather than needing a separate button.
  const firstCard = stage.querySelector('.silhouette-card');
  if (firstCard) {
    firstCard.classList.add('tappable');
    firstCard.onclick = () => { cardIndex = 0; renderCard(); };
  }
}

// Reveal order builds towards the best find: commonest first, and within a
// tier the ones already in the collection before genuinely new ones. So the
// last card of a session is the rarest new bird - the moment worth waiting for.
const REVEAL_TIER_RANK = { Common: 1, Rare: 2 };   // untiered birds fall to 0
function sortForReveal(birds) {
  return [...birds].sort((a, b) => {
    const t = (REVEAL_TIER_RANK[a.tier] ?? 0) - (REVEAL_TIER_RANK[b.tier] ?? 0);
    if (t !== 0) return t;
    return (a.is_duplicate ? 0 : 1) - (b.is_duplicate ? 0 : 1);
  });
}

// Which pack this bird belongs to. A bird has one fixed rarity now, so there
// is no set of tiers to collect - just the pack it counts towards.
function packStripHtml(bird) {
  if (!bird.pack_name) return '';
  return `
    <div class="collector-strip">
      <div class="collector-label">Collection</div>
      <div class="pack-chip">${bird.pack_name}</div>
    </div>`;
}

function renderCard() {
  if (sessionResults.length === 0) { renderNoBirds(); return; }
  const bird = sessionResults[cardIndex];
  const tierColor = tierColorOf(bird.tier);
  stage.innerHTML = `
    <div class="card-wrap">
      <div class="progress">Bird ${cardIndex + 1} of ${sessionResults.length}</div>
      <div class="card ${bird.tier === 'Rare' ? 'rare-card' : ''}" id="revealCard" style="--tier-color:${tierColor}">
        ${bird.photo_url ? `<img class="card-photo" ${birdImg(bird.photo_url, 800)}>` : `<div class="card-photo"></div>`}
        <div class="card-body">
          <div class="card-name">${birdName(bird.common_name)}</div>
          ${currentProfile.show_scientific_names !== false ? `<div class="card-sci">${bird.scientific_name}</div>` : ''}
          <div class="card-tags">
            <span class="tag ${bird.is_duplicate ? 'dup' : 'new'}">${bird.is_duplicate ? 'Already heard' : 'New bird!'}</span>
          </div>
          ${bird.season && bird.season.state === 'away'
            ? `<div class="season-surprise">Unusual! ${birdName(bird.common_name)}s have normally left by now.</div>` : ''}
          ${packStripHtml(bird)}
          ${bird.feathers
            ? `<div class="feather-row"><img class="feather-icon" src="/static/feather.webp" alt=""> +${bird.feathers}</div>`
            : `<div class="feather-row none">Feathers already won for this one today</div>`}
          ${bird.call_url ? `<button class="play-call-btn" data-call-url="${bird.call_url}">${PAINTED_PLAY} Hear its call</button>` : ''}
          <a class="learn-more" href="${wikipediaUrl(bird.scientific_name)}" target="_blank" rel="noopener">Learn more ${icon('forward')}</a>
        </div>
      </div>
      <div class="collect-hint" id="collectHint"></div>
    </div>
  `;
  const playBtn = stage.querySelector('.play-call-btn');
  if (playBtn) playBtn.onclick = (e) => { e.stopPropagation(); playBirdCall(playBtn.dataset.callUrl, playBtn); };

  const cardEl = document.getElementById('revealCard');
  const hint = document.getElementById('collectHint');
  // A new bird is a moment like any other reward: the same burst of leaves
  // as the card lands. Its flight home to My Flock is the tap below.
  if (!bird.is_duplicate && !reducedMotion()) setTimeout(() => {
    if (!cardEl.isConnected) return;
    const r = cardEl.getBoundingClientRect();
    burstLeaves(r.left + r.width / 2, r.top + r.height * 0.35);
  }, MOMENT.arrive);

  // The card is tappable as soon as it's revealed. One tap drives the whole
  // sequence: feathers fly to the counter, then the card flies to My Birds.
  cardEl.classList.add('collectable');
  if (hint) hint.textContent = bird.is_duplicate
    ? 'Tap to carry on'
    : 'Tap to add to your collection';
  showTutorial('results', 800);
  cardEl.onclick = () => {
    cardEl.onclick = null;                   // one tap only, mid-flight taps ignored
    cardEl.classList.remove('collectable');
    if (hint) hint.textContent = '';
    // Feathers are collected once, on the Done screen - not per card.
    dismissCard(cardEl, !bird.is_duplicate, advanceReveal);
  };
}

function advanceReveal() {
  cardIndex++;
  // Straight to the feathers: naming a new spot waits until they're
  // collected (renderDone), so the reward never queues behind typing.
  if (cardIndex < sessionResults.length) renderCard();
  else finishSession();
}

function finishSession() {
  renderDone();
}

// --- Animation 1: feathers fly from the card to the counter, which counts up
function flyFeathersToCounter(cardEl, feathers, onDone) {
  const counter = document.querySelector('.feathers');
  if (!cardEl || !counter || !feathers) { setTimeout(onDone, 450); return; }

  const from = cardEl.getBoundingClientRect();
  const to = counter.getBoundingClientRect();
  // One feather per 5 earned reads as "more feathers" without a swarm of 50.
  const count = Math.max(3, Math.min(10, Math.round(feathers / 5)));
  const startTotal = currentFeatherTotal;

  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'flying-feather';
    f.innerHTML = '<img class="feather-icon" src="/static/feather.webp" alt="">';
    f.style.left = `${from.left + from.width / 2}px`;
    f.style.top = `${from.top + from.height / 2}px`;
    document.body.appendChild(f);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    // Stagger so they stream rather than move as one block
    const delay = i * 70;
    requestAnimationFrame(() => {
      f.style.transition = `transform .75s cubic-bezier(.4,0,.5,1) ${delay}ms, opacity .3s ease ${delay + 550}ms`;
      f.style.transform = `translate(${dx}px, ${dy}px) scale(.5) rotate(${(Math.random() - .5) * 120}deg)`;
      f.style.opacity = '0';
    });
    setTimeout(() => f.remove(), delay + 900);
  }

  const flightTime = (count - 1) * 70 + 750;
  currentFeatherTotal = startTotal + feathers;
  setTimeout(() => animateFeatherCount(currentFeatherTotal), 400);
  setTimeout(onDone, flightTime);
}

// --- The moment: one celebration for every reward -------------------------
// A new bird, a trophy level, a pack, a challenge, a game star and a level
// opening are one family, so they share one shape and one timing:
//   ARRIVE  a wood-and-cream card pops in over where it was won, and
//           a scatter of leaves bursts from behind it;
//   HOLD    it stays long enough to be read out: what happened (the kicker),
//           what it was (the name), and its feathers if it pays any;
//   GO HOME it shrinks and flies to where the thing now lives - a nav tab,
//           or the game's own stars - which pops as it lands, while its
//           feathers fly to the counter at the same moment.
// Several queue up, one at a time. A tap sends a card home early.
// The new bird's reveal card is this same moment at full size: it arrives
// on MOMENT.arrive with the same burst, and goes home to My Flock.
// The server has already banked every feather; this is only the showing.
const MOMENT = { arrive: 350, hold: 1300, home: 600, gap: 150 };
let momentQueue = Promise.resolve();

// icon: markup for the disc (an <img>, or a little text).
// home: the element it flies into, or its id; none = it shrinks where it is.
// big: the same moment at full size, in the middle of the screen - a large
// picture in place of the disc, `more` (markup) under the name, a bigger
// burst and three times the hold. For the rarest rewards only (a new birder rank).
function celebrate({ kicker, name = '', icon = '', feathers = 0, from = null, home = null, big = false, more = '' }) {
  momentQueue = momentQueue.then(() => new Promise(resolve => {
    const card = document.createElement('div');
    card.className = big ? 'moment moment-big woodframe' : 'moment woodframe';
    card.setAttribute('role', 'status');
    card.innerHTML = big ? `<div class="moment-inner">
      ${icon ? `<span class="moment-art">${icon}</span>` : ''}
      <span class="moment-kicker">${escapeFlock(kicker)}</span>
      ${name ? `<span class="moment-name">${escapeFlock(name)}</span>` : ''}
      ${more}
      ${feathers ? `<span class="moment-feathers"><img class="feather-icon" src="/static/feather.webp" alt=""> +${feathers}</span>` : ''}
    </div>` : `<div class="moment-inner">
      ${icon ? `<span class="moment-icon">${icon}</span>` : ''}
      <span class="moment-text">
        <span class="moment-kicker">${escapeFlock(kicker)}</span>
        ${name ? `<span class="moment-name">${escapeFlock(name)}</span>` : ''}
      </span>
      ${feathers ? `<span class="moment-feathers"><img class="feather-icon" src="/static/feather.webp" alt=""> +${feathers}</span>` : ''}
    </div>`;
    card.style.animationDuration = `${MOMENT.arrive}ms`;
    document.body.appendChild(card);
    const fromEl = from && from.isConnected && !big ? from : null;
    const r = fromEl ? fromEl.getBoundingClientRect() : null;
    const cx = r && r.width ? r.left + r.width / 2 : innerWidth / 2;
    const cy = r && r.height ? r.top + r.height / 2 : innerHeight * 0.42;
    const w = card.offsetWidth, h = card.offsetHeight;
    card.style.left = `${Math.max(12, Math.min(innerWidth - 12 - w, cx - w / 2))}px`;
    card.style.top = `${Math.max(big ? 12 : 60, Math.min(innerHeight - (big ? 90 : 140) - h, cy - h / 2))}px`;
    const still = reducedMotion();
    if (!still) setTimeout(() => {
      const b = card.getBoundingClientRect();
      burstLeaves(b.left + b.width / 2, b.top + b.height / 2, big ? 2 : 1);
    }, MOMENT.arrive / 3);

    let gone = false;
    const goHome = () => {
      if (gone) return;
      gone = true;
      clearTimeout(holdTimer);
      if (feathers) flyFeathersToCounter(card, feathers, () => {});
      const target = typeof home === 'string' ? document.getElementById(home) : home;
      const t = target && target.isConnected && !still ? target.getBoundingClientRect() : null;
      const b = card.getBoundingClientRect();
      const dx = t ? (t.left + t.width / 2) - (b.left + b.width / 2) : 0;
      const dy = t ? (t.top + t.height / 2) - (b.top + b.height / 2) : 0;
      card.style.animation = 'none';
      card.style.transition = still ? 'opacity .3s ease'
        : `transform ${MOMENT.home}ms cubic-bezier(.55,0,.65,1), opacity ${MOMENT.home * .4}ms ease ${MOMENT.home * .6}ms`;
      requestAnimationFrame(() => {
        if (!still) card.style.transform = `translate(${dx}px, ${dy}px) scale(${t ? .1 : .5})`;
        card.style.opacity = '0';
      });
      setTimeout(() => {
        card.remove();
        if (t) { target.classList.add('nav-pop'); setTimeout(() => target.classList.remove('nav-pop'), 600); }
        setTimeout(resolve, MOMENT.gap);
      }, still ? 300 : MOMENT.home);
    };
    card.onclick = goHome;
    const holdTimer = setTimeout(goHome, MOMENT.arrive + (still ? 900 : MOMENT.hold) * (big ? 3 : 1));
  }));
  return momentQueue;
}

// The disc pictures, so every moment of a kind looks alike wherever it fires.
const MOMENT_ICONS = {
  trophy: t => `<img src="/static/emblem-${t.key}-v1.webp" alt="">`,
  pack:   p => `<img src="/static/pack-${p.art}-badge-v2.webp" alt="">`,
  challenge: () => '<img src="/static/tick-v1.webp" alt="">',
  week:   () => '<img src="/static/challenge-icon-v1.webp" alt="">',
  star:   () => '<img src="/static/star-v1.webp" alt="">',
  level:  n => `<span class="moment-num">${n}</span>`,
};

// Each kind of reward, as a moment. `from` is where it was won.
function celebrateTrophy(t, from) {
  return celebrate({ kicker: t.level > 1 ? 'Trophy level up!' : 'Trophy won!',
    name: `${t.name} · level ${t.level}`, icon: MOMENT_ICONS.trophy(t),
    feathers: t.feathers || 0, from, home: 'navTrophies' });
}
// A new rank is the one moment at full size: the new seal, big, and the
// ladder underneath with the step just climbed lit up. It flies into the
// top bar, and the badge there changes as it lands.
function celebrateRank(rank, from) {
  if (currentProfile) currentProfile.rank = rank;
  const landed = () => paintTopRank();
  const ladder = (rank.ladder || []).map((step, i) =>
    `<span class="moment-step${i === rank.index ? ' now' : ''}">${rankSeal(i, step.key, 30, i > rank.index)}</span>`).join('');
  const next = rank.next_name ? `Next: ${rank.next_name} at ${rank.next_at} leaves` : 'The very top rank!';
  return celebrate({ kicker: 'New birder rank!', name: `You're ${/^[AEIOU]/.test(rank.name) ? 'an' : 'a'} ${rank.name}!`,
    icon: rankSeal(rank.index, rank.key, 150), big: true, from, home: 'topRank',
    more: `${ladder ? `<span class="moment-ladder">${ladder}</span>` : ''}<span class="moment-next">${escapeFlock(next)}</span>` })
    .then(r => { landed(); return r; });
}
function celebratePack(p, from) {
  return celebrate({ kicker: 'Pack complete!', name: p.name, icon: MOMENT_ICONS.pack(p),
    feathers: p.feathers || 0, from, home: 'navHabitats' });
}
// A single challenge pays nothing, so its moment says how far the week has
// got instead; the fifth is followed by the week's own moment, which pays.
function celebrateChallenges(list, weekBonus, from) {
  (list || []).forEach((c, i) => celebrate({
    kicker: `Challenge done! ${c.done - (list.length - 1 - i)} of ${c.of}`, name: c.text,
    icon: MOMENT_ICONS.challenge(), from, home: 'navHome' }));
  if (weekBonus) celebrate({ kicker: 'All five done!', name: "This week's challenges",
    icon: MOMENT_ICONS.week(), feathers: weekBonus, from, home: 'navHome' });
}
function celebrateTrophies(list, fromEl, rankUp) {
  (list || []).forEach(t => celebrateTrophy(t, fromEl));
  if (rankUp) celebrateRank(rankUp, fromEl);
  if ((list || []).length) refreshWhatsNew();
  return momentQueue;
}

// --- Avatar birds you have to find, and the birder rank -------------------
// Which birds are still to find comes from the server (/profile "avatars"):
// a lockable bird opens the first time its real counterpart is heard.
function avatarLock(id) {
  const st = currentProfile && currentProfile.avatars && currentProfile.avatars[id];
  return st && !st.unlocked ? st : null;
}

// The top bar's rank badge and the Awards line both read currentProfile.rank;
// this brings it (and the bird locks) up to date after anything that can
// change them.
async function refreshRank() {
  try {
    const d = await (await fetch('/profile')).json();
    currentProfile.rank = d.rank;
    currentProfile.avatars = d.avatars;
    paintTopRank();
  } catch (e) { /* keep what we had */ }
}
function paintTopRank() {
  const el = document.getElementById('topRank');
  const r = currentProfile && currentProfile.rank;
  if (!el || !r) return;
  el.innerHTML = rankSeal(r.index, r.key, 40);
  el.setAttribute('aria-label', `Your birder rank: ${r.name} - see all the ranks`);
  el.hidden = false;
}

// Each rank has its own look: a wooden seal with the rank's number on its
// cream face and a wreath round it that grows a pair of leaves with every
// rank, the way a trophy's sockets fill - green up to Warden, then gold for
// the two at the top (the trophy leaves turning gold, the one other thing
// gold means in Warble). When a painting arrives as
// static/icon-rank-<key>-v1.webp it takes the seal's place
// (design-brief-rank-badges-v1.md).
const RANK_PAIRS = [1, 2, 3, 4, 5, 6, 6, 7];
const RANK_GOLD_FROM = 6;
function rankSeal(index, key, size = 64, locked = false) {
  const cls = `rank-seal${index >= RANK_GOLD_FROM ? ' gold' : ''}${locked ? ' locked' : ''}`;
  const painted = paintedIcons['rank-' + key];
  if (painted) return `<span class="${cls} painted" style="--s:${size}px"><img src="${painted}" alt=""></span>`;
  let leaves = '';
  for (let p = 0; p < (RANK_PAIRS[index] || 1); p++) {
    // Up the circle from the bottom, a pair at a time, each leaf lying along
    // the wreath. The painted leaf leans 31 degrees; the right-hand one is
    // its mirror image.
    const th = 28 + p * 24, rad = th * Math.PI / 180;
    for (const side of [-1, 1]) {
      const x = 50 + side * 40 * Math.sin(rad), y = 50 + 40 * Math.cos(rad);
      const turn = side < 0 ? `rotate(${th - 59}deg)` : `rotate(${59 - th}deg) scaleX(-1)`;
      leaves += `<img src="/static/tree-leaf2-v2.webp" alt="" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;transform:translate(-50%,-50%) ${turn}">`;
    }
  }
  return `<span class="${cls}" style="--s:${size}px">${leaves}<span class="rank-face">${index + 1}</span></span>`;
}

// The whole ladder, over Awards: every rank from Hatchling at the bottom to
// the top one, the ones climbed in colour with a tick, this one in green
// with how far to the next, and the rest still to come. The words on how to
// climb come from the server (rank.message).
function openRankLadder() {
  const r = currentProfile && currentProfile.rank;
  if (!r || !r.ladder || document.getElementById('rankSheet')) return;
  const span = r.next_at != null ? r.next_at - r.ladder[r.index].at : 1;
  const done = r.next_at != null ? Math.max(0, Math.min(1, (r.leaves - r.ladder[r.index].at) / span)) : 1;
  const rows = r.ladder.map((step, i) => {
    const state = i < r.index ? 'climbed' : i === r.index ? 'here' : 'ahead';
    return `<div class="rank-row ${state}">
      ${rankSeal(i, step.key, 54, state === 'ahead')}
      <span class="rank-row-text">
        <span class="rank-row-name">${escapeFlock(step.name)}</span>
        <span class="rank-row-at">${state === 'here' ? `You're here! · ${r.leaves} ${r.leaves === 1 ? 'leaf' : 'leaves'}`
          : step.at ? `${step.at} leaves` : 'Where everyone starts'}</span>
        ${state === 'here' && r.next_at != null ? `<span class="rank-row-bar"><span style="width:${(done * 100).toFixed(0)}%"></span></span>` : ''}
      </span>
      ${state === 'climbed' ? `<span class="rank-row-tick">${PAINTED_TICK}</span>` : ''}
    </div>`;
  }).reverse().join('');
  const veil = document.createElement('div');
  veil.className = 'rank-sheet-veil';
  veil.id = 'rankSheet';
  veil.innerHTML = `<div class="rank-sheet woodframe" role="dialog" aria-label="Birder ranks">
    <div class="rank-sheet-inner">
      <div class="rank-sheet-head">
        <span class="rank-sheet-title">Birder ranks</span>
        <button class="rank-sheet-close" aria-label="Close">${icon('close')}</button>
      </div>
      <div class="rank-sheet-msg">${escapeFlock(r.message || '')}</div>
      <div class="rank-ladder">${rows}</div>
    </div>
  </div>`;
  document.body.appendChild(veil);
  const close = () => {
    document.removeEventListener('keydown', onKey);
    veil.classList.add('closing');
    setTimeout(() => veil.remove(), reducedMotion() ? 0 : 200);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  veil.onclick = e => { if (e.target === veil || e.target.closest('.rank-sheet-close')) close(); };
  // Open on this rank, with the next one above it in view.
  const here = veil.querySelector('.rank-row.here');
  const list = veil.querySelector('.rank-ladder');
  if (here && list) list.scrollTop = Math.max(0, here.offsetTop - list.offsetTop - here.offsetHeight * 1.5);
}

// --- Animation 2: card shrinks away into the My Birds tab
// A new bird spins, shrinks and flies into the My Birds tab - it's going into
// the collection, so the card should visibly go there. A duplicate spins and
// shrinks on the spot: the same satisfying dismissal, but no journey, because
// nothing is being added.
// Origami bird, folded from flat triangles - deliberately paper-like rather
// than a realistic bird, with a light and dark face per wing so the folds read.
const ORIGAMI_SVG = `
<svg viewBox="0 0 100 100" width="96" height="96" class="origami">
  <g class="ori-wing-l">
    <path d="M50 52 L6 30 L48 44 Z" fill="#F5EDD6"/>
    <path d="M50 52 L48 44 L44 66 Z" fill="#E4D5AE"/>
  </g>
  <g class="ori-wing-r">
    <path d="M50 52 L94 30 L52 44 Z" fill="#F2C94C"/>
    <path d="M50 52 L52 44 L56 66 Z" fill="#D9A441"/>
  </g>
  <path d="M50 52 L44 66 L56 66 Z" fill="#E8845C"/>
  <path d="M50 52 L56 66 L72 78 Z" fill="#B85A36"/>
  <path d="M50 52 L40 38 L58 40 Z" fill="#F5EDD6"/>
  <path d="M58 40 L70 36 L58 46 Z" fill="#E8845C"/>
</svg>`;

// A scatter of leaves at the moment the card becomes a bird - it covers the
// swap and makes the transformation feel like it disturbed something.
// Named distinctly from the recording tree's LEAF_COLORS - two top-level
// consts of the same name is a SyntaxError that kills the whole script.
const BURST_LEAF_COLORS = ['#7EC8A4', '#5FB88F', '#A9DCBF', '#E8845C', '#3F7C5C'];

function burstLeaves(cx, cy, size = 1) {
  const n = Math.round(14 * size);
  for (let i = 0; i < n; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'burst-leaf';
    const c = BURST_LEAF_COLORS[i % BURST_LEAF_COLORS.length];
    leaf.innerHTML = `<svg viewBox="0 0 12 12" width="12" height="12">
      <path d="M6 0 Q11 5 6 12 Q1 5 6 0 Z" fill="${c}"/>
      <path d="M6 1 V11" stroke="rgba(0,0,0,.18)" stroke-width="0.7"/></svg>`;
    leaf.style.left = `${cx}px`;
    leaf.style.top = `${cy}px`;
    document.body.appendChild(leaf);

    // Thrown outward and upward, then gravity takes them down - so they burst
    // rather than simply radiating evenly like a firework.
    const angle = (Math.PI * 2 * i) / n + (Math.random() - 0.5) * 0.5;
    const dist = (55 + Math.random() * 65) * size;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist * 0.65 - 30;
    const spin = (Math.random() - 0.5) * 720;

    requestAnimationFrame(() => {
      leaf.style.transition = 'transform .85s cubic-bezier(.15,.6,.3,1), opacity .35s ease .5s';
      leaf.style.transform = `translate(${dx}px, ${dy + 90}px) rotate(${spin}deg) scale(.7)`;
      leaf.style.opacity = '0';
    });
    setTimeout(() => leaf.remove(), 900);
  }
}

// Occasional leaf bursts around the dancing avatar on the Done screen - reuses
// the same burstLeaves used when a card becomes a bird, just on a loose,
// randomised timer rather than a one-off. Self-cancels once the avatar is no
// longer on screen (navigating away replaces stage.innerHTML, so this checks
// rather than relying on a screen-change hook that doesn't exist yet).
let doneLeafTimer = null;

function scheduleDoneLeafBurst(avatarEl) {
  if (doneLeafTimer) clearTimeout(doneLeafTimer);
  if (!avatarEl) return;
  const delay = 2200 + Math.random() * 2600;
  doneLeafTimer = setTimeout(() => {
    if (!document.body.contains(avatarEl)) { doneLeafTimer = null; return; }
    const rect = avatarEl.getBoundingClientRect();
    burstLeaves(rect.left + rect.width / 2, rect.top + rect.height / 2);
    scheduleDoneLeafBurst(avatarEl);
  }, delay);
}

// A new bird folds into an origami bird and flies to My Birds along a curved
// path. A duplicate just spins and shrinks on the spot - nothing is being
// added, so nothing should fly anywhere.
function dismissCard(cardEl, isNew, onDone) {
  if (!cardEl) { onDone(); return; }
  cardEl.classList.remove('collectable');
  // cardReveal runs with fill mode 'both', so it holds its end transform and
  // would override the inline one below. Clear it before animating out.
  cardEl.style.animation = 'none';

  if (!isNew) {
    cardEl.style.transition = 'transform .45s cubic-bezier(.55,0,.65,1), opacity .25s ease .23s';
    cardEl.style.transform = 'scale(.06) rotate(300deg)';
    cardEl.style.opacity = '0';
    setTimeout(onDone, 470);
    return;
  }

  const target = document.getElementById('navCollection');
  const from = cardEl.getBoundingClientRect();
  const cx = from.left + from.width / 2;
  const cy = from.top + from.height / 2;

  // Step 1: the card folds and shrinks together, turning all the way to 90
  // degrees. At exactly side-on it has no visible width, which is what makes
  // the swap invisible - there's nothing left to see at the moment it goes.
  const FOLD = 320;
  cardEl.style.transformOrigin = 'center center';
  cardEl.style.transition = `transform ${FOLD}ms cubic-bezier(.45,0,.55,1)`;
  cardEl.style.transform = 'perspective(620px) rotateY(90deg) scale(.34)';

  setTimeout(() => {
    cardEl.style.opacity = '0';   // hidden while edge-on, so nothing flickers back
    burstLeaves(cx, cy);          // the fold 'shakes loose' a scatter of leaves
    // Step 2: the folded card becomes the origami bird, in the same spot
    const bird = document.createElement('div');
    bird.className = 'origami-flyer';
    bird.innerHTML = ORIGAMI_SVG;
    bird.style.left = `${cx - 48}px`;
    bird.style.top = `${cy - 48}px`;
    document.body.appendChild(bird);

    if (!target) { bird.remove(); onDone(); return; }
    const to = target.getBoundingClientRect();
    const dx = (to.left + to.width / 2) - cx;
    const dy = (to.top + to.height / 2) - cy;

    // Step 3: fly along a curve, lifting before it dives, so it swoops rather
    // than slides. Rotation follows the tangent so the bird points where it's
    // actually going.
    const lift = Math.max(120, Math.abs(dy) * 0.45);
    const ctrlX = dx * 0.5, ctrlY = dy * 0.5 - lift;
    const DURATION = 900;
    const start = performance.now();

    (function step(now) {
      const t = Math.min(1, (now - start) / DURATION);
      const e = t * t * (3 - 2 * t);                    // ease in and out
      const x = 2 * (1 - e) * e * ctrlX + e * e * dx;
      const y = 2 * (1 - e) * e * ctrlY + e * e * dy;
      // Tangent of the curve, for the heading
      const tx = 2 * (1 - e) * ctrlX + 2 * e * (dx - ctrlX);
      const ty = 2 * (1 - e) * ctrlY + 2 * e * (dy - ctrlY);
      const angle = Math.atan2(ty, tx) * 180 / Math.PI - 90;
      const scale = 1 - 0.72 * e;
      bird.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scale})`;
      bird.style.opacity = t > 0.82 ? String((1 - t) / 0.18) : '1';
      if (t < 1) requestAnimationFrame(step);
      else {
        bird.remove();
        target.classList.add('nav-pop');
        setTimeout(() => target.classList.remove('nav-pop'), 600);
        onDone();
      }
    })(start);
  }, FOLD);
}

// How far away a nearby place is, in words a child can picture.
function placeDistance(m) {
  if (m < 100) return 'very close';
  if (m < 1000) return `${Math.round(m / 10) * 10}m away`;
  return `${(m / 1000).toFixed(1)}km away`;
}

// A spot the app doesn't know yet. If places the child has already named
// are nearby, they come first as one-tap answers - this is probably the
// other end of the same field - with a new name as the alternative. Either
// way the spot is saved through /name-location: an existing name adds the
// spot to that place, a new name starts one.
function renderNameLocation(onDone) {
  stage.innerHTML = nameLocationHtml();
  wireNameLocation(stage, onDone);
}

// The "New spot!" question, as markup and wiring, so it can be a screen of
// its own (before going again from "no birds") or sit inside the Done
// screen once the feathers are in.
function nameLocationHtml() {
  const nearby = sessionNearbyPlaces || [];
  return `
    <div class="stage-label">New spot!</div>
    ${nearby.length ? `
      <div class="stage-sub">Are you somewhere you've been before?</div>
      <div class="nearby-places">
        ${nearby.map((p, i) => `
          <button class="nearby-place" data-i="${i}">
            <span class="nearby-place-name">${icon('pin')} ${escapeFlock(p.name)}</span>
            <span class="nearby-place-dist">${placeDistance(p.distance_m)}</span>
          </button>`).join('')}
      </div>
      <div class="stage-sub nearby-or">Or give this place a new name:</div>` : `
      <div class="stage-sub">What do you call this place?</div>`}
    <input type="text" id="locationInput" class="location-input" placeholder="e.g. Back Garden" maxlength="40">
    <button class="again-btn" id="saveLocationBtn">Save</button>
    <button class="skip-btn" id="skipLocationBtn">Skip for now</button>
  `;
}

function wireNameLocation(root, onDone) {
  const nearby = sessionNearbyPlaces || [];
  const save = async (name) => {
    if (name && sessionLat !== null && sessionLng !== null) {
      try {
        const formData = new FormData();
        formData.append('lat', sessionLat);
        formData.append('lng', sessionLng);
        formData.append('name', name);
        await fetch('/name-location', { method: 'POST', body: formData });
      } catch (e) { /* not critical if this fails, just move on */ }
    }
    needsLocationName = false;
    sessionNearbyPlaces = [];
    onDone();
  };
  root.querySelectorAll('.nearby-place').forEach(btn => {
    btn.onclick = () => save(nearby[+btn.dataset.i].name);
  });
  root.querySelector('#saveLocationBtn').onclick = () =>
    save(root.querySelector('#locationInput').value.trim());
  root.querySelector('#skipLocationBtn').onclick = () => onDone();
}

function wikipediaUrl(scientificName) {
  return `https://en.wikipedia.org/wiki/${scientificName.replace(/ /g, '_')}`;
}

function renderNoBirds() {
  // A tip belongs here rather than on Home: this is the moment a child has
  // actually failed to hear anything and a reason why is worth reading.
  // It advances every time this screen appears, so hearing nothing twice in
  // a row gives two different things to try rather than the same one again.
  const tip = nextListeningTip();
  stage.innerHTML = `
    <img class="done-icon" src="/static/empty-nest.webp" alt="Empty nest">
    <div class="done-title">No birds heard this time</div>
    <div class="done-sub">Try somewhere with more trees, or get a bit closer</div>
    <button class="again-btn mic-again-btn" id="againBtn" aria-label="Go again"><img class="mic-icon" src="/static/mic-v2.webp" alt="Go again"></button>
    <button class="tip-card nobirds-tip" id="noBirdsTip">
      <div class="tip-icon">${icon(tip.icon)}</div>
      <div>
        <div class="tip-title">${escapeFlock(tip.title)}</div>
        <div class="tip-text">${escapeFlock(tip.text)}</div>
        <div class="tip-more">More warbling tips ${icon('forward')}</div>
      </div>
    </button>
  `;
  document.getElementById('noBirdsTip').onclick = renderTips;
  // A quiet session can still win a trophy level (the very first warble,
  // Empty Nester): its moments play once the screen has settled.
  const moments = takeSessionMoments();
  setTimeout(() => moments(stage.querySelector('.done-title')), 700);
  sessionNewAvatars = [];
  document.getElementById('againBtn').onclick = () => {
    // Location naming still has to happen first if it's pending, but once
    // that's done, go straight into recording rather than back to Home.
    if (needsLocationName) renderNameLocation(startRecording); else startRecording();
  };
}

// --- My Flock --------------------------------------------------------------
// One screen over two views. Birds is a card per species; History is a row
// per detection, newest first. Search, filters and the grid density apply to
// both; sort applies to Birds only, since History is chronological by
// definition.
//
// Everything here reads the sightings the app already has. Nothing is
// invented: a sort or filter only exists if a real field backs it, which is
// why there is no taxonomic order (no taxonomy in birds.py), no distance (no
// reference point to measure from) and no rarity (rarity lives in the
// collector packs on purpose - see CLAUDE.md).
let flockView = 'birds';       // 'birds' | 'history'
let flockSort = 'az';
let flockQuery = '';
let flockDensity = 'compact';  // 'compact' | 'large'
let flockFilters = {};         // {facet: [values]} - only non-empty facets present
// What the user has explicitly said about a History day: key -> shut?. Days
// they have not touched fall back to dayShutByDefault, so a day added
// tomorrow behaves like the rest rather than inheriting a stale choice.
let flockDayChoice = new Map();
let collectionBirds = [];

// Sorts, in the order they appear in the sheet. `get` returns the value to
// compare; `desc` flips it. Kept as data so the sheet, the button label and
// the comparison can never drift apart.
const FLOCK_SORTS = [
  { id: 'az',     label: 'A–Z',                 short: 'A–Z',
    get: b => birdName(b.common_name).toLowerCase() },
  { id: 'za',     label: 'Z–A',                 short: 'Z–A',
    get: b => birdName(b.common_name).toLowerCase(), desc: true },
  { id: 'recent', label: 'Recently discovered', short: 'Newest',
    get: b => +new Date(b.first_found), desc: true },
  { id: 'first',  label: 'First discovered',    short: 'Oldest',
    get: b => +new Date(b.first_found) },
  { id: 'heard',  label: 'Recently heard',      short: 'Last heard',
    get: b => +new Date(b.last_found), desc: true },
  { id: 'most',   label: 'Most heard',          short: 'Most heard',
    get: b => b.times_heard, desc: true },
  { id: 'least',  label: 'Least heard',         short: 'Least heard',
    get: b => b.times_heard },
];

const SEASON_OF = m =>
  (m === 12 || m <= 2) ? 'Winter' : m <= 5 ? 'Spring' : m <= 8 ? 'Summer' : 'Autumn';
const SEASON_ORDER = ['Spring', 'Summer', 'Autumn', 'Winter'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'];

// Confidence is a 0-1 float on every sighting. Three bands rather than a
// slider: a number between 0 and 1 means nothing to an eight-year-old.
const CONFIDENCE_BANDS = [
  { id: 'sure',   label: 'Very sure',  test: c => c >= 0.9 },
  { id: 'likely', label: 'Likely',     test: c => c >= 0.7 && c < 0.9 },
  { id: 'maybe',  label: 'A good guess', test: c => c < 0.7 },
];

// Each facet says how to get its values off a sighting and how to order the
// options. Returning [] means "this sighting matches no value", so a bird
// with no recorded location simply never matches a location filter.
const FLOCK_FACETS = [
  { id: 'habitat', label: 'Habitat',
    of: s => (s.bird && s.bird.habitat_tags) || [] },
  { id: 'location', label: 'Where you heard it',
    of: s => s.location_name ? [s.location_name] : [] },
  { id: 'season', label: 'Season',
    of: s => [SEASON_OF(new Date(s.created_at).getMonth() + 1)],
    order: v => SEASON_ORDER.indexOf(v) },
  { id: 'month', label: 'Month',
    of: s => [MONTH_NAMES[new Date(s.created_at).getMonth()]],
    order: v => MONTH_NAMES.indexOf(v) },
  { id: 'year', label: 'Year',
    of: s => [String(new Date(s.created_at).getFullYear())],
    order: v => -Number(v) },
  { id: 'confidence', label: 'How sure Warble was',
    of: s => { const b = CONFIDENCE_BANDS.find(b => b.test(s.confidence)); return b ? [b.label] : []; },
    order: v => CONFIDENCE_BANDS.findIndex(b => b.label === v) },
];

function remember(key, value) {
  // A remembered view is a convenience, never state the screen needs - a
  // private window or blocked site data must not break My Flock.
  try {
    if (value === undefined) return localStorage.getItem('warble.' + key);
    localStorage.setItem('warble.' + key, value);
  } catch (e) { /* no storage, no preference - the defaults still work */ }
  return null;
}

function renderCollection() {
  setActiveTab('collection');
  stage.classList.add('top-aligned');
  flockSort = FLOCK_SORTS.some(s => s.id === remember('flockSort'))
    ? remember('flockSort') : 'az';
  flockDensity = remember('flockDensity') === 'large' ? 'large' : 'compact';

  stage.innerHTML = `
    <div class="collection-header">
      <div class="collection-title"><img src="/static/title-my-flock-v2.webp" alt="My Flock" style="height:30px;width:auto;display:block;"></div>
    </div>
    <div class="flock-stats" id="flockStats">Loading…</div>
    <div class="flock-bar" id="flockBar">
      <div class="flock-seg" id="flockSeg">
        <button data-view="birds">Birds</button>
        <button data-view="history">History</button>
      </div>
      <div class="flock-search" id="flockSearchWrap">
        ${SEARCH_ICON}
        <input id="flockSearch" type="search" autocomplete="off" placeholder="Search my flock"
               aria-label="Search my flock">
        <button class="flock-clear" id="flockClear" aria-label="Clear search">×</button>
      </div>
      <div class="flock-ctls">
        <button class="flock-compact-title" id="flockCompactTitle">My Flock</button>
        <button class="flock-searchbtn" id="flockSearchBtn" aria-label="Search my flock">${SEARCH_ICON}</button>
        <button class="flock-ctl" id="flockSortBtn"><span class="flock-ctl-label"></span> ▾</button>
        <button class="flock-ctl" id="flockFoldBtn"><span class="flock-ctl-label"></span></button>
        <button class="flock-ctl" id="flockFilterBtn"><span class="flock-ctl-label">Filter</span></button>
        <span class="flock-spacer"></span>
        <button class="flock-density" id="flockDensityBtn"></button>
      </div>
    </div>
    <div class="collection-grid" id="collectionGrid"></div>
  `;

  const search = document.getElementById('flockSearch');
  search.value = flockQuery;
  search.oninput = () => { flockQuery = search.value; paintFlock(); };
  document.getElementById('flockClear').onclick = () => {
    flockQuery = ''; search.value = ''; search.focus(); paintFlock();
  };
  document.getElementById('flockSeg').querySelectorAll('button').forEach(b => {
    b.onclick = () => { flockView = b.dataset.view; paintFlock(); };
  });
  document.getElementById('flockSearchBtn').onclick = () => {
    const bar = document.getElementById('flockBar');
    bar.classList.toggle('searching');
    document.getElementById('flockSearchBtn').classList.toggle('on', bar.classList.contains('searching'));
    if (bar.classList.contains('searching')) document.getElementById('flockSearch').focus();
  };
  document.getElementById('flockSortBtn').onclick = openSortSheet;
  document.getElementById('flockFoldBtn').onclick = toggleAllHistoryDays;
  document.getElementById('flockFilterBtn').onclick = openFilterSheet;
  document.getElementById('flockDensityBtn').onclick = () => {
    flockDensity = flockDensity === 'large' ? 'compact' : 'large';
    remember('flockDensity', flockDensity);
    paintFlock();
  };
  // Tapping the collapsed title goes back to the top, so the header you just
  // scrolled past is one tap away rather than a long swipe.
  document.getElementById('flockCompactTitle').onclick = () =>
    scroller().scrollTo({ top: 0, behavior: reducedMotion() ? 'auto' : 'smooth' });

  watchFlockBar();
  loadCollection();
  markSeen('collection');
}

// The two icon buttons are a fixed 32x32 whatever the phone, so unlike the
// pills they could have been painted art. They are drawn instead: at 15px a
// painted magnifier turns to mush, where strokes stay crisp at any density
// and pick up the button's own colour for free. Weight is matched to the
// chunky rounded forms the rest of the app uses rather than to a thin
// system-icon set.
const SEARCH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="10.2" cy="10.2" r="6.3" stroke-width="3.2"/>
  <path d="M15.1 15.1 L20.4 20.4" stroke-width="3.8"/>
  <path d="M7.4 8.2 A4 4 0 0 1 10.6 6.3" stroke-width="1.6"
        stroke="rgba(255,255,255,0.45)"/>
</svg>`;

// Two little card grids rather than bars: the button shows the layout you
// would get by pressing it, so three-up while you are in large and two-up
// while you are in compact.
const DENSITY_ICON = {
  compact: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <rect x="1"  y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="9"  y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="17" y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="1"  y="13"  width="6" height="7.5" rx="2"/>
    <rect x="9"  y="13"  width="6" height="7.5" rx="2"/>
    <rect x="17" y="13"  width="6" height="7.5" rx="2"/>
  </svg>`,
  large: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <rect x="1.5"  y="2.5" width="9" height="9" rx="2.6"/>
    <rect x="13.5" y="2.5" width="9" height="9" rx="2.6"/>
    <rect x="1.5"  y="13"  width="9" height="9" rx="2.6"/>
    <rect x="13.5" y="13"  width="9" height="9" rx="2.6"/>
  </svg>`,
};

// A sentinel above the bar tells us when the bar has reached the top, which
// is cheaper and far steadier than reading scrollTop on every scroll event.
function watchFlockBar() {
  const bar = document.getElementById('flockBar');
  if (!bar || !window.IntersectionObserver) return;
  // In the flow, directly above the bar, taking no room (the -1px margin
  // cancels its 1px). It used to be position:absolute, but an absolute child
  // of a flex column sits at the top of the column, not where it was put, so
  // the bar collapsed while it was still well down the screen.
  const mark = document.createElement('div');
  mark.style.cssText = 'height:1px;margin-bottom:-1px;width:1px;flex:0 0 auto;';
  bar.parentNode.insertBefore(mark, bar);
  // root is the pane, not the viewport. An IntersectionObserver left on its
  // default root watches the window, and the window no longer scrolls - the
  // sentinel would never cross anything and the bar would never stick. This
  // is the same trap as the overflow-x:hidden one noted on body.
  new IntersectionObserver(([e]) => {
    bar.classList.toggle('stuck', !e.isIntersecting);
    setSortLabel();
    // Collapsing on top of a live search would hide the text you typed, so
    // the field stays unfolded while there is anything in it.
    if (flockQuery) bar.classList.add('searching');
  }, { threshold: 0, root: scroller() }).observe(mark);
}

// --- the pipeline ----------------------------------------------------------
// Search, then filters, then sort, in that order and always all three: a new
// sort must not drop the search, and a new search must not drop the filters.
function matchesQuery(s) {
  const q = flockQuery.trim().toLowerCase();
  if (!q) return true;
  // Either name finds it: "robin" and "european" both still work.
  return s.common_name.toLowerCase().includes(q) ||
         birdName(s.common_name).toLowerCase().includes(q) ||
         (s.scientific_name || '').toLowerCase().includes(q);
}

function matchesFilters(s) {
  return FLOCK_FACETS.every(f => {
    const want = flockFilters[f.id];
    if (!want || !want.length) return true;
    return f.of(s).some(v => want.includes(v));   // within a facet, any of them
  });
}

function activeFilterCount() {
  return FLOCK_FACETS.reduce((n, f) => n + ((flockFilters[f.id] || []).length ? 1 : 0), 0);
}

function visibleSightings() {
  return allSightingsRaw.filter(s => matchesQuery(s) && matchesFilters(s));
}

// A species survives if any one of its detections does - filtering by
// "Woodland in October" should keep the bird you heard in a wood in October,
// not drop it because you also heard it in a garden in May.
function visibleBirds() {
  const kept = new Set(visibleSightings().map(s => s.common_name));
  const birds = collectionBirds.filter(b => kept.has(b.common_name));
  const rule = FLOCK_SORTS.find(r => r.id === flockSort) || FLOCK_SORTS[0];
  const out = [...birds].sort((a, b) => {
    const x = rule.get(a), y = rule.get(b);
    if (x < y) return -1;
    if (x > y) return 1;
    return birdName(a.common_name).localeCompare(birdName(b.common_name));   // steady tie-break
  });
  return rule.desc ? out.reverse() : out;
}

// --- painting --------------------------------------------------------------
function paintFlock() {
  const bar = document.getElementById('flockBar');
  if (!bar) return;
  const sortRule = FLOCK_SORTS.find(r => r.id === flockSort) || FLOCK_SORTS[0];
  const filters = activeFilterCount();

  document.getElementById('flockSearchWrap')
    .classList.toggle('has-text', !!flockQuery);
  document.getElementById('flockSeg').querySelectorAll('button')
    .forEach(b => b.classList.toggle('on', b.dataset.view === flockView));

  const history = flockView === 'history';
  const sortBtn = document.getElementById('flockSortBtn');
  setSortLabel();
  sortBtn.style.display = history ? 'none' : '';
  const foldBtn = document.getElementById('flockFoldBtn');
  foldBtn.style.display = history ? '' : 'none';

  const filterBtn = document.getElementById('flockFilterBtn');
  filterBtn.querySelector('.flock-ctl-label').textContent =
    filters ? `Filter (${filters})` : 'Filter';
  filterBtn.classList.toggle('on', filters > 0);

  const d = document.getElementById('flockDensityBtn');
  d.style.display = history ? 'none' : '';
  d.innerHTML = flockDensity === 'large' ? DENSITY_ICON.compact : DENSITY_ICON.large;
  d.setAttribute('aria-label', flockDensity === 'large' ? 'Show smaller cards' : 'Show bigger cards');

  paintFlockStats();
  if (history) { paintHistory(); setFoldLabel(); } else paintBirds();
}

function setFoldLabel() {
  const btn = document.getElementById('flockFoldBtn');
  if (!btn) return;
  const groups = document.querySelectorAll('.hist-group').length;
  btn.style.display = groups ? '' : 'none';
  btn.querySelector('.flock-ctl-label').textContent =
    anyHistoryDayOpen() ? 'Collapse all' : 'Expand all';
}

function setSortLabel() {
  const btn = document.getElementById('flockSortBtn');
  const bar = document.getElementById('flockBar');
  if (!btn || !bar) return;
  const rule = FLOCK_SORTS.find(r => r.id === flockSort) || FLOCK_SORTS[0];
  btn.querySelector('.flock-ctl-label').textContent =
    bar.classList.contains('stuck') ? rule.short : 'Sort: ' + rule.label;
}

// "31 birds · heard 61 times" - a child's words for species and detections.
function flockCountWords(birds, heard) {
  return `<b>${birds}</b> bird${birds === 1 ? '' : 's'} · heard <b>${heard}</b> time${heard === 1 ? '' : 's'}`;
}

function paintFlockStats() {
  const el = document.getElementById('flockStats');
  const compact = document.getElementById('flockCompactTitle');
  if (!el) return;
  const species = collectionBirds.length;
  const shown = flockView === 'history' ? visibleSightings().length : visibleBirds().length;
  const narrowed = flockQuery.trim() || activeFilterCount();

  if (flockView === 'history') {
    el.innerHTML = narrowed
      ? `<b>${shown}</b> of ${allSightingsRaw.length} times heard`
      : flockCountWords(species, allSightingsRaw.length);
  } else {
    el.innerHTML = narrowed
      ? `<b>${shown}</b> of ${species} birds`
      : flockCountWords(species, allSightingsRaw.length);
  }
  if (compact) compact.textContent = `My Flock · ${narrowed ? shown : species}`;
}

function flockEmpty(html) {
  const grid = document.getElementById('collectionGrid');
  if (grid) grid.innerHTML = `<div class="collection-empty" style="grid-column:1/-1;">${html}</div>`;
}

function paintBirds() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.className = 'collection-grid' + (flockDensity === 'large' ? ' large' : '');

  if (!collectionBirds.length) {
    flockEmpty(`<b>No birds yet!</b>Tap the big button on Home and listen for a
                bird. Every one Warble hears lands here.`);
    return;
  }
  const birds = visibleBirds();
  if (!birds.length) {
    if (flockQuery.trim()) {
      flockEmpty(`<b>No matching birds in your flock.</b>Nothing matches
                  “${escapeFlock(flockQuery.trim())}”.`);
    } else {
      flockEmpty(`<b>Nothing matches those filters.</b>None of your birds fit
        what you picked.<button class="flock-ctl" id="flockResetEmpty">Reset filters</button>`);
      const btn = document.getElementById('flockResetEmpty');
      if (btn) btn.onclick = () => { flockFilters = {}; paintFlock(); };
    }
    return;
  }
  shuffleCollectionTo(birds);
}

function paintHistory() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.className = '';           // a list, not a grid
  grid.style.width = '100%';

  if (!allSightingsRaw.length) {
    flockEmpty(`<b>Nothing heard yet.</b>Every bird Warble picks up will show
                up here, newest first.`);
    return;
  }
  const rows = visibleSightings();   // already newest-first from the backend
  if (!rows.length) {
    flockEmpty(flockQuery.trim()
      ? `<b>No matching birds in your flock.</b>Nothing matches “${escapeFlock(flockQuery.trim())}”.`
      : `<b>Nothing matches those filters.</b>Try fewer of them.`);
    return;
  }

  // Group first, then render, so each day knows its own count before its
  // header is written.
  const days = [];
  for (const s of rows) {
    const when = new Date(s.created_at);
    // Keyed by the actual date, not the label: "Today" becomes "Yesterday"
    // tomorrow, and a day left folded should stay folded under its new name.
    const key = when.getFullYear() + '-' + (when.getMonth() + 1) + '-' + when.getDate();
    if (!days.length || days[days.length - 1].key !== key) {
      days.push({ key, label: dayLabel(when), rows: [] });
    }
    days[days.length - 1].rows.push({ s, when });
  }

  grid.innerHTML = days.map(d => {
    const shut = dayIsShut(d.key, days.indexOf(d));
    const body = d.rows.map(({ s, when }) => {
      // Only real metadata: a sighting with no named location says nothing
      // rather than "Unknown".
      const band = CONFIDENCE_BANDS.find(b => b.test(s.confidence));
      const meta = [s.location_name, band && band.label].filter(Boolean).join(' · ');
      return `
        <div class="hist-row woodframe" data-name="${escapeFlock(s.common_name)}">
          <div class="hist-time">${when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
          ${s.image_url ? `<img ${birdImg(s.image_url, 96)} alt="">` : '<div class="hist-thumb"></div>'}
          <div class="hist-text">
            <div class="hist-name">${birdName(s.common_name)}</div>
            ${meta ? `<div class="hist-meta">${meta}</div>` : ''}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="hist-group ${shut ? 'shut' : ''}" data-day="${d.key}">
        <button class="hist-day" aria-expanded="${!shut}">
          <span>${d.label}</span>
          <span class="hist-day-count">${d.rows.length}</span>
          ${CHEVRON_ICON}
        </button>
        <div class="hist-body">${body}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.hist-group').forEach(group => {
    const body = group.querySelector('.hist-body');
    // Folded groups start at zero; open ones are left with no max-height at
    // all, so a group can grow later without being clipped by a stale number.
    body.style.maxHeight = group.classList.contains('shut') ? '0px' : '';
    group.querySelector('.hist-day').onclick = () => toggleHistoryDay(group);
  });
  grid.querySelectorAll('.hist-row').forEach(el => {
    el.onclick = () => renderBirdDetail(el.dataset.name);
  });
}

const CHEVRON_ICON = `<svg class="hist-chev" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true"><path d="M5 9 L12 16 L19 9"/></svg>`;

// max-height rather than a class, because the height is only knowable once
// the rows are on the page - and it has to be cleared again afterwards so an
// open group is not capped at whatever it measured.
function toggleHistoryDay(group) {
  const body = group.querySelector('.hist-body');
  const key = group.dataset.day;
  const opening = group.classList.contains('shut');

  if (reducedMotion()) {
    group.classList.toggle('shut', !opening);
    body.style.maxHeight = opening ? '' : '0px';
  } else if (opening) {
    group.classList.remove('shut');
    body.style.maxHeight = body.scrollHeight + 'px';
    body.addEventListener('transitionend', function done(e) {
      if (e.propertyName !== 'max-height') return;
      body.style.maxHeight = '';
      body.removeEventListener('transitionend', done);
    });
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';   // pin it, then collapse
    requestAnimationFrame(() => {
      group.classList.add('shut');
      body.style.maxHeight = '0px';
    });
  }

  flockDayChoice.set(key, !opening);
  group.querySelector('.hist-day').setAttribute('aria-expanded', String(opening));
  setFoldLabel();
}

// Only the newest day starts open. A long history is mostly days you are not
// looking for, and the one you want when you open the screen is today's.
function dayIsShut(key, index) {
  return flockDayChoice.has(key) ? flockDayChoice.get(key) : index !== 0;
}

// Which way the Collapse/Expand all button should go: if anything at all is
// open, the useful action is to shut it.
function historyDayKeys() {
  return [...document.querySelectorAll('.hist-group')].map(g => g.dataset.day);
}

// Reads the choices, not the classes. Collapsing a day adds its class inside
// a requestAnimationFrame so the height has something to animate from, so for
// one frame the DOM still says open - long enough for the button to label
// itself "Collapse all" when nothing is left to collapse.
function anyHistoryDayOpen() {
  return [...document.querySelectorAll('.hist-group')]
    .some((g, i) => !dayIsShut(g.dataset.day, i));
}

function toggleAllHistoryDays() {
  const shutThem = anyHistoryDayOpen();
  historyDayKeys().forEach(k => flockDayChoice.set(k, shutThem));
  paintFlock();
  // Collapsing throws away most of the page's height. Without this you are
  // left wherever your old scroll position happens to land, which is usually
  // the bottom of a now very short list.
  if (shutThem) {
    const grid = document.getElementById('collectionGrid');
    const bar = document.getElementById('flockBar');
    if (grid && bar) {
      const pane = scroller();
      const top = pane.scrollTop + grid.getBoundingClientRect().top
                  - pane.getBoundingClientRect().top - bar.offsetHeight - 6;
      pane.scrollTo({ top: Math.max(0, top), behavior: reducedMotion() ? 'auto' : 'smooth' });
    }
  }
}

function dayLabel(d) {
  const midnight = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((midnight(new Date()) - midnight(d)) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
}

// --- Bird photographs ------------------------------------------------------
// Wikimedia serves any width of the same file: a thumbnail URL carries its
// own width in the filename, so asking for a different size is a rewrite of
// the URL, not another request to the API. What the backend stores is
// whatever Wikipedia's summary endpoint handed over, which is 320px wide -
// soft on a detail photo shown at 358 CSS px on a 3x screen. So every place
// that shows a bird asks for the size it actually draws at.
//
// It only ever asks for MORE. A surface smaller than 320px keeps the stored
// URL rather than fetching a tidier little copy of the same bird: the saving
// is a few KB and the cost is a second file, where as it stands the card
// grid and the history thumbnails all share one already-cached image.
//
// Only Wikimedia thumbnails are touched. A child's own photo is a data URL
// and an original (rather than a thumbnail) has no width in its name, so
// both fall straight through.
function birdPhoto(url, width) {
  if (!url || url.indexOf('upload.wikimedia.org') < 0) return url;
  const cut = url.lastIndexOf('/');
  if (cut < 0) return url;
  // 320px-Foo.jpg, and the odd lossy-page1-320px-Foo.tif.jpg
  const m = url.slice(cut + 1).match(/^(.*?)(\d+)px-(.+)$/);
  if (!m || +m[2] >= width) return url;
  return url.slice(0, cut + 1) + m[1] + width + 'px-' + m[3];
}

// Wikimedia will not upscale past a file's real size, so a bird whose source
// photo is smaller than we asked for comes back as an error. The original URL
// rides along in data-fallback and is swapped back in once - better a
// slightly soft photo than a broken one. error does not bubble, hence the
// capture phase, and one listener covers every image in the app.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.dataset.fallback) return;
  const back = img.dataset.fallback;
  delete img.dataset.fallback;
  img.src = back;
}, true);

// src plus, where the URL was rewritten, the original to fall back to.
function birdImg(url, width) {
  const up = birdPhoto(url, width);
  return up === url
    ? `src="${escapeFlock(url)}"`
    : `src="${escapeFlock(up)}" data-fallback="${escapeFlock(url)}"`;
}

function escapeFlock(t) {
  return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// --- the sheets ------------------------------------------------------------
function openSheet(title, body, onClose) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet"><div class="sheet-grip"></div>
    <div class="sheet-title">${title}</div>${body}</div>`;
  const close = () => { wrap.remove(); if (onClose) onClose(); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
  document.body.appendChild(wrap);
  return { wrap, close };
}

function openSortSheet() {
  if (flockView === 'history') return;
  const body = FLOCK_SORTS.map(r => `
    <button class="sheet-opt ${r.id === flockSort ? 'on' : ''}" data-sort="${r.id}">
      ${r.label}${r.id === flockSort ? `<span class="tick">${PAINTED_TICK}</span>` : ''}
    </button>`).join('');
  const sheet = openSheet('Sort your flock', body);
  sheet.wrap.querySelectorAll('[data-sort]').forEach(b => {
    b.onclick = () => {
      flockSort = b.dataset.sort;
      remember('flockSort', flockSort);
      sheet.close();
      paintFlock();
    };
  });
}

// Filter options come out of the collection itself, so you are never offered
// a month you have never been out in or a place you have never recorded.
function flockFacetValues(facet) {
  const counts = new Map();
  for (const s of allSightingsRaw) {
    for (const v of facet.of(s)) counts.set(v, (counts.get(v) || 0) + 1);
  }
  const vals = [...counts.keys()];
  vals.sort(facet.order ? (a, b) => facet.order(a) - facet.order(b)
                        : (a, b) => a.localeCompare(b));
  return vals;
}

function openFilterSheet() {
  const before = JSON.stringify(flockFilters);
  const groups = FLOCK_FACETS.map(f => {
    const vals = flockFacetValues(f);
    if (vals.length < 2) return '';      // nothing to choose between
    return `<div class="sheet-group">${f.label}</div>
      <div class="sheet-chips">${vals.map(v => `
        <button class="sheet-chip ${(flockFilters[f.id] || []).includes(v) ? 'on' : ''}"
                data-facet="${f.id}" data-value="${escapeFlock(v)}">${escapeFlock(v)}</button>`).join('')}
      </div>`;
  }).join('');

  const body = (groups || `<div style="color:var(--ink-soft);font-size:13px;">
      There is not enough in your flock to filter yet — hear a few more birds.</div>`) +
    `<div class="sheet-actions">
       <button class="sheet-reset" id="flockReset">Reset</button>
       <button class="sheet-done" id="flockDone"></button>
     </div>`;

  const sheet = openSheet('Filter your flock', body, () => paintFlock());

  const refresh = () => {
    sheet.wrap.querySelectorAll('[data-facet]').forEach(c => {
      c.classList.toggle('on', (flockFilters[c.dataset.facet] || []).includes(c.dataset.value));
    });
    const n = flockView === 'history' ? visibleSightings().length : visibleBirds().length;
    sheet.wrap.querySelector('#flockDone').textContent =
      flockView === 'history' ? `Show ${n} detection${n === 1 ? '' : 's'}`
                              : `Show ${n} species`;
  };

  sheet.wrap.querySelectorAll('[data-facet]').forEach(c => {
    c.onclick = () => {
      const { facet, value } = c.dataset;
      const list = flockFilters[facet] || [];
      flockFilters[facet] = list.includes(value)
        ? list.filter(v => v !== value) : [...list, value];
      refresh();
    };
  });
  sheet.wrap.querySelector('#flockReset').onclick = () => { flockFilters = {}; refresh(); };
  sheet.wrap.querySelector('#flockDone').onclick = sheet.close;
  refresh();
  if (before !== JSON.stringify(flockFilters)) paintFlock();
}

// --- cards -----------------------------------------------------------------
// No pack dot. My Flock treats every bird alike - which pack it came from is
// the collector packs' business, and the marker was leaving a hole in the
// corner of the photograph.
function collectionCardHtml(bird) {
  return `
    <div class="collection-item woodframe"
         data-name="${escapeFlock(bird.common_name)}" data-key="${escapeFlock(bird.key || bird.common_name)}">
      ${bird.image_url ? `<img ${birdImg(bird.image_url, flockDensity === 'large' ? 400 : 260)} alt="">` : '<div class="ci-blank"></div>'}
      <div class="ci-name">${birdName(bird.common_name)}</div>
    </div>`;
}

function bindCollectionCards() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.querySelectorAll('.collection-item').forEach(el => {
    el.onclick = () => renderBirdDetail(el.dataset.name);
  });
}

// FLIP: measure where every card is now, re-render in the new order, then
// animate each from its old position to its new one. Doing it this way means
// the cards genuinely slide between positions rather than the grid snapping.
// Cards that were not there before (a search being cleared) simply appear.
function shuffleCollectionTo(sorted) {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;

  const before = new Map();
  grid.querySelectorAll('.collection-item').forEach(el => {
    before.set(el.dataset.key, el.getBoundingClientRect());
  });

  grid.innerHTML = sorted.map(collectionCardHtml).join('');
  bindCollectionCards();
  if (reducedMotion()) return;

  grid.querySelectorAll('.collection-item').forEach((el, i) => {
    const old = before.get(el.dataset.key);
    if (!old) return;
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left;
    const dy = old.top - now.top;
    if (!dx && !dy) return;
    // Start it back where it was, then let it travel to its real place
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.transition = 'none';
    requestAnimationFrame(() => {
      el.style.transition = `transform .5s cubic-bezier(.34,1.1,.64,1) ${Math.min(i * 12, 180)}ms`;
      el.style.transform = '';
    });
  });
}

async function loadCollection() {
  try {
    const res = await fetch('/sightings');
    const data = await res.json();
    allSightingsRaw = data.sightings || [];

    // The backend logs every individual detection - collapse that down to one
    // entry per species for the Birds view, keeping the most recent (the list
    // arrives newest-first) but remembering when it was FIRST found, when it
    // was LAST heard and how many times, which is what the sorts run on.
    const seen = new Map();
    for (const s of allSightingsRaw) {
      const key = s.common_name;
      if (!seen.has(key)) {
        seen.set(key, { ...s, key, first_found: s.created_at, last_found: s.created_at, times_heard: 1 });
      } else {
        // Still newer-to-older, so each later row is an earlier sighting
        const b = seen.get(key);
        b.first_found = s.created_at;
        b.times_heard++;
      }
    }
    collectionBirds = [...seen.values()];
    paintFlock();
    showTutorial('collection', 300);
  } catch (e) {
    const stats = document.getElementById('flockStats');
    if (stats) stats.textContent = '';
    flockEmpty(`Couldn't load your collection right now.`);
  }
}

function renderBirdDetail(commonName, onBack) {

  const matches = allSightingsRaw.filter(s => s.common_name === commonName);
  if (matches.length === 0) return;

  const latest = matches[0]; // list arrives newest-first

  stage.innerHTML = `
    <div class="woodframe detail-wood" data-bird-detail>
    <div class="detail-card bird-card">
      <div class="detail-photo-wrap">
        <div class="detail-photo-strip" id="detailPhotoStrip">
          ${latest.image_url ? `<img class="detail-photo" ${birdImg(latest.image_url, 800)}>` : `<div class="detail-photo"></div>`}
        </div>
        <div class="detail-photo-dots" id="detailPhotoDots"></div>
        <div class="photo-actions">
          ${latest.call_url ? `<button class="photo-icon-btn play-call-btn-icon" data-call-url="${latest.call_url}" aria-label="Hear its call"><img src="/static/btn-play-v1.webp" alt=""></button>` : ''}
          <button class="photo-icon-btn" id="placesBtn" aria-label="Where you've heard it"><img src="/static/btn-pin-v1.webp" alt=""></button>
          <button class="photo-icon-btn" id="shareBirdBtn" aria-label="Share this bird"><img src="/static/btn-share-v1.webp" alt=""></button>
          <label class="add-photo-btn" for="birdPhotoInput" aria-label="Add a photo">+</label>
        </div>
        <input type="file" id="birdPhotoInput" accept="image/*" style="display:none">
      </div>
      <div class="detail-body">
        <div class="detail-name">${birdName(latest.common_name)}</div>
        ${currentProfile.show_scientific_names !== false ? `<div class="detail-sci">${latest.scientific_name}</div>` : ''}
        <div class="detail-pack" id="detailPack">
          ${conservationDisc(latest.bird)}
          ${migrationDisc(latest.bird)}
          <button class="heard-disc ${matches.length > 99 ? 'long' : ''}" id="heardDisc"
                  aria-label="Heard ${matches.length === 1 ? 'once' : `${matches.length} times`}">${matches.length}</button>
        </div>
        ${CONSERVATION[latest.bird?.conservation_status]
          ? `<div class="badge-note ${CONSERVATION[latest.bird.conservation_status].cls}" id="statusNote"><div><p>${CONSERVATION_INTRO} <b>${CONSERVATION[latest.bird.conservation_status].note}</b></p></div></div>` : ''}
        ${latest.bird?.migration
          ? `<div class="badge-note migrate-note" id="migrateNote"><div><p>${migrationLine(birdName(latest.common_name), latest.bird.migration)}</p></div></div>` : ''}
        <div class="badge-note pack-note" id="packNote"><div><p></p></div></div>
        <div class="badge-note heard-note" id="heardNote"><div><p><button class="pack-note-go" id="heardNoteGo">
          ${heardLine(matches)}<span aria-hidden="true"> ${icon('forward')}</span></button></p></div></div>
        ${latest.bird?.about ? `<div class="detail-about">${latest.bird.about}</div>` : ''}
        ${(!latest.bird?.about && latest.description) ? `<div class="detail-desc">${latest.description}</div>` : ''}
        <a class="learn-more" href="${wikipediaUrl(latest.scientific_name)}" target="_blank" rel="noopener">Find out more ${icon('forward')}</a>
        ${buildCoreTiles(latest.bird)}

        <button class="remove-bird-btn" id="removeBirdBtn">Not this bird? Remove it</button>

    </div>

  `;
  document.getElementById('removeBirdBtn').onclick = async () => {
    if (!confirm(`Remove ${birdName(commonName)} from your collection?\n\nUse this if it was heard wrong. Your feathers are kept.`)) return;
    try {
      await fetch(`/species/${encodeURIComponent(commonName)}/delete`, { method: 'POST' });
      renderCollection();
    } catch (e) { alert("Couldn't remove that bird right now."); }
  };
  const playBtn = stage.querySelector('.play-call-btn-icon');

  document.getElementById('heardNoteGo').onclick = () => document.getElementById('placesBtn').click();
