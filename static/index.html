function renderDone() {
  // Server total, not a sum of the birds - bonuses are added server-side.
  const total = sessionFeatherTotal || sessionResults.reduce((sum, b) => sum + b.feathers, 0);
  const bonusRows = sessionBonuses.map(b => `
    <div class="bonus-row"><span>${b.label}</span><span class="bonus-feathers">+${b.feathers}</span></div>
  `).join('');

  // Summary by tier, not by name - the birds have had their moment on the cards.
  const tierCounts = {};
  // Untiered birds have no chip - only pack birds carry a tier now.
  sessionResults.forEach(b => { if (b.tier) tierCounts[b.tier] = (tierCounts[b.tier] || 0) + 1; });
  const newCount = sessionResults.filter(b => !b.is_duplicate).length;
  const tierChips = ['Rare', 'Visitor', 'Common']
    .filter(t => tierCounts[t])
    .map(t => `<span class="summary-chip" style="--tier-color:${TIER_COLORS[t] || 'var(--sage)'}">${tierCounts[t]} ${t}</span>`)
    .join('');
  const n = sessionResults.length;

  const trophyBanners = newlyEarnedTrophies.map(t => `
    <div class="trophy-banner done-trophy">
      <div class="trophy-banner-title">\u{1F3C6} Trophy earned!</div>
      <div class="trophy-banner-row">
        <div class="trophy-banner-emoji">${t.emoji}</div>
        <div class="trophy-banner-text">
          <div class="trophy-banner-name">${t.name}${t.level ? ` · Level ${t.level}` : ''}</div>
          <div class="trophy-banner-citation">${t.citation}</div>
        </div>
      </div>
      <div class="trophy-banner-tap">Tap to celebrate</div>
    </div>
  `).join('');

  stage.innerHTML = `
    <div class="done-avatar">${avatarSvg(currentProfile.avatar_body, currentProfile.avatar_face, currentProfile.avatar_beak, 140, currentProfile.equipped, true)}</div>
    <div class="done-title">${pickDoneMessage(n, newCount, tierCounts)}</div>
    <div class="done-sub">You heard ${n} bird${n === 1 ? '' : 's'}</div>
    ${tierChips ? `<div class="summary-chips">${tierChips}</div>` : ''}
    ${bonusRows ? `<div class="bonus-list">${bonusRows}</div>` : ''}
    ${trophyBanners}
    <div class="done-feathers tappable" id="doneFeathers">\u{1FAB6} ${total} feathers earned</div>
    <div class="collect-hint" id="doneHint">Tap your feathers to collect them</div>
    <div id="goAgainWrap"></div>
  `;

  stage.querySelectorAll('.done-trophy').forEach(el => {
    el.onclick = () => { el.onclick = null; celebrateTrophy(el); };
  });

  const featherEl = document.getElementById('doneFeathers');
  featherEl.onclick = () => {
    featherEl.onclick = null;
    featherEl.classList.remove('tappable');
    const hint = document.getElementById('doneHint');
    if (hint) hint.textContent = '';
    flyFeathersToCounter(featherEl, total, () => {
      featherEl.style.opacity = '0.45';
      // Another go is only offered once the feathers have been collected,
      // so it isn't possible to leave the session's reward on the table.
      const wrap = document.getElementById('goAgainWrap');
      if (wrap) {
        wrap.innerHTML = `
          <div class="go-again-ask">Go again?</div>
          <button class="again-btn mic-again-btn" id="againBtn" aria-label="Go again">\u{1F399}</button>`;
        document.getElementById('againBtn').onclick = startRecording;
      }
      refreshFeathers();   // reconcile against the server once animations finish
    });
  };

  newlyEarnedTrophies = [];
  sessionBonuses = [];
}

// Well-done messages. The specific ones are checked first so a genuinely
// notable session gets a message that reflects it, rather than a generic one.
const DONE_MESSAGES = {
  rare:    ['Wow, a rare one!', 'Something special!', 'What a find!', 'That was rare!'],
  big:     ['What a haul!', 'So many birds!', 'The birds love you!', 'A brilliant warble!'],
  allNew:  ['All new birds!', 'Every one a first!', 'What a discovery!'],
  someNew: ['New bird alert!', 'One for the collection!', 'A great find!', 'Something new!'],
  one:     ['One good bird!', 'Found one!', 'Nice listening!', 'Got one!'],
  general: ['Nice warble!', 'Well done!', 'Great listening!', 'Lovely warbling!',
            'Good ears!', 'Brilliant!', 'What a listener!', 'Top warbling!'],
};

function pickDoneMessage(count, newCount, tierCounts) {
  let pool;
  if (tierCounts['Rare']) pool = DONE_MESSAGES.rare;
  else if (count >= 5) pool = DONE_MESSAGES.big;
  else if (newCount && newCount === count) pool = DONE_MESSAGES.allNew;
  else if (newCount) pool = DONE_MESSAGES.someNew;
  else if (count === 1) pool = DONE_MESSAGES.one;
  else pool = DONE_MESSAGES.general;
  return pool[Math.floor(Math.random() * pool.length)];
}

function celebrateTrophy(el) {
  el.classList.add('celebrating');
  burstSparks(el);
  setTimeout(() => {
    el.classList.remove('celebrating');
    flyElementTo(el, document.getElementById('navTrophies'));
  }, 900);
}

// A burst of stars around an element - the trophy celebration
function burstSparks(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['\u2728', '\u2B50', '\u{1F31F}'][i % 3];
    s.style.left = `${r.left + r.width / 2}px`;
    s.style.top = `${r.top + r.height / 2}px`;
    document.body.appendChild(s);
    const angle = (Math.PI * 2 * i) / 12;
    const dist = 70 + Math.random() * 50;
    requestAnimationFrame(() => {
      s.style.transition = 'transform .85s cubic-bezier(.2,.8,.3,1), opacity .85s ease';
      s.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(.4)`;
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 900);
  }
}

// Shrink an element away into one of the nav tabs
function flyElementTo(el, target) {
  if (!el) return;
  if (!target) { el.style.display = 'none'; return; }
  const from = el.getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  el.style.transition = 'transform .62s cubic-bezier(.55,0,.65,1), opacity .25s ease .38s';
  el.style.transform = `translate(${dx}px, ${dy}px) scale(.08)`;
  el.style.opacity = '0';
  target.classList.add('nav-pop');
  setTimeout(() => target.classList.remove('nav-pop'), 600);
  setTimeout(() => { el.style.display = 'none'; }, 640);
}

let currentLat = null, currentLng = null, newlyEarnedTrophies = [];
// What the device actually granted for the mic. Constraints are requests,
// not guarantees, so this is worth being able to see without a USB cable.
let lastMicSettings = null;
let currentProfile = { name: 'Explorer', avatar_id: 'robin' };
let needsLocationName = false, sessionLat = null, sessionLng = null, sessionLocationName = null;

function requestGpsPosition() {
  // Fire-and-forget — recording shouldn't wait on this. If it fails or
  // times out, currentLat/currentLng stay null and the backend falls
  // back to a default location — worth knowing that's a real fallback
  // to a fixed point, not "somewhere near you", if this keeps failing.
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      console.log(`GPS fix: ${currentLat}, ${currentLng} (accuracy: ~${Math.round(pos.coords.accuracy)}m)`);
      // GPS is fire-and-forget, so the recording screen has usually already
      // rendered by now with an empty location line - fill it in once we
      // actually know where we are. No-ops if we're not on that screen.
      loadRecordingLocation();
    },
    (err) => {
      console.log('GPS unavailable, using default location:', err.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

async function startRecording() {
  try {
    // Can now be reached directly from the Done / No-birds screens via the
    // mic button, not just from Home - so make sure the Home tab reads as
    // active rather than leaving whatever tab was highlighted before.
    setActiveTab('home');
    requestGpsPosition();
    // { audio: true } accepts the browser's voice-call defaults: noise
    // suppression, echo cancellation and automatic gain control all on. Those
    // are tuned for speech and actively strip sustained non-speech sound -
    // which is exactly what birdsong is. Quiet or distant birds get filtered
    // out before BirdNET ever sees them. All three are turned off here to get
    // the rawest audio the device will give us.
    //
    // echoCancellation:false matters more than it looks: on Chrome, AGC can't
    // be disabled by the autoGainControl constraint alone - echo cancellation
    // has to go too, or gain control stays on regardless.
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        noiseSuppression: false,
        echoCancellation: false,
        autoGainControl: false,
        channelCount: 1,
      },
    });

    // Log what the device actually granted - constraints are requests, not
    // guarantees, and some devices silently ignore them.
    const settings = stream.getAudioTracks()[0]?.getSettings?.() || {};
    lastMicSettings = settings;
    try { localStorage.setItem('warbleMicSettings', JSON.stringify(settings)); } catch (e) {}
    console.log('Mic settings:', {
      noiseSuppression: settings.noiseSuppression,
      echoCancellation: settings.echoCancellation,
      autoGainControl: settings.autoGainControl,
      sampleRate: settings.sampleRate,
    });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    recordSeconds = 0;
    renderRecording();
    startEqualizer(stream);
    startLivePreviewLoop(stream);
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  } catch (e) {
    renderError("Couldn't access your microphone. Check your browser's permission settings.");
  }
}

// --- Live audio-reactive equalizer, driven by real microphone volume ---
// Also drives a genuine "a bird was heard!" flash during recording -
// backed by real, filtered identification (the same NBN Atlas
// plausibility check /analyze-session uses), not just raw volume, so
// a live flash reliably means something that should also show up in
// the final result. Species names still aren't shown live - only
// that a real one was heard - keeping the reveal for after Stop.
let eqAudioContext = null, eqAnalyser = null, eqAnimationId = null;

const TREE_CX = 80, TREE_CY = 72;
const LEAF_COLORS = ['#F2C94C', '#5FB88F', '#7EC8A4', '#3F7C5C'];
let treeShards = [], fallingLeaves = [], activeRustle = null, lastFrameTime = 0;
// Tracks how loud things have been recently, so the quiver scales to the
// actual environment. Without this the design's numbers - tuned in a demo
// against a synthetic signal - produce well under 1 degree of rotation from
// a real phone mic in a quiet garden, which is invisible.
let binCeiling = 40;
// Multiplies the design's per-facet amplitudes (3.4-6.1 deg). At 1.0 the
// quiver tops out around 2-4 deg even when loud; this brings a normal
// sound up to roughly the 6-10 deg the old placeholder tree used, which
// is the level that actually reads on a phone screen.
const QUIVER_GAIN = 2.4;

function startEqualizer(stream) {
  eqAudioContext = new (window.AudioContext || window.webkitAudioContext)();
  eqAnalyser = eqAudioContext.createAnalyser();
  eqAnalyser.fftSize = 64;
  eqAudioContext.createMediaStreamSource(stream).connect(eqAnalyser);
  const bins = new Uint8Array(eqAnalyser.frequencyBinCount);

  // Each canopy facet carries its own pivot, frequency bin and amplitude,
  // baked into the SVG by the design. Cache them once rather than re-reading
  // attributes 59 times every frame.
  treeShards = Array.from(document.querySelectorAll('[data-shard]')).map((el, i) => {
    const p = el.getAttribute('data-pivot').split(',').map(Number);
    const nx = p[0] - TREE_CX, ny = p[1] - TREE_CY;
    const len = Math.hypot(nx, ny) || 1;
    return {
      el, px: p[0], py: p[1], nx: nx / len, ny: ny / len,
      bin: +el.getAttribute('data-bin'), amp: +el.getAttribute('data-amp'),
      phase: i * 0.73, lvl: 0,
    };
  });
  fallingLeaves = [];
  activeRustle = null;
  lastFrameTime = 0;
  binCeiling = 40;   // reset per recording, don't carry a loud session into a quiet one

  function draw(now) {
    if (!eqAnalyser) return;
    const t = now / 1000;
    const dt = Math.min(0.05, (now - (lastFrameTime || now)) / 1000);
    lastFrameTime = now;
    eqAnalyser.getByteFrequencyData(bins);

    // Adapt to the current environment: track the loudest bin, rising fast and
    // decaying slowly, and scale against that. A quiet garden and a noisy
    // street both produce visible movement, rather than the tree only reacting
    // to shouting. The floor stops near-silence being amplified into noise.
    let frameMax = 0;
    for (let i = 0; i < bins.length; i++) if (bins[i] > frameMax) frameMax = bins[i];
    binCeiling += (frameMax - binCeiling) * (frameMax > binCeiling ? 0.25 : 0.015);
    const ceiling = Math.max(binCeiling, 26);

    const breath = 0.9;               // gentle idle motion so it's never fully dead
    const r = activeRustle;
    const rAge = r ? t - r.t : 999;
    if (r && rAge > 2.2) activeRustle = null;

    for (const s of treeShards) {
      // LEVEL 1 - quiver: proportional to this facet's own frequency band,
      // with a fast attack and slow release so it breathes rather than flickers.
      const raw = Math.pow(Math.min(1, bins[s.bin] / ceiling), 1.25);
      s.lvl += (raw - s.lvl) * (raw > s.lvl ? 0.32 : 0.07);
      let a = breath * Math.sin(t * 1.63 + s.phase) + s.lvl * s.amp * QUIVER_GAIN;
      let ox = 0, oy = 0;

      // LEVEL 2 - rustle: a wave leaving the landing point at 240px/s. Each
      // facet fires as the wave reaches it, so the tree moves in sequence and
      // has a visible direction - which is what distinguishes it from quiver.
      if (r) {
        const d = Math.hypot(s.px - r.ox, s.py - r.oy);
        const tt = rAge - d / 240;
        if (tt > 0 && tt < 1.2) {
          const fall = Math.max(0.3, 1 - d / 190);
          const dir = (s.px - r.ox) >= 0 ? 1 : -1;
          const env = Math.exp(-tt / 0.2) * Math.sin(Math.PI * 2 * 4.2 * tt);
          a += 16 * fall * dir * env;
          const push = 4 * fall * Math.exp(-tt / 0.24) * Math.sin(Math.PI * 2 * 4.2 * tt);
          ox = s.nx * push; oy = s.ny * push;
        }
      }

      s.el.setAttribute('transform',
        `rotate(${a.toFixed(2)},${s.px},${s.py}) translate(${ox.toFixed(2)},${oy.toFixed(2)}) ` +
        `translate(${s.px},${s.py}) scale(1.07) translate(${-s.px},${-s.py})`);
    }

    // Leaves shaken loose by a rustle - the "consequence" cue.
    for (let i = fallingLeaves.length - 1; i >= 0; i--) {
      const l = fallingLeaves[i];
      const age = t - l.born;
      if (age > l.life) { l.el.remove(); fallingLeaves.splice(i, 1); continue; }
      l.vy += 34 * dt;
      l.x += (l.vx + Math.sin(t * l.sway * 3 + l.ph) * 9) * dt;
      l.y += l.vy * dt;
      l.rot += l.spin * dt;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)},${l.y.toFixed(1)}) rotate(${l.rot.toFixed(0)})`);
      l.el.setAttribute('opacity', String(Math.max(0, 1 - Math.pow(age / l.life, 3))));
    }

    eqAnimationId = requestAnimationFrame(draw);
  }
  eqAnimationId = requestAnimationFrame(draw);
}

function fireTreeRustle() {
  if (!treeShards.length) return;
  // Start from an outer facet so the wave visibly travels inward across the
  // tree, as though something just landed on the edge of the canopy.
  const edge = treeShards.filter(s => Math.hypot(s.px - 80, s.py - 70) > 38);
  const pool = edge.length ? edge : treeShards;
  const s = pool[Math.floor(Math.random() * pool.length)];
  activeRustle = { t: performance.now() / 1000, ox: s.px, oy: s.py };
  spawnFallingLeaves(s.px, s.py);
}

function spawnFallingLeaves(x, y) {
  const layer = document.getElementById('leaves');
  if (!layer) return;
  for (let i = 0; i < 9; i++) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    el.setAttribute('points', '0,-3 4,0 0,3.5 -3.5,0.5');
    el.setAttribute('fill', LEAF_COLORS[i % LEAF_COLORS.length]);
    layer.appendChild(el);
    fallingLeaves.push({
      el, x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 12,
      vx: (Math.random() - 0.5) * 14, vy: -6 - Math.random() * 10,
      rot: Math.random() * 360, spin: (Math.random() - 0.5) * 260,
      sway: 1.4 + Math.random() * 2.2, ph: Math.random() * 6.3,
      born: performance.now() / 1000, life: 1.5 + Math.random() * 0.7,
    });
  }
}

// --- Live preview loop: repeatedly checks short clips against the
// same filtered /identify endpoint used elsewhere, so a live flash
// and the final result are answering the same question, not two
// separate ones that could disagree. ---
let livePreviewActive = false;

function startLivePreviewLoop(stream) {
  livePreviewActive = true;
  captureLiveChunk(stream);
}

function stopLivePreviewLoop() {
  livePreviewActive = false;
}

function captureLiveChunk(stream) {
  if (!livePreviewActive) return;
  let chunkRecorder;
  try {
    chunkRecorder = new MediaRecorder(stream);
  } catch (e) {
    return; // if this fails, live preview just doesn't run — recording itself is unaffected
  }
  const chunkParts = [];
  chunkRecorder.ondataavailable = e => chunkParts.push(e.data);
  chunkRecorder.onstop = () => {
    const blob = new Blob(chunkParts, { type: 'audio/webm' });
    checkLiveChunk(blob);
    if (livePreviewActive) captureLiveChunk(stream);
  };
  chunkRecorder.start();
  setTimeout(() => {
    if (chunkRecorder.state !== 'inactive') chunkRecorder.stop();
  }, 3500);
}

async function checkLiveChunk(blob) {
  try {
    const formData = new FormData();
    formData.append('file', blob, 'chunk.webm');
    if (currentLat !== null && currentLng !== null) {
      formData.append('lat', currentLat);
      formData.append('lng', currentLng);
    }
    const res = await fetch('/identify', { method: 'POST', body: formData });
    if (!res.ok) return;
    const data = await res.json();
    (data.detections || []).forEach(d => {
      if (!liveBadgedSpecies.has(d.common_name)) {
        liveBadgedSpecies.add(d.common_name);
        liveDetectedBirds.push({
          tier: d.tier,
          common_name: d.common_name,
          scientific_name: d.scientific_name,
          confidence: d.confidence,
        });
        renderLiveBirdStack();
        // Fire the rustle on the same frame the badge appears, so the two
        // read as one event rather than two unrelated things happening.
        fireTreeRustle();
      }
    });
  } catch (e) { /* a missed preview chunk doesn't matter, just skip it */ }
}

function stopRecording() {
  clearInterval(recordTimerInterval);
  stopEqualizer();
  stopLivePreviewLoop();
  mediaRecorder.onstop = async () => {
    renderProcessing();
    try {
      // The recording audio is no longer uploaded - identification already
      // happened live during recording. This call only enriches and saves
      // what was found, so it's a small JSON payload rather than an audio
      // upload, and returns much faster.
      const formData = new FormData();
      if (currentLat !== null && currentLng !== null) {
        formData.append('lat', currentLat);
        formData.append('lng', currentLng);
      }
      formData.append('live_detections', JSON.stringify(liveDetectedBirds));
      const res = await fetch('/analyze-session', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      sessionResults = sortForReveal(data.detections || []);
      sessionBonuses = data.bonuses || [];
      sessionFeatherTotal = data.total_feathers_this_session || 0;
      newlyEarnedTrophies = data.newly_earned_trophies || [];
      needsLocationName = data.needs_location_name || false;
      sessionLocationName = data.location_name || null;
      sessionLat = data.lat;
      sessionLng = data.lng;
      cardIndex = 0;
      renderSessionResults();
    } catch (e) {
      renderError(e.message || 'Something went wrong talking to the server.');
    }
  };
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
}

function applyTimeOfDayBackground() {
  const hour = new Date().getHours();
  let band;
  if (hour >= 5 && hour < 8) band = 'time-dawn';
  else if (hour >= 8 && hour < 17) band = 'time-day';
  else if (hour >= 17 && hour < 21) band = 'time-dusk';
  else band = 'time-night';
  document.body.classList.add(band);
}

function renderMicCheck() {

  let s = lastMicSettings;

  }
  if (!s) {
    el.innerHTML = `<div class="stat-empty">Go warbling once, then come back here to see your microphone settings.</div>`;

  // All three should read Off. If any says On, the device overrode the

  const rows = [

    ['Echo cancellation', s.echoCancellation],
    ['Auto gain control', s.autoGainControl],
  ].map(([label, on]) => `
    <div class="stat-row">
      <span class="stat-label">${label}</span>
      <span class="stat-value" style="color:${on ? '#C0392B' : 'var(--sage-dk)'}">${on ? 'On — bad' : 'Off ✓'}</span>
    </div>`).join('');
  const anyOn = [s.noiseSuppression, s.echoCancellation, s.autoGainControl].some(Boolean);
  el.innerHTML = rows + `<div class="stat-empty" style="text-align:left;padding-top:4px;">${
    anyOn
      ? "Your phone is filtering the audio, which can hide quiet birds."
      : "Your phone is giving Warble the raw audio. That's what we want."
  }</div>`;
}

// Photos are shrunk to 240px square and re-encoded as JPEG before upload.
// They're stored as a data URL in the database, so sending a multi-megabyte
// phone photo straight up would be far too heavy - this lands around 15-25KB.
function handlePhotoChosen(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 240;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      // Centre-crop to a square so it fills the circular frame without squashing
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIZE, SIZE);
      savePhoto(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => alert("Sorry, that image couldn't be read.");
    img.src = reader.result;
  };
  reader.onerror = () => alert("Sorry, that image couldn't be read.");
  reader.readAsDataURL(file);
}

const COLOR_PART_SWATCHES = { body: AVATAR_SWATCHES, face: AVATAR_SWATCHES, beak: AVATAR_SWATCHES };
let selectedColorPart = 'body';

function renderSwatchRows() {
  const toggle = document.getElementById('partToggle');
  if (toggle) {
    // Position the three buttons on an arc OUTSIDE the swatch arch (which
    // sits at 59%), each rotated to follow the curve's tangent. Face is
    // dead centre at the top (12 o'clock, no tilt); Body and Beak sit
    // either side, tilted symmetrically.
    const btnRadius = 72;                       // % of frame box - same gap above the swatches as they have from the circle
    const btnAngles = { body: -21, face: 0, beak: 21 }; // degrees from vertical
    toggle.querySelectorAll('.part-btn').forEach(btn => {
      const part = btn.dataset.part;
      const deg = btnAngles[part] ?? 0;
      const rad = (deg - 90) * Math.PI / 180;   // -90 so 0deg means straight up
      const x = 50 + btnRadius * Math.cos(rad);
      const y = 50 + btnRadius * Math.sin(rad);
      btn.style.left = `${x}%`;
      btn.style.top = `${y}%`;
      // translate(-50%,-50%) centres the button on its point; the rotation
      // matches the arc's tangent at that angle, so it follows the curve.
      btn.style.transform = `translate(-50%, -50%) rotate(${deg}deg)`;
      btn.classList.toggle('active', part === selectedColorPart);
      btn.onclick = () => { selectedColorPart = part; renderSwatchRows(); };
    });
  }

  const swatches = COLOR_PART_SWATCHES[selectedColorPart] || AVATAR_SWATCHES;
  const currentColor = currentProfile[`avatar_${selectedColorPart}`];

  const wheel = document.getElementById('colorWheel');
  if (!wheel) return;
  // Clear out any previously-placed swatches (the centre toggle buttons
  // live in their own child element, untouched by this).
  wheel.querySelectorAll('.color-swatch').forEach(el => el.remove());

  // The swatches form an arch across the TOP of the avatar frame, sitting
  // on the frame's own edge circle - so they use the avatar's existing
  // footprint instead of needing their own space beside or above it.
  // Percentage-based so it stays correct if the avatar size changes.
  const n = swatches.length;
  const archStart = Math.PI * 1.16;  // just past 9 o'clock, going over the top
  const archEnd = Math.PI * 1.84;    // to just before 3 o'clock
  swatches.forEach((hex, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const angle = archStart + (archEnd - archStart) * t;
    const x = 50 + 59 * Math.cos(angle); // % of frame box; 59% (vs the frame's own 50% edge) leaves a real gap
    const y = 50 + 59 * Math.sin(angle);
    const btn = document.createElement('button');
    btn.className = 'color-swatch';
    btn.style.background = hex;
    btn.style.borderColor = currentColor === hex ? 'var(--ink)' : '#fff';
    btn.style.left = `${x}%`;
    btn.style.top = `${y}%`;
    btn.onclick = () => {
      currentProfile[`avatar_${selectedColorPart}`] = hex;
      saveAvatarColors();
    };
    wheel.appendChild(btn);
  });
}

async function loadProfileLocations() {
  const listEl = document.getElementById('locationsList');
  if (!listEl) return;
  try {
    const res = await fetch('/locations');
    const data = await res.json();
    const locations = data.locations || [];
    if (locations.length === 0) {
      listEl.innerHTML = `<div class="collection-empty">No locations named yet</div>`;
      return;
    }
    listEl.innerHTML = locations.map(loc => `
      <div class="location-row" data-id="${loc.id}">
        <a class="location-row-name location-map-link"
           href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}#map=16/${loc.lat}/${loc.lng}"
           target="_blank" rel="noopener">📍 ${loc.name}</a>
        <span class="location-row-actions">
          <button class="location-edit-btn" data-id="${loc.id}">Edit</button>
          <button class="location-delete-btn" data-id="${loc.id}" aria-label="Delete ${loc.name}">✕</button>
        </span>
      </div>
    `).join('');
    listEl.querySelectorAll('.location-edit-btn').forEach(btn => {
      btn.onclick = () => editLocationPrompt(parseInt(btn.dataset.id, 10), listEl);
    });
    listEl.querySelectorAll('.location-delete-btn').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('.location-row');
        const name = row.querySelector('.location-row-name').textContent.replace('📍 ', '');
        if (!confirm(`Forget the name "${name}"? The place stays, it just becomes unnamed again.`)) return;
        try {
          await fetch(`/locations/${btn.dataset.id}/delete`, { method: 'POST' });
          loadProfileLocations();
        } catch (e) { /* leave the list as-is if it fails */ }
      };
    });
  } catch (e) {
    listEl.innerHTML = `<div class="collection-empty">Couldn't load locations right now.</div>`;
  }
}

function editLocationPrompt(id, listEl) {
  const row = listEl.querySelector(`.location-row[data-id="${id}"]`);
  if (!row) return;
  const currentName = row.querySelector('.location-row-name').textContent.replace('📍 ', '');
  row.innerHTML = `
    <input type="text" class="location-input" style="margin:0;flex:1;padding:8px 12px;" value="${currentName}" id="editInput${id}">
    <button class="location-edit-btn" id="saveEdit${id}">Save</button>
  `;
  document.getElementById(`saveEdit${id}`).onclick = async () => {
    const newName = document.getElementById(`editInput${id}`).value.trim();
    if (!newName) return;
    const formData = new FormData();
    formData.append('name', newName);
    try {
      await fetch(`/locations/${id}/rename`, { method: 'POST', body: formData });
    } catch (e) { /* ok to fail quietly */ }
    loadProfileLocations();
  };
}

  renderCategoryRow();

function setDressUpHint(text) {
  const hintEl = document.getElementById('dressUpHint');
  if (hintEl) hintEl.textContent = text;
}

let expandedItemId = null;

function renderCarousel() {
  const wrap = document.getElementById('carouselWrap');
  if (!wrap) return;
  // Cheapest first, so the carousel reads as a ladder - what you can afford
  // now at the front, what you're saving for further along.
  const items = accessoryCatalog
    .filter(a => a.category === selectedCategory)
    .sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name));
  if (items.length === 0) {
    wrap.innerHTML = `<div class="collection-empty">Nothing here yet</div>`;
    return;
  }
  wrap.innerHTML = items.map(a => {
    const isEquipped = currentProfile.equipped && currentProfile.equipped[a.category] === a.id;
    const canAfford = currentFeatherTotal >= a.cost;
    const isOpen = expandedItemId === a.id;
    const priceHtml = a.owned
      ? `<div class="carousel-item-price owned-label">${isEquipped ? 'Worn' : 'Owned'}</div>`
      : `<div class="carousel-item-price ${canAfford ? 'affordable' : 'unaffordable'}">🪶 ${a.cost}</div>`;

    // Only unowned items expand - an owned one just toggles on and off, so
    // there's nothing to confirm.
    const action = (isOpen && !a.owned)
      ? `<button class="item-buy-btn ${canAfford ? '' : 'cant-afford'}" data-buy="${a.id}">
           ${canAfford ? 'Buy' : `${Math.round(a.cost - currentFeatherTotal)} more`}
         </button>`
      : '';

    return `
      <div class="carousel-item ${a.owned ? '' : 'unowned'} ${isEquipped ? 'equipped' : ''} ${isOpen ? 'expanded' : ''}"
           data-id="${a.id}" data-owned="${a.owned}" data-category="${a.category}"
           data-cost="${a.cost}" data-name="${a.name}">
        <div class="item-icon-wrap"><svg viewBox="${a.tile_viewbox}" width="100%" height="100%">${a.svg}</svg></div>
        <div class="carousel-item-name">${a.name}</div>
        ${priceHtml}
        ${action}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.carousel-item').forEach(el => {
    el.onclick = (e) => {
      // The buy button has its own handler; don't let the tile's tap collapse
      // the card out from under it.
      if (e.target.closest('.item-buy-btn')) return;
      const owned = el.dataset.owned === 'true';
      if (owned) {
        handleAccessoryTap(el.dataset.id, true, el.dataset.category,
                           parseInt(el.dataset.cost, 10), el.dataset.name);
      } else {
        expandedItemId = expandedItemId === el.dataset.id ? null : el.dataset.id;
        renderCarousel();
      }
    };
  });

  wrap.querySelectorAll('.item-buy-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const el = btn.closest('.carousel-item');
      buyAccessory(el.dataset.id, el.dataset.category,
                   parseInt(el.dataset.cost, 10), el.dataset.name);
    };
  });
}

async function buyAccessory(accessoryId, category, cost, name) {
  if (currentFeatherTotal < cost) {
    setDressUpHint(`Not enough feathers yet — ${Math.round(cost - currentFeatherTotal)} more to go`);
    return;
  }
  try {
    const res = await fetch(`/accessories/${accessoryId}/purchase`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      const item = accessoryCatalog.find(a => a.id === accessoryId);
      if (item) item.owned = true;
      currentFeatherTotal = data.new_total;
      animateFeatherCount(currentFeatherTotal);
      // Bought, not worn - tap it again to put it on.
      expandedItemId = null;
      setDressUpHint(`Bought ${name} — tap it to wear it`);
      renderCarousel();
    } else {
      setDressUpHint("That didn't work — try again");
    }
  } catch (e) { /* fail quietly, nothing to update */ }
}

async function handleAccessoryTap(accessoryId, owned, category, cost, name) {
  // Only ever called for owned items now - buying goes through buyAccessory()
  // from the expanded tile's Buy button.

  // Already owned - tap toggles wearing it in its category's slot.
  if (!currentProfile.equipped) currentProfile.equipped = {};
  const currentlyWorn = currentProfile.equipped[category] === accessoryId;
  const newValue = currentlyWorn ? null : accessoryId;
  currentProfile.equipped[category] = newValue;
  setDressUpHint(currentlyWorn ? `Took off ${name}` : `Wearing ${name}`);
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  try {
    const formData = new FormData();
    formData.append('category', category);
    if (newValue) formData.append('accessory_id', newValue);
    await fetch('/accessories/equip', { method: 'POST', body: formData });
  } catch (e) { /* local state's already updated, ok if the save fails silently */ }
}

  wingman: '<path d="M-11 2 q4 -5 8 -2 l3 2" fill="none" stroke="#F5EDD6" stroke-width="2.4" stroke-linecap="round"/><path d="M11 2 q-4 -5 -8 -2 l-3 2" fill="none" stroke="#F2C94C" stroke-width="2.4" stroke-linecap="round"/><circle cx="-5" cy="-6" r="3.2" fill="#F5EDD6"/><circle cx="5" cy="-6" r="3.2" fill="#F2C94C"/><path d="M-4 6 q4 3 8 0" fill="none" stroke="#F5EDD6" stroke-width="2" stroke-linecap="round"/>',
  century: '<circle cx="0" cy="0" r="11" fill="none" stroke="#F5EDD6" stroke-width="2"/><text x="0" y="4.5" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="900" font-size="12" fill="#F5EDD6">100</text>',
};

// Little stars on the plinth showing how many of the three levels are held -
// so the carousel communicates progress at a glance, not just earned/not.
function levelPips(t) {
  const total = t.level_count || 3;
  const got = t.level || 0;
  const w = 9, gap = 3;
  const startX = 50 - ((total * w + (total - 1) * gap) / 2) + w / 2;
  return Array.from({ length: total }, (_, i) => {
    const x = startX + i * (w + gap);
    const on = i < got;
    return `<circle cx="${x}" cy="103" r="3.1" fill="${on ? '#F2C94C' : '#3D2A85'}"
            stroke="${on ? '#B8901F' : '#2D1B69'}" stroke-width="1"/>`;
  }).join('');
}

function trophySvg(trophy) {
  const earned = trophy.earned;
  const cup = earned ? '#F2C94C' : '#8E87B8';
  const cupDark = earned ? '#B8901F' : '#6F68A0';
  const emblem = TROPHY_EMBLEMS[trophy.key] || '';
  return `<svg viewBox="0 0 100 116" class="trophy-svg">
    <path d="M22 16 H78 V44 a28 28 0 0 1 -56 0 Z" fill="${cup}"/>
    <path d="M22 16 H78 V26 H22 Z" fill="${cupDark}" opacity="0.35"/>
    <path d="M22 24 h-9 a11 11 0 0 0 11 15" fill="none" stroke="${cup}" stroke-width="5"/>
    <path d="M78 24 h9 a11 11 0 0 1 -11 15" fill="none" stroke="${cup}" stroke-width="5"/>
    <rect x="44" y="70" width="12" height="14" fill="${cupDark}"/>
    <path d="M30 98 h40 l-4 -12 H34 Z" fill="${cupDark}"/>
    <rect x="24" y="98" width="52" height="10" rx="3" fill="${cup}"/>
    <g transform="translate(50,36)" ${earned ? '' : 'opacity="0.45"'}>${emblem}</g>
    ${levelPips(trophy)}
  </svg>`;
}

let trophyIndex = 0;

let allPacksRaw = [], selectedPack = 0;

async function loadCollectorPacks() {
  const el = document.getElementById('packList');
  if (!el) return;
  try {
    const res = await fetch('/collector-packs');
    const d = await res.json();
    allPacksRaw = d.packs || [];
    renderPackSelector();
    renderSelectedPack();
  } catch (e) {
    el.innerHTML = `<div class="collection-empty">Couldn't load packs right now.</div>`;
  }
}

function renderPackSelector() {
  const row = document.getElementById('packSelector');
  if (!row) return;
  row.innerHTML = allPacksRaw.map((p, i) => `
    <button class="pack-tab ${i === selectedPack ? 'active' : ''}" data-i="${i}">
      <span class="pack-tab-emoji">${p.emoji}</span>
      <span class="pack-tab-name">${p.name}</span>
      <span class="pack-tab-count">${p.cards_found}/${p.cards_total}</span>
    </button>`).join('');
  row.querySelectorAll('.pack-tab').forEach(b => {
    b.onclick = () => {
      selectedPack = +b.dataset.i;
      renderPackSelector();
      renderSelectedPack();
    };
  });
}

function renderSelectedPack() {
  const el = document.getElementById('packList');
  const p = allPacksRaw[selectedPack];
  if (!el || !p) return;

  // Fanned like a real hand. Angles are computed from the pack size rather
  // than hard-coded for five, so any pack size fans symmetrically.
  // Two rows of five rather than one fan of ten - ten cards in a single row
  // either overflow the screen or shrink to unreadable.
  const fanRow = (birds, rowOffset) => {
    const n = birds.length;
    return birds.map((b, i) => {
      const offset = i - (n - 1) / 2;
      const angle = offset * 9;
      const lift = Math.abs(offset) * 7;
      const rareMark = b.rarity === 'Rare'
        ? `<div class="fan-rare" style="--tier-color:${TIER_COLORS.Rare}">RARE</div>`
        : '';
      const face = b.photo_url
        ? `<img class="fan-photo" src="${b.photo_url}" alt="">`
        : `<div class="fan-photo empty">${b.found ? '' : '🐦'}</div>`;
      return `
        <div class="fan-card ${b.found ? 'complete tappable' : 'unfound'}"
             style="transform:rotate(${angle}deg) translateY(${lift}px); z-index:${10 - Math.abs(offset)}"
             data-name="${b.found ? b.common_name : ''}">
          ${face}
          <div class="fan-name">${b.common_name}</div>
          ${rareMark}
        </div>`;
    }).join('');
  };
  const fan = `
    <div class="fan-row">${fanRow(p.birds.slice(0, 5), 0)}</div>
    <div class="fan-row">${fanRow(p.birds.slice(5), 1)}</div>`;

  const pct = Math.round((p.cards_found / p.cards_total) * 100);
  el.innerHTML = `
    <div class="pack-blurb">${p.blurb}</div>
    ${fan}
    <div class="habitat-bar" style="max-width:280px;margin:0 auto;">
      <div class="habitat-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="pack-status">${p.complete
      ? 'Pack complete!'
      : `${p.cards_found} of ${p.cards_total} cards found`}</div>
  `;

  // Only found cards open - there's nothing to show for a bird you haven't
  // heard yet, and a dead tap is worse than an obviously inert card.
  el.querySelectorAll('.fan-card.tappable').forEach(card => {
    card.onclick = () => openBirdFromPack(card.dataset.name);
  });
}

async function openBirdFromPack(commonName) {
  if (!commonName) return;
  // Collections can be opened without ever visiting My Birds, in which case
  // the sightings cache is empty and the detail view would silently bail.
  if (!allSightingsRaw.length) {
    try {
      const res = await fetch('/sightings');
      allSightingsRaw = (await res.json()).sightings || [];
    } catch (e) { return; }
  }
  renderBirdDetail(commonName, renderHabitats);
}

async function renderHabitats() {
  setActiveTab('habitats');
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="collection-header"><div class="collection-title">Collections</div></div>
    <div class="collection-count">Ten packs of ten birds to complete</div>
    <div class="pack-selector" id="packSelector"></div>
    <div id="packList" style="width:100%;"></div>
  `;
  loadCollectorPacks();
}

async function renderTrophies() {
  setActiveTab('trophies');
  stage.classList.remove('top-aligned');
  stage.innerHTML = `
    <div class="collection-header"><div class="collection-title">Trophies</div></div>
    <div class="collection-count" id="trophyCount">Loading...</div>
    <div class="trophy-carousel" id="trophyCarousel"></div>
    <div class="trophy-caption" id="trophyCaption"></div>
  `;

  try {
    const res = await fetch('/trophies');
    const data = await res.json();
    allTrophiesRaw = data.trophies || [];
    // Levels earned, not trophies started - 20 trophies x 3 levels
    const levelsGot = allTrophiesRaw.reduce((n, t) => n + (t.level || 0), 0);
    const levelsTotal = allTrophiesRaw.reduce((n, t) => n + (t.level_count || 3), 0);
    document.getElementById('trophyCount').textContent = `${levelsGot} of ${levelsTotal} levels earned`;

    // Start on the first unearned trophy if there is one - it's the most
    // useful thing to be looking at.
    const firstLocked = allTrophiesRaw.findIndex(t => !t.earned);
    trophyIndex = firstLocked === -1 ? 0 : firstLocked;

    const carousel = document.getElementById('trophyCarousel');
    carousel.innerHTML = allTrophiesRaw.map((t, i) => `
      <div class="trophy-slide ${t.earned ? 'earned' : 'locked'}" data-i="${i}">
        ${trophySvg(t)}
      </div>
    `).join('');
    carousel.querySelectorAll('.trophy-slide').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.i;
        // Tapping a side trophy brings it to the front; tapping the front one
        // opens its detail, but only when it's actually been earned.
        if (i !== trophyIndex) { trophyIndex = i; layoutTrophyCarousel(); }
        else if (allTrophiesRaw[i].earned) renderTrophyDetail(allTrophiesRaw[i].key);
      };
    });
    attachTrophySwipe(carousel);
    layoutTrophyCarousel();
  } catch (e) {
    const c = document.getElementById('trophyCarousel');
    if (c) c.outerHTML = `<div class="collection-empty">Couldn't load trophies right now.</div>`;
  }
}

function layoutTrophyCarousel() {
  const slides = document.querySelectorAll('.trophy-slide');
  slides.forEach((el, i) => {
    const offset = i - trophyIndex;
    const abs = Math.abs(offset);
    // Depth is faked with scale and horizontal spacing rather than real 3D:
    // it reads the same on a small screen and avoids perspective quirks on
    // mobile browsers. Anything past two positions out is hidden entirely.
    const scale = Math.max(0.55, 1 - abs * 0.22);
    const x = offset * 96;
    el.style.transform = `translateX(calc(-50% + ${x}px)) scale(${scale})`;
    el.style.opacity = abs > 2 ? '0' : String(Math.max(0.35, 1 - abs * 0.3));
    el.style.zIndex = String(50 - abs);
    el.style.pointerEvents = abs > 2 ? 'none' : 'auto';
    el.classList.toggle('front', offset === 0);
  });

  const t = allTrophiesRaw[trophyIndex];
  const caption = document.getElementById('trophyCaption');
  if (t && caption) {
    const progressLine = t.maxed
      ? 'All three levels complete!'
      : `${t.requirement} &nbsp;·&nbsp; ${Math.min(t.progress, t.next_target)}/${t.next_target}`;
    caption.innerHTML = `
      <div class="trophy-caption-name">
        ${t.earned ? t.name : '???'}
        ${t.earned ? `<span class="trophy-level">Level ${t.level}</span>` : ''}
      </div>
      ${t.earned && t.citation ? `<div class="trophy-caption-req">${t.citation}</div>` : ''}
      <div class="trophy-caption-next">${progressLine}</div>
      ${t.earned ? '<div class="trophy-caption-tap">Tap for more</div>' : ''}
    `;
  }
}

function moveTrophy(delta) {
  const next = trophyIndex + delta;
  if (next < 0 || next >= allTrophiesRaw.length) return;
  trophyIndex = next;
  layoutTrophyCarousel();
}

function attachTrophySwipe(el) {
  let startX = null;
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 35) moveTrophy(dx < 0 ? 1 : -1);
    startX = null;
  });
  // Mouse drag too, so it works on desktop
  let mouseDown = null;
  el.addEventListener('mousedown', e => { mouseDown = e.clientX; });
  el.addEventListener('mouseup', e => {
    if (mouseDown === null) return;
    const dx = e.clientX - mouseDown;
    if (Math.abs(dx) > 35) moveTrophy(dx < 0 ? 1 : -1);
    mouseDown = null;
  });
}

async function shareBird(bird) {
  const text = `I found a ${bird.common_name} on Warble!`;
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Warble', text });
    } else {
      // Web Share isn't available on all browsers (notably desktop Firefox),
      // so fall back to the clipboard rather than doing nothing.
      await navigator.clipboard.writeText(text);
      alert('Copied to your clipboard!');
    }
  } catch (e) {
    return;   // user cancelled the share sheet - not an achievement
  }
  try {
    const res = await fetch('/trophies/wingman', { method: 'POST' });
    const data = await res.json();
    if ((data.newly_earned_trophies || []).length) {
      newlyEarnedTrophies = data.newly_earned_trophies;
      alert(`Trophy unlocked: ${data.newly_earned_trophies[0].name}!`);
    }
  } catch (e) { /* sharing worked; the trophy can wait */ }
}

function renderTrophyDetail(trophyKey) {
  const trophy = allTrophiesRaw.find(t => t.key === trophyKey);
  if (!trophy || !trophy.earned) return;

  stage.innerHTML = `
    <div style="width:100%;margin-bottom:14px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="detail-card" style="--tier-color:var(--gold);">
      <div class="detail-photo" style="display:flex;align-items:center;justify-content:center;background:var(--goldbg,#FBF0D8);padding:12px 0;">
        <div style="width:110px;">${trophySvg(trophy)}</div>
      </div>
      <div class="detail-body">
        <div class="detail-name">${trophy.name}</div>
        <div class="detail-sci" style="font-style:normal;color:var(--gold-dk);font-weight:700;">${trophy.citation}</div>
        <div class="detail-desc">${trophy.description}</div>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderTrophies;
}
</script>
