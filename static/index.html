// Lets a drag that starts on the circle itself move the carousel, even
// though the circle is a separate fixed element sitting on top of the
// scrolling track rather than part of it.
function setupCircleDragBridge(track, circle) {
  if (circle.dataset.dragBound) return;
  circle.dataset.dragBound = '1';
  circle.style.touchAction = 'pan-y';
  let dragging = false, startX = 0, startScrollLeft = 0, moved = false;

  circle.addEventListener('pointerdown', (e) => {
    dragging = true; moved = false;
    startX = e.clientX;
    startScrollLeft = track.scrollLeft;
    circle.setPointerCapture(e.pointerId);
  });
  circle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    if (Math.abs(dx) > 3) moved = true;
    track.scrollLeft = startScrollLeft - dx;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    if (moved) {
      const centred = findCentredSpeciesButton(track);
      if (centred) centred.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
  };
  circle.addEventListener('pointerup', endDrag);
  circle.addEventListener('pointercancel', endDrag);
}

async function loadProfileLocations() {
  const listEl = document.getElementById('locationsList');
  if (!listEl) return;
  try {
    const res = await fetch('/locations');
    const data = await res.json();
    const locations = data.locations || [];
    if (locations.length === 0) {
      listEl.innerHTML = `<div class="collection-empty">No locations named yet</div>`;
      return;
    }
    listEl.innerHTML = locations.map(loc => `
      <div class="location-row" data-id="${loc.id}">
        <a class="location-row-name location-map-link"
           href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}#map=16/${loc.lat}/${loc.lng}"
           target="_blank" rel="noopener">📍 ${loc.name}</a>
        <span class="location-row-actions">
          <button class="location-edit-btn" data-id="${loc.id}">Edit</button>
          <button class="location-delete-btn" data-id="${loc.id}" aria-label="Delete ${loc.name}">✕</button>
        </span>
      </div>
    `).join('');
    listEl.querySelectorAll('.location-edit-btn').forEach(btn => {
      btn.onclick = () => editLocationPrompt(parseInt(btn.dataset.id, 10), listEl);
    });
    listEl.querySelectorAll('.location-delete-btn').forEach(btn => {
      btn.onclick = async () => {
        const row = btn.closest('.location-row');
        const name = row.querySelector('.location-row-name').textContent.replace('📍 ', '');
        if (!confirm(`Forget the name "${name}"? The place stays, it just becomes unnamed again.`)) return;
        try {
          await fetch(`/locations/${btn.dataset.id}/delete`, { method: 'POST' });
          loadProfileLocations();
        } catch (e) { /* leave the list as-is if it fails */ }
      };
    });
  } catch (e) {
    listEl.innerHTML = `<div class="collection-empty">Couldn't load locations right now.</div>`;
  }
}

function editLocationPrompt(id, listEl) {
  const row = listEl.querySelector(`.location-row[data-id="${id}"]`);
  if (!row) return;
  const currentName = row.querySelector('.location-row-name').textContent.replace('📍 ', '');
  row.innerHTML = `
    <input type="text" class="location-input" style="margin:0;flex:1;padding:8px 12px;" value="${currentName}" id="editInput${id}">
    <button class="location-edit-btn" id="saveEdit${id}">Save</button>
  `;
  document.getElementById(`saveEdit${id}`).onclick = async () => {
    const newName = document.getElementById(`editInput${id}`).value.trim();
    if (!newName) return;
    const formData = new FormData();
    formData.append('name', newName);
    try {
      await fetch(`/locations/${id}/rename`, { method: 'POST', body: formData });
    } catch (e) { /* ok to fail quietly */ }
    loadProfileLocations();
  };
}

async function renderDressUp() {
  setActiveTab('dressup');
  stage.classList.add('top-aligned');
  selectedCategory = null;
  stage.innerHTML = `
    <div class="collection-header" style="margin-bottom:8px;"><div class="collection-title"><img src="/static/title-hoottique-v3.webp" alt="The Hoot-tique" style="height:62px;width:auto;display:block;"></div></div>
    <div class="collection-count" style="margin-bottom:22px;text-align:center;">Welcome to The Hoot-tique! Don't leave until you're looking fly!</div>
    <div class="dressup-avatar-stage" id="dressUpAvatarStage">
      <div class="species-track" id="speciesTrack"></div>
      <div class="avatar-frame-wrap">
        <div class="avatar-ring-frame"></div>
        <div class="avatar-frame" id="dressUpPreview"></div>
        <div class="color-wheel" id="colorWheel"></div>
      </div>
    </div>
    <button class="reset-accessories-btn" id="resetAccessoriesBtn">Reset</button>
    <div class="category-row" id="categoryRow"></div>
    <div class="carousel-panel"><div class="carousel-wrap" id="carouselWrap"></div></div>
    <div class="dressup-hint" id="dressUpHint"></div>
  `;

  try {
    const [accRes, profRes, featherRes] = await Promise.all([
      fetch('/accessories'),
      fetch('/profile'),
      fetch('/feathers'),
    ]);
    const accData = await accRes.json();
    accessoryCatalog = accData.accessories || [];
    dressUpCategories = accData.categories || [];
    currentProfile = await profRes.json();
    const featherData = await featherRes.json();
    currentFeatherTotal = featherData.total_feathers;

    accessoryCatalog.forEach(a => { accessorySvgCache[a.id] = a.svg; });

    initDressUpAvatarPicker();
    renderCategoryRow();
    document.getElementById('resetAccessoriesBtn').onclick = resetAllAccessories;
    if (dressUpCategories.length) selectCategory(dressUpCategories[0].id);
  } catch (e) {
    const wrap = document.getElementById('carouselWrap');
    if (wrap) wrap.outerHTML = `<div class="collection-empty">Couldn't load Dress Up right now.</div>`;
  }
}

async function resetAllAccessories() {
  const worn = Object.entries(currentProfile.equipped || {}).filter(([, id]) => id);
  if (!worn.length) { setDressUpHint('Nothing to take off'); return; }

  currentProfile.equipped = {};
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  setDressUpHint('Took everything off');

  // Clear each slot server-side. Items stay owned - this only unequips.
  for (const [category] of worn) {
    const formData = new FormData();
    formData.append('category', category);
    try { await fetch('/accessories/equip', { method: 'POST', body: formData }); }
    catch (e) { /* local state already updated */ }
  }
}

function renderDressUpPreview() {
  // Always the avatar here, regardless of any profile photo - this is the
  // bird being dressed, so the accessories have something to sit on.
  const el = document.getElementById('dressUpPreview');
  if (el) el.innerHTML = avatarSvg(currentProfile.avatar_body, 210, currentProfile.equipped, false, currentProfile.avatar_species);
}

function renderCategoryRow() {
  const row = document.getElementById('categoryRow');
  if (!row) return;
  row.innerHTML = dressUpCategories.map(cat => `
    <button class="category-tile ${selectedCategory === cat.id ? 'active' : ''}" data-category="${cat.id}">
      <span class="cat-icon"><img src="${cat.icon_img}" alt="${cat.name}" width="26" height="26" style="object-fit:contain;"></span>
      <div>${cat.name}</div>
    </button>
  `).join('');
  row.querySelectorAll('.category-tile').forEach(btn => {
    btn.onclick = () => selectCategory(btn.dataset.category);
  });
}

function selectCategory(categoryId) {
  selectedCategory = categoryId;
  expandedItemId = null;   // don't carry an open card into another category
  renderCategoryRow();
  renderCarousel();
}

function setDressUpHint(text) {
  const hintEl = document.getElementById('dressUpHint');
  if (hintEl) hintEl.textContent = text;
}

let expandedItemId = null;

function renderCarousel() {
  const wrap = document.getElementById('carouselWrap');
  if (!wrap) return;
  // Cheapest first, so the carousel reads as a ladder - what you can afford
  // now at the front, what you're saving for further along.
  const items = accessoryCatalog
    .filter(a => a.category === selectedCategory)
    .sort((a, b) => a.cost - b.cost || a.name.localeCompare(b.name));
  if (items.length === 0) {
    wrap.innerHTML = `<div class="collection-empty">Nothing here yet</div>`;
    return;
  }
  wrap.innerHTML = items.map(a => {
    const isEquipped = currentProfile.equipped && currentProfile.equipped[a.category] === a.id;
    const canAfford = currentFeatherTotal >= a.cost;
    const isOpen = expandedItemId === a.id;
    // Ownership/selection now read entirely from the frame colour (see
    // .carousel-item.owned / .equipped below), so owned items carry no
    // price badge at all - only unowned ones, tucked in a corner instead
    // of taking a full text row.
    const priceBadge = a.owned
      ? ''
      : `<div class="carousel-item-price-badge ${canAfford ? 'affordable' : 'unaffordable'}"><img class="feather-icon" src="/static/feather.webp" alt=""> ${a.cost}</div>`;

    // Only unowned items expand - an owned one just toggles on and off, so
    // there's nothing to confirm.
    const action = (isOpen && !a.owned)
      ? `<button class="item-buy-btn ${canAfford ? '' : 'cant-afford'}" data-buy="${a.id}">
           ${canAfford ? 'Buy' : `${Math.round(a.cost - currentFeatherTotal)} more`}
         </button>`
      : '';

    return `
      <div class="carousel-item ${a.owned ? 'owned' : 'unowned'} ${isEquipped ? 'equipped' : ''} ${isOpen ? 'expanded' : ''}"
           data-id="${a.id}" data-owned="${a.owned}" data-category="${a.category}"
           data-cost="${a.cost}" data-name="${a.name}">
        <div class="item-icon-wrap"><svg viewBox="${a.tile_viewbox}" width="100%" height="100%">${a.svg}</svg></div>
        ${priceBadge}
        ${action}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.carousel-item').forEach(el => {
    el.onclick = (e) => {
      // The buy button has its own handler; don't let the tile's tap collapse
      // the card out from under it.
      if (e.target.closest('.item-buy-btn')) return;
      const owned = el.dataset.owned === 'true';
      if (owned) {
        handleAccessoryTap(el.dataset.id, true, el.dataset.category,
                           parseInt(el.dataset.cost, 10), el.dataset.name);
      } else {
        expandedItemId = expandedItemId === el.dataset.id ? null : el.dataset.id;
        renderCarousel();
      }
    };
  });

  wrap.querySelectorAll('.item-buy-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const el = btn.closest('.carousel-item');
      buyAccessory(el.dataset.id, el.dataset.category,
                   parseInt(el.dataset.cost, 10), el.dataset.name);
    };
  });
}

async function buyAccessory(accessoryId, category, cost, name) {
  if (currentFeatherTotal < cost) {
    setDressUpHint(`Not enough feathers yet — ${Math.round(cost - currentFeatherTotal)} more to go`);
    return;
  }
  try {
    const res = await fetch(`/accessories/${accessoryId}/purchase`, { method: 'POST' });
    const data = await res.json();
    if (data.status === 'ok') {
      const item = accessoryCatalog.find(a => a.id === accessoryId);
      if (item) item.owned = true;
      currentFeatherTotal = data.new_total;
      animateFeatherCount(currentFeatherTotal);
      // Bought, not worn - tap it again to put it on.
      expandedItemId = null;
      setDressUpHint(`Bought ${name} — tap it to wear it`);
      renderCarousel();
    } else {
      setDressUpHint("That didn't work — try again");
    }
  } catch (e) { /* fail quietly, nothing to update */ }
}

async function handleAccessoryTap(accessoryId, owned, category, cost, name) {
  // Only ever called for owned items now - buying goes through buyAccessory()
  // from the expanded tile's Buy button.

  // Already owned - tap toggles wearing it in its category's slot.
  if (!currentProfile.equipped) currentProfile.equipped = {};
  const currentlyWorn = currentProfile.equipped[category] === accessoryId;
  const newValue = currentlyWorn ? null : accessoryId;
  currentProfile.equipped[category] = newValue;
  setDressUpHint(currentlyWorn ? `Took off ${name}` : `Wearing ${name}`);
  renderDressUpPreview();
  renderCarousel();
  updateNavAvatarIcon();
  try {
    const formData = new FormData();
    formData.append('category', category);
    if (newValue) formData.append('accessory_id', newValue);
    await fetch('/accessories/equip', { method: 'POST', body: formData });
  } catch (e) { /* local state's already updated, ok if the save fails silently */ }
}

// Little stars on the plinth showing how many of the three levels are held -
// so the carousel communicates progress at a glance, not just earned/not.
function levelPips(t) {
  const total = t.level_count || 3;
  const got = t.level || 0;
  const w = 9, gap = 3;
  const startX = 50 - ((total * w + (total - 1) * gap) / 2) + w / 2;
  return Array.from({ length: total }, (_, i) => {
    const x = startX + i * (w + gap);
    const on = i < got;
    return `<circle cx="${x}" cy="103" r="3.1" fill="${on ? '#F2C94C' : '#3D2A85'}"
            stroke="${on ? '#B8901F' : '#2D1B69'}" stroke-width="1"/>`;
  }).join('');
}

function trophySvg(trophy) {
  const earned = trophy.earned;
  const cup = earned ? '#F2C94C' : '#8E87B8';
  const cupDark = earned ? '#B8901F' : '#6F68A0';
  const emblem = TROPHY_EMBLEMS[trophy.key] || '';
  return `<svg viewBox="0 0 100 116" class="trophy-svg">
    <path d="M22 16 H78 V44 a28 28 0 0 1 -56 0 Z" fill="${cup}"/>
    <path d="M22 16 H78 V26 H22 Z" fill="${cupDark}" opacity="0.35"/>
    <path d="M22 24 h-9 a11 11 0 0 0 11 15" fill="none" stroke="${cup}" stroke-width="5"/>
    <path d="M78 24 h9 a11 11 0 0 1 -11 15" fill="none" stroke="${cup}" stroke-width="5"/>
    <rect x="44" y="70" width="12" height="14" fill="${cupDark}"/>
    <path d="M30 98 h40 l-4 -12 H34 Z" fill="${cupDark}"/>
    <rect x="24" y="98" width="52" height="10" rx="3" fill="${cup}"/>
    <g transform="translate(50,36)" ${earned ? '' : 'opacity="0.45"'}>${emblem}</g>
    ${levelPips(trophy)}
  </svg>`;
}

let allPacksRaw = [], selectedPack = 0, selectedCard = 0;

async function loadCollectorPacks() {
  const el = document.getElementById('packList');
  if (!el) return;
  try {
    const res = await fetch('/collector-packs');
    const d = await res.json();
    allPacksRaw = d.packs || [];
    renderPackSelector();
    renderSelectedPack();
  } catch (e) {
    el.innerHTML = `<div class="collection-empty">Couldn't load packs right now.</div>`;
  }
}

function renderPackSelector() {
  const row = document.getElementById('packSelector');
  if (!row) return;
  const p = allPacksRaw[selectedPack];
  if (!p) return;
  row.innerHTML = `
    <div class="pack-nav">
      <button class="pack-arrow" id="packPrev" aria-label="Previous pack">&lsaquo;</button>
      <button class="pack-current" id="packCurrent">
        <img class="pack-current-icon" src="/static/pack-${p.art}-icon-v1.webp" alt="">
        <img class="pack-current-name" src="/static/pack-${p.art}-name-v1.webp" alt="${p.name}">
      </button>
      <button class="pack-arrow" id="packNext" aria-label="Next pack">&rsaquo;</button>
    </div>
    <div class="pack-tally">${p.cards_found} / ${p.cards_total}</div>
    <div class="pack-pips">${allPacksRaw.map((_, i) =>
      `<span class="pack-pip ${i === selectedPack ? 'on' : ''}"></span>`).join('')}</div>`;
  document.getElementById('packPrev').onclick = () => stepPack(-1);
  document.getElementById('packNext').onclick = () => stepPack(1);
  document.getElementById('packCurrent').onclick = openAllPacks;
}

// Packs wrap round, so arrowing never dead-ends on the first or last one.
function stepPack(dir) {
  const n = allPacksRaw.length;
  if (!n) return;
  goToPack((selectedPack + dir + n) % n, dir);
}

function goToPack(i, dir) {
  if (i === selectedPack) return;
  const from = selectedPack;
  selectedPack = i;
  selectedCard = 0;
  renderPackSelector();
  renderSelectedPack();
  if (reducedMotion()) return;
  // Short slide in the direction of travel, so which way you moved is
  // obvious even though the cards themselves also move horizontally.
  const way = dir || (i > from ? 1 : -1);
  const el = document.getElementById('packList');
  if (el) el.animate(
    [{ transform: `translateX(${way * 26}px)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
    { duration: 220, easing: 'cubic-bezier(.25,.8,.35,1)' });
}

function openAllPacks() {
  if (document.querySelector('.all-packs')) return;
  const wrap = document.createElement('div');
  wrap.className = 'all-packs';
  wrap.innerHTML = `
    <div class="all-packs-sheet">
      <div class="all-packs-title">All ten packs</div>
      <div class="all-packs-grid">
        ${allPacksRaw.map((p, i) => `
          <button class="all-pack ${i === selectedPack ? 'on' : ''} ${p.complete ? 'done' : ''}" data-i="${i}">
            <img class="all-pack-badge" src="/static/pack-${p.art}-badge-v1.webp" alt="">
            <span class="all-pack-text">
              <img class="all-pack-name" src="/static/pack-${p.art}-name-v1.webp" alt="${p.name}">
              <span class="all-pack-count">${p.cards_found}/${p.cards_total}</span>
            </span>
          </button>`).join('')}
      </div>
    </div>`;
  const close = () => wrap.remove();
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  wrap.querySelectorAll('.all-pack').forEach(btn => {
    btn.onclick = () => { const i = +btn.dataset.i; close(); goToPack(i, i > selectedPack ? 1 : -1); };
  });
  document.body.appendChild(wrap);
  if (!reducedMotion()) wrap.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 140 });
}

function renderSelectedPack() {
  const el = document.getElementById('packList');
  const p = allPacksRaw[selectedPack];
  if (!el || !p) return;
  if (selectedCard >= p.birds.length) selectedCard = 0;

  const cards = p.birds.map((b, i) => {
    const rareMark = b.rarity === 'Rare'
      ? `<div class="fan-rare" style="--tier-color:${TIER_COLORS.Rare}">RARE</div>`
      : '';
    const face = b.photo_url
      ? `<img class="fan-photo" ${birdImg(b.photo_url, 420)} alt="">`
      : `<div class="fan-photo empty">${b.found ? '' : '<span class="fan-photo-emoji">🐦</span>'}</div>`;
    // An away bird is marked as such, so an empty slot reads as "not this
    // month" rather than something the child has failed to find.
    const away = !b.found && b.season_state === 'away';
    return `
      <div class="fan-card ${b.found ? 'tappable' : 'unfound'} ${away ? 'away' : ''}"
           data-i="${i}" data-name="${b.found ? b.common_name : ''}">
        <div class="fan-badge tl" style="--pack-color:${p.color};
             -webkit-mask-image:url('/static/pack-${p.art}-emblem-v2.webp');
             mask-image:url('/static/pack-${p.art}-emblem-v2.webp')"></div>
        <div class="fan-badge br" style="--pack-color:${p.color};
             -webkit-mask-image:url('/static/pack-${p.art}-emblem-v2.webp');
             mask-image:url('/static/pack-${p.art}-emblem-v2.webp')"></div>
        ${face}
        <div class="fan-name">${b.common_name}</div>
        ${rareMark}
        ${away ? `<div class="fan-away">${b.season_label}</div>` : ''}
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="pack-blurb">${p.blurb}</div>
    <div class="card-carousel" id="cardCarousel">${cards}</div>
    <div class="card-dots" id="cardDots"></div>
    <div class="fan-caption" id="fanCaption"></div>
  `;

  const carousel = document.getElementById('cardCarousel');
  if (carousel) wireCardCarousel(carousel, p.birds);
}

// One dot per card in the pack: filled once found, and the one you're
// looking at sits slightly larger. Replaces the old "x of 10 cards found"
// line, which said the same thing as the tally by the pack name.
function renderCardDots(birds) {
  const el = document.getElementById('cardDots');
  if (!el) return;
  el.innerHTML = birds.map((b, i) =>
    `<span class="card-dot ${b.found ? 'found' : ''} ${i === selectedCard ? 'now' : ''}"></span>`).join('');
}

// Cover-flow: cards sit at fixed steps either side of the middle, scaled
// down and tucked behind as they go. `drift` is how far a finger has dragged
// in card-widths, so the whole row follows the thumb before snapping.
const CARD_STEP = 35;      // how far the next card sits out from the middle
const CARD_HERO = 2.2;     // scale of the card in the middle

function layoutCarousel(cards, drift = 0) {
  cards.forEach((card, i) => {
    const off = i - selectedCard - drift;
    const away = Math.abs(off);
    // The first card either side steps out by a full stride; the ones behind
    // it barely move, so they stay tucked behind rather than fanning out and
    // showing a row of competing names.
    const x = Math.sign(off) *
      (CARD_STEP * Math.min(away, 1) + CARD_STEP * 0.32 * Math.max(away - 1, 0));
    const scale = Math.max(0.45, CARD_HERO - Math.min(away, 3) * 0.7);
    card.style.transform =
      `translate(-50%,-50%) translateX(${x.toFixed(2)}px) scale(${scale.toFixed(3)})`;
    card.style.opacity = away > 1.75 ? '0' : '1';
    card.style.zIndex = String(100 - Math.round(away * 10));
  });
}

function wireCardCarousel(carousel, birds) {
  const cards = Array.from(carousel.querySelectorAll('.fan-card'));
  if (!cards.length) return;
  const caption = () => {
    const el = document.getElementById('fanCaption');
    if (el) el.textContent = fanCaptionFor(birds[selectedCard]);
  };
  const settle = () => {
    carousel.classList.add('settling');
    layoutCarousel(cards);
    renderCardDots(birds);
    caption();
  };
  layoutCarousel(cards);
  renderCardDots(birds);
  caption();

  let pid = null, startX = 0, startY = 0, drift = 0, dragging = false, moved = false;

  carousel.addEventListener('dragstart', (e) => e.preventDefault());
  carousel.addEventListener('pointerdown', (e) => {
    pid = e.pointerId; startX = e.clientX; startY = e.clientY;
    drift = 0; dragging = false; moved = false;
    carousel.classList.remove('settling');
    try { carousel.setPointerCapture(pid); } catch (err) { /* unsupported */ }
  });

  carousel.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // Let a clearly vertical drag scroll the page instead of turning cards.
    if (!dragging && Math.abs(dx) < 6 && Math.abs(dx) <= Math.abs(dy)) return;
    dragging = true;
    if (Math.abs(dx) > 4) moved = true;
    drift = -dx / (CARD_STEP * 1.6);
    // Resist dragging past either end so the row feels bounded.
    const limit = 0.45;
    if (selectedCard + drift < -limit) drift = -limit - selectedCard;
    if (selectedCard + drift > cards.length - 1 + limit) drift = cards.length - 1 + limit - selectedCard;
    layoutCarousel(cards, drift);
  });

  const release = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    try { carousel.releasePointerCapture(e.pointerId); } catch (err) { /* already */ }
    if (moved) {
      // One card per swipe, however far the finger travelled.
      const stepBy = drift > 0.28 ? 1 : drift < -0.28 ? -1 : 0;
      selectedCard = Math.min(cards.length - 1, Math.max(0, selectedCard + stepBy));
      settle();
      return;
    }
    // A tap: the middle card opens, the ones either side come to the middle.
    // Found by coordinate rather than e.target, because capturing the pointer
    // retargets every event to the carousel itself.
    const at = document.elementFromPoint(e.clientX, e.clientY);
    const hit = at && at.closest ? at.closest('.fan-card') : null;
    const i = hit ? +hit.dataset.i : -1;
    if (i === selectedCard) {
      settle();
      if (hit.classList.contains('tappable')) openBirdFromPack(hit.dataset.name, hit);
      return;
    }
    // Only a sliver of each neighbour is showing, which is far too small a
    // target for a small child - so a tap anywhere to one side of the middle
    // card steps that way, whether or not it landed on the card itself.
    const mid = carousel.getBoundingClientRect();
    const step = i >= 0 ? (i > selectedCard ? 1 : -1)
                        : (e.clientX < mid.left + mid.width / 2 ? -1 : 1);
    selectedCard = Math.min(cards.length - 1, Math.max(0, selectedCard + step));
    settle();
  };
  carousel.addEventListener('pointerup', release);
  carousel.addEventListener('pointercancel', () => { pid = null; settle(); });
}

// "Found 3 times! First found on 4 May 2026 in Grandma's garden."
// The location clause is dropped entirely when we don't have a name for the
// spot, rather than printing a placeholder at a child.
function fanCaptionFor(b) {
  if (!b) return '';
  // Not found yet: tell them where to go looking instead.
  if (!b.found) return b.hint || '';
  let text = b.found_count === 1 ? 'Found once!' : `Found ${b.found_count} times!`;
  if (b.first_found) {
    const d = new Date(b.first_found);
    if (!isNaN(d)) {
      text += ` First found on ${d.toLocaleDateString('en-GB', {
        day: 'numeric', month: 'long', year: 'numeric'
      })}`;
      text += b.first_location ? ` in ${b.first_location}.` : '.';
    }
  }
  return text;
}

// Tapping a card lifts it clear of the carousel and spins it; the bird's details
// are on the other side. The spin is done in two halves that hand over at
// 90deg, where the card is edge-on and so has no visible width at all - which
// is what lets the little pack card be swapped for the full detail card
// without anyone seeing it happen. Both halves turn the same way, so it reads
// as one continuous movement.
const FLIP_MS = 210;
const FLIP_LIFT = 2.2;          // how much bigger the card gets as it comes up
let packFlipName = null;        // which bird we spun in from, for the way back

const reducedMotion = () =>
  !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Where a lifted card hovers: middle of the space above the tab bar.
function flipCentre() {
  const nav = document.querySelector('.bottom-nav');
  const floor = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  return { x: window.innerWidth / 2, y: floor / 2 };
}

// A fixed-position stand-in for a fan card, so the spin isn't boxed in by the
// fan row's own stacking and overlap. Sized from the card's untransformed box
// and centred on where it actually sits, since getBoundingClientRect() on a
// tilted, enlarged card reports the bigger rotated box rather than the card.
function makeFlipper(cardEl) {
  const r = cardEl.getBoundingClientRect();
  const w = cardEl.offsetWidth, h = cardEl.offsetHeight;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:${cx - w / 2}px;top:${cy - h / 2}px;` +
    `width:${w}px;height:${h}px;z-index:400;pointer-events:none;`;
  const face = cardEl.cloneNode(true);
    face.style.cssText += ';margin:0;transform:none;transition:none;width:100%;height:100%;';
  host.appendChild(face);
  document.body.appendChild(host);
  const c = flipCentre();
  // Read the scale off the rendered box rather than assuming it - in the
  // carousel a card's size comes from its transform, not its layout.
  const scale = w ? r.width / w : 1;
  return {
    host,
    // resting in the carousel, at whatever size it was sitting at
    rest: `perspective(900px) translate(0px,0px) rotate(0deg) ` +
          `scale(${scale.toFixed(3)}) rotateY(0deg)`,
    // lifted, straightened and turned edge-on
    lifted: `perspective(900px) translate(${c.x - cx}px,${c.y - cy}px) rotate(0deg) ` +
            `scale(${FLIP_LIFT}) rotateY(90deg)`,
  };
}

const play = (el, frames, opts) => el.animate(frames, { fill: 'forwards', ...opts }).finished;
async function openBirdFromPack(commonName, cardEl) {
  if (!commonName) return;
  // Collections can be opened without ever visiting My Birds, in which case
  // the sightings cache is empty and the detail view would silently bail.
  if (!allSightingsRaw.length) {
    try {
      const res = await fetch('/sightings');
      allSightingsRaw = (await res.json()).sightings || [];
    } catch (e) { return; }
  }

  packFlipName = commonName;
  const showDetail = () => {
    renderBirdDetail(commonName, renderHabitats);
    // Re-point Back at the reverse spin. Only this route spins - reaching a
    // bird from My Flock never came off the pack, so it keeps its plain Back.
    const back = document.getElementById('backBtn');
    if (back) back.onclick = () => closeBirdToPack();
  };

  if (!cardEl || reducedMotion()) { showDetail(); return; }

  // First half: the card lifts out of the fan, straightens up and turns
  // edge-on.
  const f = makeFlipper(cardEl);
  cardEl.style.visibility = 'hidden';
  await play(f.host, [{ transform: f.rest }, { transform: f.lifted }],
             { duration: FLIP_MS, easing: 'cubic-bezier(.4,0,.7,.35)' });
  f.host.remove();

  showDetail();

  // Second half: the detail card carries on turning from edge-on to face us.
  const detail = document.querySelector('.detail-card');
  if (detail) {
    play(detail, [
      { transform: 'perspective(900px) rotateY(-90deg) scale(.94)', opacity: .5 },
      { transform: 'perspective(900px) rotateY(0deg) scale(1)', opacity: 1 },
    ], { duration: FLIP_MS + 50, easing: 'cubic-bezier(.25,.7,.4,1)' });
  } else {
    cardEl.style.visibility = '';   // detail bailed - put the card back
  }
}

// The way back: the detail card turns edge-on, then the pack card finishes
// the turn and settles into the fan it came from.
async function closeBirdToPack() {
  const name = packFlipName;
  const detail = document.querySelector('.detail-card');

  if (reducedMotion() || !detail) { await renderHabitats(); return; }

  await play(detail, [
    { transform: 'perspective(900px) rotateY(0deg) scale(1)', opacity: 1 },
    { transform: 'perspective(900px) rotateY(-90deg) scale(.94)', opacity: .5 },
  ], { duration: FLIP_MS, easing: 'cubic-bezier(.4,0,.7,.35)' });

  await renderHabitats();   // awaits the fan, so the card is there to land on

  const card = Array.from(document.querySelectorAll('.fan-card'))
    .find(c => c.dataset.name === name);
  if (!card) return;

  const f = makeFlipper(card);
  card.style.visibility = 'hidden';
  await play(f.host, [{ transform: f.lifted }, { transform: f.rest }],
             { duration: FLIP_MS, easing: 'cubic-bezier(.25,.7,.4,1)' });
  f.host.remove();
  card.style.visibility = '';
}

async function renderHabitats() {
  setActiveTab('habitats');
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="collection-header"><div class="collection-title">Collections</div></div>
    <div class="collection-count">Ten packs of ten birds to complete</div>
    <div class="pack-selector" id="packSelector"></div>
    <div id="packList" style="width:100%;"></div>
  `;
  // Awaited so callers can rely on the fan actually being on screen - the
  // spin back from a bird's details needs its card to exist to land on.
  await loadCollectorPacks();
}

async function renderTrophies() {
  setActiveTab('trophies');
  stage.classList.remove('top-aligned');
  stage.innerHTML = `
    <div class="collection-header"><div class="collection-title"><img src="/static/title-awards-v1.webp" alt="Awards" style="height:30px;width:auto;display:block;"></div></div>
    <div class="collection-count" id="trophyCount">Loading...</div>
    <div class="trophy-carousel" id="trophyCarousel"></div>
    <div class="trophy-caption" id="trophyCaption"></div>
  `;

  try {
    const res = await fetch('/trophies');
    const data = await res.json();
    allTrophiesRaw = data.trophies || [];
    // Levels earned, not trophies started - 20 trophies x 3 levels
    const levelsGot = allTrophiesRaw.reduce((n, t) => n + (t.level || 0), 0);
    const levelsTotal = allTrophiesRaw.reduce((n, t) => n + (t.level_count || 3), 0);
    document.getElementById('trophyCount').textContent = `${levelsGot} of ${levelsTotal} levels earned`;

    // Start on the first unearned trophy if there is one - it's the most
    // useful thing to be looking at.
    const firstLocked = allTrophiesRaw.findIndex(t => !t.earned);
    trophyIndex = firstLocked === -1 ? 0 : firstLocked;

    const carousel = document.getElementById('trophyCarousel');
    carousel.innerHTML = allTrophiesRaw.map((t, i) => `
      <div class="trophy-slide ${t.earned ? 'earned' : 'locked'}" data-i="${i}">
        ${trophySvg(t)}
      </div>
    `).join('');
    carousel.querySelectorAll('.trophy-slide').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.i;
        // Tapping a side trophy brings it to the front; tapping the front one
        // opens its detail, but only when it's actually been earned.
        if (i !== trophyIndex) { trophyIndex = i; layoutTrophyCarousel(); }
        else if (allTrophiesRaw[i].earned) renderTrophyDetail(allTrophiesRaw[i].key);
      };
    });
    attachTrophySwipe(carousel);
    layoutTrophyCarousel();
  } catch (e) {
    const c = document.getElementById('trophyCarousel');
    if (c) c.outerHTML = `<div class="collection-empty">Couldn't load trophies right now.</div>`;
  }
}

function layoutTrophyCarousel() {
  const slides = document.querySelectorAll('.trophy-slide');
  slides.forEach((el, i) => {
    const offset = i - trophyIndex;
    const abs = Math.abs(offset);
    // Depth is faked with scale and horizontal spacing rather than real 3D:
    // it reads the same on a small screen and avoids perspective quirks on
    // mobile browsers. Anything past two positions out is hidden entirely.
    const scale = Math.max(0.55, 1 - abs * 0.22);
    const x = offset * 96;
    el.style.transform = `translateX(calc(-50% + ${x}px)) scale(${scale})`;
    el.style.opacity = abs > 2 ? '0' : String(Math.max(0.35, 1 - abs * 0.3));
    el.style.zIndex = String(50 - abs);
    el.style.pointerEvents = abs > 2 ? 'none' : 'auto';
    el.classList.toggle('front', offset === 0);
  });

  const t = allTrophiesRaw[trophyIndex];
  const caption = document.getElementById('trophyCaption');
  if (t && caption) {
    const progressLine = t.maxed
      ? 'All three levels complete!'
      : `${t.requirement} &nbsp;·&nbsp; ${Math.min(t.progress, t.next_target)}/${t.next_target}`;
    caption.innerHTML = `
      <div class="trophy-caption-name">
        ${t.earned ? t.name : '???'}
        ${t.earned ? `<span class="trophy-level">Level ${t.level}</span>` : ''}
      </div>
      ${t.earned && t.citation ? `<div class="trophy-caption-req">${t.citation}</div>` : ''}
      <div class="trophy-caption-next">${progressLine}</div>
      ${t.earned ? '<div class="trophy-caption-tap">Tap for more</div>' : ''}
    `;
  }
}

function moveTrophy(delta) {
  const next = trophyIndex + delta;
  if (next < 0 || next >= allTrophiesRaw.length) return;
  trophyIndex = next;
  layoutTrophyCarousel();
}

function attachTrophySwipe(el) {
  let startX = null;
  el.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
  el.addEventListener('touchend', e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 35) moveTrophy(dx < 0 ? 1 : -1);
    startX = null;
  });
  // Mouse drag too, so it works on desktop
  let mouseDown = null;
  el.addEventListener('mousedown', e => { mouseDown = e.clientX; });
  el.addEventListener('mouseup', e => {
    if (mouseDown === null) return;
    const dx = e.clientX - mouseDown;
    if (Math.abs(dx) > 35) moveTrophy(dx < 0 ? 1 : -1);
    mouseDown = null;
  });
}

async function shareBird(bird) {
  const text = `I found a ${bird.common_name} on Warble!`;
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Warble', text });
    } else {
      // Web Share isn't available on all browsers (notably desktop Firefox),
      // so fall back to the clipboard rather than doing nothing.
      await navigator.clipboard.writeText(text);
      alert('Copied to your clipboard!');
    }
  } catch (e) {
    return;   // user cancelled the share sheet - not an achievement
  }
  try {
    const res = await fetch('/trophies/wingman', { method: 'POST' });
    const data = await res.json();
    if ((data.newly_earned_trophies || []).length) {
      newlyEarnedTrophies = data.newly_earned_trophies;
      alert(`Trophy unlocked: ${data.newly_earned_trophies[0].name}!`);
    }
  } catch (e) { /* sharing worked; the trophy can wait */ }
}

function renderTrophyDetail(trophyKey) {
  const trophy = allTrophiesRaw.find(t => t.key === trophyKey);
  if (!trophy || !trophy.earned) return;

  stage.innerHTML = `
    <div style="width:100%;margin-bottom:14px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="detail-card" style="--tier-color:var(--gold);">
      <div class="detail-photo" style="display:flex;align-items:center;justify-content:center;background:var(--goldbg,#FBF0D8);padding:12px 0;">
        <div style="width:110px;">${trophySvg(trophy)}</div>
      </div>
      <div class="detail-body">
        <div class="detail-name">${trophy.name}</div>
        <div class="detail-sci" style="font-style:normal;color:var(--gold-dk);font-weight:700;">${trophy.citation}</div>
        <div class="detail-desc">${trophy.description}</div>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderTrophies;
}
</script>

</body>
