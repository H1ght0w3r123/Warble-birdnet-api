// Cover-flow: cards sit at fixed steps either side of the middle, scaled
// down and tucked behind as they go. `drift` is how far a finger has dragged
// in card-widths, so the whole row follows the thumb before snapping.
const CARD_HERO = 2.2;     // scale of the card in the middle

// Where the cards sit, by how many places they are from the middle: the
// hero, the card behind it either side, the one behind that, and the one
// past it that has faded away.
const CARD_SCALE = [CARD_HERO, 1.5, 1.0, 0.7];
const CARD_HALF = 33;      // half a card's natural 66px width

// The offsets are worked out from the room on screen, so the deck spreads
// to fill a 320px phone and a 430px one alike: the outermost card's edge
// sits DECK_GUTTER in from the screen edge (never wider than DECK_HALF_MAX
// either side of the middle), and of the width beyond the hero the first
// layer gets a slightly bigger share than the second, so the stack still
// reads as stepping back.
let DECK_HALF_MAX = 185;
let DECK_GUTTER = 18;
function deckOffsets(width) {
  const heroEdge = CARD_HALF * CARD_SCALE[0];
  const half = Math.max(heroEdge + 24, Math.min(DECK_HALF_MAX, width / 2 - DECK_GUTTER));
  const s1 = (half - heroEdge) / 1.85, s2 = s1 * 0.85;
  const x1 = heroEdge + s1 - CARD_HALF * CARD_SCALE[1];
  const x2 = heroEdge + s1 + s2 - CARD_HALF * CARD_SCALE[2];
  return [0, x1, x2, x2 + 18];
}
let CARD_X = deckOffsets(390);

// Between two whole places, part-way along - so a card being dragged slides
// smoothly from one layer to the next instead of jumping.
function deckAt(table, away) {
  const a = Math.min(away, table.length - 1);
  const i = Math.floor(a), f = a - i;
  return i >= table.length - 1 ? table[i] : table[i] + (table[i + 1] - table[i]) * f;
}

// How far the deck is fanned out, as two numbers so the cards' positions
// and their sizes can move separately: 1 is the normal deck, 0 is collapsed
// - every card stacked in a neat pile behind the front one, at nearly its
// size and a few pixels further back. Animated by animateDeck when a pack
// opens or closes.
let deckPos = 1, deckSize = 1;
let deckAnimToken = 0;

function layoutCarousel(cards, drift = 0) {
  const box = cards[0] && cards[0].parentElement;
  if (box && box.clientWidth) CARD_X = deckOffsets(box.clientWidth);
  const kp = deckPos, ks = deckSize;
  cards.forEach((card, i) => {
    const off = i - selectedCard - drift;
    const away = Math.abs(off);
    const pile = Math.min(away, 3);
    const x = Math.sign(off) * (deckAt(CARD_X, away) * kp + pile * 3 * (1 - kp));
    const scale = deckAt(CARD_SCALE, away) * ks + (CARD_HERO - pile * 0.06) * (1 - ks);
    card.style.transform =
      `translate(-50%,-50%) translateX(${x.toFixed(2)}px) scale(${scale.toFixed(3)})`;
    card.style.setProperty('--sheen', off.toFixed(3));
    // Two layers either side stay fully visible; the third fades out as it
    // tucks in behind them, rather than blinking off.
    card.style.opacity = String(Math.max(0, Math.min(1, (2.75 - away) / 0.75)).toFixed(3));
    card.style.zIndex = String(100 - Math.round(away * 10));
  });
}

function wireCardCarousel(carousel, birds) {
  const cards = Array.from(carousel.querySelectorAll('.fan-card'));
  if (!cards.length) return;
  const caption = () => {
    const el = document.getElementById('fanCaption');
    if (el) el.textContent = fanCaptionFor(birds[selectedCard]);
  };
  const settle = () => {
    carousel.classList.add('settling');
    layoutCarousel(cards);
    renderCardDots(birds);
    caption();
  };
  layoutCarousel(cards);
  renderCardDots(birds);
  caption();

  let pid = null, startX = 0, startY = 0, drift = 0, dragging = false, moved = false;
  // Momentum: recent finger positions (in places) to measure the flick's
  // speed on release, and the glide that carries on after it.
  let trail = [], baseDrift = 0, glide = 0, caught = false;
  const placePx = () => CARD_X[1] * 1.6;     // finger travel for one place
  const stopGlide = () => {
    if (!glide) return false;
    cancelAnimationFrame(glide); glide = 0;
    return true;
  };

  carousel.addEventListener('dragstart', (e) => e.preventDefault());
  carousel.addEventListener('pointerdown', (e) => {
    pid = e.pointerId; startX = e.clientX; startY = e.clientY;
    dragging = false; moved = false;
    // A finger on the deck while it's opening snaps it fully open.
    if (deckPos !== 1 || deckSize !== 1) { stopDeckAnimation(1); layoutCarousel(cards); }
    // A finger landing on a gliding deck catches it where it is, and a drag
    // carries on from there; a plain tap just stops it (rather than opening
    // whichever card happened to be passing the middle).
    caught = stopGlide();
    baseDrift = caught ? drift : 0;
    drift = baseDrift;
    trail = [{ t: e.timeStamp, d: drift }];
    carousel.classList.remove('settling');
    try { carousel.setPointerCapture(pid); } catch (err) { /* unsupported */ }
  });

  carousel.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // Let a clearly vertical drag scroll the page instead of turning cards.
    if (!dragging && Math.abs(dx) < 6 && Math.abs(dx) <= Math.abs(dy)) return;
    dragging = true;
    if (Math.abs(dx) > 4) moved = true;
    drift = baseDrift - dx / placePx();
    trail.push({ t: e.timeStamp, d: drift });
    while (trail.length > 2 && e.timeStamp - trail[0].t > 100) trail.shift();
    // Resist dragging past either end so the row feels bounded.
    const limit = 0.45;
    if (selectedCard + drift < -limit) drift = -limit - selectedCard;
    if (selectedCard + drift > cards.length - 1 + limit) drift = cards.length - 1 + limit - selectedCard;
    layoutCarousel(cards, drift);
  });

  const release = (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    try { carousel.releasePointerCapture(e.pointerId); } catch (err) { /* already */ }
    if (moved) {
      // How fast the finger was going as it let go, in places per ms, from
      // the last ~100ms of movement. A finger that stopped before lifting
      // has no speed left to give.
      const last = trail[trail.length - 1], first = trail[0];
      let v = 0;
      if (trail.length > 1 && e.timeStamp - last.t < 60 && last.t > first.t) {
        v = (last.d - first.d) / (last.t - first.t);
      }
      // Where that speed would carry the deck if it slowed steadily to a
      // stop (GLIDE_MS sets how far), rounded to the nearest card.
      const pos = selectedCard + drift;
      let target = Math.round(pos + v * GLIDE_MS);
      // A short, slow push still turns one card, as before. The threshold
      // is a fixed 16px of finger travel, whatever the deck's spread: drift
      // is measured in places, and a place is wider on a bigger phone, so a
      // threshold in places would make the same flick count on a small phone
      // and not on a large one.
      const swipeAt = 16 / placePx();
      const nudge = drift - baseDrift;
      if (target === selectedCard && Math.abs(nudge) > swipeAt) target += Math.sign(nudge);
      target = Math.min(cards.length - 1, Math.max(0, target));
      glideTo(pos, target, v);
      return;
    }
    if (caught) {
      // Tapped to stop a gliding deck: land on whichever card is nearest.
      selectedCard = Math.min(cards.length - 1, Math.max(0, Math.round(selectedCard + drift)));
      drift = 0;
      settle();
      return;
    }
    // A tap: the middle card opens, the ones either side come to the middle.
    // Found by coordinate rather than e.target, because capturing the pointer
    // retargets every event to the carousel itself.
    const at = document.elementFromPoint(e.clientX, e.clientY);
    const hit = at && at.closest ? at.closest('.fan-card') : null;
    const i = hit ? +hit.dataset.i : -1;
    if (i === selectedCard) {
      settle();
      if (hit.classList.contains('tappable')) openBirdFromPack(hit.dataset.name, hit);
      return;
    }
    // Only a sliver of each card behind is showing, which is far too small a
    // target for a small child - so a tap anywhere to one side of the middle
    // card steps one place that way, and a tap that does land on a card
    // brings that card to the middle, two places for the back layer.
    const mid = carousel.getBoundingClientRect();
    const step = i >= 0 ? i - selectedCard
                        : (e.clientX < mid.left + mid.width / 2 ? -1 : 1);
    selectedCard = Math.min(cards.length - 1, Math.max(0, selectedCard + step));
    settle();
  };
  // Carry the deck from `from` to the card at `to`, starting at the finger's
  // own speed and easing out to a stop - so a flick keeps going for a card or
  // few after the thumb lifts. Eased with a cubic ease-out, whose starting
  // speed is 3 x distance / time; the time is picked to match the flick, so
  // there's no jolt as the finger hands over. Each frame re-centres on the
  // nearest card, so the dots and the gold glint track it as it passes.
  function glideTo(from, to, v) {
    const dist = to - from;
    carousel.classList.remove('settling');
    if (!dist || reducedMotion()) {
      selectedCard = to; drift = 0; settle(); return;
    }
    const sameWay = Math.sign(v) === Math.sign(dist);
    const ms = sameWay && Math.abs(v) > 1e-4
      ? Math.min(900, Math.max(260, 3 * Math.abs(dist) / Math.abs(v)))
      : 300;
    const t0 = performance.now();
    let shown = -1;
    const step = (now) => {
      // Switched pack (or tab) mid-glide: this deck is gone, so leave
      // selectedCard to the new one.
      if (!carousel.isConnected) { glide = 0; return; }
      const t = Math.min(1, (now - t0) / ms);
      const pos = from + dist * (1 - Math.pow(1 - t, 3));
      selectedCard = Math.round(pos);
      drift = pos - selectedCard;
      layoutCarousel(cards, drift);
      if (selectedCard !== shown) { shown = selectedCard; renderCardDots(birds); }
      if (t < 1) { glide = requestAnimationFrame(step); return; }
      glide = 0;
      selectedCard = to; drift = 0;
      layoutCarousel(cards);
      renderCardDots(birds);
      caption();
    };
    glide = requestAnimationFrame(step);
  }

  carousel.addEventListener('pointerup', release);
  carousel.addEventListener('pointercancel', () => {
    pid = null;
    selectedCard = Math.min(cards.length - 1, Math.max(0, Math.round(selectedCard + drift)));
    drift = 0;
    settle();
  });
}

// How far a flick carries the deck after the finger lifts: the speed at
// release times this many ms. 180 lets a hard flick run on two or three
// cards and a gentle one just one; raise it for a looser, longer glide.
const GLIDE_MS = 180;

// "Found 3 times! First found on 4 May 2026 in Grandma's garden."
// The location clause is dropped entirely when we don't have a name for the
// spot, rather than printing a placeholder at a child.
function fanCaptionFor(b) {
  if (!b) return '';
  // Not found yet: tell them where to go looking instead.
  if (!b.found) return b.hint || '';
  let text = b.found_count === 1 ? 'Heard once!' : `Heard ${b.found_count} times!`;
  if (b.first_found) {
    const d = new Date(b.first_found);
    if (!isNaN(d)) {
      text += ` First heard on ${d.toLocaleDateString('en-GB', {
        day: 'numeric', month: 'long', year: 'numeric'
      })}`;
      text += b.first_location ? ` in ${b.first_location}.` : '.';
    }
  }
  return text;
}

// Tapping a card lifts it clear of the carousel and spins it; the bird's details
// are on the other side. The spin is done in two halves that hand over at
// 90deg, where the card is edge-on and so has no visible width at all - which
// is what lets the little pack card be swapped for the full detail card
// without anyone seeing it happen. Both halves turn the same way, so it reads
// as one continuous movement.
const FLIP_MS = 210;
const FLIP_LIFT = 2.2;          // how much bigger the card gets as it comes up
let packFlipName = null;        // which bird we spun in from, for the way back

const reducedMotion = () =>
  !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Where a lifted card hovers: middle of the space above the tab bar.
function flipCentre() {
  const nav = document.querySelector('.bottom-nav');
  const floor = nav ? nav.getBoundingClientRect().top : window.innerHeight;
  return { x: window.innerWidth / 2, y: floor / 2 };
}

// A fixed-position stand-in for a fan card, so the spin isn't boxed in by the
// fan row's own stacking and overlap. Sized from the card's untransformed box
// and centred on where it actually sits, since getBoundingClientRect() on a
// tilted, enlarged card reports the bigger rotated box rather than the card.
function makeFlipper(cardEl) {
  const r = cardEl.getBoundingClientRect();
  const w = cardEl.offsetWidth, h = cardEl.offsetHeight;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:${cx - w / 2}px;top:${cy - h / 2}px;` +
    `width:${w}px;height:${h}px;z-index:400;pointer-events:none;`;
  const face = cardEl.cloneNode(true);
    face.style.cssText += ';margin:0;transform:none;transition:none;width:100%;height:100%;';
  host.appendChild(face);
  document.body.appendChild(host);
  const c = flipCentre();
  // Read the scale off the rendered box rather than assuming it - in the
  // carousel a card's size comes from its transform, not its layout.
  const scale = w ? r.width / w : 1;
  return {
    host,
    // resting in the carousel, at whatever size it was sitting at
    rest: `perspective(900px) translate(0px,0px) rotate(0deg) ` +
          `scale(${scale.toFixed(3)}) rotateY(0deg)`,
    // lifted, straightened and turned edge-on
    lifted: `perspective(900px) translate(${c.x - cx}px,${c.y - cy}px) rotate(0deg) ` +
            `scale(${FLIP_LIFT}) rotateY(90deg)`,
  };
}

const play = (el, frames, opts) => el.animate(frames, { fill: 'forwards', ...opts }).finished;
async function openBirdFromPack(commonName, cardEl) {
  if (!commonName) return;
  // Collections can be opened without ever visiting My Birds, in which case
  // the sightings cache is empty and the detail view would silently bail.
  if (!allSightingsRaw.length) {
    try {
      const res = await fetch('/sightings');
      allSightingsRaw = (await res.json()).sightings || [];
    } catch (e) { return; }
  }

  packFlipName = commonName;
  const showDetail = () => {
    renderBirdDetail(commonName, () => renderHabitats({ keepCard: true }));
    // Going back runs the reverse spin. Only this route spins - reaching a
    // bird from My Flock never came off the pack, so it goes straight back.
    setDetailBack(closeBirdToPack);
  };

  if (!cardEl || reducedMotion()) { showDetail(); return; }

  // First half: the card lifts out of the fan, straightens up and turns
  // edge-on.
  const f = makeFlipper(cardEl);
  cardEl.style.visibility = 'hidden';
  await play(f.host, [{ transform: f.rest }, { transform: f.lifted }],
             { duration: FLIP_MS, easing: 'cubic-bezier(.4,0,.7,.35)' });
  f.host.remove();

  showDetail();

  // Second half: the detail card carries on turning from edge-on to face us.
  const detail = document.querySelector('[data-bird-detail]');
  if (detail) {
    play(detail, [
      { transform: 'perspective(900px) rotateY(-90deg) scale(.94)', opacity: .5 },
      { transform: 'perspective(900px) rotateY(0deg) scale(1)', opacity: 1 },
    ], { duration: FLIP_MS + 50, easing: 'cubic-bezier(.25,.7,.4,1)' });
  } else {
    cardEl.style.visibility = '';   // detail bailed - put the card back
  }
}

// The way back: the detail card turns edge-on, then the pack card finishes
// the turn and settles into the fan it came from.
async function closeBirdToPack() {
  const name = packFlipName;
  const detail = document.querySelector('[data-bird-detail]');

  if (reducedMotion() || !detail) { await renderHabitats({ keepCard: true }); return; }

  await play(detail, [
    { transform: 'perspective(900px) rotateY(0deg) scale(1)', opacity: 1 },
    { transform: 'perspective(900px) rotateY(-90deg) scale(.94)', opacity: .5 },
  ], { duration: FLIP_MS, easing: 'cubic-bezier(.4,0,.7,.35)' });

  await renderHabitats({ alreadyOpen: true, keepCard: true });   // awaits the fan, so the card is there to land on

  const card = Array.from(document.querySelectorAll('.fan-card'))
    .find(c => c.dataset.name === name);
  if (!card) return;

  const f = makeFlipper(card);
  card.style.visibility = 'hidden';
  await play(f.host, [{ transform: f.lifted }, { transform: f.rest }],
             { duration: FLIP_MS, easing: 'cubic-bezier(.25,.7,.4,1)' });
  f.host.remove();
  card.style.visibility = '';
}

async function renderHabitats(opts) {
  setActiveTab('habitats');
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="collection-header"><div class="collection-title"><img src="/static/title-collections-v1.webp" alt="Collections" style="height:30px;width:auto;display:block;"></div></div>
    <div class="pack-selector" id="packSelector"></div>
    <div id="packList" style="width:100%;"></div>
  `;
  // Awaited so callers can rely on the fan actually being on screen - the
  // spin back from a bird's details needs its card to exist to land on, so
  // that one asks for the deck already open. The deck opens on the middle
  // card, except when coming back from a bird's card (keepCard), when it
  // opens on that bird. (renderHabitats is also the nav button's click
  // handler, so opts may be a click event.)
  await loadCollectorPacks(!(opts && opts.alreadyOpen), !!(opts && opts.keepCard));
  markSeen('habitats');
}

async function renderTrophies(focusKey) {
  setActiveTab('trophies');
  document.body.classList.add('awards-on');
  // Top-aligned, like Collections and My Flock, for two reasons: the header
  // then sits at the same height as theirs, and the carousel stops moving.
  // Centred, the whole column was balanced about the middle of the screen,
  // so a trophy with a long citation under it pushed the trophy upward - the
  // picture shifted depending on how much text happened to be below it.
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="awards-bg" id="awardsBg"><div class="awards-beam"></div><div class="awards-off"></div></div>
    <div class="collection-header"><div class="collection-title"><img src="/static/title-awards-v2.webp" alt="Awards" style="height:30px;width:auto;display:block;"></div></div>
    <div class="collection-count" id="trophyCount">Loading...</div>
    <div class="trophy-title awards-sign-text" id="trophyTitle"></div>
    <div class="trophy-carousel" id="trophyCarousel"></div>
    <div class="trophy-caption" id="trophyCaption"></div>
  `;

  try {
    const res = await fetch('/trophies');
    const data = await res.json();
    allTrophiesRaw = data.trophies || [];
    // Levels earned, not trophies started - 20 trophies x 3 levels
    const levelsGot = allTrophiesRaw.reduce((n, t) => n + (t.level || 0), 0);
    const levelsTotal = allTrophiesRaw.reduce((n, t) => n + (t.level_count || 7), 0);
    // The rank from all the leaves together, and how far to the next one.
    // (Its badge is in the top bar, which opens the whole ladder.)
    const r = data.rank;
    document.getElementById('trophyCount').textContent = r
      ? `${r.name} · ${levelsGot} of ${levelsTotal} leaves` + (r.next_name ? ` · ${r.to_go} more to ${r.next_name}` : '')
      : `${levelsGot} of ${levelsTotal} levels earned`;
    if (r && currentProfile) { currentProfile.rank = r; paintTopRank(); }

    // Coming back from a trophy's card, that trophy goes back to the front.
    // Otherwise start on the first unearned one - the most useful thing to
    // be looking at. (renderTrophies is also the nav button's click handler,
    // so focusKey can be a click event; only a string counts.)
    const focused = typeof focusKey === 'string' ? allTrophiesRaw.findIndex(t => t.key === focusKey) : -1;
    const firstLocked = allTrophiesRaw.findIndex(t => !t.earned);
    trophyIndex = focused >= 0 ? focused : (firstLocked === -1 ? 0 : firstLocked);

    const carousel = document.getElementById('trophyCarousel');
    carousel.innerHTML = allTrophiesRaw.map((t, i) => `
      <div class="trophy-slide ${t.earned ? 'earned' : 'locked'}" data-i="${i}">
        ${trophyArt(t)}
      </div>
    `).join('');
    attachTrophySwipe(carousel);
    layoutTrophyCarousel();
    layoutAwardsScene();
    markSeen('trophies');
    showTutorial('trophies', 400);
  } catch (e) {
    const c = document.getElementById('trophyCarousel');
    if (c) c.outerHTML = `<div class="collection-empty">Couldn't load trophies right now.</div>`;
  }
}

// Where the trophies sit: the deck's card positions (deckOffsets), spread a
// little wider. A trophy is wider for its height than a card, so at the
// cards' spacing the ones behind crowd the front one. The first layer moves
// out by a third; the second as far as it can while staying on screen.
let TROPHY_X = trophyOffsets(390);
function trophyOffsets(width) {
  const d = deckOffsets(width);
  const x1 = d[1] * 1.35;
  const x2 = Math.min(d[2] * 1.15, width / 2 - CARD_HALF * CARD_SCALE[2]);
  return [0, x1, x2, x2 + 18];
}

// `drift` is how far the row has been dragged (or is gliding), in places, so
// the trophies can sit part-way between two positions.
function layoutTrophyCarousel(drift = 0) {
  const slides = document.querySelectorAll('.trophy-slide');
  const row = document.getElementById('trophyCarousel');
  if (row && row.clientWidth) TROPHY_X = trophyOffsets(row.clientWidth);
  slides.forEach((el, i) => {
    const offset = i - trophyIndex - drift;
    const abs = Math.abs(offset);
    // The deck's own positions and scales (CARD_SCALE): the front trophy at
    // the front card's size and place, two layers behind it either side,
    // and a third that fades out as it tucks in behind them.
    const x = Math.sign(offset) * deckAt(TROPHY_X, abs);
    const scale = deckAt(CARD_SCALE, abs);
    el.style.transform =
      `translate(-50%,-50%) translateX(${x.toFixed(2)}px) scale(${scale.toFixed(3)})`;
    el.style.opacity = String(Math.max(0, Math.min(1, (2.75 - abs) / 0.75)).toFixed(3));
    el.style.zIndex = String(100 - Math.round(abs * 10));
    el.style.pointerEvents = abs > 2.5 ? 'none' : 'auto';
    el.classList.toggle('front', Math.round(offset) === 0 && abs < 0.5);
  });
  renderTrophyCaption();
}

// The caption only changes when a different trophy reaches the front, so it
// isn't rebuilt on every frame of a drag.
let trophyCaptionFor = -1;
function renderTrophyCaption() {
  if (trophyCaptionFor === trophyIndex && document.getElementById('trophyCaption')?.childElementCount) return;
  trophyCaptionFor = trophyIndex;
  const t = allTrophiesRaw[trophyIndex];
  const caption = document.getElementById('trophyCaption');
  const title = document.getElementById('trophyTitle');
  // The name and level sit above the row, the trophy's citation and what
  // the next level needs below it.
  // The spotlight is on for a trophy that's been won, and goes out for one
  // that hasn't.
  const scene = document.getElementById('awardsBg');
  if (t && scene) scene.classList.toggle('lights-off', !t.earned);
  if (t && title) {
    title.innerHTML = `<span class="trophy-caption-name">${t.earned ? t.name : icon('mystery')}</span>
      ${t.earned ? `<span class="trophy-level">Level ${t.level}</span>` : ''}`;
  }
  if (t && caption) {
    const progressLine = t.maxed
      ? 'All seven levels complete!'
      : `${t.requirement} &nbsp;·&nbsp; ${Math.min(t.progress, t.next_target)}/${t.next_target}`;
    caption.innerHTML = `
      ${t.earned && t.citation ? `<div class="trophy-caption-req">${t.citation}</div>` : ''}
      <div class="trophy-caption-next">${progressLine}</div>
      ${t.earned ? '<div class="trophy-caption-tap">Tap for more</div>' : ''}
    `;
  }
  placeAwardsCaption();
  fitAwardsSign();
}

// Every trophy's name, with its Level pill, on one line of the plank: a
// long name steps the type down a pixel at a time until it fits.
function fitAwardsSign() {
  const title = document.getElementById('trophyTitle');
  if (!title || !title.classList.contains('awards-sign-text')) return;
  title.style.removeProperty('--sign-font');
  const content = () => [...title.children].reduce((w, el) => w + el.offsetWidth, 0)
    + parseFloat(getComputedStyle(title).columnGap || 0) * Math.max(0, title.children.length - 1);
  for (let px = 21; px > 12 && content() > title.clientWidth - 8; px--) {
    title.style.setProperty('--sign-font', (px - 1) + 'px');
  }
}

// --- The treehouse ---------------------------------------------------------
// The Awards scene is one see-through painting: the arch, the sign hanging
// from it, the tree-stump podium and the floor. Measured on the 942 x 1669
// picture:
//   sign     - the plank's writing area, where the trophy's name goes
//   standX/Y - the middle of the stump's top, where the front trophy stands
//   faceY    - a little way down the stump's face, where the caption starts
//   top      - just above the plank (the ropes fade out above it)
//   floor    - just below the stones round the stump's foot. The floor
//              boards carry on below that and simply pass behind the nav bar.
const AWARDS_BG = {
  w: 942, h: 1669,
  sign: { l: 200, t: 150, r: 740, b: 292 },
  standX: 471, standY: 1040, faceY: 1130, top: 110, floor: 1420,
};
let awardsGeom = null;
let awardsSceneBox = null;   // where the scene was last drawn, for the trophy card

// Full width where the phone has the height for it - a touch wider than
// the screen, so the cut-off edges stay off it. On a shorter phone it
// shrinks just enough to fit between the levels count and the nav bar; its
// edges are painted to fade out, so the narrower scene melts into the
// background either side rather than stopping at a hard line.
function layoutAwardsScene() {
  const bg = document.getElementById('awardsBg');
  const row = document.getElementById('trophyCarousel');
  const pane = document.getElementById('scroller');
  const count = document.getElementById('trophyCount');
  if (!bg || !row || !pane || !count) { awardsGeom = null; return; }
  const B = AWARDS_BG;
  const vw = window.innerWidth;
  const navTop = pane.getBoundingClientRect().bottom;
  // Always full width. When the screen is short, the floor slides down
  // behind the nav bar (up to 160 picture units) rather than the scene
  // shrinking; only a very short phone makes it shrink.
  const ceiling = count.getBoundingClientRect().bottom + 6;
  const room = navTop - 4 - ceiling;
  const sc = Math.min(vw * 1.04 / B.w, room / (B.floor - 160 - B.top));
  const w = B.w * sc, h = B.h * sc;
  const left = (vw - w) / 2;
  const top = Math.max(navTop - 4 - B.floor * sc, ceiling - B.top * sc);
  awardsSceneBox = { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px' };
  Object.assign(bg.style, awardsSceneBox);
  const at = (x, y) => ({ x: left + x * sc, y: top + y * sc });
  awardsGeom = { standY: at(0, B.standY).y, faceY: at(0, B.faceY).y };

  // The trophy's name on the painted sign.
  const title = document.getElementById('trophyTitle');
  if (title) {
    const p = at(B.sign.l, B.sign.t), q = at(B.sign.r, B.sign.b);
    Object.assign(title.style, { left: p.x + 'px', top: p.y + 'px', width: (q.x - p.x) + 'px', height: (q.y - p.y) + 'px' });
    fitAwardsSign();
  }

  // Stand the front trophy on the stump: move the row so the trophy's base
  // (the row's middle plus half the trophy's height at the front's size)
  // lands on standY. Its height comes from its width and the art's fixed
  // 369 x 390 shape, because this runs before the pictures have loaded.
  const art = row.querySelector('.trophy-art');
  if (!art) return;
  row.style.marginTop = '';
  const r = row.getBoundingClientRect();
  const artH = art.offsetWidth * 390 / 369;
  const base = r.top + row.clientHeight / 2 + artH * CARD_SCALE[0] / 2;
  const margin = parseFloat(getComputedStyle(row).marginTop) || 0;
  row.style.marginTop = (margin + awardsGeom.standY - base) + 'px';
  placeAwardsCaption();
}

// The description and progress go on the stump's face, under the trophy -
// dark wood that white type reads well against - or as near as fits above
// the nav bar.
function placeAwardsCaption() {
  const caption = document.getElementById('trophyCaption');
  const sc = document.getElementById('scroller');
  if (!caption || !sc || !awardsGeom) return;
  caption.style.marginTop = '';
  const now = caption.getBoundingClientRect().top;
  const margin = parseFloat(getComputedStyle(caption).marginTop) || 0;
  // 20px is the scroll pane's own bottom padding: any lower and the page
  // would scroll by those few pixels.
  const floor = sc.getBoundingClientRect().bottom - 20 - caption.offsetHeight;
  const want = Math.min(awardsGeom.faceY, floor);
  caption.style.marginTop = (margin + want - now) + 'px';
}
window.addEventListener('resize', () => { if (document.getElementById('awardsBg')) layoutAwardsScene(); });

// The trophy row moves the same way as the Collections deck: it follows the
// finger, a flick hands its speed on so the row glides a trophy or few
// further (GLIDE_MS, shared with the deck), and it eases to a stop on the
// nearest one. Pointer events cover touch and mouse alike.
function attachTrophySwipe(carousel) {
  const count = () => allTrophiesRaw.length;
  const placePx = () => TROPHY_X[1] * 1.6;   // finger travel for one trophy, as the deck
  let pid = null, startX = 0, startY = 0, drift = 0, baseDrift = 0;
  let dragging = false, moved = false, caught = false, trail = [], glide = 0;
  const clamp = (i) => Math.min(count() - 1, Math.max(0, i));
  const land = (i) => {
    trophyIndex = clamp(i); drift = 0;
    carousel.classList.remove('live');
    layoutTrophyCarousel();
  };

  carousel.addEventListener('dragstart', (e) => e.preventDefault());
  carousel.addEventListener('pointerdown', (e) => {
    pid = e.pointerId; startX = e.clientX; startY = e.clientY;
    dragging = false; moved = false;
    caught = !!glide;
    if (glide) { cancelAnimationFrame(glide); glide = 0; }
    baseDrift = caught ? drift : 0;
    drift = baseDrift;
    trail = [{ t: e.timeStamp, d: drift }];
    try { carousel.setPointerCapture(pid); } catch (err) { /* unsupported */ }
  });

  carousel.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    // A clearly vertical drag scrolls the page instead.
    if (!dragging && Math.abs(dx) < 6 && Math.abs(dx) <= Math.abs(dy)) return;
    dragging = true;
    if (Math.abs(dx) > 4) moved = true;
    carousel.classList.add('live');
    drift = baseDrift - dx / placePx();
    trail.push({ t: e.timeStamp, d: drift });
    while (trail.length > 2 && e.timeStamp - trail[0].t > 100) trail.shift();
    // Resist dragging past either end.
    const limit = 0.45;
    if (trophyIndex + drift < -limit) drift = -limit - trophyIndex;
    if (trophyIndex + drift > count() - 1 + limit) drift = count() - 1 + limit - trophyIndex;
    layoutTrophyCarousel(drift);
  });

  // Glide from `from` to trophy `to`, starting at the flick's speed and
  // easing out (the same cubic ease-out as the deck).
  const glideTo = (from, to, v) => {
    const dist = to - from;
    if (!dist || reducedMotion()) { land(to); return; }
    carousel.classList.add('live');
    const sameWay = Math.sign(v) === Math.sign(dist);
    const ms = sameWay && Math.abs(v) > 1e-4
      ? Math.min(900, Math.max(260, 3 * Math.abs(dist) / Math.abs(v)))
      : 300;
    const t0 = performance.now();
    const step = (now) => {
      if (!carousel.isConnected) { glide = 0; return; }
      const t = Math.min(1, (now - t0) / ms);
      const pos = from + dist * (1 - Math.pow(1 - t, 3));
      trophyIndex = Math.round(pos);
      drift = pos - trophyIndex;
      layoutTrophyCarousel(drift);
      if (t < 1) { glide = requestAnimationFrame(step); return; }
      glide = 0;
      land(to);
    };
    glide = requestAnimationFrame(step);
  };

  carousel.addEventListener('pointerup', (e) => {
    if (e.pointerId !== pid) return;
    pid = null;
    try { carousel.releasePointerCapture(e.pointerId); } catch (err) { /* already */ }
    if (moved) {
      const last = trail[trail.length - 1], first = trail[0];
      let v = 0;
      if (trail.length > 1 && e.timeStamp - last.t < 60 && last.t > first.t) {
        v = (last.d - first.d) / (last.t - first.t);
      }
      const pos = trophyIndex + drift;
      let target = Math.round(pos + v * GLIDE_MS);
      // A short push still turns one trophy (16px of travel, as the deck).
      const nudge = drift - baseDrift;
      if (target === trophyIndex && Math.abs(nudge) > 16 / placePx()) target += Math.sign(nudge);
      glideTo(pos, clamp(target), v);
      return;
    }
    // A tap on a gliding row just stops it, on the nearest trophy.
    if (caught) { land(Math.round(trophyIndex + drift)); return; }
    // A tap: a side trophy comes to the front; the front one opens its
    // detail, but only once it's been earned. Found by coordinate, because
    // capturing the pointer retargets the event to the row itself.
    const at = document.elementFromPoint(e.clientX, e.clientY);
    const hit = at && at.closest ? at.closest('.trophy-slide') : null;
    if (!hit) return;
    const i = +hit.dataset.i;
    if (i !== trophyIndex) land(i);
    else if (allTrophiesRaw[i].earned) renderTrophyDetail(allTrophiesRaw[i].key);
  });
  carousel.addEventListener('pointercancel', () => { pid = null; land(Math.round(trophyIndex + drift)); });
}

async function shareBird(bird) {
  const text = `I heard a ${birdName(bird.common_name)} on Warble!`;
  try {
    if (navigator.share) {
      await navigator.share({ title: 'Warble', text });
    } else {
      // Web Share isn't available on all browsers (notably desktop Firefox),
      // so fall back to the clipboard rather than doing nothing.
      await navigator.clipboard.writeText(text);
      alert('Copied to your clipboard!');
    }
  } catch (e) {
    return;   // user cancelled the share sheet - not an achievement
  }
  try {
    // One share per bird per day counts towards Wingman.
    const shareForm = new FormData();
    shareForm.append('common_name', bird.common_name);
    const res = await fetch('/trophies/wingman', { method: 'POST', body: shareForm });
    const data = await res.json();
    celebrateTrophies(data.newly_earned_trophies, document.getElementById('shareBirdBtn'), data.rank_up);
  } catch (e) { /* sharing worked; the trophy can wait */ }
}

function renderTrophyDetail(trophyKey) {
  const trophy = allTrophiesRaw.find(t => t.key === trophyKey);
  if (!trophy || !trophy.earned) return;

  // No Back button: like the bird card, a tap anywhere goes back - to the
  // trophy row, with this trophy still at the front.
  // The treehouse stays where it was, dimmed a little, and the card hovers
  // in front of it.
  stage.innerHTML = `
    <div class="awards-bg" id="awardsBg"><div class="awards-beam"></div><div class="awards-off"></div></div>
    <div class="awards-veil"></div>
    <div class="woodframe detail-wood trophy-card-hover" data-bird-detail>
    <div class="detail-card" style="--tier-color:var(--sage-dk);">
      <div class="trophy-hero">
        <div class="trophy-hero-art">${trophyArt(trophy)}</div>
      </div>
      <div class="detail-body">
        <div class="detail-name trophy-card-title">${trophy.name}
          <span class="trophy-card-level">Level ${trophy.level}</span></div>
        <div class="detail-sci" style="font-style:normal;color:var(--wood-edge);font-weight:700;">${trophy.citation}</div>
        <div class="detail-desc">${trophy.description}</div>
      </div>
    </div>
    </div>
  `;
  if (awardsSceneBox) Object.assign(document.getElementById('awardsBg').style, awardsSceneBox);
  setDetailBack(() => renderTrophies(trophyKey));
}
</script>
