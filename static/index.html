function paintFlockStats() {
  const el = document.getElementById('flockStats');
  const compact = document.getElementById('flockCompactTitle');
  if (!el) return;
  const species = collectionBirds.length;
  const shown = flockView === 'history' ? visibleSightings().length : visibleBirds().length;
  const narrowed = flockQuery.trim() || activeFilterCount();

  if (flockView === 'history') {
    el.innerHTML = narrowed
      ? `<b>${shown}</b> of ${allSightingsRaw.length} detections`
      : `<b>${species}</b> species · <b>${allSightingsRaw.length}</b> detections`;
  } else {
    el.innerHTML = narrowed
      ? `<b>${shown}</b> of ${species} species`
      : `<b>${species}</b> species · <b>${allSightingsRaw.length}</b> detections`;
  }
  if (compact) compact.textContent = `My Flock · ${narrowed ? shown : species}`;
}

function flockEmpty(html) {
  const grid = document.getElementById('collectionGrid');
  if (grid) grid.innerHTML = `<div class="collection-empty" style="grid-column:1/-1;">${html}</div>`;
}

function paintBirds() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.className = 'collection-grid' + (flockDensity === 'large' ? ' large' : '');

  if (!collectionBirds.length) {
    flockEmpty(`<b>No birds yet!</b>Tap the big button on Home and listen for a
                bird. Every one Warble hears lands here.`);
    return;
  }
  const birds = visibleBirds();
  if (!birds.length) {
    if (flockQuery.trim()) {
      flockEmpty(`<b>No birds found in your flock.</b>Nothing matches
                  “${escapeFlock(flockQuery.trim())}”.`);
    } else {
      flockEmpty(`<b>Nothing matches those filters.</b>None of your birds fit
        what you picked.<button class="flock-ctl" id="flockResetEmpty">Reset filters</button>`);
      const btn = document.getElementById('flockResetEmpty');
      if (btn) btn.onclick = () => { flockFilters = {}; paintFlock(); };
    }
    return;
  }
  shuffleCollectionTo(birds);
}

function paintHistory() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.className = '';           // a list, not a grid
  grid.style.width = '100%';

  if (!allSightingsRaw.length) {
    flockEmpty(`<b>Nothing heard yet.</b>Every bird Warble picks up will show
                up here, newest first.`);
    return;
  }
  const rows = visibleSightings();   // already newest-first from the backend
  if (!rows.length) {
    flockEmpty(flockQuery.trim()
      ? `<b>No birds found in your flock.</b>Nothing matches “${escapeFlock(flockQuery.trim())}”.`
      : `<b>Nothing matches those filters.</b>Try fewer of them.`);
    return;
  }

  // Group first, then render, so each day knows its own count before its
  // header is written.
  const days = [];
  for (const s of rows) {
    const when = new Date(s.created_at);
    // Keyed by the actual date, not the label: "Today" becomes "Yesterday"
    // tomorrow, and a day left folded should stay folded under its new name.
    const key = when.getFullYear() + '-' + (when.getMonth() + 1) + '-' + when.getDate();
    if (!days.length || days[days.length - 1].key !== key) {
      days.push({ key, label: dayLabel(when), rows: [] });
    }
    days[days.length - 1].rows.push({ s, when });
  }

  grid.innerHTML = days.map(d => {
    const shut = dayIsShut(d.key, days.indexOf(d));
    const body = d.rows.map(({ s, when }) => {
      // Only real metadata: a sighting with no named location says nothing
      // rather than "Unknown".
      const band = CONFIDENCE_BANDS.find(b => b.test(s.confidence));
      const meta = [s.location_name, band && band.label].filter(Boolean).join(' · ');
      return `
        <div class="hist-row woodframe" data-name="${escapeFlock(s.common_name)}">
          <div class="hist-time">${when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
          ${s.image_url ? `<img ${birdImg(s.image_url, 96)} alt="">` : '<div class="hist-thumb"></div>'}
          <div class="hist-text">
            <div class="hist-name">${s.common_name}</div>
            ${meta ? `<div class="hist-meta">${meta}</div>` : ''}
          </div>
        </div>`;
    }).join('');
    return `
      <div class="hist-group ${shut ? 'shut' : ''}" data-day="${d.key}">
        <button class="hist-day" aria-expanded="${!shut}">
          <span>${d.label}</span>
          <span class="hist-day-count">${d.rows.length}</span>
          ${CHEVRON_ICON}
        </button>
        <div class="hist-body">${body}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.hist-group').forEach(group => {
    const body = group.querySelector('.hist-body');
    // Folded groups start at zero; open ones are left with no max-height at
    // all, so a group can grow later without being clipped by a stale number.
    body.style.maxHeight = group.classList.contains('shut') ? '0px' : '';
    group.querySelector('.hist-day').onclick = () => toggleHistoryDay(group);
  });
  grid.querySelectorAll('.hist-row').forEach(el => {
    el.onclick = () => renderBirdDetail(el.dataset.name);
  });
}

const CHEVRON_ICON = `<svg class="hist-chev" viewBox="0 0 24 24" fill="none"
  stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
  aria-hidden="true"><path d="M5 9 L12 16 L19 9"/></svg>`;

// max-height rather than a class, because the height is only knowable once
// the rows are on the page - and it has to be cleared again afterwards so an
// open group is not capped at whatever it measured.
function toggleHistoryDay(group) {
  const body = group.querySelector('.hist-body');
  const key = group.dataset.day;
  const opening = group.classList.contains('shut');

  if (reducedMotion()) {
    group.classList.toggle('shut', !opening);
    body.style.maxHeight = opening ? '' : '0px';
  } else if (opening) {
    group.classList.remove('shut');
    body.style.maxHeight = body.scrollHeight + 'px';
    body.addEventListener('transitionend', function done(e) {
      if (e.propertyName !== 'max-height') return;
      body.style.maxHeight = '';
      body.removeEventListener('transitionend', done);
    });
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';   // pin it, then collapse
    requestAnimationFrame(() => {
      group.classList.add('shut');
      body.style.maxHeight = '0px';
    });
  }

  flockDayChoice.set(key, !opening);
  group.querySelector('.hist-day').setAttribute('aria-expanded', String(opening));
  setFoldLabel();
}

// Only the newest day starts open. A long history is mostly days you are not
// looking for, and the one you want when you open the screen is today's.
function dayIsShut(key, index) {
  return flockDayChoice.has(key) ? flockDayChoice.get(key) : index !== 0;
}

// Which way the Collapse/Expand all button should go: if anything at all is
// open, the useful action is to shut it.
function historyDayKeys() {
  return [...document.querySelectorAll('.hist-group')].map(g => g.dataset.day);
}

// Reads the choices, not the classes. Collapsing a day adds its class inside
// a requestAnimationFrame so the height has something to animate from, so for
// one frame the DOM still says open - long enough for the button to label
// itself "Collapse all" when nothing is left to collapse.
function anyHistoryDayOpen() {
  return [...document.querySelectorAll('.hist-group')]
    .some((g, i) => !dayIsShut(g.dataset.day, i));
}

function toggleAllHistoryDays() {
  const shutThem = anyHistoryDayOpen();
  historyDayKeys().forEach(k => flockDayChoice.set(k, shutThem));
  paintFlock();
  // Collapsing throws away most of the page's height. Without this you are
  // left wherever your old scroll position happens to land, which is usually
  // the bottom of a now very short list.
  if (shutThem) {
    const grid = document.getElementById('collectionGrid');
    const bar = document.getElementById('flockBar');
    if (grid && bar) {
      const top = window.scrollY + grid.getBoundingClientRect().top - bar.offsetHeight - 6;
      window.scrollTo({ top: Math.max(0, top), behavior: reducedMotion() ? 'auto' : 'smooth' });
    }
  }
}

function dayLabel(d) {
  const midnight = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((midnight(new Date()) - midnight(d)) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: 'long' });
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
}

// --- Bird photographs ------------------------------------------------------
// Wikimedia serves any width of the same file: a thumbnail URL carries its
// own width in the filename, so asking for a different size is a rewrite of
// the URL, not another request to the API. What the backend stores is
// whatever Wikipedia's summary endpoint handed over, which is 320px wide -
// soft on a detail photo shown at 358 CSS px on a 3x screen. So every place
// that shows a bird asks for the size it actually draws at.
//
// It only ever asks for MORE. A surface smaller than 320px keeps the stored
// URL rather than fetching a tidier little copy of the same bird: the saving
// is a few KB and the cost is a second file, where as it stands the card
// grid and the history thumbnails all share one already-cached image.
//
// Only Wikimedia thumbnails are touched. A child's own photo is a data URL
// and an original (rather than a thumbnail) has no width in its name, so
// both fall straight through.
function birdPhoto(url, width) {
  if (!url || url.indexOf('upload.wikimedia.org') < 0) return url;
  const cut = url.lastIndexOf('/');
  if (cut < 0) return url;
  // 320px-Foo.jpg, and the odd lossy-page1-320px-Foo.tif.jpg
  const m = url.slice(cut + 1).match(/^(.*?)(\d+)px-(.+)$/);
  if (!m || +m[2] >= width) return url;
  return url.slice(0, cut + 1) + m[1] + width + 'px-' + m[3];
}

// Wikimedia will not upscale past a file's real size, so a bird whose source
// photo is smaller than we asked for comes back as an error. The original URL
// rides along in data-fallback and is swapped back in once - better a
// slightly soft photo than a broken one. error does not bubble, hence the
// capture phase, and one listener covers every image in the app.
document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.dataset.fallback) return;
  const back = img.dataset.fallback;
  delete img.dataset.fallback;
  img.src = back;
}, true);

// src plus, where the URL was rewritten, the original to fall back to.
function birdImg(url, width) {
  const up = birdPhoto(url, width);
  return up === url
    ? `src="${escapeFlock(url)}"`
    : `src="${escapeFlock(up)}" data-fallback="${escapeFlock(url)}"`;
}

function escapeFlock(t) {
  return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// --- the sheets ------------------------------------------------------------
function openSheet(title, body, onClose) {
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet"><div class="sheet-grip"></div>
    <div class="sheet-title">${title}</div>${body}</div>`;
  const close = () => { wrap.remove(); if (onClose) onClose(); };
  wrap.onclick = e => { if (e.target === wrap) close(); };
  document.body.appendChild(wrap);
  return { wrap, close };
}

function openSortSheet() {
  if (flockView === 'history') return;
  const body = FLOCK_SORTS.map(r => `
    <button class="sheet-opt ${r.id === flockSort ? 'on' : ''}" data-sort="${r.id}">
      ${r.label}${r.id === flockSort ? '<span class="tick">✓</span>' : ''}
    </button>`).join('');
  const sheet = openSheet('Sort your flock', body);
  sheet.wrap.querySelectorAll('[data-sort]').forEach(b => {
    b.onclick = () => {
      flockSort = b.dataset.sort;
      remember('flockSort', flockSort);
      sheet.close();
      paintFlock();
    };
  });
}

// Filter options come out of the collection itself, so you are never offered
// a month you have never been out in or a place you have never recorded.
function flockFacetValues(facet) {
  const counts = new Map();
  for (const s of allSightingsRaw) {
    for (const v of facet.of(s)) counts.set(v, (counts.get(v) || 0) + 1);
  }
  const vals = [...counts.keys()];
  vals.sort(facet.order ? (a, b) => facet.order(a) - facet.order(b)
                        : (a, b) => a.localeCompare(b));
  return vals;
}

function openFilterSheet() {
  const before = JSON.stringify(flockFilters);
  const groups = FLOCK_FACETS.map(f => {
    const vals = flockFacetValues(f);
    if (vals.length < 2) return '';      // nothing to choose between
    return `<div class="sheet-group">${f.label}</div>
      <div class="sheet-chips">${vals.map(v => `
        <button class="sheet-chip ${(flockFilters[f.id] || []).includes(v) ? 'on' : ''}"
                data-facet="${f.id}" data-value="${escapeFlock(v)}">${escapeFlock(v)}</button>`).join('')}
      </div>`;
  }).join('');

  const body = (groups || `<div style="color:var(--mist-dk);font-size:13px;">
      There is not enough in your flock to filter yet — find a few more birds.</div>`) +
    `<div class="sheet-actions">
       <button class="sheet-reset" id="flockReset">Reset</button>
       <button class="sheet-done" id="flockDone"></button>
     </div>`;

  const sheet = openSheet('Filter your flock', body, () => paintFlock());

  const refresh = () => {
    sheet.wrap.querySelectorAll('[data-facet]').forEach(c => {
      c.classList.toggle('on', (flockFilters[c.dataset.facet] || []).includes(c.dataset.value));
    });
    const n = flockView === 'history' ? visibleSightings().length : visibleBirds().length;
    sheet.wrap.querySelector('#flockDone').textContent =
      flockView === 'history' ? `Show ${n} detection${n === 1 ? '' : 's'}`
                              : `Show ${n} species`;
  };

  sheet.wrap.querySelectorAll('[data-facet]').forEach(c => {
    c.onclick = () => {
      const { facet, value } = c.dataset;
      const list = flockFilters[facet] || [];
      flockFilters[facet] = list.includes(value)
        ? list.filter(v => v !== value) : [...list, value];
      refresh();
    };
  });
  sheet.wrap.querySelector('#flockReset').onclick = () => { flockFilters = {}; refresh(); };
  sheet.wrap.querySelector('#flockDone').onclick = sheet.close;
  refresh();
  if (before !== JSON.stringify(flockFilters)) paintFlock();
}

// --- cards -----------------------------------------------------------------
// No pack dot. My Flock treats every bird alike - which pack it came from is
// the collector packs' business, and the marker was leaving a hole in the
// corner of the photograph.
function collectionCardHtml(bird) {
  return `
    <div class="collection-item woodframe"
         data-name="${escapeFlock(bird.common_name)}" data-key="${escapeFlock(bird.key || bird.common_name)}">
      ${bird.image_url ? `<img ${birdImg(bird.image_url, flockDensity === 'large' ? 400 : 260)} alt="">` : '<div class="ci-blank"></div>'}
      <div class="ci-name">${bird.common_name}</div>
    </div>`;
}

function bindCollectionCards() {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;
  grid.querySelectorAll('.collection-item').forEach(el => {
    el.onclick = () => renderBirdDetail(el.dataset.name);
  });
}

// FLIP: measure where every card is now, re-render in the new order, then
// animate each from its old position to its new one. Doing it this way means
// the cards genuinely slide between positions rather than the grid snapping.
// Cards that were not there before (a search being cleared) simply appear.
function shuffleCollectionTo(sorted) {
  const grid = document.getElementById('collectionGrid');
  if (!grid) return;

  const before = new Map();
  grid.querySelectorAll('.collection-item').forEach(el => {
    before.set(el.dataset.key, el.getBoundingClientRect());
  });

  grid.innerHTML = sorted.map(collectionCardHtml).join('');
  bindCollectionCards();
  if (reducedMotion()) return;

  grid.querySelectorAll('.collection-item').forEach((el, i) => {
    const old = before.get(el.dataset.key);
    if (!old) return;
    const now = el.getBoundingClientRect();
    const dx = old.left - now.left;
    const dy = old.top - now.top;
    if (!dx && !dy) return;
    // Start it back where it was, then let it travel to its real place
    el.style.transform = `translate(${dx}px, ${dy}px)`;
    el.style.transition = 'none';
    requestAnimationFrame(() => {
      el.style.transition = `transform .5s cubic-bezier(.34,1.1,.64,1) ${Math.min(i * 12, 180)}ms`;
      el.style.transform = '';
    });
  });
}

async function loadCollection() {
  try {
    const res = await fetch('/sightings');
    const data = await res.json();
    allSightingsRaw = data.sightings || [];

    // The backend logs every individual detection - collapse that down to one
    // entry per species for the Birds view, keeping the most recent (the list
    // arrives newest-first) but remembering when it was FIRST found, when it
    // was LAST heard and how many times, which is what the sorts run on.
    const seen = new Map();
    for (const s of allSightingsRaw) {
      const key = s.common_name;
      if (!seen.has(key)) {
        seen.set(key, { ...s, key, first_found: s.created_at, last_found: s.created_at, times_heard: 1 });
      } else {
        // Still newer-to-older, so each later row is an earlier sighting
        const b = seen.get(key);
        b.first_found = s.created_at;
        b.times_heard++;
      }
    }
    collectionBirds = [...seen.values()];
    paintFlock();
  } catch (e) {
    const stats = document.getElementById('flockStats');
    if (stats) stats.textContent = '';
    flockEmpty(`Couldn't load your collection right now.`);
  }
}

function renderBirdDetail(commonName, onBack) {
  // onBack lets Collections send you back to Collections rather than My Birds
  setActiveTab(onBack ? 'habitats' : 'collection');
  const matches = allSightingsRaw.filter(s => s.common_name === commonName);
  if (matches.length === 0) return;

  const latest = matches[0]; // list arrives newest-first
  const firstFound = matches[matches.length - 1];
  const firstDate = new Date(firstFound.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
  const locationNames = [...new Set(matches.map(m => m.location_name).filter(Boolean))];
  const locationTags = locationNames.map(name => `<span class="location-tag">📍 ${name}</span>`).join('');

  stage.innerHTML = `
    <div style="width:100%;margin-bottom:14px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="detail-card">
      <div class="detail-photo-wrap">
        <div class="detail-photo-strip" id="detailPhotoStrip">
          ${latest.image_url ? `<img class="detail-photo" ${birdImg(latest.image_url, 800)}>` : `<div class="detail-photo"></div>`}
        </div>
        <div class="detail-photo-dots" id="detailPhotoDots"></div>
        <label class="add-photo-btn" for="birdPhotoInput">+</label>
        <input type="file" id="birdPhotoInput" accept="image/*" style="display:none">
      </div>
      <div class="detail-body">
        <div class="detail-name">${latest.common_name}</div>
        ${currentProfile.show_scientific_names !== false ? `<div class="detail-sci">${latest.scientific_name}</div>` : ''}
        <div class="card-tags detail-tier-row" style="margin-top:10px;">
          <span class="detail-actions">
            ${latest.call_url ? `<button class="play-call-btn play-call-inline" data-call-url="${latest.call_url}">▶ Hear its call</button>` : ''}
            <button class="share-bird-btn" id="shareBirdBtn">Share this bird</button>
            ${latest.bird?.is_migratory ? `<button class="migrator-btn" id="migratorBtn">✈️ Migrator</button>` : ''}
          </span>
        </div>
        <div class="detail-stats">
          <div>
            <div class="detail-stat-num">${matches.length}</div>
            <div class="detail-stat-label">Time${matches.length === 1 ? '' : 's'} found</div>
          </div>
          <div>
            <div class="detail-stat-num">${firstDate}</div>
            <div class="detail-stat-label">First found</div>
          </div>
        </div>
        ${locationTags ? `<div class="location-tags">${locationTags}</div>` : ''}
        ${buildCoreTiles(latest.bird)}
        ${buildStatBars(latest.bird)}
        ${buildConservation(latest.bird)}
        ${(!latest.bird?.conservation_status && latest.description) ? `<div class="detail-desc">${latest.description}</div>` : ''}
        <a class="learn-more" href="${wikipediaUrl(latest.scientific_name)}" target="_blank" rel="noopener">Learn more →</a>
        <button class="remove-bird-btn" id="removeBirdBtn">Not this bird? Remove it</button>
      </div>
    </div>
  `;
  document.getElementById('removeBirdBtn').onclick = async () => {
    if (!confirm(`Remove ${commonName} from your collection?\n\nUse this if it was heard wrong. Your feathers are kept.`)) return;
    try {
      await fetch(`/species/${encodeURIComponent(commonName)}/delete`, { method: 'POST' });
      renderCollection();
    } catch (e) { alert("Couldn't remove that bird right now."); }
  };
  const playBtn = stage.querySelector('.play-call-btn');
  if (playBtn) playBtn.onclick = () => playBirdCall(playBtn.dataset.callUrl, playBtn);
  const shareBtn = document.getElementById('shareBirdBtn');
  if (shareBtn) shareBtn.onclick = () => shareBird(latest);
  const migratorBtn = document.getElementById('migratorBtn');
  if (migratorBtn) migratorBtn.onclick = () => renderMigrationCard(commonName, () => renderBirdDetail(commonName, onBack));
  document.getElementById('backBtn').onclick = onBack || renderCollection;

  document.getElementById('birdPhotoInput').onchange = (e) => {
    if (e.target.files && e.target.files[0]) handleBirdPhotoChosen(e.target.files[0], commonName);
  };
  loadBirdPhotos(commonName);
}

// Photos the child took themselves, appended to the hero photo strip after
// the Wikipedia photo (or blank placeholder) that's always slide one. The
// strip only actually scrolls once there's something to scroll to - with
// zero self-taken photos it looks exactly like the single static photo it
// used to be. Re-fetched fresh each time the detail card opens rather than
// carried on the sighting objects, since a photo can be added at any point
// and there's no cache-invalidation path from other screens back into
// allSightingsRaw.
async function loadBirdPhotos(commonName) {
  const strip = document.getElementById('detailPhotoStrip');
  if (!strip) return;
  try {
    const res = await fetch(`/species/${encodeURIComponent(commonName)}/photos`);
    const data = await res.json();
    strip.querySelectorAll('.my-photo-slide').forEach(el => el.remove());
    (data.photos || []).forEach(p => {
      const img = document.createElement('img');
      img.className = 'detail-photo my-photo-slide';
      img.src = p.photo_data;
      strip.appendChild(img);
    });
    setupPhotoDots(strip, strip.children.length);
  } catch (e) { /* strip just shows the Wikipedia photo if this fails */ }
}

// One dot per slide, only shown once there's more than one - a photo can be
// added while the card's already open, so this runs fresh every time
// loadBirdPhotos does rather than once at card-open.
function setupPhotoDots(strip, count) {
  const dotsEl = document.getElementById('detailPhotoDots');
  if (!dotsEl) return;
  if (count <= 1) { dotsEl.innerHTML = ''; return; }
  dotsEl.innerHTML = Array.from({ length: count }, (_, i) =>
    `<span class="detail-photo-dot ${i === 0 ? 'active' : ''}"></span>`).join('');
  const dots = dotsEl.querySelectorAll('.detail-photo-dot');
  const updateActive = () => {
    const idx = Math.round(strip.scrollLeft / strip.clientWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  };
  // The strip element itself persists across repeated loadBirdPhotos calls
  // within one card-open session (only its children are swapped) - binding
  // more than once would fire updateActive() multiple times per scroll.
  if (!strip.dataset.dotsBound) {
    strip.addEventListener('scroll', () => requestAnimationFrame(updateActive));
    strip.dataset.dotsBound = '1';
  }
}

// Kept full-frame (not centre-cropped to a square, unlike the avatar photo)
// since these are meant to look like an actual photo the child took, not an
// icon. Longest side capped at 900px and re-encoded as JPEG before upload -
// a multi-megabyte phone photo would be far too heavy to store as a data URL
// otherwise, but 900px is generous enough to still look good full-width.
function handleBirdPhotoChosen(file, commonName) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const MAX = 900;
      const scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      saveBirdPhoto(commonName, canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => alert("Sorry, that image couldn't be read.");
    img.src = reader.result;
  };
  reader.onerror = () => alert("Sorry, that image couldn't be read.");
  reader.readAsDataURL(file);
}

async function saveBirdPhoto(commonName, dataUrl) {
  const formData = new FormData();
  formData.append('photo', dataUrl);
  try {
    await fetch(`/species/${encodeURIComponent(commonName)}/photos`, { method: 'POST', body: formData });
    await loadBirdPhotos(commonName);
    // Scroll straight to the photo that was just added, so adding one feels
    // immediate rather than needing a manual swipe to go find it.
    const strip = document.getElementById('detailPhotoStrip');
    if (strip) strip.scrollTo({ left: strip.scrollWidth, behavior: 'smooth' });
  } catch (e) { alert("Sorry, that photo couldn't be saved right now."); }
}

let currentlyPlayingAudio = null;
let currentlyPlayingBtn = null;
let currentlyPlayingLabel = '▶ Hear its call';

function stopAnyPlayingAudio() {
  if (currentlyPlayingAudio) {
    currentlyPlayingAudio.pause();
    currentlyPlayingAudio.currentTime = 0;
  }
  if (currentlyPlayingBtn) {
    currentlyPlayingBtn.textContent = currentlyPlayingLabel;
    currentlyPlayingBtn.disabled = false;
  }
  currentlyPlayingAudio = null;
  currentlyPlayingBtn = null;
}

function playBirdCall(url, btnEl) {
  if (!url) return;

  // Tapping the button while it's already playing stops it. The button used
  // to show a pause icon but was disabled, so the pause was unclickable.
  if (currentlyPlayingBtn === btnEl && currentlyPlayingAudio) {
    stopAnyPlayingAudio();
    return;
  }

  stopAnyPlayingAudio(); // only one call plays at a time
  const audio = new Audio(url);
  currentlyPlayingLabel = btnEl.textContent;
  currentlyPlayingAudio = audio;
  currentlyPlayingBtn = btnEl;
  btnEl.textContent = '⏸ Stop';
  audio.play().catch(() => stopAnyPlayingAudio());
  audio.onended = () => stopAnyPlayingAudio();
}

// Every screen change (any render*() function) fully replaces stage's
// children - watching for that means audio reliably stops the moment
// you navigate away or move to a different card, without needing to
// remember to add a stop-call to every single screen function.
const stageAudioObserver = new MutationObserver(() => stopAnyPlayingAudio());
stageAudioObserver.observe(stage, { childList: true });

const HABITAT_ICONS = {
  'Garden & Parks': '🌳', 'Woodland': '🌲', 'Wetland & Coast': '🌊',
  'Farmland': '🌾', 'Towns & Cities': '🏘️',
};

// Mirrors STAT_LABELS in birds.py. Kept in a fixed order so the bars
// always read the same way down every card.
const STAT_LABELS = { size: 'Size', speed: 'Speed', population: 'Population',
                     song: 'Song', brains: 'Brains' };

function buildStatBars(bird) {
  if (!bird || !bird.ratings) return '';
  const rows = Object.entries(STAT_LABELS).map(([key, label]) => {
    const v = bird.ratings[key] ?? 0;
    return `
      <div class="tt-row">
        <span class="tt-label">${label}</span>
        <span class="tt-bar"><span class="tt-fill" style="width:${v}%"></span></span>
        <span class="tt-num">${v}</span>
      </div>`;
  }).join('');
  return `
    <div class="tt-block">
      <div class="tt-title">Compared to all 100 birds</div>
      ${rows}
    </div>`;
}

// Every bird carries these four, so no card is ever missing them.
function buildCoreTiles(bird) {
  if (!bird) return '';
  const weight = bird.weight_g >= 1000
    ? `${(bird.weight_g / 1000).toFixed(1)}kg` : `${bird.weight_g}g`;
  const tiles = [
    ['⚖️', weight, 'Weight'],
    ['📏', `${bird.length_cm}cm`, 'Length'],
    ['🏞️', bird.habitat, 'Where it lives'],
    ['🍽️', bird.diet, 'What it eats'],
  ];
  return `<div class="facts-grid">${tiles.map(([icon, num, label]) => `
    <div class="fact-tile">
      <div class="fact-icon">${icon}</div>
      <div class="fact-num ${String(num).length > 8 ? 'fact-num-sm' : ''}">${num}</div>
      <div class="fact-label">${label}</div>
    </div>`).join('')}</div>`;
}

// Only the researched birds carry a conservation status and habitat tags.
function buildConservation(bird) {
  if (!bird || !bird.conservation_status) return '';
  const tags = (bird.habitat_tags || [])
    .map(h => `<span class="habitat-tag">${HABITAT_ICONS[h] || '📍'} ${h}</span>`)
    .join('');
  const statusClass = bird.conservation_status === 'Green' ? 'status-green'
    : bird.conservation_status === 'Amber' ? 'status-amber' : 'status-red';
  return `
    ${tags ? `<div class="habitat-tags">${tags}</div>` : ''}
    <div class="status-badge ${statusClass}">🛡️ ${bird.conservation_status} status</div>
  `;
}

function renderDone() {
  // Server total, not a sum of the birds - bonuses are added server-side.
  const total = sessionFeatherTotal || sessionResults.reduce((sum, b) => sum + b.feathers, 0);
  const bonusRows = sessionBonuses.map(b => `
    <div class="bonus-row"><span>${b.label}</span><span class="bonus-feathers">+${b.feathers}</span></div>
  `).join('');

  // Rarity isn't shown here any more - it belongs to the collector packs. The
  // counts are still worked out, but only so a rare find can pick a message
  // that reflects it.
  const tierCounts = {};
  sessionResults.forEach(b => { if (b.tier) tierCounts[b.tier] = (tierCounts[b.tier] || 0) + 1; });
  const newCount = sessionResults.filter(b => !b.is_duplicate).length;
  const n = sessionResults.length;

  const trophyBanners = newlyEarnedTrophies.map(t => `
    <div class="trophy-banner done-trophy">
      <div class="trophy-banner-title">\u{1F3C6} Trophy earned!</div>
      <div class="trophy-banner-row">
        <div class="trophy-banner-emoji">${t.emoji}</div>
        <div class="trophy-banner-text">
          <div class="trophy-banner-name">${t.name}${t.level ? ` · Level ${t.level}` : ''}</div>
          <div class="trophy-banner-citation">${t.citation}</div>
        </div>
      </div>
      <div class="trophy-banner-tap">Tap to celebrate</div>
    </div>
  `).join('');

  stage.innerHTML = `
    <div class="done-avatar">${avatarSvg(currentProfile.avatar_body, 140, currentProfile.equipped, true, currentProfile.avatar_species)}</div>
    <div class="done-title">${pickDoneMessage(n, newCount, tierCounts)}</div>
    <div class="done-sub">You heard ${n} bird${n === 1 ? '' : 's'}${newCount ? ` · ${newCount} new` : ''}</div>
    ${bonusRows ? `<div class="bonus-list">${bonusRows}</div>` : ''}
    ${trophyBanners}
    <div class="done-feathers-slot">
      <div class="done-feathers tappable" id="doneFeathers"><img class="feather-icon" src="/static/feather.webp" alt=""> ${total} feathers earned</div>
      <div class="go-again-content" id="goAgainWrap">
        <div class="go-again-ask">Go again?</div>
        <button class="again-btn mic-again-btn" id="againBtn" aria-label="Go again"><img class="mic-icon" src="/static/mic-v2.webp" alt="Go again"></button>
      </div>
    </div>
    <div class="collect-hint" id="doneHint">Tap your feathers to collect them</div>
  `;

  stage.querySelectorAll('.done-trophy').forEach(el => {
    el.onclick = () => { el.onclick = null; celebrateTrophy(el); };
  });

  scheduleDoneLeafBurst(stage.querySelector('.done-avatar'));

  // Bound immediately rather than only after collecting - the button sits
  // underneath the feathers message from the start (opacity 0, pointer-
  // events off), so there's nothing to wire up later, just a class to add.
  document.getElementById('againBtn').onclick = startRecording;

  const featherEl = document.getElementById('doneFeathers');
  featherEl.onclick = () => {
    featherEl.onclick = null;
    featherEl.classList.remove('tappable');
    const hint = document.getElementById('doneHint');
    if (hint) hint.textContent = '';
    flyFeathersToCounter(featherEl, total, () => {
      // Another go is only offered once the feathers have been collected,
      // so it isn't possible to leave the session's reward on the table.
      featherEl.classList.add('collected');
      const wrap = document.getElementById('goAgainWrap');
      if (wrap) wrap.classList.add('visible');
      refreshFeathers();   // reconcile against the server once animations finish
    });
  };

  newlyEarnedTrophies = [];
  sessionBonuses = [];
}

// Well-done messages. The specific ones are checked first so a genuinely
// notable session gets a message that reflects it, rather than a generic one.
const DONE_MESSAGES = {
  rare:    ['Wow, a rare one!', 'Something special!', 'What a find!', 'That was rare!'],
  big:     ['What a haul!', 'So many birds!', 'The birds love you!', 'A brilliant warble!'],
  allNew:  ['All new birds!', 'Every one a first!', 'What a discovery!'],
  someNew: ['New bird alert!', 'One for the collection!', 'A great find!', 'Something new!'],
  one:     ['One good bird!', 'Found one!', 'Nice listening!', 'Got one!'],
  general: ['Nice warble!', 'Well done!', 'Great listening!', 'Lovely warbling!',
            'Good ears!', 'Brilliant!', 'What a listener!', 'Top warbling!'],
};

function pickDoneMessage(count, newCount, tierCounts) {
  let pool;
  if (tierCounts['Rare']) pool = DONE_MESSAGES.rare;
  else if (count >= 5) pool = DONE_MESSAGES.big;
  else if (newCount && newCount === count) pool = DONE_MESSAGES.allNew;
  else if (newCount) pool = DONE_MESSAGES.someNew;
  else if (count === 1) pool = DONE_MESSAGES.one;
  else pool = DONE_MESSAGES.general;
  return pool[Math.floor(Math.random() * pool.length)];
}

function celebrateTrophy(el) {
  el.classList.add('celebrating');
  burstSparks(el);
  setTimeout(() => {
    el.classList.remove('celebrating');
    flyElementTo(el, document.getElementById('navTrophies'));
  }, 900);
}

// A burst of stars around an element - the trophy celebration
function burstSparks(el) {
  const r = el.getBoundingClientRect();
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['\u2728', '\u2B50', '\u{1F31F}'][i % 3];
    s.style.left = `${r.left + r.width / 2}px`;
    s.style.top = `${r.top + r.height / 2}px`;
    document.body.appendChild(s);
    const angle = (Math.PI * 2 * i) / 12;
    const dist = 70 + Math.random() * 50;
    requestAnimationFrame(() => {
      s.style.transition = 'transform .85s cubic-bezier(.2,.8,.3,1), opacity .85s ease';
      s.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(.4)`;
      s.style.opacity = '0';
    });
    setTimeout(() => s.remove(), 900);
  }
}

// Shrink an element away into one of the nav tabs
function flyElementTo(el, target) {
  if (!el) return;
  if (!target) { el.style.display = 'none'; return; }
  const from = el.getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
  const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
  el.style.transition = 'transform .62s cubic-bezier(.55,0,.65,1), opacity .25s ease .38s';
  el.style.transform = `translate(${dx}px, ${dy}px) scale(.08)`;
  el.style.opacity = '0';
  target.classList.add('nav-pop');
  setTimeout(() => target.classList.remove('nav-pop'), 600);
  setTimeout(() => { el.style.display = 'none'; }, 640);
}

let currentLat = null, currentLng = null, newlyEarnedTrophies = [];
// What the device actually granted for the mic. Constraints are requests,
// not guarantees, so this is worth being able to see without a USB cable.
let lastMicSettings = null;
let currentProfile = { name: 'Explorer', avatar_id: 'robin' };
let needsLocationName = false, sessionLat = null, sessionLng = null, sessionLocationName = null;

function requestGpsPosition() {
  // Fire-and-forget — recording shouldn't wait on this. If it fails or
  // times out, currentLat/currentLng stay null and the backend falls
  // back to a default location — worth knowing that's a real fallback
  // to a fixed point, not "somewhere near you", if this keeps failing.
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
      console.log(`GPS fix: ${currentLat}, ${currentLng} (accuracy: ~${Math.round(pos.coords.accuracy)}m)`);
      // GPS is fire-and-forget, so the recording screen has usually already
      // rendered by now with an empty location line - fill it in once we
      // actually know where we are. No-ops if we're not on that screen.
      loadRecordingLocation();
    },
    (err) => {
      console.log('GPS unavailable, using default location:', err.message);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

async function startRecording() {
  try {
    // Can now be reached directly from the Done / No-birds screens via the
    // mic button, not just from Home - so make sure the Home tab reads as
    // active rather than leaving whatever tab was highlighted before.
    setActiveTab('home');
    // Home is top-aligned now that it carries cards below the mic, and every
    // screen in the recording flow - listening, saving, the results pile, the
    // reveal - is centred and had been relying on Home to leave this off.
    stage.classList.remove('top-aligned');
    showHomeScene(false);
    requestGpsPosition();
    // { audio: true } accepts the browser's voice-call defaults: noise
    // suppression, echo cancellation and automatic gain control all on. Those
    // are tuned for speech and actively strip sustained non-speech sound -
    // which is exactly what birdsong is. Quiet or distant birds get filtered
    // out before BirdNET ever sees them. All three are turned off here to get
    // the rawest audio the device will give us.
    //
    // echoCancellation:false matters more than it looks: on Chrome, AGC can't
    // be disabled by the autoGainControl constraint alone - echo cancellation
    // has to go too, or gain control stays on regardless.
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        noiseSuppression: false,
        echoCancellation: false,
        autoGainControl: false,
        channelCount: 1,
      },
    });

    // Log what the device actually granted - constraints are requests, not
    // guarantees, and some devices silently ignore them.
    const settings = stream.getAudioTracks()[0]?.getSettings?.() || {};
    lastMicSettings = settings;
    try { localStorage.setItem('warbleMicSettings', JSON.stringify(settings)); } catch (e) {}
    console.log('Mic settings:', {
      noiseSuppression: settings.noiseSuppression,
      echoCancellation: settings.echoCancellation,
      autoGainControl: settings.autoGainControl,
      sampleRate: settings.sampleRate,
    });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    recordSeconds = 0;
    renderRecording();
    startEqualizer(stream);
    startLivePreviewLoop(stream);
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  } catch (e) {
    renderError("Couldn't access your microphone. Check your browser's permission settings.");
  }
}

// --- Live audio-reactive equalizer, driven by real microphone volume ---
// Also drives a genuine "a bird was heard!" flash during recording -
// backed by real, filtered identification (the same NBN Atlas
// plausibility check /analyze-session uses), not just raw volume, so
// a live flash reliably means something that should also show up in
// the final result. Species names still aren't shown live - only
// that a real one was heard - keeping the reveal for after Stop.
let eqAudioContext = null, eqAnalyser = null, eqAnimationId = null;

// Centre of the 200x210 viewBox (was 80,72 for the old 160x190 canopy) -
// used to derive each cluster's outward push direction during a rustle.
// v2 redesign: centre of the 380x452 viewBox (was 100,105 for 200x210).
const TREE_CX = 190, TREE_CY = 226;
// Individual leaf sprites (painted, matching the canopy's redesigned style)
// swapped in for spawnFallingLeaves() - replaces the old flat LEAF_COLORS
// polygon-fill approach now that the canopy itself is illustrated rather
// than flat-shaded facets.
const LEAF_SPRITES = ['/static/tree-leaf1-v2.webp', '/static/tree-leaf2-v2.webp', '/static/tree-leaf3-v2.webp', '/static/tree-leaf4-v2.webp'];
let treeShards = [], fallingLeaves = [], activeRustle = null, lastFrameTime = 0;
// Tracks how loud things have been recently, so the quiver scales to the
// actual environment. Without this the design's numbers - tuned in a demo
// against a synthetic signal - produce well under 1 degree of rotation from
// a real phone mic in a quiet garden, which is invisible.
let binCeiling = 40;
// Multiplies each cluster's per-facet amplitude (4.6-5.2 deg, set on the
// 6 canopy clusters after the hand-painted redesign replaced the old
// 59-facet procedural canopy). Lower than the old placeholder tree's 3.2:
// each cluster is a much bigger mass than an individual facet was, so the
// same angular rotation sweeps a visibly larger arc - this keeps the
// quiver reading as a shimmer rather than a wobble. Tune after watching it
// live against a real mic.
const QUIVER_GAIN = 2.3;

function startEqualizer(stream) {
  eqAudioContext = new (window.AudioContext || window.webkitAudioContext)();
  eqAnalyser = eqAudioContext.createAnalyser();
  eqAnalyser.fftSize = 64;
  eqAudioContext.createMediaStreamSource(stream).connect(eqAnalyser);
  const bins = new Uint8Array(eqAnalyser.frequencyBinCount);

  // Each canopy cluster carries its own pivot, frequency bin and amplitude,
  // baked into the SVG by the design. Cache them once rather than re-reading
  // attributes 6 times every frame. (Was 59 facets pre-redesign; the
  // hand-painted canopy trades facet-level granularity for a much richer
  // illustrated look - see the design brief for why.)
  treeShards = Array.from(document.querySelectorAll('[data-cluster]')).map((el, i) => {
    const p = el.getAttribute('data-pivot').split(',').map(Number);
    const nx = p[0] - TREE_CX, ny = p[1] - TREE_CY;
    const len = Math.hypot(nx, ny) || 1;
    return {
      el, px: p[0], py: p[1], nx: nx / len, ny: ny / len,
      bin: +el.getAttribute('data-bin'), amp: +el.getAttribute('data-amp'),
      phase: i * 0.73, lvl: 0,
    };
  });
  fallingLeaves = [];
  activeRustle = null;
  lastFrameTime = 0;
  binCeiling = 40;   // reset per recording, don't carry a loud session into a quiet one

  function draw(now) {
    if (!eqAnalyser) return;
    const t = now / 1000;
    const dt = Math.min(0.05, (now - (lastFrameTime || now)) / 1000);
    lastFrameTime = now;
    eqAnalyser.getByteFrequencyData(bins);

    // Adapt to the current environment: track the loudest bin, rising fast and
    // decaying slowly, and scale against that. A quiet garden and a noisy
    // street both produce visible movement, rather than the tree only reacting
    // to shouting. The floor stops near-silence being amplified into noise.
    let frameMax = 0;
    for (let i = 0; i < bins.length; i++) if (bins[i] > frameMax) frameMax = bins[i];
    binCeiling += (frameMax - binCeiling) * (frameMax > binCeiling ? 0.25 : 0.015);
    const ceiling = Math.max(binCeiling, 26);

    const breath = 1.4;               // idle motion so it's never fully dead
    const r = activeRustle;
    const rAge = r ? t - r.t : 999;
    if (r && rAge > 2.2) activeRustle = null;

    for (const s of treeShards) {
      // LEVEL 1 - quiver: proportional to this facet's own frequency band,
      // with a fast attack and slow release so it breathes rather than flickers.
      const raw = Math.pow(Math.min(1, bins[s.bin] / ceiling), 1.25);
      s.lvl += (raw - s.lvl) * (raw > s.lvl ? 0.32 : 0.07);
      let a = breath * Math.sin(t * 1.63 + s.phase) + s.lvl * s.amp * QUIVER_GAIN;
      let ox = 0, oy = 0;

      // LEVEL 2 - rustle: a wave leaving the landing point at 456px/s. Each
      // facet fires as the wave reaches it, so the tree moves in sequence and
      // has a visible direction - which is what distinguishes it from quiver.
      // Speed/falloff/push scaled ~1.9x for the 380x452 viewBox (was 240,
      // 190, 7 for the old 200x210 one) to keep the same relative timing and
      // reach across the now-bigger canopy.
      if (r) {
        const d = Math.hypot(s.px - r.ox, s.py - r.oy);
        const tt = rAge - d / 456;
        if (tt > 0 && tt < 1.2) {
          const fall = Math.max(0.3, 1 - d / 361);
          const dir = (s.px - r.ox) >= 0 ? 1 : -1;
          const env = Math.exp(-tt / 0.2) * Math.sin(Math.PI * 2 * 4.2 * tt);
          a += 24 * fall * dir * env;
          const push = 13 * fall * Math.exp(-tt / 0.24) * Math.sin(Math.PI * 2 * 4.2 * tt);
          ox = s.nx * push; oy = s.ny * push;
        }
      }

      s.el.setAttribute('transform',
        `rotate(${a.toFixed(2)},${s.px},${s.py}) translate(${ox.toFixed(2)},${oy.toFixed(2)}) ` +
        `translate(${s.px},${s.py}) scale(1.02) translate(${-s.px},${-s.py})`);
    }

    // Leaves shaken loose by a rustle - the "consequence" cue.
    for (let i = fallingLeaves.length - 1; i >= 0; i--) {
      const l = fallingLeaves[i];
      const age = t - l.born;
      if (age > l.life) { l.el.remove(); fallingLeaves.splice(i, 1); continue; }
      l.vy += 34 * dt;
      l.x += (l.vx + Math.sin(t * l.sway * 3 + l.ph) * 9) * dt;
      l.y += l.vy * dt;
      l.rot += l.spin * dt;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)},${l.y.toFixed(1)}) rotate(${l.rot.toFixed(0)})`);
      l.el.setAttribute('opacity', String(Math.max(0, 1 - Math.pow(age / l.life, 3))));
    }

    eqAnimationId = requestAnimationFrame(draw);
  }
  eqAnimationId = requestAnimationFrame(draw);
}

function fireDetectionHaptic() {
  // Short, kid-friendly buzz for the moment a new bird is found. Silently
  // does nothing on devices/browsers without vibration support (e.g. iOS
  // Safari) rather than erroring.
  if (navigator.vibrate) navigator.vibrate(80);
}

function fireTreeRustle() {
  if (!treeShards.length) return;
  // With 6 large clusters instead of 59 tiny facets there's no longer a
  // meaningful "interior vs edge" distinction to filter on - any cluster
  // makes a fine landing point, the directional wave logic below does the
  // rest of the work of making it read as something landing and spreading.
  const s = treeShards[Math.floor(Math.random() * treeShards.length)];
  activeRustle = { t: performance.now() / 1000, ox: s.px, oy: s.py };
  spawnFallingLeaves(s.px, s.py);
}

function spawnFallingLeaves(x, y) {
  const layer = document.getElementById('leaves');
  if (!layer) return;
  for (let i = 0; i < 13; i++) {
    // Illustrated leaf sprite instead of a flat-fill polygon, matching the
    // redesigned canopy. Each sprite is placed as an 8x8-centred image (x/y
    // = -4) so translate(x,y) in the physics loop below positions it by its
    // own centre, same convention the old polygon (centred at 0,0) used.
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    el.setAttribute('href', LEAF_SPRITES[i % LEAF_SPRITES.length]);
    // Scaled up for the 380x452 viewBox (was 7-10 for the old 200x210 one) -
    // keeps leaf particles the same relative size against the bigger canopy.
    const size = 13 + Math.random() * 6;
    el.setAttribute('x', -size / 2); el.setAttribute('y', -size / 2);
    el.setAttribute('width', size); el.setAttribute('height', size);
    layer.appendChild(el);
    fallingLeaves.push({
      el, x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 12,
      vx: (Math.random() - 0.5) * 22, vy: -10 - Math.random() * 14,
      rot: Math.random() * 360, spin: (Math.random() - 0.5) * 260,
      sway: 1.4 + Math.random() * 2.2, ph: Math.random() * 6.3,
      born: performance.now() / 1000, life: 1.5 + Math.random() * 0.7,
    });
  }
}

function stopEqualizer() {
  if (eqAnimationId) cancelAnimationFrame(eqAnimationId);
  eqAnimationId = null;
  if (eqAudioContext) { eqAudioContext.close(); eqAudioContext = null; }
  eqAnalyser = null;
}

// --- Demo quiver, for the settings > Animation Preview debug screen ---
// Drives the exact same per-cluster rotate/rustle/leaf-fall logic as the
// real recording-screen equalizer above, but feeds it a synthetic wandering
// "volume" per cluster instead of real mic data - so this never needs
// microphone permission just to look at the animation. Kept as a separate
// function rather than sharing draw() with startEqualizer(), since that one
// is wired tightly to a real AudioContext/analyser and forcing a fake-data
// path through it risked the real recording animation for a debug feature.
let demoAnimId = null;
function startDemoQuiver() {
  stopDemoQuiver();
  treeShards = Array.from(document.querySelectorAll('[data-cluster]')).map((el, i) => {
    const p = el.getAttribute('data-pivot').split(',').map(Number);
    const nx = p[0] - TREE_CX, ny = p[1] - TREE_CY;
    const len = Math.hypot(nx, ny) || 1;
    return {
      el, px: p[0], py: p[1], nx: nx / len, ny: ny / len,
      bin: +el.getAttribute('data-bin'), amp: +el.getAttribute('data-amp'),
      phase: i * 0.73, lvl: 0, demoTarget: Math.random(),
    };
  });
  fallingLeaves = [];
  activeRustle = null;
  lastFrameTime = 0;

  function draw(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - (lastFrameTime || now)) / 1000);
    lastFrameTime = now;
    const breath = 1.4;
    const r = activeRustle;
    const rAge = r ? t - r.t : 999;
    if (r && rAge > 2.2) activeRustle = null;

    for (const s of treeShards) {
      // Synthetic level: a slow random walk toward a wandering target,
      // standing in for a real frequency bin's rise-and-fall.
      if (Math.random() < 0.02) s.demoTarget = Math.random();
      s.lvl += (s.demoTarget - s.lvl) * (s.demoTarget > s.lvl ? 0.1 : 0.04);
      let a = breath * Math.sin(t * 1.63 + s.phase) + s.lvl * s.amp * QUIVER_GAIN;
      let ox = 0, oy = 0;

      if (r) {
        const d = Math.hypot(s.px - r.ox, s.py - r.oy);
        const tt = rAge - d / 456;
        if (tt > 0 && tt < 1.2) {
          const fall = Math.max(0.3, 1 - d / 361);
          const dir = (s.px - r.ox) >= 0 ? 1 : -1;
          const env = Math.exp(-tt / 0.2) * Math.sin(Math.PI * 2 * 4.2 * tt);
          a += 24 * fall * dir * env;
          const push = 13 * fall * Math.exp(-tt / 0.24) * Math.sin(Math.PI * 2 * 4.2 * tt);
          ox = s.nx * push; oy = s.ny * push;
        }
      }

      s.el.setAttribute('transform',
        `rotate(${a.toFixed(2)},${s.px},${s.py}) translate(${ox.toFixed(2)},${oy.toFixed(2)}) ` +
        `translate(${s.px},${s.py}) scale(1.02) translate(${-s.px},${-s.py})`);
    }

    for (let i = fallingLeaves.length - 1; i >= 0; i--) {
      const l = fallingLeaves[i];
      const age = t - l.born;
      if (age > l.life) { l.el.remove(); fallingLeaves.splice(i, 1); continue; }
      l.vy += 34 * dt;
      l.x += (l.vx + Math.sin(t * l.sway * 3 + l.ph) * 9) * dt;
      l.y += l.vy * dt;
      l.rot += l.spin * dt;
      l.el.setAttribute('transform', `translate(${l.x.toFixed(1)},${l.y.toFixed(1)}) rotate(${l.rot.toFixed(0)})`);
      l.el.setAttribute('opacity', String(Math.max(0, 1 - Math.pow(age / l.life, 3))));
    }

    demoAnimId = requestAnimationFrame(draw);
  }
  demoAnimId = requestAnimationFrame(draw);
}
function stopDemoQuiver() {
  if (demoAnimId) cancelAnimationFrame(demoAnimId);
  demoAnimId = null;
}

// --- Live preview loop: repeatedly checks short clips against the
// same filtered /identify endpoint used elsewhere, so a live flash
// and the final result are answering the same question, not two
// separate ones that could disagree. ---
let livePreviewActive = false;

function startLivePreviewLoop(stream) {
  livePreviewActive = true;
  captureLiveChunk(stream);
}

function stopLivePreviewLoop() {
  livePreviewActive = false;
}

function captureLiveChunk(stream) {
  if (!livePreviewActive) return;
  let chunkRecorder;
  try {
    chunkRecorder = new MediaRecorder(stream);
  } catch (e) {
    return; // if this fails, live preview just doesn't run — recording itself is unaffected
  }
  const chunkParts = [];
  chunkRecorder.ondataavailable = e => chunkParts.push(e.data);
  chunkRecorder.onstop = () => {
    const blob = new Blob(chunkParts, { type: 'audio/webm' });
    checkLiveChunk(blob);
    if (livePreviewActive) captureLiveChunk(stream);
  };
  chunkRecorder.start();
  setTimeout(() => {
    if (chunkRecorder.state !== 'inactive') chunkRecorder.stop();
  }, 3500);
}

async function checkLiveChunk(blob) {
  try {
    const formData = new FormData();
    formData.append('file', blob, 'chunk.webm');
    if (currentLat !== null && currentLng !== null) {
      formData.append('lat', currentLat);
      formData.append('lng', currentLng);
    }
    const res = await fetch('/identify', { method: 'POST', body: formData });
    if (!res.ok) return;
    const data = await res.json();
    (data.detections || []).forEach(d => {
      if (!liveBadgedSpecies.has(d.common_name)) {
        liveBadgedSpecies.add(d.common_name);
        liveDetectedBirds.push({
          tier: d.tier,
          common_name: d.common_name,
          scientific_name: d.scientific_name,
          confidence: d.confidence,
          is_new: d.is_new,
          pack_color: d.pack_color,
        });
        renderLiveBirdStack();
        // Fire the rustle and haptic buzz on the same frame the badge
        // appears, so all three read as one event rather than separate things.
        fireTreeRustle();
        fireDetectionHaptic();
      }
    });
  } catch (e) { /* a missed preview chunk doesn't matter, just skip it */ }
}

function stopRecording() {
  clearInterval(recordTimerInterval);
  stopEqualizer();
  stopLivePreviewLoop();
  mediaRecorder.onstop = async () => {
    // Only show anything if the request is actually slow - otherwise the
    // recording screen stays put and the reveal follows immediately.
    const slowTimer = setTimeout(renderSaving, 700);
    try {
      // The recording audio is no longer uploaded - identification already
      // happened live during recording. This call only enriches and saves
      // what was found, so it's a small JSON payload rather than an audio
      // upload, and returns much faster.
      const formData = new FormData();
      if (currentLat !== null && currentLng !== null) {
        formData.append('lat', currentLat);
        formData.append('lng', currentLng);
      }
      formData.append('live_detections', JSON.stringify(liveDetectedBirds));
      const res = await fetch('/analyze-session', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      sessionResults = sortForReveal(data.detections || []);
      sessionBonuses = data.bonuses || [];
      sessionFeatherTotal = data.total_feathers_this_session || 0;
      newlyEarnedTrophies = data.newly_earned_trophies || [];
      needsLocationName = data.needs_location_name || false;
      sessionLocationName = data.location_name || null;
      sessionLat = data.lat;
      sessionLng = data.lng;
      cardIndex = 0;
      renderSessionResults();
    } catch (e) {
      renderError(e.message || 'Something went wrong talking to the server.');
    } finally {
      // finally, not the success path - a non-ok response throws above, which
      // would otherwise leave the timer pending and flash "Saving..." over the
      // error message a moment later.
      clearTimeout(slowTimer);
    }
  };
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
}

// dawn / day / dusk / night. The gradient background has always used these
// bands; the painted scenes now pick their variant from the same four, so a
// scene and the fallback gradient can never disagree about the time.
function timeBand() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 8) return 'dawn';
  if (hour >= 8 && hour < 17) return 'day';
  if (hour >= 17 && hour < 21) return 'dusk';
  return 'night';
}

const HOME_SCENES = [
  { id: 'garden', name: 'Garden' },
  { id: 'river',  name: 'River' },
  { id: 'coast',  name: 'Coast' },
  { id: 'meadow', name: 'Meadow' },

// Only Home wears a scene. Every other screen is a list or a grid of cards
// that would have to fight it, and the recording screen has scenery of its
// own. Called with false from setActiveTab for anything that is not Home.
// The CSS sizes this in lvh, which is the viewport at its largest. Where lvh
// is not understood it falls back to vh, which a phone changes as the address
// bar comes and goes - so remember the tallest viewport seen and hold the
// layer at that. It can grow once, on the first scroll, and never shrink.
let sceneMaxHeight = 0;
function sizeSceneLayer() {
  const el = document.getElementById('sceneBg');
  if (!el || CSS.supports('height', '100lvh')) return;
  sceneMaxHeight = Math.max(sceneMaxHeight, window.innerHeight);
  el.style.height = sceneMaxHeight + 'px';
}
// Turning the phone gives a genuinely different viewport, so start again.
window.addEventListener('orientationchange', () => {
  sceneMaxHeight = 0;
  setTimeout(sizeSceneLayer, 350);
});
window.addEventListener('resize', sizeSceneLayer);

function showHomeScene(on) {
  const el = document.getElementById('sceneBg');
  if (!el) return;
  const scene = currentProfile && currentProfile.home_scene;
  if (!on || !scene || scene === 'none' || !HOME_SCENES.some(s => s.id === scene)) {
    el.classList.remove('on');
    document.body.classList.remove('scene-on');
    return;
  }
  const url = sceneUrl(scene, timeBand());
  // Only touch background-image when it actually changes, so re-rendering
  // Home does not make the scene flicker through a reload.
  if (el.dataset.url !== url) {
    el.style.backgroundImage = `url('${url}')`;
    el.dataset.url = url;
  }
  sizeSceneLayer();
  el.classList.add('on');
  document.body.classList.add('scene-on');
}

// One shared palette - every part offers the same 10 colours in the same
// order, so the arch never reflows when switching between Body/Face/Beak.
const AVATAR_SWATCHES = ['#C4BFDF', '#8E87B8', '#2D1B69', '#7EC8A4', '#E8845C', '#F2C94C', '#E87EA1', '#1A1128', '#F5EDD6', '#3F7C5C'];
const ACCESSORY_LAYER_ORDER = ['shoes', 'neck', 'held', 'glasses', 'hats'];

// Every non-default species has its own native art proportions, so a body/
// wing/leg box sized for the original bird would stretch or squash it.
// These widths are pre-measured per species (height/x/y of each part stay
// the same as the original bird - only width, and body's x to keep it
// centred, are adjusted) so nothing distorts. 'default' needs no entry: it
// falls through to the original fixed box below.
const SPECIES_LAYOUT = {
  // wingX/wingY: replicates the exact attachment relationship measured on
  // the original bird (wing's inner edge inset 10.3 units from the body's
  // widest silhouette point within the wing's height band), computed per
  // species from their own body art rather than reused as one flat
  // constant. cardinal/owl/penguin/duckling need nothing beyond that - a
  // close zoom against the original bird's own attachment (which has the
  // same small amount of separation) confirmed they already match it.
  // parrot and bluebird still needed an extra pull-in beyond the formula:
  // their wing art itself has less coverage near the inner corner than
  // the other species' wings, so the same relative position leaves a
  // real gap the other four don't have - confirmed by comparing all six
  // against the original at identical zoom, not just the two that
  // seemed likely.
  cardinal: { bodyW: 60.75, bodyX: 19.62, wingW: 18.57, legW: 12.21, wingX: 69.60 },
  owl:      { bodyW: 62.99, bodyX: 18.50, wingW: 18.68, legW: 12.11, wingX: 69.30 },
  penguin:  { bodyW: 59.33, bodyX: 20.34, wingW: 18.21, legW: 12.09, wingX: 67.70 },
  parrot:   { bodyW: 62.65, bodyX: 18.68, wingW: 16.58, legW: 11.99, wingX: 63,    wingY: 60 },
  duckling: { bodyW: 59.54, bodyX: 20.23, wingW: 21.12, legW: 12.10, wingX: 67.50 },
  bluebird: { bodyW: 56.85, bodyX: 21.57, wingW: 19.48, legW: 12.09, wingX: 58,    wingY: 60 },
};
const AVATAR_SPECIES = [
  { id: 'default',  name: 'Classic' },
  { id: 'cardinal', name: 'Cardinal' },
  { id: 'owl',      name: 'Owl' },
  { id: 'penguin',  name: 'Penguin' },
  { id: 'parrot',   name: 'Parrot' },
  { id: 'duckling', name: 'Duckling' },
  { id: 'bluebird', name: 'Bluebird' },
];

let accessorySvgCache = {};

function avatarSvg(body, size, equipped, dancing, species) {
  equipped = equipped || {};
  // Held items ride with the right wing, so they're pulled out of the normal
  // layer stack and animated alongside it. Everything else layers as usual.
  const layer = cat => (equipped[cat] && accessorySvgCache[equipped[cat]]) ? accessorySvgCache[equipped[cat]] : '';
  const accessoryLayers = ACCESSORY_LAYER_ORDER.filter(cat => cat !== 'held').map(layer).join('');
  const heldLayer = layer('held');

  // Real illustrated art (Warble art pass 04), replacing the old flat
  // vector shapes. Body and wings are recolorable: each swatch has its own
  // pre-baked pair (body_<hex>.webp / wing_<hex>.webp), produced by
  // extracting a normalized shading map from the neutral-toned source art
  // and overlay-blending it onto the swatch colour - so every colour keeps
  // the same painted highlights and shadow, not a flat tint. The beak is
  // baked into the body art as a fixed orange in every variant (colour
  // customization for face/beak was dropped - body colour only now), so
  // there's no separate face/beak layer to draw. Wing and leg are single
  // assets, mirrored for the opposite side via a scale(-1,1) transform on
  // the inner <image> - the .av-wing-l/.av-leg-l wrapper still gets its
  // own transform-origin from the dancing CSS untouched by that mirror.
  //
  // Species (added in the bird-selector pass): 'default' is the original
  // plain bird and keeps the old unprefixed filenames untouched
  // (body_<hex>.webp). Every other species has its own asset triplet -
  // body_<species>_<hex>.webp / wing_<species>_<hex>.webp / leg_<species>.webp
  // - built the same way (luminance-preserving overlay blend per swatch),
  // so the same colour wheel works for all of them; legs aren't recoloured
  // for any species, default included.
  const hex = (body || '#C4BFDF').replace('#', '').toUpperCase();
  const sp = (species && species !== 'default') ? species : null;
  const bodyImg = sp ? `/static/avatar/body_${sp}_${hex}.webp` : `/static/avatar/body_${hex}.webp`;
  const wingImg = sp ? `/static/avatar/wing_${sp}_${hex}.webp` : `/static/avatar/wing_${hex}.webp`;
  const legImg = sp ? `/static/avatar/leg_${sp}.webp` : `/static/avatar/leg.webp`;
  const L = sp ? SPECIES_LAYOUT[sp] : null;
  const bodyW = L ? L.bodyW : 60, bodyX = L ? L.bodyX : 20;
  const wingW = L ? L.wingW : 18;
  const legW = L ? L.legW : 12;
  const wingRX = L && L.wingX ? L.wingX : 69;  // right wing's inner (body-side) edge
  const wingLX = 100 - wingRX;                 // mirrored left counterpart
  const wingY = L && L.wingY ? L.wingY : 57.5;

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="overflow:visible;" class="${dancing ? 'avatar-dancing' : ''}">
    <g class="av-leg-l">
    <image xlink:href="${legImg}" href="${legImg}" x="36" y="84" width="${legW}" height="12.9" transform="scale(-1,1) translate(-84,0)"/>
    </g>
    <g class="av-leg-r">
    <image xlink:href="${legImg}" href="${legImg}" x="52" y="84" width="${legW}" height="12.9"/>
    </g>
    <g class="av-torso">
    <image xlink:href="${bodyImg}" href="${bodyImg}" x="${bodyX}" y="8" width="${bodyW}" height="83.8"/>
    <g class="av-wing-l">
    <image xlink:href="${wingImg}" href="${wingImg}" x="${wingLX}" y="${wingY}" width="${wingW}" height="29.5" transform="scale(-1,1) translate(-${2 * wingLX},0)"/>
    </g>
    <g class="av-wing-r">
    <image xlink:href="${wingImg}" href="${wingImg}" x="${wingRX}" y="${wingY}" width="${wingW}" height="29.5"/>
    </g>
    </g>
    <g class="av-face">
    ${accessoryLayers}
    <g class="av-held">${heldLayer}</g>
    </g>
  </svg>`;
}

      a.download = `warble-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (e) { alert("Couldn't export right now."); }
  };

  const RESET_COPY = {
    dressup:    ['Reset Dress Up?', 'All bought items are forgotten and your bird is undressed. Feathers and colours are kept.'],
    feathers:   ['Reset feathers?', 'Your feather balance goes back to zero. Items you already own are kept.'],
    sightings:  ['Reset birds, habitats and trophies?', 'Every bird, warble, named place, trophy and weekly bonus is deleted. Feathers and Dress Up items are kept.'],
    everything: ['Reset EVERYTHING?', 'The whole app goes back to how it was the first time you opened it. Birds, trophies, feathers, Dress Up, your name and photo - all of it.'],
  };

  stage.querySelectorAll('.reset-btn').forEach(btn => {
    btn.onclick = async () => {
      const scope = btn.dataset.scope;
      const [title, detail] = RESET_COPY[scope];
      if (!confirm(`${title}\n\n${detail}\n\nThis cannot be undone.`)) return;
      // Full reset asks twice - it's the one there's no recovering from.
      if (scope === 'everything' && !confirm('Really wipe everything? Last chance.')) return;

      btn.disabled = true;
      btn.textContent = 'Resetting...';
      try {
        const res = await fetch(`/reset/${scope}`, { method: 'POST' });
        if (!res.ok) throw new Error('reset failed');
        // Reload rather than patching state by hand - far too many caches
        // (profile, accessories, collection, feathers) would otherwise be
        // left holding data that no longer exists.
        location.reload();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Reset failed - tap to retry';
      }
    };
  });
}

// Photos are shrunk to 240px square and re-encoded as JPEG before upload.
// They're stored as a data URL in the database, so sending a multi-megabyte
// phone photo straight up would be far too heavy - this lands around 15-25KB.
function handlePhotoChosen(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const SIZE = 240;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      // Centre-crop to a square so it fills the circular frame without squashing
      const side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, SIZE, SIZE);
      savePhoto(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => alert("Sorry, that image couldn't be read.");
    img.src = reader.result;
  };
  reader.onerror = () => alert("Sorry, that image couldn't be read.");
  reader.readAsDataURL(file);
}

// Face/beak colour customization was dropped when the avatar moved to real
// illustrated art (the beak is baked into the body art as a fixed colour
// in every variant) - body is the only recolorable part now, so there's no
// part-toggle needed, just the one swatch row.
function renderSwatchRows() {
  const swatches = AVATAR_SWATCHES;
  const currentColor = currentProfile.avatar_body;

  const wheel = document.getElementById('colorWheel');
  if (!wheel) return;
  wheel.querySelectorAll('.color-swatch').forEach(el => el.remove());

  // The swatches form an arch across the TOP of the avatar frame, sitting
  // on the frame's own edge circle - so they use the avatar's existing
  // footprint instead of needing their own space beside or above it.
  // Percentage-based so it stays correct if the avatar size changes.
  const n = swatches.length;
  const archStart = Math.PI * 1.16;  // just past 9 o'clock, going over the top
  const archEnd = Math.PI * 1.84;    // to just before 3 o'clock
  swatches.forEach((hex, i) => {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const angle = archStart + (archEnd - archStart) * t;
    const x = 50 + 59 * Math.cos(angle); // % of frame box; 59% (vs the frame's own 50% edge) leaves a real gap - back to this now the ring matches the white circle's own exterior instead of extending past it
    const y = 50 + 59 * Math.sin(angle);
    const btn = document.createElement('button');
    btn.className = 'color-swatch';
    btn.style.background = hex;
    btn.style.borderColor = currentColor === hex ? 'var(--ink)' : '#fff';
    btn.style.left = `${x}%`;
    btn.style.top = `${y}%`;
    btn.onclick = () => {
      currentProfile.avatar_body = hex;
      saveAvatarColors();
    };
    wheel.appendChild(btn);
  });
}

// Bird species picker: a fixed, non-scrolling white circle (the real
// avatar, full colour, colour wheel arched over it) sits on top of an
// independently-scrolling track of silhouettes. Unlike the earlier
// version, the track is built ONCE per Dress Up visit and never rebuilt -
// selection only ever toggles a class and swaps which button is hidden
// behind the circle, so a bird already mid-transition keeps moving
// continuously as part of the same strip rather than popping between
// states. That continuity is also what makes the loop and the circle-drag
// below possible: both just manipulate scrollLeft/classes on stable DOM.
//
// Endless loop: the species list is repeated three times back to back.
// Normal scrolling happens inside the middle copy; once the settled
// position drifts into the first or third copy, we silently (no
// animation - scrollLeft assignment is instant) jump scrollLeft by one
// copy-width to land on the pixel-identical spot in the middle copy, then
// re-find the centred button there. Since every copy is visually
// identical this jump is imperceptible - it just gives room to keep
// scrolling in the same direction forever.
const SPECIES_LOOP_COPIES = 3;
let speciesScrollSettleTimer = null;
let speciesScrollRAF = null;
let activeSpeciesBtn = null;

function initDressUpAvatarPicker() {
  const track = document.getElementById('speciesTrack');
  const circle = document.querySelector('#dressUpAvatarStage .avatar-frame');
  if (!track) return;
  activeSpeciesBtn = null;

  let html = '';
  for (let copy = 0; copy < SPECIES_LOOP_COPIES; copy++) {
    html += AVATAR_SPECIES.map(sp => `
      <button class="species-silhouette-btn" data-species="${sp.id}" aria-label="Switch to ${sp.name}">
        <img src="/static/avatar/silhouette_${sp.id}.webp" alt="">
      </button>`).join('');
  }
  track.innerHTML = html;

  track.querySelectorAll('.species-silhouette-btn').forEach(btn => {
    btn.onclick = () => btn.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
  });
  track.addEventListener('scroll', onSpeciesTrackScroll, { passive: true });

  // Jump straight to the middle copy's instance of the saved species, with
  // no animation, before anything is visible - the very first render
  // shouldn't visibly scroll in from the edge. This sets activeSpeciesBtn
  // directly rather than through markActiveButton, since the species here
  // already matches currentProfile and markActiveButton's job is reacting
  // to a *change* - the actual preview/swatches render is done explicitly
  // below regardless, so it can't be skipped the way it was before.
  const current = currentProfile.avatar_species || 'default';
  const startIdx = Math.max(0, AVATAR_SPECIES.findIndex(sp => sp.id === current));
  const middleCopyButtons = track.querySelectorAll('.species-silhouette-btn');
  const startBtn = middleCopyButtons[AVATAR_SPECIES.length + startIdx];
  if (startBtn) {
    startBtn.scrollIntoView({ inline: 'center', block: 'nearest' });
    setActiveSilhouette(startBtn);
    updateSpeciesTrackVisuals(track);
  }

  if (circle) setupCircleDragBridge(track, circle);

  renderDressUpPreview();
  renderSwatchRows();
}

function onSpeciesTrackScroll() {
  // Two separate concerns, deliberately on different cadences:
  // - which button is hidden (is-current) needs to track the scroll in
  //   real time, every frame, so the outgoing bird visibly slides away as
  //   part of the same continuous motion as everything else, rather than
  //   staying invisible for the whole swipe and only reappearing once
  //   things stop moving.
  // - actually committing the selection (updating the profile, re-
  //   rendering the coloured avatar, saving to the server) stays
  //   debounced to settle, so the main avatar doesn't flicker through
  //   every bird you scroll past and the server isn't hit mid-swipe.
  if (!speciesScrollRAF) {
    speciesScrollRAF = requestAnimationFrame(() => {
      speciesScrollRAF = null;
      const track = document.getElementById('speciesTrack');
      if (!track) return;
      const centred = findCentredSpeciesButton(track);
      if (centred) setActiveSilhouette(centred);
    });
  }
  clearTimeout(speciesScrollSettleTimer);
  speciesScrollSettleTimer = setTimeout(onSpeciesTrackSettled, 130);
}

function findCentredSpeciesButton(track) {
  return updateSpeciesTrackVisuals(track);
}

// Scales every silhouette by how close it is to the fixed circle - 90% at
// rest, growing smoothly to 100% (matching the selected bird's own size)
// as it approaches centre, shrinking back to 90% as it moves away. Runs
// on the same per-frame cadence as the hidden/visible handoff, and
// returns whichever button is currently closest to centre so callers
// don't need a second pass over the DOM.
const SPECIES_SCALE_REST = 0.9;
const SPECIES_SCALE_DISTANCE = 85; // px of travel over which the scale fully settles

function updateSpeciesTrackVisuals(track) {
  const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
  let best = null, bestDist = Infinity;
  track.querySelectorAll('.species-silhouette-btn').forEach(btn => {
    const r = btn.getBoundingClientRect();
    const dist = Math.abs((r.left + r.width / 2) - mid);
    const t = Math.min(1, dist / SPECIES_SCALE_DISTANCE);
    btn.style.transform = `scale(${1 - (1 - SPECIES_SCALE_REST) * t})`;
    if (dist < bestDist) { bestDist = dist; best = btn; }
  });
  return best;
}

function onSpeciesTrackSettled() {
  const track = document.getElementById('speciesTrack');
  if (!track) return;
  const centred = findCentredSpeciesButton(track);
  if (centred) {
    setActiveSilhouette(centred);          // no-op if the RAF loop above already set it
    commitSpeciesSelection(centred.dataset.species);
  }
  rewrapToMiddleCopy(track, centred);
}

// Endless-loop rewrap. Deliberately NOT scrollWidth/SPECIES_LOOP_COPIES:
// the track has large left/right padding (so the first/last species can
// still scroll to centre), which is outside all three copies but still
// counted in scrollWidth - dividing that total by 3 overstates a single
// copy's actual width, so the jump landed short, off by exactly the
// padding's share of the error. That's what was causing the mismatch:
// the "same" bird one copy over wasn't actually behind the circle after
// the jump, silhouettes stopped lining up with the species that ended up
// selected, and skipped/repeated ones could appear to flash by.
// Measuring the exact offset between the centred button and its literal
// counterpart n items over sidesteps the padding entirely - it's a
// precise, self-correcting distance with no assumptions baked in.
function rewrapToMiddleCopy(track, centred) {
  if (!centred) return;
  const buttons = track.querySelectorAll('.species-silhouette-btn');
  const idx = Array.prototype.indexOf.call(buttons, centred);
  const n = AVATAR_SPECIES.length;
  const copyIndex = Math.floor(idx / n);       // 0, 1, or 2 of the 3 copies
  const middleCopyIndex = Math.floor(SPECIES_LOOP_COPIES / 2); // 1
  if (copyIndex === middleCopyIndex) return;   // already in the safe middle copy

  const counterpart = buttons[idx + (middleCopyIndex - copyIndex) * n];
  if (!counterpart) return;
  track.scrollLeft += counterpart.getBoundingClientRect().left - centred.getBoundingClientRect().left;

  // We jumped copies - re-anchor the active-button reference to the
  // physically different (but visually identical) node now behind the
  // circle. Same species either way, so this never re-commits.
  const recentred = findCentredSpeciesButton(track);
  if (recentred) setActiveSilhouette(recentred);
}

// Purely visual: which DOM button (not just which species id, since the
// same species exists in all three loop copies) is hidden behind the
// circle right now. Safe to call every frame - it never touches the
// profile or the server.
function setActiveSilhouette(btn) {
  if (activeSpeciesBtn === btn) return;
  if (activeSpeciesBtn) activeSpeciesBtn.classList.remove('is-current');
  activeSpeciesBtn = btn;
  activeSpeciesBtn.classList.add('is-current');
}

// The actual selection: only called once scrolling has settled.
function commitSpeciesSelection(id) {
  if (currentProfile.avatar_species === id) return;
  currentProfile.avatar_species = id;
  renderDressUpPreview();
  updateNavAvatarIcon();
  saveSpeciesSelection(id);
