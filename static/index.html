     no horizontal scroll at all, which is also what fixes a real clipping
     bug the scrolling version had: mixing overflow-x:auto with
     overflow-y:visible doesn't actually keep the y-axis visible - per the
     CSS spec, setting one axis to something other than visible forces the
     other to auto too, so an enlarged card poking above the row was
     silently getting clipped. With neither axis restricted now, that's
     gone. */
  .pack-blurb{font-size:12.5px;color:rgba(255,255,255,0.88);text-align:center;line-height:1.45;margin:15px auto 4px;max-width:320px;padding:0 10px;}
  /* Cover-flow carousel: the centred card is the hero, its neighbours peek
     out either side so it reads as swipeable without any instructions.
     Cards keep their natural 66 x 101.5 box and are scaled by transform, so
     everything inside them stays exactly where it was measured. */
  .card-carousel{
    position:relative;width:100%;height:242px;margin:6px 0 2px;
    overflow:hidden;
    touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  }
  .card-carousel .fan-card{
    position:absolute;left:50%;top:50%;margin:0;
    transform-origin:center center;
    will-change:transform;
  }
  /* Without this the browser starts its own native image-drag as soon as a
     swipe begins on a bird photo, which cancels the pointer stream and the
     card never moves. */
  .card-carousel img{-webkit-user-drag:none;user-drag:none;}
  .card-carousel .fan-photo,
  .card-carousel .fan-name,
  .card-carousel .fan-badge{pointer-events:none;}
  .card-carousel.settling .fan-card{
    transition:transform .34s cubic-bezier(.22,.9,.3,1.05), opacity .34s ease;
  }
  .card-dots{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:2px;min-height:14px;}
  .card-dot{
    width:7px;height:7px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,0.75);background:transparent;
    transition:transform .18s ease, background .18s ease;
  }
  .card-dot.found{background:#fff;}
  .card-dot.now{transform:scale(1.55);border-color:#fff;}
  .fan-card{
    /* The frame art draws its own rounded corners (a ~4.5px radius at this
       size) and is transparent outside them, so this clip only exists to
       keep the full-width "back in May" ribbon inside the card's silhouette.
       It has to stay at or under the art's own radius - at 9px it was
       cropping the corners off the artwork. */
    width:66px; height:101.5px; border-radius:5px;
    box-shadow:0 6px 14px rgba(0,0,0,0.34); overflow:hidden; position:relative;
    transform-origin:center bottom;
    cursor:pointer;
  }
  /* The frame art is a layer ON TOP of the photo, not the card's background,
     so the photo can be bigger than the window and tuck its edges behind the
     painted wood instead of overlapping it. The window itself is a real
     transparent hole in card-frame-v7.webp, so the photo shows through it. */
  .fan-card::after{
    content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
    background:url('/static/card-frame-v7.webp') center/100% 100% no-repeat;
  }
  .fan-card.unfound{filter:grayscale(1) brightness(.9);}
  /* The frame art has an empty cream disc in each of those two corners; the
     pack's own mark drops into them. One flat silhouette per pack, recoloured
     live via mask + background-color, so all ten share the frame rather than
     needing ten painted frames.

     The box is square IN PIXELS (9% of 66 = 5.94px across, 5.85% of 101.5 =
     5.94px down) and the mask is sized to contain, so a wide mark like
     Waterwings and a tall one like Locals both sit inside the same round disc
     without either being stretched. Centres measured off the frame artwork:
     the discs are not quite symmetric, so each corner carries its own. */
  .fan-badge{
    position:absolute; z-index:3; width:9.00%; height:5.85%;
    background-color:var(--pack-color);
    /* Pack colours are picked to read on the app's dark backgrounds; three of
       them (the yellow, the mint, the tan) all but vanish on this cream disc,
       so the mark is darkened uniformly rather than the palette being forked. */
    filter:brightness(.72) saturate(1.15);
    -webkit-mask-size:contain; mask-size:contain;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
  }
  .fan-badge.tl{left:4.50%; top:3.03%;}
  .fan-badge.br{right:4.22%; bottom:3.93%;}
  /* Sits BEHIND the frame layer (z-index 1 vs the frame's 2) and is 5px
     bigger than the window in both directions, centred on it, so its edges
     disappear under the painted wood rather than butting up against it.
     Window measured off card-frame-v7.webp: 3.93px from left, 4.59px from
     top, 58.06 x 56.94px on this 66 x 101.5px card - the card box matches the
     artwork's own 906x1394 proportions, so nothing is stretched. */
  .fan-photo{
    position:absolute; z-index:1;
    left:1.43px; top:2.09px; width:63.06px; height:61.94px;
    object-fit:cover; object-position:var(--bird-crop);
    display:block; background:var(--parch-dk);
  }
  .fan-photo.empty{display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--parch-dk);}
  /* opacity lives on the emoji itself, not .fan-photo.empty - that div's own
     background must stay fully opaque, since the window above it is a real
     hole in the frame art rather than painted-in card colour. */
  .fan-photo-emoji{opacity:.3;}
  /* Nameplate area of the frame art, measured the same way as the window. */
  .fan-name{position:absolute;z-index:3;left:2.83px;top:61.90px;width:60.33px;height:36.00px;font-family:'Poppins';font-weight:700;font-size:8.5px;color:var(--dusk);text-align:center;line-height:1.1;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0 2px;box-sizing:border-box;}
  .fan-pips{display:flex;gap:3px;justify-content:center;padding:2px 0;}
  .fan-pip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--tier-color);opacity:.3;}
  .fan-pip.got{background:var(--tier-color);opacity:1;}
  .pack-status{text-align:center;font-family:'Poppins';font-weight:700;font-size:11.5px;color:rgba(255,255,255,0.85);margin-top:8px;}
  /* Hover/selection caption, sitting below the progress bar where there's
     room for a four-line hint. It's the last thing on the screen, so it can
     size to its text - nothing below it to push around, which is why there's
     no reserved height here. */
  .fan-caption{
    text-align:center;font-family:'Poppins';font-weight:700;font-size:11px;
    color:rgba(255,255,255,0.92);line-height:1.4;
    margin:10px auto 0;max-width:300px;padding:0 10px;
    transition:opacity .15s ease;
  }
  .fan-caption:empty{opacity:0;}
  .habitat-tap{font-family:'Poppins';font-weight:700;font-size:9.5px;color:var(--mist-dk);margin-top:7px;text-transform:uppercase;letter-spacing:.05em;}
  .hab-list{width:100%;display:flex;flex-direction:column;gap:6px;}
  .hab-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:7px 12px 7px 8px;}
  .hab-row.mystery{background:rgba(255,255,255,0.42);}
  .hab-row-num{font-family:'Poppins';font-weight:900;font-size:11px;color:var(--mist-dk);width:18px;text-align:center;flex-shrink:0;}
  .hab-row-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;object-position:var(--bird-crop);flex-shrink:0;background:var(--parch-dk);display:flex;align-items:center;justify-content:center;}
  .hab-row-silhouette{font-size:19px;filter:grayscale(1) brightness(.4);opacity:.45;}
  .hab-row-name{flex:1;font-family:'Poppins';font-weight:700;font-size:12.5px;color:var(--dusk);min-width:0;}
  .hab-row.mystery .hab-row-name{color:var(--mist-dk);font-weight:400;font-style:italic;}
  .hab-row-mark{font-family:'Poppins';font-weight:900;font-size:14px;color:var(--mist-dk);flex-shrink:0;}
  .hab-row-mark.found{color:var(--sage-dk);}
  .trophy-carousel{position:relative;width:100%;height:210px;margin-top:8px;overflow:hidden;touch-action:pan-y;}
  .trophy-slide{
    position:absolute; left:50%; top:8px; width:130px; cursor:pointer;
    transition:transform .32s cubic-bezier(.34,1.3,.64,1), opacity .32s ease;
  }
  .trophy-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,0.3));}
  .trophy-slide.locked .trophy-svg{filter:grayscale(0.9) brightness(0.72) drop-shadow(0 6px 12px rgba(0,0,0,0.28));}
  .trophy-slide.front .trophy-svg{filter:drop-shadow(0 12px 20px rgba(0,0,0,0.38));}
  .trophy-slide.front.locked .trophy-svg{filter:grayscale(0.9) brightness(0.72) drop-shadow(0 10px 16px rgba(0,0,0,0.34));}
  .trophy-caption{width:100%;max-width:300px;text-align:center;margin-top:6px;min-height:64px;}
  .trophy-caption-name{font-family:'Poppins';font-weight:900;font-size:19px;color:#fff;}
  .trophy-caption-req{font-size:12.5px;color:rgba(255,255,255,0.88);margin-top:4px;line-height:1.4;}
  .trophy-level{display:inline-block;background:var(--gold);color:var(--ink);font-size:10px;font-weight:900;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  .trophy-caption-next{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:5px;}
  .trophy-caption-tap{font-family:'Poppins';font-weight:700;font-size:10.5px;color:var(--gold);margin-top:6px;text-transform:uppercase;letter-spacing:.05em;}
  /* Feathers-earned and "go again" share one grid cell (both always in the
     DOM, never display:none) so the cell's height is fixed to whichever is
     taller - swapping which one is visible is a pure opacity crossfade with
     no layout height change, which is what keeps everything below/above it
     from shifting position when the transition happens. */
  .done-feathers-slot{position:relative; display:grid;}
  .done-feathers-slot > *{grid-area:1 / 1;}
  .done-feathers-slot .go-again-content{
    display:flex; flex-direction:column; align-items:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .done-feathers-slot .go-again-content.visible{opacity:1; pointer-events:auto;}
  .done-feathers{font-family:'Poppins';font-weight:900;font-size:17px;color:var(--gold);margin-top:14px;transition:opacity .3s ease;}
  .done-feathers.collected{opacity:0; pointer-events:none;}
  .go-again-ask{font-family:'Poppins';font-weight:900;font-size:17px;color:#fff;margin-top:22px;}
  /* Dancing avatar on the Done screen: av-torso (body + both wings) adds a
     small shimmy, and each wing wave pivots at the shoulder joint where it
     meets the body - same wave shape/timing as a resting flap, just offset
     so the wings sit up in the air instead of hanging down. Legs and the
     face (eyes/beak/cheeks/accessories) sit outside av-torso and never
     move. The held item shares the right wing's pivot and timing, so
     anything carried waves with the wing holding it. */
  .avatar-dancing .av-torso{transform-origin:50px 70px;animation:bodyWiggle 0.45s ease-in-out infinite;}
  .avatar-dancing .av-wing-l{transform-origin:26px 58px;animation:wingL 0.6s ease-in-out infinite;}
  .avatar-dancing .av-wing-r,
  .avatar-dancing .av-held{transform-origin:74px 58px;animation:wingR 0.75s ease-in-out infinite;}
  @keyframes bodyWiggle{0%,100%{transform:translateX(0);}25%{transform:translateX(-0.6px);}75%{transform:translateX(0.6px);}}
  @keyframes wingL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(45deg);}}
  @keyframes wingR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-45deg);}}
  .done-avatar{margin-bottom:4px;}
  .done-trophy{cursor:pointer;}
  .done-trophy.celebrating{animation:trophyCelebrate .9s cubic-bezier(.34,1.56,.64,1);}
  @keyframes trophyCelebrate{
    0%{transform:scale(1) rotate(0);}
    25%{transform:scale(1.22) rotate(-7deg);}
    50%{transform:scale(1.22) rotate(7deg);}
    75%{transform:scale(1.28) rotate(-4deg);}
    100%{transform:scale(1.12) rotate(0);}
  }
  .trophy-banner-tap{font-family:'Poppins';font-weight:700;font-size:10px;color:var(--gold-dk);margin-top:8px;text-transform:uppercase;letter-spacing:.05em;}
  .done-feathers.tappable{cursor:pointer;animation:collectGlow 1.8s ease-in-out infinite;border-radius:20px;padding:6px 18px;}
  .spark{position:fixed;z-index:200;pointer-events:none;font-size:18px;will-change:transform,opacity;}
  .bonus-list{width:100%;max-width:300px;margin-top:12px;}
  .bonus-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.18);border-radius:10px;padding:8px 13px;margin-bottom:6px;font-family:'Poppins';font-weight:700;font-size:12.5px;color:#fff;}
  .bonus-feathers{color:var(--gold);}
  .trophy-banner{
    width:100%;background:var(--goldbg,#FBF0D8);border:2px solid var(--gold);border-radius:16px;
    padding:14px;margin-top:16px;text-align:center;
  }
  .trophy-banner-title{font-family:'Poppins';font-weight:900;font-size:13px;color:var(--gold-dk);text-transform:uppercase;letter-spacing:.04em;}
  .trophy-banner-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
  .trophy-banner-emoji{font-size:24px;}
  .trophy-banner-text{text-align:left;}
  .trophy-banner-name{font-family:'Poppins';font-weight:700;font-size:14px;color:var(--dusk);}
  .trophy-banner-citation{font-size:11px;color:var(--mist-dk);}
</style>
</head>
<body>

       feTurbulence + feDisplacementMap gently warps the image edges and

  <div class="top">

<script>
const stage = document.getElementById('stage');
const featherCountEl = document.getElementById('featherCount');

// Untiered birds (everything outside a collector pack) get a neutral edge.
// Falling back to sage would have coloured them exactly like a Common bird,
// which claims a rarity they don't have.
function tierColorOf(tier) { return tier ? TIER_COLORS[tier] : 'var(--mist)'; }

// Three levels of "how exciting is this find", used during a session:
//   no tier  - a bird, but not one of Warble's 100
//   Common   - a collector bird, so it counts towards a pack
//   Rare     - one of the 20 rare collector birds
const SESSION_TIERS = {
  none:   { color: 'var(--mist)',   cls: 'find-plain'  },
  common: { color: 'var(--sage)',   cls: 'find-collect' },
  rare:   { color: 'var(--rare)',   cls: 'find-rare'   },
};
function sessionTier(tier) {
  if (tier === 'Rare') return SESSION_TIERS.rare;
  if (tier) return SESSION_TIERS.common;
  return SESSION_TIERS.none;
}

// Only two rarities exist now - Visitor went when rarity became a fixed
// property of the species rather than a per-location calculation.
const TIER_COLORS = { Common: 'var(--sage)', Rare: 'var(--rare)' };

let mediaRecorder, audioChunks = [], recordTimerInterval, recordSeconds = 0;
let sessionResults = [], cardIndex = 0;
let sessionBonuses = [], sessionFeatherTotal = 0;
// Running feather total, kept in step with the counter in the top bar so the
// per-card fly-and-count animation can add to it without re-fetching.
let currentFeatherTotal = 0;
let allSightingsRaw = [];

async function refreshFeathers() {
  try {
    const res = await fetch('/feathers');
    const data = await res.json();
    currentFeatherTotal = data.total_feathers;
    animateFeatherCount(data.total_feathers);
  } catch (e) { /* fine to fail quietly here */ }
}

function animateFeatherCount(newTotal) {
  const el = featherCountEl;
  const startVal = parseInt(el.textContent, 10) || 0;
  const endVal = Math.round(newTotal);
  if (startVal === endVal) { el.textContent = endVal; return; }
  const duration = 700;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out, fast then settling
    el.textContent = Math.round(startVal + (endVal - startVal) * eased);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = endVal;
      const pill = el.closest('.feathers');
      if (pill) {
        pill.classList.add('feather-pop');
        setTimeout(() => pill.classList.remove('feather-pop'), 320);
      }
    }
  }
  requestAnimationFrame(step);
}

// --- Home ------------------------------------------------------------------
// One obvious thing to do, then two things worth looking at, then two small
// ones. The four equal circles that used to sit here read as a menu of app
// features; a child opening this should see somewhere to start instead.
function renderIdle() {
  setActiveTab('home');
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="home-wordmark"><img src="/static/wordmark.webp" alt="Warble" style="height:100%;display:block;margin:0 auto;"></div>
    <div class="mic-wrap mic-alive" id="micWrap">
      <button class="mic-btn" id="recordBtn"><img class="mic-icon" src="/static/mic-v2.webp" alt="Record"></button>
    </div>
    <div class="stage-label">${firstNameOrDefault() ? `Get out there, ${firstNameOrDefault()}` : 'Get out there'}</div>
    <div class="stage-sub">Hear some birds? Then tap the mic!</div>

    <button class="home-card herenow-card" id="hereNowCard">
      ${FLYING_BIRDS_SVG}
      <div class="home-card-eyebrow">🪽 Here Now</div>
      <div class="herenow-head" id="hereNowHead">Who's visiting?</div>
      <div class="herenow-sub"><span id="hereNowSub">Discover the birds around you right now</span> →</div>
    </button>

    <button class="home-card challenge-card" id="challengeCard">
      <div class="home-card-eyebrow">🎯 Your challenge
        <span class="spacer"></span>
        <span class="challenge-tally" id="challengeTally"></span>
      </div>
      <div class="challenge-text" id="challengeText">Loading…</div>
      <div class="challenge-bar"><div class="challenge-fill" id="challengeFill" style="width:0%"></div></div>
      <div class="challenge-note" id="challengeNote"></div>
    </button>

    <div class="home-minis">
      <button class="mini-card mini-joke" id="jokeMini">
        <span class="mini-icon" id="jokeMiniIcon">😄</span>
        <span class="mini-text">
          <span class="mini-label">Bird joke</span>
          <span class="mini-body" id="jokeMiniBody">Tap me!</span>
        </span>
      </button>
    </div>
  `;

  // Answer the tap before the listening screen has loaded - on a slow phone
  // that gap is long enough for a child to press again.
  const wrap = document.getElementById('micWrap');
  const mic = document.getElementById('recordBtn');
  mic.onpointerdown = () => wrap.classList.add('pressed');
  mic.onpointerup = mic.onpointercancel = () => wrap.classList.remove('pressed');
  mic.onclick = () => { wrap.classList.remove('mic-alive'); startRecording(); };

  document.getElementById('hereNowCard').onclick = renderWhatsHere;
  document.getElementById('challengeCard').onclick = renderChallenges;
  document.getElementById('jokeMini').onclick = renderJokeOfDay;
  showHomeScene(true);
  loadHereNowCard();
  loadChallengeCard();
  loadJokeTileStatus();
}

// Three birds in the corner of the Here Now card. Drawn rather than an
// emoji: this is the one picture on the screen that has to say "migration"
// rather than "calendar".
const FLYING_BIRDS_SVG = `<svg class="herenow-birds" viewBox="0 0 120 62" fill="none"
  stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true">
  <path class="b1" d="M12 26 q9 -11 18 0 q9 -11 18 0"/>
  <path class="b2" d="M55 12 q7 -8 14 0 q7 -8 14 0"/>
  <path class="b3" d="M78 40 q6 -7 12 0 q6 -7 12 0"/>
</svg>`;

// Walks the list one at a time and remembers where it got to, so a run of
// quiet sessions works through all six rather than repeating whichever one
// today happened to land on.
function nextListeningTip() {
  const seen = parseInt(remember('tipSeen'), 10);
  const next = (Number.isFinite(seen) ? seen + 1 : 0) % WARBLING_TIPS.length;
  remember('tipSeen', next);
  return WARBLING_TIPS[next];
}

// Display copy only - never matched back against a species. Full common
// names are what BirdNET returns and what everything else keys on, but
// "Common House-Martin are back!" is not a sentence a seven-year-old reads.
const SEASONAL_NICKNAMES = {
  'Barn Swallow': 'swallows', 'Common House-Martin': 'house martins',
  'Common Tern': 'terns', 'Willow Warbler': 'willow warblers',
  'Common Whitethroat': 'whitethroats', 'Sedge Warbler': 'sedge warblers',
  'Common Redstart': 'redstarts', 'Ring Ouzel': 'ring ouzels',
  'Lesser Whitethroat': 'lesser whitethroats',
  'Eurasian Reed Warbler': 'reed warblers',
  'European Turtle-Dove': 'turtle doves', 'Eurasian Hobby': 'hobbies',
  'Common Cuckoo': 'cuckoos', 'Redwing': 'redwings',
};
const nickname = n => SEASONAL_NICKNAMES[n] || n;

async function loadHereNowCard() {
  const head = document.getElementById('hereNowHead');
  const sub = document.getElementById('hereNowSub');
  if (!head) return;
  try {
    const res = await fetch('/whats-here');
    const d = await res.json();
    const birds = d.birds || [];
    const of = st => birds.filter(b => b.state === st);
    const leaving = of('leaving'), here = of('here').filter(b => b.pack), arriving = of('arriving');

    // Urgency first: a bird about to go is the one thing here with a deadline.
    if (leaving.length) {
      head.textContent = `Last chance to hear the ${nickname(leaving[0].common_name)}!`;
      sub.textContent = leaving.length > 1
        ? `${leaving.length} birds are leaving soon` : 'They are leaving soon';
    } else if (here.length) {
      head.textContent = `The ${nickname(here[0].common_name)} are back!`;
      sub.textContent = d.to_find
        ? `${d.to_find} visiting bird${d.to_find === 1 ? '' : 's'} still to find`
        : 'See every bird visiting right now';
    } else if (arriving.length) {
      head.textContent = `The ${nickname(arriving[0].common_name)} are on their way!`;
      sub.textContent = 'See who is arriving next';
    } else {
      head.textContent = "Who's visiting?";
      sub.textContent = 'Discover the birds around you right now';
    }
  } catch (e) { /* the card keeps the copy it rendered with */ }
}

async function loadChallengeCard() {
  const text = document.getElementById('challengeText');
  if (!text) return;
  const tally = document.getElementById('challengeTally');
  const fill = document.getElementById('challengeFill');
  const note = document.getElementById('challengeNote');
  try {
    const res = await fetch('/weekly-challenges');
    const d = await res.json();
    const all = d.challenges || [];
    // The one being worked on: furthest along of the unfinished ones, so the
    // card shows progress a child can nearly finish rather than a fresh zero.
    const open = all.filter(c => !c.complete)
      .sort((a, b) => (b.progress / b.target) - (a.progress / a.target));

    if (!all.length) {
      text.textContent = 'New challenges every Monday';
      note.textContent = 'Tap to take a look';
      fill.style.width = '0%';
      return;
    }
    if (!open.length) {
      tally.textContent = `${all.length}/${all.length}`;
      text.textContent = 'Every challenge done this week!';
      fill.style.width = '100%';
      fill.classList.add('done');
      note.textContent = 'Come back on Monday for more 🎉';
      return;
    }
    const c = open[0];
    tally.textContent = `${c.progress}/${c.target}`;
    text.textContent = c.text;
    fill.style.width = Math.round((c.progress / c.target) * 100) + '%';
    const left = c.target - c.progress;
    note.textContent = c.progress === 0 ? "Let's get started!"
      : left === 1 ? 'Just one more to go!'
      : `${left} more to go!`;
  } catch (e) {
    text.textContent = 'This week\'s challenges';
    note.textContent = 'Tap to take a look';
  }
}

async function renderWhatsHere() {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div style="width:100%;margin-bottom:12px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="collection-title" style="margin-bottom:4px;">Here Right Now</div>
    <div class="collection-count">Some birds only visit for part of the year</div>
    <div id="seasonList" style="width:100%;"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    renderIdle();
  };
  const list = document.getElementById('seasonList');
  try {
    const res = await fetch('/whats-here');
    const d = await res.json();
    // Here and leaving first - those are the ones you can act on today
    const rank = { leaving: 0, here: 1, arriving: 2, away: 3 };
    const birds = (d.birds || []).sort((a, b) =>
      (rank[a.state] - rank[b.state]) || a.common_name.localeCompare(b.common_name));
    list.innerHTML = birds.map(b => `
      <div class="season-row season-${b.state} tappable" data-name="${b.common_name}">
        <span class="season-dot"></span>
        <span class="season-name">${b.common_name}</span>
        <span class="season-label">${b.found ? '✓ ' : ''}${b.label}</span>
        <span class="season-chevron">›</span>
      </div>`).join('');
    list.querySelectorAll('.season-row').forEach(row => {
      row.onclick = () => renderMigrationCard(row.dataset.name, renderWhatsHere);
    });
  } catch (e) {
    list.innerHTML = `<div class="collection-empty">Couldn't load right now.</div>`;
  }
}

function migrationRoutePathD(points) {
  return points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');
}

// The map image itself is /static/migration-map-base.webp (560x780) - real
// Wikimedia Commons continent shapes (CC BY-SA 3.0/GFDL), cropped to Europe/
// Africa/Middle East and calibrated against Africa's actual real-world
// extremes rather than eyeballed. This overlay just draws the route on top,
// sized to match the image exactly so the two line up with plain CSS
// stacking - no projection math happens here.
function renderMigrationMap(info) {
  const uk = info.route[0];
  const dest = info.route[info.route.length - 1];
  // The dashed line is drawn in the actual direction of travel - for the one
  // "arrives" species (Redwing) that's destination-to-UK, the reverse of how
  // every "departs" route is stored, so the arrowhead points the right way
  // regardless of which end the data lists first.
  const drawPoints = info.direction === 'arrives' ? [...info.route].reverse() : info.route;
  return `
    <div class="migration-map-panel">
      <img class="migration-map-img" src="/static/migration-map-base.webp" alt="Map of Europe and Africa">
      <svg viewBox="0 0 560 780" class="migration-map-overlay">
        <defs>
          <marker id="migArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#2D1B69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <path d="${migrationRoutePathD(drawPoints)}" fill="none" stroke="#2D1B69" stroke-width="3.5"
              stroke-dasharray="10 8" stroke-linecap="round" opacity="0.9" marker-end="url(#migArrow)"/>
        <circle cx="${uk[0]}" cy="${uk[1]}" r="9" fill="#2D1B69" stroke="#fff" stroke-width="3"/>
        <circle cx="${dest[0]}" cy="${dest[1]}" r="10" fill="#E8845C" stroke="#fff" stroke-width="3.5"/>
      </svg>
    </div>
    <div class="migration-credit">Map: <a href="https://commons.wikimedia.org/wiki/File:Continents_vide_couleurs-automatedvector.svg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 3.0</div>`;
}

async function renderMigrationCard(commonName, onBack) {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div style="width:100%;margin-bottom:12px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="migration-title">${commonName}</div>
    <div class="migration-subtitle" id="migrationSubtitle">Loading...</div>
    <div id="migrationMapWrap" style="width:100%;"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    (onBack || renderIdle)();
  };
  const wrap = document.getElementById('migrationMapWrap');
  try {
    const res = await fetch(`/migration/${encodeURIComponent(commonName)}`);
    const data = await res.json();
    const info = data.migration;
    if (!info) {
      document.getElementById('migrationSubtitle').textContent = '';
      wrap.innerHTML = `<div class="collection-empty">No migration story for this bird yet.</div>`;
      return;
    }
    document.getElementById('migrationSubtitle').textContent = info.direction === 'arrives'
      ? 'Where it breeds - it winters here in the UK'
      : 'Where it goes for the winter';
    wrap.innerHTML = `
      ${renderMigrationMap(info)}
      <div class="migration-destination">${info.destination_name}</div>
      <div class="migration-fact">${info.fact}</div>
    `;
  } catch (e) {
    document.getElementById('migrationSubtitle').textContent = '';
    wrap.innerHTML = `<div class="collection-empty">Couldn't load right now.</div>`;
  }

}

// The same two-hue bird bust used for the Profile icon, reused for the
// live detection badges so they read as "a bird" in Warble's own style
// rather than a generic emoji.
// The fixed two-hue bird bust used by the top-bar profile button, kept here
// so it can be restored after a photo is cleared.
const PROFILE_BIRD_SVG = '<svg viewBox="0 0 24 24" color="#8E87B8"><path d="M4.6 21.6 L4.6 15.4 L9.4 11.2 L19.2 11.2 L19.2 21.6 Z" fill="#C4BFDF"/><circle cx="14.6" cy="7.6" r="5" fill="#8E87B8"/><path d="M19.2 5.9 L23.4 7.9 L19.2 9.9 Z" fill="#8E87B8"/><circle cx="13.4" cy="6.6" r="1.5" fill="#fff"/><path d="M9.4 11.2 L14.4 11.2 L9.4 16 Z" fill="#8E87B8"/></svg>';

const BADGE_BIRD_SVG = '<svg viewBox="0 0 24 24" width="26" height="26"><path d="M4.6 21.6 L4.6 15.4 L9.4 11.2 L19.2 11.2 L19.2 21.6 Z" fill="#C4BFDF"/><circle cx="14.6" cy="7.6" r="5" fill="#8E87B8"/><path d="M19.2 5.9 L23.4 7.9 L19.2 9.9 Z" fill="#8E87B8"/><circle cx="13.4" cy="6.6" r="1.5" fill="#fff"/><path d="M9.4 11.2 L14.4 11.2 L9.4 16 Z" fill="#8E87B8"/></svg>';

// Rare first, then collector birds, then anything else - so the best find
// of the session sits at the front of the badge stack.
const TIER_ORDER = { Rare: 0, Common: 1 };
let liveDetectedBirds = [];
let liveBadgedSpecies = new Set();

function renderLiveBirdStack() {
  const el = document.getElementById('liveBirdStack');
  if (!el) return;
  // Tiered (pack) birds first and rarest-first; untiered birds after them.
  const sorted = [...liveDetectedBirds].sort((a, b) => (TIER_ORDER[a.tier] ?? 3) - (TIER_ORDER[b.tier] ?? 3));
  el.innerHTML = sorted.map((bird, i) => {
    const t = sessionTier(bird.tier);
    // Duration and a negative delay (so it starts already mid-cycle rather
    // than every badge launching from the same pose) both vary by position,
    // the same trick used for the dancing avatar's wings - it's what makes
    // a row of badges read as independently jittering rather than one badge
    // copy-pasted sideways.
    const dur = (2.1 + (i % 4) * 0.3).toFixed(2);
    const delay = (-(i % 5) * 0.4).toFixed(2);
    const packDot = bird.pack_color ? `<div class="pack-dot" style="--pack-color:${bird.pack_color}"></div>` : '';
    return `<div class="live-bird-badge ${t.cls} ${bird.is_new ? 'badge-new' : ''}" style="--tier-color:${t.color}">
      ${packDot}
      <div class="badge-jitter" style="animation-duration:${dur}s; animation-delay:${delay}s;">${BADGE_BIRD_SVG}</div>
    </div>`;
  }).join('');
}

// No "listening back" step any more - identification already happened live
// during the recording, so stopping just posts a small JSON payload and gets
// the enrichment back. On a good connection that's imperceptible, and the
// reveal appears straight away.
//
// This is kept only as a safety net for a slow or flaky connection, shown
// after a short delay rather than immediately, so it never flashes up on a
// normal session. The wording is honest about what's actually happening.
function renderSaving() {
  stage.innerHTML = `
    <div class="stage-label">Just a moment...</div>
    <div class="stage-sub">Saving what you found</div>
  `;
}

function renderError(message) {
  stage.innerHTML = `
    <div class="stage-label">Hmm, that didn't work</div>
    <div class="error">${message}</div>
    <button class="again-btn" id="retryBtn">Try again</button>
  `;
  document.getElementById('retryBtn').onclick = renderIdle;
}

function renderSessionResults() {
  if (sessionResults.length === 0) {
    renderNoBirds();
    return;
  }

  const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
  const timeStr = `${m}:${s.toString().padStart(2, '0')}`;
  const locationLine = sessionLocationName ? ` at ${sessionLocationName}` : '';

  const silhouettes = sessionResults.map((bird, i) => {
    const t = sessionTier(bird.tier);
    const angle = (i % 2 === 0 ? -1 : 1) * (5 + i * 2);
    // Front-to-back, so the first card - the one that's tappable and reveals
    // next - sits on TOP of the pack. Without an explicit z-index the DOM
    // order wins and it ends up buried at the back, which is backwards.
    const z = sessionResults.length - i;
    return `<div class="silhouette-card ${t.cls}" style="--tier-color:${t.color}; transform:rotate(${angle}deg); z-index:${z}; animation-delay:${(i * 0.08).toFixed(2)}s;"><span style="opacity:0.35;filter:grayscale(1);">🐦</span></div>`;
  }).join('');

  stage.innerHTML = `
    <div class="results-title">You heard ${sessionResults.length} bird${sessionResults.length === 1 ? '' : 's'}!</div>
    <div class="results-sub">${timeStr} session${locationLine}</div>
    <div class="silhouette-row">${silhouettes}</div>
    <div class="reveal-hint">Tap the first card to reveal</div>
  `;
  // The first (frontmost) card is the tap target, so the gesture matches the
  // instruction rather than needing a separate button.
  const firstCard = stage.querySelector('.silhouette-card');
  if (firstCard) {
    firstCard.classList.add('tappable');
    firstCard.onclick = () => { cardIndex = 0; renderCard(); };
  }
}

// Reveal order builds towards the best find: commonest first, and within a
// tier the ones already in the collection before genuinely new ones. So the
// last card of a session is the rarest new bird - the moment worth waiting for.
const REVEAL_TIER_RANK = { Common: 1, Rare: 2 };   // untiered birds fall to 0
function sortForReveal(birds) {
  return [...birds].sort((a, b) => {
    const t = (REVEAL_TIER_RANK[a.tier] ?? 0) - (REVEAL_TIER_RANK[b.tier] ?? 0);
    if (t !== 0) return t;
    return (a.is_duplicate ? 0 : 1) - (b.is_duplicate ? 0 : 1);
  });
}

// Which pack this bird belongs to. A bird has one fixed rarity now, so there
// is no set of tiers to collect - just the pack it counts towards.
function packStripHtml(bird) {
  if (!bird.pack_name) return '';
  return `
    <div class="collector-strip">
      <div class="collector-label">Collection</div>
      <div class="pack-chip">${bird.pack_name}</div>
    </div>`;
}

function renderCard() {
  if (sessionResults.length === 0) { renderNoBirds(); return; }
  const bird = sessionResults[cardIndex];
  const tierColor = tierColorOf(bird.tier);
  stage.innerHTML = `
    <div class="card-wrap">
      <div class="progress">Bird ${cardIndex + 1} of ${sessionResults.length}</div>
      <div class="card ${bird.tier === 'Rare' ? 'rare-card' : ''}" id="revealCard" style="--tier-color:${tierColor}">
        ${bird.photo_url ? `<img class="card-photo" ${birdImg(bird.photo_url, 800)}>` : `<div class="card-photo"></div>`}
        <div class="card-body">
          <div class="card-name">${bird.common_name}</div>
          ${currentProfile.show_scientific_names !== false ? `<div class="card-sci">${bird.scientific_name}</div>` : ''}
          <div class="card-tags">
            <span class="tag ${bird.is_duplicate ? 'dup' : 'new'}">${bird.is_duplicate ? 'Already found' : 'New!'}</span>
          </div>
          ${bird.season && bird.season.state === 'away'
            ? `<div class="season-surprise">Unusual! ${bird.common_name}s have normally left by now.</div>` : ''}
          ${packStripHtml(bird)}
          <div class="feather-row"><img class="feather-icon" src="/static/feather.webp" alt=""> +${bird.feathers}</div>
          ${bird.call_url ? `<button class="play-call-btn" data-call-url="${bird.call_url}">▶ Hear its call</button>` : ''}
          <a class="learn-more" href="${wikipediaUrl(bird.scientific_name)}" target="_blank" rel="noopener">Learn more →</a>
        </div>
      </div>
      <div class="collect-hint" id="collectHint"></div>
    </div>
  `;
  const playBtn = stage.querySelector('.play-call-btn');
  if (playBtn) playBtn.onclick = (e) => { e.stopPropagation(); playBirdCall(playBtn.dataset.callUrl, playBtn); };

  const cardEl = document.getElementById('revealCard');
  const hint = document.getElementById('collectHint');

  // The card is tappable as soon as it's revealed. One tap drives the whole
  // sequence: feathers fly to the counter, then the card flies to My Birds.
  cardEl.classList.add('collectable');
  if (hint) hint.textContent = bird.is_duplicate
    ? 'Tap to carry on'
    : 'Tap to add to your collection';
  cardEl.onclick = () => {
    cardEl.onclick = null;                   // one tap only, mid-flight taps ignored
    cardEl.classList.remove('collectable');
    if (hint) hint.textContent = '';
    // Feathers are collected once, on the Done screen - not per card.
    dismissCard(cardEl, !bird.is_duplicate, advanceReveal);
  };
}

function advanceReveal() {
  cardIndex++;
  if (cardIndex < sessionResults.length) {
    renderCard();
  } else if (needsLocationName) {
    renderNameLocation(finishSession);
  } else {
    finishSession();
  }
}

function finishSession() {
  renderDone();
}

// --- Animation 1: feathers fly from the card to the counter, which counts up
function flyFeathersToCounter(cardEl, feathers, onDone) {
  const counter = document.querySelector('.feathers');
  if (!cardEl || !counter || !feathers) { setTimeout(onDone, 450); return; }

  const from = cardEl.getBoundingClientRect();
  const to = counter.getBoundingClientRect();
  // One feather per 5 earned reads as "more feathers" without a swarm of 50.
  const count = Math.max(3, Math.min(10, Math.round(feathers / 5)));
  const startTotal = currentFeatherTotal;

  for (let i = 0; i < count; i++) {
    const f = document.createElement('div');
    f.className = 'flying-feather';
    f.innerHTML = '<img class="feather-icon" src="/static/feather.webp" alt="">';
    f.style.left = `${from.left + from.width / 2}px`;
    f.style.top = `${from.top + from.height / 2}px`;
    document.body.appendChild(f);
    const dx = (to.left + to.width / 2) - (from.left + from.width / 2);
    const dy = (to.top + to.height / 2) - (from.top + from.height / 2);
    // Stagger so they stream rather than move as one block
    const delay = i * 70;
    requestAnimationFrame(() => {
      f.style.transition = `transform .75s cubic-bezier(.4,0,.5,1) ${delay}ms, opacity .3s ease ${delay + 550}ms`;
      f.style.transform = `translate(${dx}px, ${dy}px) scale(.5) rotate(${(Math.random() - .5) * 120}deg)`;
      f.style.opacity = '0';
    });
    setTimeout(() => f.remove(), delay + 900);
  }

  const flightTime = (count - 1) * 70 + 750;
  currentFeatherTotal = startTotal + feathers;
  setTimeout(() => animateFeatherCount(currentFeatherTotal), 400);
  setTimeout(onDone, flightTime);
}

// --- Animation 2: card shrinks away into the My Birds tab
// A new bird spins, shrinks and flies into the My Birds tab - it's going into
// the collection, so the card should visibly go there. A duplicate spins and
// shrinks on the spot: the same satisfying dismissal, but no journey, because
// nothing is being added.
// Origami bird, folded from flat triangles - deliberately paper-like rather
// than a realistic bird, with a light and dark face per wing so the folds read.
const ORIGAMI_SVG = `
<svg viewBox="0 0 100 100" width="96" height="96" class="origami">
  <g class="ori-wing-l">
    <path d="M50 52 L6 30 L48 44 Z" fill="#F5EDD6"/>
    <path d="M50 52 L48 44 L44 66 Z" fill="#E4D5AE"/>
  </g>
  <g class="ori-wing-r">
    <path d="M50 52 L94 30 L52 44 Z" fill="#F2C94C"/>
    <path d="M50 52 L52 44 L56 66 Z" fill="#D9A441"/>
  </g>
  <path d="M50 52 L44 66 L56 66 Z" fill="#E8845C"/>
  <path d="M50 52 L56 66 L72 78 Z" fill="#B85A36"/>
  <path d="M50 52 L40 38 L58 40 Z" fill="#F5EDD6"/>
  <path d="M58 40 L70 36 L58 46 Z" fill="#E8845C"/>
</svg>`;

// A scatter of leaves at the moment the card becomes a bird - it covers the
// swap and makes the transformation feel like it disturbed something.
// Named distinctly from the recording tree's LEAF_COLORS - two top-level
// consts of the same name is a SyntaxError that kills the whole script.
const BURST_LEAF_COLORS = ['#7EC8A4', '#5FB88F', '#F2C94C', '#E8845C', '#3F7C5C'];

function burstLeaves(cx, cy) {
  for (let i = 0; i < 14; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'burst-leaf';
    const c = BURST_LEAF_COLORS[i % BURST_LEAF_COLORS.length];
    leaf.innerHTML = `<svg viewBox="0 0 12 12" width="12" height="12">
      <path d="M6 0 Q11 5 6 12 Q1 5 6 0 Z" fill="${c}"/>
      <path d="M6 1 V11" stroke="rgba(0,0,0,.18)" stroke-width="0.7"/></svg>`;
    leaf.style.left = `${cx}px`;
    leaf.style.top = `${cy}px`;
    document.body.appendChild(leaf);

    // Thrown outward and upward, then gravity takes them down - so they burst
    // rather than simply radiating evenly like a firework.
    const angle = (Math.PI * 2 * i) / 14 + (Math.random() - 0.5) * 0.5;
    const dist = 55 + Math.random() * 65;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist * 0.65 - 30;
    const spin = (Math.random() - 0.5) * 720;

    requestAnimationFrame(() => {
      leaf.style.transition = 'transform .85s cubic-bezier(.15,.6,.3,1), opacity .35s ease .5s';
      leaf.style.transform = `translate(${dx}px, ${dy + 90}px) rotate(${spin}deg) scale(.7)`;
      leaf.style.opacity = '0';
    });
    setTimeout(() => leaf.remove(), 900);
  }
}

// Occasional leaf bursts around the dancing avatar on the Done screen - reuses
// the same burstLeaves used when a card becomes a bird, just on a loose,
// randomised timer rather than a one-off. Self-cancels once the avatar is no
// longer on screen (navigating away replaces stage.innerHTML, so this checks
// rather than relying on a screen-change hook that doesn't exist yet).
let doneLeafTimer = null;

function scheduleDoneLeafBurst(avatarEl) {
  if (doneLeafTimer) clearTimeout(doneLeafTimer);
  if (!avatarEl) return;
  const delay = 2200 + Math.random() * 2600;
  doneLeafTimer = setTimeout(() => {
    if (!document.body.contains(avatarEl)) { doneLeafTimer = null; return; }
    const rect = avatarEl.getBoundingClientRect();
    burstLeaves(rect.left + rect.width / 2, rect.top + rect.height / 2);
    scheduleDoneLeafBurst(avatarEl);
  }, delay);
}

// A new bird folds into an origami bird and flies to My Birds along a curved
// path. A duplicate just spins and shrinks on the spot - nothing is being
// added, so nothing should fly anywhere.
function dismissCard(cardEl, isNew, onDone) {
  if (!cardEl) { onDone(); return; }
  cardEl.classList.remove('collectable');
  // cardReveal runs with fill mode 'both', so it holds its end transform and
  // would override the inline one below. Clear it before animating out.
  cardEl.style.animation = 'none';

  if (!isNew) {
    cardEl.style.transition = 'transform .45s cubic-bezier(.55,0,.65,1), opacity .25s ease .23s';
    cardEl.style.transform = 'scale(.06) rotate(300deg)';
    cardEl.style.opacity = '0';
    setTimeout(onDone, 470);
    return;
  }

  const target = document.getElementById('navCollection');
  const from = cardEl.getBoundingClientRect();
  const cx = from.left + from.width / 2;
  const cy = from.top + from.height / 2;

  // Step 1: the card folds and shrinks together, turning all the way to 90
  // degrees. At exactly side-on it has no visible width, which is what makes
  // the swap invisible - there's nothing left to see at the moment it goes.
  const FOLD = 320;
  cardEl.style.transformOrigin = 'center center';
  cardEl.style.transition = `transform ${FOLD}ms cubic-bezier(.45,0,.55,1)`;
  cardEl.style.transform = 'perspective(620px) rotateY(90deg) scale(.34)';

  setTimeout(() => {
    cardEl.style.opacity = '0';   // hidden while edge-on, so nothing flickers back
    burstLeaves(cx, cy);          // the fold 'shakes loose' a scatter of leaves
    // Step 2: the folded card becomes the origami bird, in the same spot
    const bird = document.createElement('div');
    bird.className = 'origami-flyer';
    bird.innerHTML = ORIGAMI_SVG;
    bird.style.left = `${cx - 48}px`;
    bird.style.top = `${cy - 48}px`;
    document.body.appendChild(bird);

    if (!target) { bird.remove(); onDone(); return; }
    const to = target.getBoundingClientRect();
    const dx = (to.left + to.width / 2) - cx;
    const dy = (to.top + to.height / 2) - cy;

    // Step 3: fly along a curve, lifting before it dives, so it swoops rather
    // than slides. Rotation follows the tangent so the bird points where it's
    // actually going.
    const lift = Math.max(120, Math.abs(dy) * 0.45);
    const ctrlX = dx * 0.5, ctrlY = dy * 0.5 - lift;
    const DURATION = 900;
    const start = performance.now();

    (function step(now) {
      const t = Math.min(1, (now - start) / DURATION);
      const e = t * t * (3 - 2 * t);                    // ease in and out
      const x = 2 * (1 - e) * e * ctrlX + e * e * dx;
      const y = 2 * (1 - e) * e * ctrlY + e * e * dy;
      // Tangent of the curve, for the heading
      const tx = 2 * (1 - e) * ctrlX + 2 * e * (dx - ctrlX);
      const ty = 2 * (1 - e) * ctrlY + 2 * e * (dy - ctrlY);
      const angle = Math.atan2(ty, tx) * 180 / Math.PI - 90;
      const scale = 1 - 0.72 * e;
      bird.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg) scale(${scale})`;
      bird.style.opacity = t > 0.82 ? String((1 - t) / 0.18) : '1';
      if (t < 1) requestAnimationFrame(step);
      else {
        bird.remove();
        target.classList.add('nav-pop');
        setTimeout(() => target.classList.remove('nav-pop'), 600);
        onDone();
      }
    })(start);
  }, FOLD);
}

// --- My Flock --------------------------------------------------------------
// One screen over two views. Birds is a card per species; History is a row
// per detection, newest first. Search, filters and the grid density apply to
// both; sort applies to Birds only, since History is chronological by
// definition.
//
// Everything here reads the sightings the app already has. Nothing is
// invented: a sort or filter only exists if a real field backs it, which is
// why there is no taxonomic order (no taxonomy in birds.py), no distance (no
// reference point to measure from) and no rarity (rarity lives in the
// collector packs on purpose - see CLAUDE.md).
let flockView = 'birds';       // 'birds' | 'history'
let flockSort = 'az';
let flockQuery = '';
let flockDensity = 'compact';  // 'compact' | 'large'
let flockFilters = {};         // {facet: [values]} - only non-empty facets present
// What the user has explicitly said about a History day: key -> shut?. Days
// they have not touched fall back to dayShutByDefault, so a day added
// tomorrow behaves like the rest rather than inheriting a stale choice.
let flockDayChoice = new Map();
let collectionBirds = [];

// Sorts, in the order they appear in the sheet. `get` returns the value to
// compare; `desc` flips it. Kept as data so the sheet, the button label and
// the comparison can never drift apart.
const FLOCK_SORTS = [
  { id: 'az',     label: 'A–Z',                 short: 'A–Z',
    get: b => b.common_name.toLowerCase() },
  { id: 'za',     label: 'Z–A',                 short: 'Z–A',
    get: b => b.common_name.toLowerCase(), desc: true },
  { id: 'recent', label: 'Recently discovered', short: 'Newest',
    get: b => +new Date(b.first_found), desc: true },
  { id: 'first',  label: 'First discovered',    short: 'Oldest',
    get: b => +new Date(b.first_found) },
  { id: 'heard',  label: 'Recently heard',      short: 'Last heard',
    get: b => +new Date(b.last_found), desc: true },
  { id: 'most',   label: 'Most heard',          short: 'Most heard',
    get: b => b.times_heard, desc: true },
  { id: 'least',  label: 'Least heard',         short: 'Least heard',
    get: b => b.times_heard },
];

const SEASON_OF = m =>
  (m === 12 || m <= 2) ? 'Winter' : m <= 5 ? 'Spring' : m <= 8 ? 'Summer' : 'Autumn';
const SEASON_ORDER = ['Spring', 'Summer', 'Autumn', 'Winter'];
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'];

// Confidence is a 0-1 float on every sighting. Three bands rather than a
// slider: a number between 0 and 1 means nothing to an eight-year-old.
const CONFIDENCE_BANDS = [
  { id: 'sure',   label: 'Very sure',  test: c => c >= 0.9 },
  { id: 'likely', label: 'Likely',     test: c => c >= 0.7 && c < 0.9 },
  { id: 'maybe',  label: 'A good guess', test: c => c < 0.7 },
];

// Each facet says how to get its values off a sighting and how to order the
// options. Returning [] means "this sighting matches no value", so a bird
// with no recorded location simply never matches a location filter.
const FLOCK_FACETS = [
  { id: 'habitat', label: 'Habitat',
    of: s => (s.bird && s.bird.habitat_tags) || [] },
  { id: 'location', label: 'Where you heard it',
    of: s => s.location_name ? [s.location_name] : [] },
  { id: 'season', label: 'Season',
    of: s => [SEASON_OF(new Date(s.created_at).getMonth() + 1)],
    order: v => SEASON_ORDER.indexOf(v) },
  { id: 'month', label: 'Month',
    of: s => [MONTH_NAMES[new Date(s.created_at).getMonth()]],
    order: v => MONTH_NAMES.indexOf(v) },
  { id: 'year', label: 'Year',
    of: s => [String(new Date(s.created_at).getFullYear())],
    order: v => -Number(v) },
  { id: 'confidence', label: 'How sure Warble was',
    of: s => { const b = CONFIDENCE_BANDS.find(b => b.test(s.confidence)); return b ? [b.label] : []; },
    order: v => CONFIDENCE_BANDS.findIndex(b => b.label === v) },
];

function remember(key, value) {
  // A remembered view is a convenience, never state the screen needs - a
  // private window or blocked site data must not break My Flock.
  try {
    if (value === undefined) return localStorage.getItem('warble.' + key);
    localStorage.setItem('warble.' + key, value);
  } catch (e) { /* no storage, no preference - the defaults still work */ }
  return null;
}

// The two icon buttons are a fixed 32x32 whatever the phone, so unlike the
// pills they could have been painted art. They are drawn instead: at 15px a
// painted magnifier turns to mush, where strokes stay crisp at any density
// and pick up the button's own colour for free. Weight is matched to the
// chunky rounded forms the rest of the app uses rather than to a thin
// system-icon set.
const SEARCH_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <circle cx="10.2" cy="10.2" r="6.3" stroke-width="3.2"/>
  <path d="M15.1 15.1 L20.4 20.4" stroke-width="3.8"/>
  <path d="M7.4 8.2 A4 4 0 0 1 10.6 6.3" stroke-width="1.6"
        stroke="rgba(255,255,255,0.45)"/>
</svg>`;

// Two little card grids rather than bars: the button shows the layout you
// would get by pressing it, so three-up while you are in large and two-up
// while you are in compact.
const DENSITY_ICON = {
  compact: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <rect x="1"  y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="9"  y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="17" y="3.5" width="6" height="7.5" rx="2"/>
    <rect x="1"  y="13"  width="6" height="7.5" rx="2"/>
    <rect x="9"  y="13"  width="6" height="7.5" rx="2"/>
    <rect x="17" y="13"  width="6" height="7.5" rx="2"/>
  </svg>`,
  large: `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <rect x="1.5"  y="2.5" width="9" height="9" rx="2.6"/>
    <rect x="13.5" y="2.5" width="9" height="9" rx="2.6"/>
    <rect x="1.5"  y="13"  width="9" height="9" rx="2.6"/>
    <rect x="13.5" y="13"  width="9" height="9" rx="2.6"/>
  </svg>`,
};

// A sentinel above the bar tells us when the bar has reached the top, which
// is cheaper and far steadier than reading scrollTop on every scroll event.
function watchFlockBar() {
  const bar = document.getElementById('flockBar');
  if (!bar || !window.IntersectionObserver) return;
  const mark = document.createElement('div');
  mark.style.cssText = 'position:absolute;height:1px;width:1px;';
  bar.parentNode.insertBefore(mark, bar);
  new IntersectionObserver(([e]) => {
    bar.classList.toggle('stuck', !e.isIntersecting);
    setSortLabel();
    // Collapsing on top of a live search would hide the text you typed, so
    // the field stays unfolded while there is anything in it.
    if (flockQuery) bar.classList.add('searching');
  }, { threshold: 0 }).observe(mark);
}

// --- the pipeline ----------------------------------------------------------
// Search, then filters, then sort, in that order and always all three: a new
// sort must not drop the search, and a new search must not drop the filters.
function matchesQuery(s) {
  const q = flockQuery.trim().toLowerCase();
  if (!q) return true;
  return s.common_name.toLowerCase().includes(q) ||
         (s.scientific_name || '').toLowerCase().includes(q);
}

function matchesFilters(s) {
  return FLOCK_FACETS.every(f => {
    const want = flockFilters[f.id];
    if (!want || !want.length) return true;
    return f.of(s).some(v => want.includes(v));   // within a facet, any of them
  });
}

function activeFilterCount() {
  return FLOCK_FACETS.reduce((n, f) => n + ((flockFilters[f.id] || []).length ? 1 : 0), 0);
}

function visibleSightings() {
  return allSightingsRaw.filter(s => matchesQuery(s) && matchesFilters(s));
}

// A species survives if any one of its detections does - filtering by
// "Woodland in October" should keep the bird you heard in a wood in October,
// not drop it because you also heard it in a garden in May.
function visibleBirds() {
  const kept = new Set(visibleSightings().map(s => s.common_name));
  const birds = collectionBirds.filter(b => kept.has(b.common_name));
  const rule = FLOCK_SORTS.find(r => r.id === flockSort) || FLOCK_SORTS[0];
  const out = [...birds].sort((a, b) => {
    const x = rule.get(a), y = rule.get(b);
    if (x < y) return -1;
    if (x > y) return 1;
    return a.common_name.localeCompare(b.common_name);   // steady tie-break
  });
  return rule.desc ? out.reverse() : out;
}

// --- painting --------------------------------------------------------------
function paintFlock() {
  const bar = document.getElementById('flockBar');
  if (!bar) return;
  const sortRule = FLOCK_SORTS.find(r => r.id === flockSort) || FLOCK_SORTS[0];
  const filters = activeFilterCount();

  document.getElementById('flockSearchWrap')
    .classList.toggle('has-text', !!flockQuery);
  document.getElementById('flockSeg').querySelectorAll('button')
    .forEach(b => b.classList.toggle('on', b.dataset.view === flockView));

  const history = flockView === 'history';
  const sortBtn = document.getElementById('flockSortBtn');
  setSortLabel();
  sortBtn.style.display = history ? 'none' : '';
  const foldBtn = document.getElementById('flockFoldBtn');
  foldBtn.style.display = history ? '' : 'none';

  const filterBtn = document.getElementById('flockFilterBtn');
  filterBtn.querySelector('.flock-ctl-label').textContent =
    filters ? `Filter (${filters})` : 'Filter';
  filterBtn.classList.toggle('on', filters > 0);

  const d = document.getElementById('flockDensityBtn');
  d.style.display = history ? 'none' : '';
  d.innerHTML = flockDensity === 'large' ? DENSITY_ICON.compact : DENSITY_ICON.large;
  d.setAttribute('aria-label', flockDensity === 'large' ? 'Show smaller cards' : 'Show bigger cards');

  paintFlockStats();
  if (history) { paintHistory(); setFoldLabel(); } else paintBirds();
}

function setFoldLabel() {

function setSortLabel() {
  const btn = document.getElementById('flockSortBtn');
  const bar = document.getElementById('flockBar');
  if (!btn || !bar) return;

  btn.querySelector('.flock-ctl-label').textContent =
