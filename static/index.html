  .hab-row-mark.found{color:var(--sage-dk);}
  /* Laid out exactly like the Collections deck: the same 242px box, starting
     the same distance down the screen (Awards has one line of header where
     Collections has the pack selector and its blurb, so it takes the
     difference as margin), and every trophy sits in a card-sized 66 x 101.5
     box placed and scaled by the deck's own table (see layoutTrophyCarousel).
     The trophy is drawn to the box's width and centred in it, so the one at
     the front is as wide as the front card and centred where it is. Clipped
     at the sides only, so the drop shadows aren't cut off. */
  .trophy-carousel{position:relative;width:100%;height:242px;margin-top:55px;
    clip-path:inset(-40px 0 -70px 0);touch-action:pan-y;}
  .trophy-slide{
    position:absolute; left:50%; top:50%; width:66px; height:101.5px; cursor:pointer;
    display:flex; align-items:center; transform-origin:center center;
    transition:transform .32s cubic-bezier(.34,1.3,.64,1), opacity .32s ease;
  }
  /* While a finger is dragging the row, or it's gliding on after a flick,
     the trophies follow frame by frame - an eased transition would lag. */
  .trophy-carousel.live .trophy-slide{transition:none;}
  /* The trophy is now carved art with the emblem laid into its maple plaque,
     so there are two elements where there used to be one drawing. The
     filters sit on the wrapper rather than the image: a locked trophy has to
     grey out its emblem too, and a drop shadow on the wrapper follows the
     whole silhouette instead of being drawn twice. */
  .trophy-art{position:relative;width:100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,0.3));}
  .trophy-svg{width:100%;height:auto;display:block;}
  /* Measured off the art, the same way the bird card's window and nameplate
     are: the pale plaque is an ellipse 162x104 in a 369x390 picture, centred
     at 50.81%, 33.72%.
     A width alone will not do it. The rendered emblems come in at aspects
     from 0.81 to 1.16, and at a fixed width the tall ones (the rooster,
     the hatching egg) grow past the plaque's 104px height and foul its rim.
     So the emblem gets a BOX and is fitted inside it. 100x80 art units is
     the largest useful rectangle that sits wholly within the ellipse -
     (50/81)^2 + (40/52)^2 = 0.97, just inside 1 - which is 27.1% by 20.5%.
     Anything scaled to fit that box clears the rim whatever its shape. */
  .trophy-emblem{
    position:absolute; left:50.81%; top:33.72%;
    width:27.1%; height:20.5%; object-fit:contain;
    transform:translate(-50%,-50%); display:block; pointer-events:none;
  }
  .trophy-slide.locked .trophy-art{filter:grayscale(0.9) brightness(0.72) drop-shadow(0 3px 5px rgba(0,0,0,0.28));}
  .trophy-slide.front .trophy-art{filter:drop-shadow(0 5px 9px rgba(0,0,0,0.38));}
  /* The front trophy breathes, slowly and only a little, to say it can be
     tapped - but only an earned one, since a locked trophy has no card to
     open. It stops while the row is being dragged or is gliding. */
  .trophy-slide.front.earned .trophy-art{animation:trophyInvite 2.4s ease-in-out infinite; transform-origin:50% 70%;}
  .trophy-carousel.live .trophy-art{animation:none;}
  @keyframes trophyInvite{0%,100%{transform:scale(1);} 50%{transform:scale(1.045);}}
  @media (prefers-reduced-motion: reduce){ .trophy-slide.front.earned .trophy-art{animation:none;} }
  .trophy-slide.front.locked .trophy-art{filter:grayscale(0.9) brightness(0.72) drop-shadow(0 4px 7px rgba(0,0,0,0.34));}
  /* --- The trophy detail card ------------------------------------------
     Three things this does NOT reuse from the bird card, each for a reason.
     .detail-photo, which is sized and cropped for a photograph. .detail-card's own border, because
     the frame here is the drawn wooden one the My Flock cards wear. And its
     height is fixed rather than fitted, so a long citation cannot move the
     trophy up the screen. */
  .detail-wood{--frame:7px; --inner:16px; width:100%; max-width:340px;}
  .detail-wood .detail-card{
    width:100%; max-width:none; border:none; border-radius:var(--inner);
    box-shadow:none;
  }
  /* The bird card (and its places list) wears the same wooden frame as the
     My Flock cards, on the cream of the wooden button discs. */
  .detail-card.bird-card{background:var(--disc-cream);}
  /* The fact tiles were parchment on white; on the cream they'd all but
     vanish, so here they go the near-white of the stats panel below them. */

  .trophy-hero{
    height:236px; background:#FFF6E6;
    display:flex; align-items:center; justify-content:center;
    border-radius:var(--inner) var(--inner) 0 0;
  }
  /* Bigger than the 130px the carousel gives it: this is the one screen
     that is only about this trophy. */
  .trophy-hero-art{width:186px;}
  .trophy-hero-art .trophy-art{animation:trophyBreathe 3s ease-in-out infinite;}
  @keyframes trophyBreathe{
    0%,100%{transform:scale(1);}
    50%    {transform:scale(1.05);}
  }
  @media (prefers-reduced-motion: reduce){
    .trophy-hero-art .trophy-art{animation:none;}
  }
  .trophy-caption{width:100%;max-width:300px;text-align:center;margin-top:6px;min-height:44px;}
  /* The front trophy's name and level, above the row. It takes 42px of the
     gap above the row (12px margin + 30px), and the row's own margin gives
     the same back, so the trophies stay level with the Collections cards. */
  .trophy-title{display:flex;align-items:center;justify-content:center;gap:2px;
    height:30px;margin-top:12px;width:100%;}
  /* --- Awards: the treehouse -------------------------------------------
     A see-through painting - the arch, its hanging sign and the stump -
     on a fixed layer of its own inside the Awards screen's markup. It sits
     in front of the app's blurred scene, which shows through the arch, and
     behind the trophies. layoutAwardsScene sizes and places it, and pins
     the trophy name to the painted sign. */
  .awards-bg{
    position:fixed; left:0; top:0; width:0; height:0;
    z-index:-1; pointer-events:none;
    background:url('/static/awards-scene-v4.webp') no-repeat 0 0 / 100% 100%;
  }
  /* The spotlight. Its beam and the lights-off version of the lamp and
     stump top are layers of the scene; .lights-off swaps one for the other.
     Coming on, the beam flickers like a bulb warming up. */
  .awards-beam, .awards-off{position:absolute; inset:0; pointer-events:none;
    background:no-repeat 0 0 / 100% 100%; transition:opacity .35s ease;}
  .awards-beam{background-image:url('/static/awards-beam-v1.webp'); animation:awardsBeamOn .6s ease-out both;}
  .awards-off{background-image:url('/static/awards-lightsoff-v1.webp'); opacity:0;}
  .awards-bg.lights-off .awards-beam{opacity:0; animation:none;}
  .awards-bg.lights-off .awards-off{opacity:1;}
  @keyframes awardsBeamOn{0%{opacity:0;} 12%{opacity:.85;} 22%{opacity:.25;} 34%{opacity:1;} 46%{opacity:.6;} 60%,100%{opacity:1;}}
  /* The front trophy under the beam: lit warmly from above, and casting a
     shadow straight down on the stump. Off for a trophy not yet won, which
     stands in the dark. */
  .trophy-shadow, .trophy-light{display:none; position:absolute; pointer-events:none;}
  body.awards-on .trophy-slide .trophy-shadow, body.awards-on .trophy-slide .trophy-light{display:block;
    opacity:0; transition:opacity .35s ease;}
  .trophy-shadow{left:-16%; right:-16%; bottom:-10%; height:20%; z-index:-1;
    background:radial-gradient(ellipse at 50% 42%, rgba(40,18,4,0.85) 0%, rgba(40,18,4,0.6) 30%, rgba(40,18,4,0.22) 55%, rgba(40,18,4,0) 72%);}
  .trophy-light{inset:0; z-index:3; mix-blend-mode:screen;
    -webkit-mask:var(--cup) center / 100% 100% no-repeat; mask:var(--cup) center / 100% 100% no-repeat;
    background:radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,232,160,0.72) 0%, rgba(255,214,140,0.32) 45%, rgba(255,214,140,0) 80%);}
  body.awards-on .trophy-slide.front.earned .trophy-shadow,
  body.awards-on .trophy-slide.front.earned .trophy-light{opacity:1;}
  /* The rest stand outside the beam, with just a soft contact shadow. */
  body.awards-on .trophy-slide:not(.front) .trophy-shadow{opacity:.35;}
  /* The trophy card over the treehouse: the scene dims a touch and the card
     floats up in front of it with a deep shadow. */
  .awards-veil{position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:rgba(26,17,40,0.38); animation:awardsVeilIn .3s ease both;}
  @keyframes awardsVeilIn{from{opacity:0;}}
  .trophy-card-hover{position:relative; z-index:2;
    box-shadow:0 18px 40px rgba(10,6,20,0.55), 0 4px 10px rgba(10,6,20,0.35);
    animation:trophyCardHover .38s cubic-bezier(.2,1.25,.45,1) both;}
  @keyframes trophyCardHover{from{transform:translateY(26px) scale(.94); opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .trophy-card-hover, .awards-veil{animation:none;} }
  .awards-sign-text{position:fixed; margin:0; height:auto; gap:8px; z-index:1;
    flex-wrap:nowrap; white-space:nowrap;}
  /* --sign-font is set by fitAwardsSign, which shrinks a long name until it
     and its Level pill fit the plank on one line. */
  .awards-sign-text .trophy-caption-name{font-size:var(--sign-font, 21px); white-space:nowrap;}
  .awards-sign-text .trophy-level{flex:0 0 auto; white-space:nowrap;}
  /* The painting is bright in places, so the type on it always carries the
     same dark collar the scene screens give their text. */
  body.awards-on .collection-count, body.awards-on .trophy-caption,
  body.awards-on .trophy-caption-name, body.awards-on .feathers{
    text-shadow:0 0 2px rgba(26,17,40,0.95), 0 0 4px rgba(26,17,40,0.85),
                0 1px 3px rgba(26,17,40,0.92), 0 2px 12px rgba(26,17,40,0.5);
  }
  .trophy-title + .trophy-carousel{margin-top:13px;}
  .trophy-caption-name{font-family:'Poppins';font-weight:900;font-size:19px;color:#fff;}
  .trophy-caption-req{font-size:12.5px;color:rgba(255,255,255,0.88);margin-top:4px;line-height:1.4;}
  /* text-shadow:none is load-bearing. The pill sits inside
     .trophy-caption-name, which on a scene screen carries a four-layer dark
     shadow so white type survives a bright sky - and text-shadow inherits.
     Dark text on a gold pill was getting all four, which read as badly out
     of focus. */
  /* On the trophy card: which of the seven levels this is, beside the name. */
  .trophy-card-title{display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px;}
  .trophy-card-level{display:inline-block; background:var(--sage); color:var(--ink);
    font-family:'Poppins'; font-size:12px; font-weight:900; padding:3px 10px; border-radius:12px;
    white-space:nowrap;}
  .trophy-level{display:inline-block;background:var(--sage);color:var(--ink);font-size:10px;font-weight:900;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle;text-shadow:none;}
  .trophy-caption-next{font-size:11.5px;color:rgba(255,255,255,0.8);margin-top:5px;}
  .trophy-caption-tap{font-family:'Poppins';font-weight:700;font-size:10.5px;color:var(--disc-cream);margin-top:6px;text-transform:uppercase;letter-spacing:.05em;}
  /* Feathers-earned and "go again" share one grid cell (both always in the
     DOM, never display:none) so the cell's height is fixed to whichever is
     taller - swapping which one is visible is a pure opacity crossfade with
     no layout height change, which is what keeps everything below/above it
     from shifting position when the transition happens. */
  .done-feathers-slot{position:relative; display:grid;}
  .done-feathers-slot > *{grid-area:1 / 1;}
  .done-feathers-slot .go-again-content{
    display:flex; flex-direction:column; align-items:center;
    opacity:0; pointer-events:none; transition:opacity .3s ease;
  }
  .done-feathers-slot .go-again-content.visible{opacity:1; pointer-events:auto;}
  .done-feathers{font-family:'Poppins';font-weight:900;font-size:17px;color:var(--feather-lt);margin-top:14px;transition:opacity .3s ease;}
  .done-feathers.collected{opacity:0; pointer-events:none;}
  /* It shares its grid cell with what comes next, which is taller - keep
     the glowing pill its own size rather than stretched to fill it. */
  .done-feathers{align-self:start; justify-self:center;}
  .go-again-ask{font-family:'Poppins';font-weight:900;font-size:17px;color:#fff;margin-top:22px;}
  /* What next, once the feathers are in: go again, and - when the feathers
     now buy something new - the Hoot-tique, each a disc with its word under. */
  .done-next{display:flex; justify-content:center; align-items:flex-start; gap:30px; margin-top:12px;}
  .done-next-item{display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:'Poppins'; font-weight:900; font-size:15px; color:#fff;}
  .done-next-item .mic-again-btn{margin-top:0;}
  .done-shop-disc{width:84px; height:84px; border-radius:50%; border:none; padding:0; cursor:pointer; overflow:hidden;
    display:grid; place-items:center; background:radial-gradient(circle at 50% 42%, var(--disc-cream), #F2D3A6 70%);
    box-shadow:0 0 0 4px var(--wood), 0 0 0 6px var(--wood-edge), 0 4px 10px rgba(0,0,0,0.35);
    animation:shopInvite 1.6s ease-in-out .6s infinite;}
  .done-shop-disc:active{transform:scale(.94);}
  @keyframes shopInvite{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.07); box-shadow:0 0 0 4px var(--wood), 0 0 0 6px var(--wood-edge), 0 0 18px 6px rgba(var(--glow),0.8);}
  }
  /* "New spot!" inside the Done screen, after the feathers. */
  .done-spot{--frame:5px; --inner:14px; width:100%; max-width:340px; margin-top:12px;}
  .done-spot-in{background:var(--disc-cream); border-radius:var(--inner); padding:14px 14px 10px;
    display:flex; flex-direction:column; align-items:center; color:var(--wood-edge);}
  .done-spot-in .stage-label{color:var(--wood-edge); font-size:20px; text-shadow:none;}
  .done-spot-in .stage-sub{color:var(--wood-dk); text-shadow:none;}
  .done-spot-in .again-btn{margin-top:10px;}
  .done-spot-in .skip-btn{color:var(--wood-edge); text-shadow:none;}
  /* The scene's legibility shadow (body.scene-on ...) outranks the three
     lines above, and on cream it smudged every letter of "New spot!". */
  body.scene-on .done-spot-in .stage-label, body.scene-on .done-spot-in .stage-sub,
  body.scene-on .done-spot-in .skip-btn, body.scene-on .done-spot-in .nearby-or{text-shadow:none;}
  @media (prefers-reduced-motion: reduce){ .done-shop-disc{animation:none;} }
  /* Dancing avatar on the Done screen: av-torso (body + both wings) adds a
     small shimmy, and each wing wave pivots at the shoulder joint where it
     meets the body - same wave shape/timing as a resting flap, just offset
     so the wings sit up in the air instead of hanging down. Legs and the
     face (eyes/beak/cheeks/accessories) sit outside av-torso and never
     move. The held item shares the right wing's pivot and timing, so
     anything carried waves with the wing holding it. */
  .avatar-dancing .av-torso{transform-origin:50px 70px;animation:bodyWiggle 0.45s ease-in-out infinite;}
  .avatar-dancing .av-wing-l{transform-origin:26px 58px;animation:wingL 0.6s ease-in-out infinite;}
  .avatar-dancing .av-wing-r,
  .avatar-dancing .av-held{transform-origin:74px 58px;animation:wingR 0.75s ease-in-out infinite;}
  /* The layered prototype has its own shoulders. Its manifest puts them at
     (335,440) and (665,440) on the 1000px canvas, which is (33.5,44) on the
     0-100 grid - and those are inside the group that nudges the bird down, so
     they are stated in the art's own coordinates, not the shifted ones. */
  /* Each delivery names its own shoulder height in its manifest - the Parrot's
     sits 6.5 units lower than the others - so the bird sets --wing-y itself. */
  .avatar-layered{--wing-y:44px;}
  .avatar-dancing.avatar-layered .av-wing-l{transform-origin:33.5px var(--wing-y);}
  .avatar-dancing.avatar-layered .av-wing-r,
  .avatar-dancing.avatar-layered .av-held{transform-origin:66.5px var(--wing-y);}
  @keyframes bodyWiggle{0%,100%{transform:translateX(0);}25%{transform:translateX(-0.6px);}75%{transform:translateX(0.6px);}}
  @keyframes wingL{0%,100%{transform:rotate(0deg);}50%{transform:rotate(45deg);}}
  @keyframes wingR{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-45deg);}}
  .done-avatar{margin-bottom:4px;}
  .trophy-banner-tap{font-family:'Poppins';font-weight:700;font-size:10px;color:var(--sage-dk);margin-top:8px;text-transform:uppercase;letter-spacing:.05em;}
  .done-feathers.tappable{cursor:pointer;animation:collectGlow 1.8s ease-in-out infinite;border-radius:20px;padding:6px 18px;}
  .trophy-banner{
    width:100%;background:#FFF6E6;border:2px solid var(--wood);border-radius:16px;
    padding:14px;margin-top:16px;text-align:center;
  }
  .trophy-banner-title{font-family:'Poppins';font-weight:900;font-size:13px;color:var(--wood-edge);text-transform:uppercase;letter-spacing:.04em;}
  .trophy-banner-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
  .trophy-banner-emoji{font-size:24px;}
  .trophy-banner-text{text-align:left;}
  .trophy-banner-name{font-family:'Poppins';font-weight:700;font-size:14px;color:var(--wood-edge);}
  .trophy-banner-citation{font-size:11px;color:var(--ink-soft);}
  .avatar-banner{display:block; font:inherit; cursor:pointer;}
  .avatar-banner-bird{width:56px; height:56px; border-radius:50%; overflow:hidden; flex:0 0 auto;
    background:var(--disc-cream); box-shadow:0 0 0 2px var(--wood);}
  /* --- Every text button is wood ------------------------------------------
     The design language (CLAUDE.md): one material for everything a child
     touches. A text button is a carved wood rim round a cream face with the
     words in the wood's dark edge colour, sitting proud on a darker lip that
     it presses into when tapped - the same wood as the frames and discs.
     One element, no extra markup: the cream fills the padding box and the
     wood shows through the transparent border. Sizes and spacing stay with
     each button's own rule above; only the material is set here, after them,
     so it wins. A new text button joins this list rather than picking a
     colour of its own. */
  .again-btn:not(.mic-again-btn), .tut-ok, .photo-btn, .photo-btn-clear,
  .reset-btn, .play-call-btn, .sheet-done, .item-buy-btn, .grownup > summary{
    background:linear-gradient(var(--disc-cream), var(--disc-cream)) padding-box, var(--wood-rim);
    border:3px solid transparent;
    color:var(--wood-edge); font-weight:900; text-shadow:none;
    box-shadow:0 3px 0 var(--wood-edge), 0 4px 8px rgba(26,17,40,0.28);
    backdrop-filter:none; -webkit-backdrop-filter:none;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .again-btn:not(.mic-again-btn):active, .tut-ok:active, .photo-btn:active, .photo-btn-clear:active,
  .reset-btn:active, .play-call-btn:active, .sheet-done:active, .item-buy-btn:active{
    transform:translateY(2px); box-shadow:0 1px 0 var(--wood-edge), 0 2px 4px rgba(26,17,40,0.28);
  }
  /* Settings' grown-up corner: a full-width wood button that opens it. */
  .grownup{width:100%; margin-top:22px;}
  .grownup > summary{list-style:none; cursor:pointer; text-align:center; border-radius:12px;
    padding:12px 14px; font-family:'Poppins'; font-size:13px;}
  .grownup > summary::-webkit-details-marker{display:none;}
  /* The one that can't be undone says so in its words' colour, not a red slab. */
  .reset-btn.danger{color:#A3261C;}
  /* Not enough feathers yet: the same wood, greyed like anything locked. */
  .item-buy-btn.cant-afford{filter:grayscale(1); opacity:.7; box-shadow:0 2px 0 var(--wood-edge);}
  .reset-btn:disabled, .again-btn:disabled, .tut-ok:disabled{filter:grayscale(.6); opacity:.6;}
</style>
</head>
<body>

  <!-- Watercolour effect for every bird photo, applied via CSS filter:url(#watercolor-filter).
       feTurbulence + feDisplacementMap gently warps the image edges and
       surface, like paint settling unevenly, rather than a hard photo crop. -->
  <svg width="0" height="0" style="position:absolute;">
    <filter id="watercolor-filter">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
      <feGaussianBlur stdDeviation="0.35"/>
    </filter>
    <!-- Gold: takes a painted picture's light and shade and maps it onto a
         gold ramp (deep bronze -> gold -> pale highlight), so a wooden pack
         badge turns gold without losing its carving. -->
    <filter id="gold-filter" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.30 0.66 0.91 1.00 1.00"/>
        <feFuncG type="table" tableValues="0.17 0.42 0.67 0.84 0.97"/>
        <feFuncB type="table" tableValues="0.02 0.04 0.10 0.30 0.72"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <div id="scroller">
  <div class="top">
    <div class="top-left">
      <div class="feathers"><img class="feather-icon" src="/static/feather.webp" alt=""> <span id="featherCount">–</span></div>
      <button class="top-rank" id="topRank" hidden aria-label="Your birder rank - see all the ranks"></button>
    </div>
    <div class="top-wordmark" id="topWordmark"><img src="/static/wordmark.webp" alt="Warble" style="height:100%;display:block;"></div>
    <div class="top-actions">
    <button class="top-settings-btn" id="topSettingsBtn" aria-label="Settings">
      <img src="/static/settings-gear-v1.webp" alt="Settings">
    </button>
    <button class="top-profile-btn" id="topProfileBtn"><svg viewBox="0 0 24 24" color="#8E87B8"><path d="M4.6 21.6 L4.6 15.4 L9.4 11.2 L19.2 11.2 L19.2 21.6 Z" fill="#C4BFDF"/><circle cx="14.6" cy="7.6" r="5" fill="#8E87B8"/><path d="M19.2 5.9 L23.4 7.9 L19.2 9.9 Z" fill="#8E87B8"/><circle cx="13.4" cy="6.6" r="1.5" fill="#fff"/><path d="M9.4 11.2 L14.4 11.2 L9.4 16 Z" fill="#8E87B8"/></svg></button>
    </div>
  </div>


  <div class="stage" id="stage"></div>
  </div>

  <div id="sceneBg"></div>

  <div class="bottom-nav">
    <button class="nav-tab" id="navHabitats" data-tab="habitats">
      <span class="nav-icon-wrap"><img src="/static/nav-cards-v1.webp" alt="Collections" class="nav-icon-svg" style="object-fit:contain;"></span>
      <span>Collections</span>
    </button>
    <button class="nav-tab" id="navCollection" data-tab="collection">
      <span class="nav-icon-wrap"><img src="/static/nav-flock-v1.webp" alt="My Flock" class="nav-icon-svg" style="object-fit:contain;"></span>
      <span>My Flock</span>
    </button>
    <button class="nav-tab home-tab" id="navHome" data-tab="home">

      <span>Home</span>
    </button>
    <button class="nav-tab" id="navTrophies" data-tab="trophies">

      <span class="nav-icon-wrap"><span id="navDressUpIcon"></span></span>
      <span>Hoot-tique</span>

<script>
const stage = document.getElementById('stage');

// --- Painted icons -------------------------------------------------------
// The design language is painted art, never emoji. These are the last few
// small icons still waiting for their paintings: each shows its emoji
// stand-in until static/icon-<name>-v<N>.webp is delivered. The server lists
// the ones it finds (/painted-icons) and icon() uses them from then on, with
// no code change. What each should look like: design-brief-info-icons-v1.md.
const ICON_STANDINS = {
  weight: '⚖️', length: '📏', wingspan: '↔️', habitat: '🏞️', diet: '🍽️',
  'garden-parks': '🌳', woodland: '🌲', 'wetland-coast': '🌊', farmland: '🌾', towns: '🏘️',
  'tip-sunrise': '🌅', 'tip-quiet': '🤫', 'tip-places': '📍', 'tip-close': '🎧',
  'tip-rain': '🌦️', 'tip-calm': '🧘',
  pin: '📍', lock: '🔒', camera: '📷',
  back: '←', forward: '→', close: '✕', pause: '⏸', mystery: '???',
};
let paintedIcons = {};
fetch('/painted-icons').then(r => r.ok ? r.json() : {}).then(d => { paintedIcons = d.icons || {}; }).catch(() => {});
function icon(name) {
  return paintedIcons[name] ? `<img class="ico" src="${paintedIcons[name]}" alt="">` : (ICON_STANDINS[name] || '');
}
// Two that are painted already.
const PAINTED_TICK = '<img class="ico" src="/static/tick-v1.webp" alt="done">';
const PAINTED_BIRD = '<img class="ico" src="/static/live-bird-v2.webp" alt="">';
const PAINTED_PLAY = '<img class="ico" src="/static/btn-play-v1.webp" alt="">';
// The play disc's partner: the plain wooden disc with a stop square carved
// in, the way the read-aloud disc has its speaker carved in.
const PAINTED_STOP_DISC = '<img src="/static/btn-blank-v1.webp" alt=""><span class="disc-stop" aria-hidden="true"></span>';
const featherCountEl = document.getElementById('featherCount');

// Untiered birds - ones BirdNET knows that Warble does not collect - used to
// get a grey edge here, a third colour on top of the two the badges use. A
// child hearing a bird does not care whether it is in the set, and grey read
// as a lesser find, so they take the same edge as any other non-rare bird.
function tierColorOf(tier) { return tier === 'Rare' ? TIER_COLORS.Rare : TIER_COLORS.Common; }

// Two states, not three. There used to be a third for a bird with no tier at
// all - one BirdNET knows but Warble does not collect - which gave a grey
// badge that meant nothing to a child and read as a lesser find. A bird is
// either rare or it is not.
const SESSION_TIERS = {
  normal: { color: 'var(--sage)', cls: 'find-normal' },
  rare:   { color: 'var(--rare)', cls: 'find-rare'   },
};
function sessionTier(tier) {
  return tier === 'Rare' ? SESSION_TIERS.rare : SESSION_TIERS.normal;
}

// The two rarities, Common and Rare - a fixed property of each species.
const TIER_COLORS = { Common: 'var(--sage)', Rare: 'var(--rare)' };

let mediaRecorder, audioChunks = [], recordTimerInterval, recordSeconds = 0;
let sessionResults = [], cardIndex = 0;
let sessionBonuses = [], sessionFeatherTotal = 0;
// What a recording won besides its birds: each gets its moment on Done.
let sessionPacks = [], sessionChallenges = [], sessionWeekBonus = 0;
// Running feather total, kept in step with the counter in the top bar so the
// per-card fly-and-count animation can add to it without re-fetching.
let currentFeatherTotal = 0;
let allSightingsRaw = [];

async function refreshFeathers() {
  try {
    const res = await fetch('/feathers');
    const data = await res.json();
    currentFeatherTotal = data.total_feathers;
    animateFeatherCount(data.total_feathers);
  } catch (e) { /* fine to fail quietly here */ }
}

function animateFeatherCount(newTotal) {
  const el = featherCountEl;
  const startVal = parseInt(el.textContent, 10) || 0;
  const endVal = Math.round(newTotal);
  // Room for the longer of the two numbers from the start, so the rank badge
  // beside it doesn't shuffle along as the digits tick over (99 -> 100).
  el.style.minWidth = `${Math.max(String(startVal).length, String(endVal).length)}ch`;
  if (startVal === endVal) { el.textContent = endVal; el.style.minWidth = ''; return; }
  const duration = 700;
  const startTime = performance.now();
  function step(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out, fast then settling
    el.textContent = Math.round(startVal + (endVal - startVal) * eased);
    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      el.textContent = endVal;
      el.style.minWidth = `${String(endVal).length}ch`;
      const pill = el.closest('.feathers');
      if (pill) {
        pill.classList.add('feather-pop');
        setTimeout(() => pill.classList.remove('feather-pop'), 320);
      }
    }
  }
  requestAnimationFrame(step);
}

// --- Home ------------------------------------------------------------------
// One obvious thing to do, then two things worth looking at, then two small
// ones. The four equal circles that used to sit here read as a menu of app
// features; a child opening this should see somewhere to start instead.
function renderIdle() {
  setActiveTab('home');
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="home-wordmark"><img src="/static/wordmark.webp" alt="Warble" style="height:100%;display:block;margin:0 auto;"></div>
    <!-- The greeting sits above the mic now: straight below it is where the
         bottom of the U of three discs goes. -->
    <div class="stage-label home-greeting">${firstNameOrDefault() ? `Get out there, ${firstNameOrDefault()}` : 'Get out there'}</div>
    <div class="stage-sub">Hear some birds? Then tap the mic!</div>

    <!-- The "Here Now" card sat here and is parked, not deleted: Home was
         getting crowded and what the feature should be is still an open
         question. Everything behind it is untouched - renderWhatsHere, the
         /whats-here endpoint, loadHereNowCard, FLYING_BIRDS_SVG and the
         .herenow- styles. To bring it back, restore this markup and the two
         lines below that wired it up:
             document.getElementById('hereNowCard').onclick = renderWhatsHere;
             loadHereNowCard();
         Note that this card was the ONLY way into renderWhatsHere, so that
         screen is currently unreachable rather than merely hidden. -->
    <div class="home-hub">
      <div class="mic-wrap mic-alive" id="micWrap">
        <button class="mic-btn" id="recordBtn"><img class="mic-icon" src="/static/mic-v2.webp" alt="Record"></button>
      </div>
      <button class="hub-item hub-left" id="jokeMini">
        <span class="hub-icon"><img src="/static/joke-icon-v1.webp" alt=""></span>
        <span class="hub-label">Joke Of The Day</span>
      </button>
      <button class="hub-item hub-mid" id="challengeCard">
        <span class="hub-icon"><img src="/static/challenge-icon-v1.webp" alt=""><span class="hub-badge" id="challengeTally"></span></span>
        <span class="hub-label">Weekly Challenges</span>
      </button>
      <button class="hub-item hub-right" id="gameMini">
        <span class="hub-icon"><img src="/static/song-game-icon-v1.webp" alt=""></span>
        <span class="hub-label">Guess The Song</span>
      </button>
    </div>
  `;

  // Answer the tap before the listening screen has loaded - on a slow phone
  // that gap is long enough for a child to press again.
  const wrap = document.getElementById('micWrap');
  const mic = document.getElementById('recordBtn');
  mic.onpointerdown = () => wrap.classList.add('pressed');
  mic.onpointerup = mic.onpointercancel = () => wrap.classList.remove('pressed');
  mic.onclick = () => { wrap.classList.remove('mic-alive'); beginWarble(); };

  document.getElementById('challengeCard').onclick = renderChallenges;
  refreshRank();
  document.getElementById('jokeMini').onclick = renderJokeOfDay;
  document.getElementById('gameMini').onclick = () => renderSongGame();
  setSceneFocus(true);
  loadChallengeCard();
  loadJokeTileStatus();
  loadSongGameTile();
  // Back on Home is when anything new from a recording, a purchase or a
  // game shows up on the nav bar and the three discs.
  paintNewCues();
  refreshWhatsNew();
  showTutorial('home', 500);
}

// Three birds in the corner of the Here Now card. Drawn rather than an
// emoji: this is the one picture on the screen that has to say "migration"
// rather than "calendar".
const FLYING_BIRDS_SVG = `<svg class="herenow-birds" viewBox="0 0 120 62" fill="none"
  stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true">
  <path class="b1" d="M12 26 q9 -11 18 0 q9 -11 18 0"/>
  <path class="b2" d="M55 12 q7 -8 14 0 q7 -8 14 0"/>
  <path class="b3" d="M78 40 q6 -7 12 0 q6 -7 12 0"/>
</svg>`;

// Walks the list one at a time and remembers where it got to, so a run of
// quiet sessions works through all six rather than repeating whichever one
// today happened to land on.
function nextListeningTip() {
  const seen = parseInt(remember('tipSeen'), 10);
  const next = (Number.isFinite(seen) ? seen + 1 : 0) % WARBLING_TIPS.length;
  remember('tipSeen', next);
  return WARBLING_TIPS[next];
}

// Display copy only - never matched back against a species. Full common
// names are what BirdNET returns and what everything else keys on, but
// "Common House-Martin are back!" is not a sentence a seven-year-old reads.
const SEASONAL_NICKNAMES = {
  'Barn Swallow': 'swallows', 'Common House-Martin': 'house martins',
  'Common Tern': 'terns', 'Willow Warbler': 'willow warblers',
  'Greater Whitethroat': 'whitethroats', 'Sedge Warbler': 'sedge warblers',
  'Common Redstart': 'redstarts', 'Ring Ouzel': 'ring ouzels',
  'Lesser Whitethroat': 'lesser whitethroats',
  'Eurasian Reed Warbler': 'reed warblers',
  'European Turtle-Dove': 'turtle doves', 'Eurasian Hobby': 'hobbies',
  'Common Cuckoo': 'cuckoos', 'Redwing': 'redwings',
};
// The name a child sees. The data keeps BirdNET's exact names ("European
// Robin", "Eurasian Wren") because a detection only matches if the stored
// name is identical - change that and the bird is silently never found. On
// screen, every Eurasian and European prefix reads "Common", so the
// collection uses one word for it throughout ("Common Robin", "Common Wren",
// "Common Blackbird"). BirdNET spells grey the American way ("Gray Heron",
// "Graylag Goose"); on screen it's British. And two take the name a UK child
// knows: BirdNET's "Ring-necked Pheasant" and "Greater Whitethroat".
// None of the 100 clash once renamed.
const BIRD_DISPLAY_NAMES = {
  'Ring-necked Pheasant': 'Common Pheasant',
  'Greater Whitethroat': 'Common Whitethroat',
};
function birdName(n) {
  const name = String(n || '');
  return BIRD_DISPLAY_NAMES[name]
    || name.replace(/^(Eurasian|European) /, 'Common ').replace(/\bGray/g, 'Grey');
}
const nickname = n => SEASONAL_NICKNAMES[n] || birdName(n);

async function loadHereNowCard() {
  const head = document.getElementById('hereNowHead');
  const sub = document.getElementById('hereNowSub');
  if (!head) return;
  try {
    const res = await fetch('/whats-here');
    const d = await res.json();
    const birds = d.birds || [];
    const of = st => birds.filter(b => b.state === st);
    const leaving = of('leaving'), here = of('here').filter(b => b.pack), arriving = of('arriving');

    // Urgency first: a bird about to go is the one thing here with a deadline.
    if (leaving.length) {
      head.textContent = `Last chance to hear the ${nickname(leaving[0].common_name)}!`;
      sub.textContent = leaving.length > 1
        ? `${leaving.length} birds are leaving soon` : 'They are leaving soon';
    } else if (here.length) {
      head.textContent = `The ${nickname(here[0].common_name)} are back!`;
      sub.textContent = d.to_find
        ? `${d.to_find} visiting bird${d.to_find === 1 ? '' : 's'} still to hear`
        : 'See every bird visiting right now';
    } else if (arriving.length) {
      head.textContent = `The ${nickname(arriving[0].common_name)} are on their way!`;
      sub.textContent = 'See who is arriving next';
    } else {
      head.textContent = "Who's visiting?";
      sub.textContent = 'Discover the birds around you right now';
    }
  } catch (e) { /* the card keeps the copy it rendered with */ }
}

// One line on Home: what the challenge is, and the count. The encouragement
// ("3 more to go!") and the bar both went with the card - the tally says the
// same thing in less room, and the Challenges screen still has all of it.
async function loadChallengeCard() {
  // Home shows how many of this week's challenges are done, as a badge on
  // the challenges disc - "2/5", turning green when they all are.
  const badge = document.getElementById('challengeTally');
  if (!badge) return;
  try {
    const d = await (await fetch('/weekly-challenges')).json();
    const all = d.challenges || [];
    const done = all.filter(c => c.complete).length;
    badge.textContent = all.length ? `${done}/${all.length}` : '';
    badge.classList.toggle('done', all.length > 0 && done === all.length);
  } catch (e) { badge.textContent = ''; }
}

async function renderWhatsHere() {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div style="width:100%;margin-bottom:12px;">
      <button class="back-btn" id="backBtn">${icon('back')} Back</button>
    </div>
    <div class="collection-title" style="margin-bottom:4px;">Here Right Now</div>
    <div class="collection-count">Some birds only visit for part of the year</div>
    <div id="seasonList" style="width:100%;"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    renderIdle();
  };
  const list = document.getElementById('seasonList');
  try {
    const res = await fetch('/whats-here');
    const d = await res.json();
    // Here and leaving first - those are the ones you can act on today
    const rank = { leaving: 0, here: 1, arriving: 2, away: 3 };
    const birds = (d.birds || []).sort((a, b) =>
      (rank[a.state] - rank[b.state]) || birdName(a.common_name).localeCompare(birdName(b.common_name)));
    list.innerHTML = birds.map(b => `
      <div class="season-row season-${b.state} tappable" data-name="${b.common_name}">
        <span class="season-dot"></span>
        <span class="season-name">${birdName(b.common_name)}</span>
        <span class="season-label">${b.found ? PAINTED_TICK + ' ' : ''}${b.label}</span>
        <span class="season-chevron">›</span>
      </div>`).join('');
    list.querySelectorAll('.season-row').forEach(row => {
      row.onclick = () => renderMigrationCard(row.dataset.name, renderWhatsHere);
    });
  } catch (e) {
    list.innerHTML = `<div class="collection-empty">Couldn't load right now.</div>`;
  }
}

function migrationRoutePathD(points) {
  return points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p[0]},${p[1]}`).join(' ');
}

// The map image itself is /static/migration-map-base.webp (560x780) - real
// Wikimedia Commons continent shapes (CC BY-SA 3.0/GFDL), cropped to Europe/
// Africa/Middle East and calibrated against Africa's actual real-world
// extremes rather than eyeballed. This overlay just draws the route on top,
// sized to match the image exactly so the two line up with plain CSS
// stacking - no projection math happens here.
function renderMigrationMap(info) {
  const uk = info.route[0];
  const dest = info.route[info.route.length - 1];
  // The dashed line is drawn in the actual direction of travel - for the one
  // "arrives" species (Redwing) that's destination-to-UK, the reverse of how
  // every "departs" route is stored, so the arrowhead points the right way
  // regardless of which end the data lists first.
  const drawPoints = info.direction === 'arrives' ? [...info.route].reverse() : info.route;
  return `
    <div class="migration-map-panel">
      <img class="migration-map-img" src="/static/migration-map-base.webp" alt="Map of Europe and Africa">
      <svg viewBox="0 0 560 780" class="migration-map-overlay">
        <defs>
          <marker id="migArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="#2D1B69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </marker>
        </defs>
        <path d="${migrationRoutePathD(drawPoints)}" fill="none" stroke="#2D1B69" stroke-width="3.5"
              stroke-dasharray="10 8" stroke-linecap="round" opacity="0.9" marker-end="url(#migArrow)"/>
        <circle cx="${uk[0]}" cy="${uk[1]}" r="9" fill="#2D1B69" stroke="#fff" stroke-width="3"/>
        <circle cx="${dest[0]}" cy="${dest[1]}" r="10" fill="#E8845C" stroke="#fff" stroke-width="3.5"/>
      </svg>
    </div>
    <div class="migration-credit">Map: <a href="https://commons.wikimedia.org/wiki/File:Continents_vide_couleurs-automatedvector.svg" target="_blank" rel="noopener">Wikimedia Commons</a>, CC BY-SA 3.0</div>`;
}

async function renderMigrationCard(commonName, onBack) {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div style="width:100%;margin-bottom:12px;">
      <button class="back-btn" id="backBtn">${icon('back')} Back</button>
    </div>
    <div class="migration-title">${birdName(commonName)}</div>
    <div class="migration-subtitle" id="migrationSubtitle">Loading...</div>
    <div id="migrationMapWrap" style="width:100%;"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    (onBack || renderIdle)();
  };
  const wrap = document.getElementById('migrationMapWrap');
  try {
    const res = await fetch(`/migration/${encodeURIComponent(commonName)}`);
    const data = await res.json();
    const info = data.migration;
    if (!info) {
      document.getElementById('migrationSubtitle').textContent = '';
      wrap.innerHTML = `<div class="collection-empty">No migration story for this bird yet.</div>`;
      return;
    }
    document.getElementById('migrationSubtitle').textContent = info.direction === 'arrives'
      ? 'Where it breeds - it winters here in the UK'
      : 'Where it goes for the winter';
    wrap.innerHTML = `
      ${renderMigrationMap(info)}
      <div class="migration-destination">${info.destination_name}</div>
      <div class="migration-fact">${info.fact}</div>
    `;
  } catch (e) {
    document.getElementById('migrationSubtitle').textContent = '';
    wrap.innerHTML = `<div class="collection-empty">Couldn't load right now.</div>`;
  }

}

async function renderChallenges() {
  setSceneFocus(false);   // the same light blur as the other screens
  stage.classList.add('top-aligned');
  // No back button: the Home tab is the way out, as on the joke and game.
  stage.innerHTML = `
    <div class="collection-title" style="margin-bottom:4px;">Weekly Challenges</div>
    <div class="collection-count">New challenges every Monday</div>
    <div id="challengeList" style="width:100%;"></div>
  `;

  const list = document.getElementById('challengeList');
  const card = (complete, extra, text, feathers, body) => `
    <div class="challenge-card woodframe ${complete ? 'complete' : ''} ${extra}">
      <div class="challenge-inner">
        <div class="challenge-top">
          <span class="challenge-text">${complete ? '<img class="challenge-tick" src="/static/tick-v1.webp" alt="Done">' : ''}<span>${text}</span></span>
          ${feathers ? `<span class="challenge-feathers"><img class="feather-icon" src="/static/feather.webp" alt=""> ${feathers}</span>` : ''}
        </div>
        ${body}
      </div>
    </div>`;
  try {
    const res = await fetch('/weekly-challenges');
    const d = await res.json();
    const items = d.challenges || [];
    const allDone = items.length && items.every(i => i.complete);
    // The week's one prize goes first, so it's clear what the challenges are
    // for: feathers only for finishing all of them, none for each on its own.
    const prizePct = items.length ? Math.round((d.completed / items.length) * 100) : 0;
    const meter = (pct, label) => `
      <div class="challenge-meter">
        <div class="challenge-bar"><div class="challenge-bar-fill" style="width:${pct}%"></div></div>
        <span class="challenge-progress">${label}</span>
      </div>`;
    list.innerHTML = card(allDone, 'all-bonus', `Finish all ${items.length} to win`, d.all_bonus,
        meter(prizePct, `${d.completed} of ${items.length} done`)) +
      items.map(i => card(i.complete, '', i.text, 0,
        meter(Math.round((i.progress / i.target) * 100), `${i.progress} of ${i.target}`))).join('');
    markSeen('challenges');
    showTutorial('challenges', 300);
  } catch (e) {
    list.innerHTML = `<div class="collection-empty">Couldn't load challenges right now.</div>`;
  }
}

async function loadJokeTileStatus() {
  try {
    const res = await fetch('/joke-of-the-day');
    const data = await res.json();
    const tile = document.getElementById('jokeMini');
    if (!tile) return; // already navigated away before this resolved
    // Still locked (nothing heard today): greyed like the other "not yet"
    // things. Tapping it anyway opens the joke screen, which says why.
    tile.classList.toggle('locked', !data.unlocked);
  } catch (e) { /* the card still opens the joke screen */ }
}

async function renderJokeOfDay() {
  setSceneFocus(false);   // the same light blur as the other screens
  stage.classList.add('top-aligned');
  // No back button: the Home tab is the way out.
  stage.innerHTML = `
    <div class="collection-title">Joke of the Day</div>
    <div class="joke-stage" id="jokeCard"><div class="joke-locked">Loading…</div></div>
  `;
  const box = () => document.getElementById('jokeCard');
  try {
    const data = await (await fetch('/joke-of-the-day')).json();
    if (!box()) return;   // navigated away while loading
    if (!data.unlocked) {
      box().innerHTML = `
        <img class="joke-locked-icon" src="/static/joke-icon-v1.webp" alt="">
        <div class="joke-locked">${escapeFlock(data.message || '')}</div>`;
      return;
    }
    box().innerHTML = `
      <div class="joke-setup" id="jokeSetup">${escapeFlock(data.setup)}</div>
      <div class="joke-spot" id="jokeSpot">
        <button class="joke-reveal" id="revealJokeBtn" aria-label="Show the answer">
          <img src="/static/song-game-icon-v1.webp" alt="">
        </button>
      </div>`;
    document.getElementById('revealJokeBtn').onclick = () => revealJokePunchline(data.punchline);
    markSeen('joke');
  } catch (e) {
    if (box()) box().innerHTML = `<div class="joke-locked">Couldn't load the joke right now.</div>`;
  }
}

// Three beats: the question mark winds up, bursts in a ring of sparks, and
// the punchline bounces in where it was - with a tiny buzz on phones that
// can. Straight to the answer for anyone who has asked for less motion.
function revealJokePunchline(punchline) {
  const btn = document.getElementById('revealJokeBtn');
  const spot = document.getElementById('jokeSpot');
  if (!btn || btn.dataset.going) return;
  btn.dataset.going = '1';
  const show = () => {
    if (!document.getElementById('jokeSpot')) return;   // left the screen
    btn.remove();   // the sparks stay to finish their flight, then go
    spot.insertAdjacentHTML('afterbegin', `<div class="joke-punch">${escapeFlock(punchline)}</div>`);
    setTimeout(() => spot.querySelectorAll('.joke-ring, .joke-spark').forEach(el => el.remove()), 700);
    const setup = document.getElementById('jokeSetup');
    if (setup) { setup.classList.remove('giggle'); void setup.offsetWidth; setup.classList.add('giggle'); }
  };
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return show();

  btn.classList.add('windup');
  setTimeout(() => {
    if (!document.getElementById('jokeSpot')) return;
    btn.classList.remove('windup');
    btn.classList.add('burst');
    try { navigator.vibrate && navigator.vibrate(35); } catch (e) {}
    const colours = ['var(--disc-cream)', '#FFFFFF', 'var(--terra)', 'var(--sage)'];
    let bits = '<span class="joke-ring"></span>';
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * Math.PI * 2 + Math.random() * 0.3;
      const d = 80 + Math.random() * 80;
      bits += `<span class="joke-spark" style="--dx:${Math.round(Math.cos(a) * d)}px;--dy:${Math.round(Math.sin(a) * d)}px;--spark:${colours[i % colours.length]}"></span>`;
    }
    spot.insertAdjacentHTML('beforeend', bits);
    setTimeout(show, 260);
  }, 600);
}

// --- Guess the Song --------------------------------------------------------
// Hear a song, tap the bird that sang it. Every bird in it is one the child
// has heard themselves (/song-game), so the game unlocks at 10 of Warble's
// 100 and each level after needs 5 more. Every level draws from all the birds
// heard so far; a level only changes how many choices are shown.
// Each go at a level earns up to three stars - 6 of 8 right is one, 7 two,
// 8 three - and a level only opens once the one before has a star. The
// server works the stars out and keeps the best (/song-game/result).
const SONG_GAME_FIRST_UNLOCK = 10;   // mirrors SONG_GAME_LEVELS in main.py
const SONG_GAME_ANSWER_MS = 15000;   // from when the song starts playing
const SONG_GAME_URGENT_MS = 5000;    // the bar pulses for this last stretch
const SONG_GAME_CLIP_MS = 9000;      // xeno-canto recordings can run for minutes
let songGame = null;                 // the level being played, or null
// Leaving the game by any route - a nav tab, the mic - ends the level, so a
// countdown can't run out on a screen that has gone.
new MutationObserver(() => {
  if (songGame && !document.getElementById('sgRound')) stopSongGame();
}).observe(stage, { childList: true });

async function loadSongGameTile() {
  try {
    const res = await fetch('/curated-progress');
    const data = await res.json();
    const tile = document.getElementById('gameMini');
    if (!tile) return;
    // Greyed until 10 birds have been heard. Tapping it anyway opens the
    // game, whose level list says how many more are needed.
    tile.classList.toggle('locked', data.found < SONG_GAME_FIRST_UNLOCK);
  } catch (e) { /* the tile still opens the game */ }
}

function songGameShuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function stopSongGame() {
  if (!songGame) return;
  clearTimeout(songGame.timer);
  clearTimeout(songGame.urgentTimer);
  clearTimeout(songGame.clipTimer);
  if (songGame.audio) { songGame.audio.onended = songGame.audio.onerror = null; songGame.audio.pause(); }
  songGame = null;
}

// The level list. `data` is passed back in from the end of a level so playing
// on doesn't wait on the server again.
async function renderSongGame(data) {
  stopSongGame();
  setActiveTab('home');
  setSceneFocus(false);   // the same light blur as the other screens
  stage.classList.add('top-aligned');
  // No back button: the Home tab is the way out.
  stage.innerHTML = `
    <div class="collection-title">Guess the Song</div>
    <div class="sg-sub">Hear a song, then tap the bird that sang it.<br>Get 6 right for a star - a star opens the next level.</div>
    <div class="sg-levels" id="sgLevels"><div class="sg-note">Loading…</div></div>
  `;
  if (!data) {
    try { data = await (await fetch('/song-game')).json(); }
    catch (e) {
      const el = document.getElementById('sgLevels');
      if (el) el.innerHTML = `<div class="sg-note">Couldn't load the game right now.</div>`;
      return;
    }
  }
  const box = document.getElementById('sgLevels');
  if (!box) return;   // navigated away while loading
  const playable = data.birds.filter(b => b.call_url).length;
  // The one to play next pulses: the highest open level still short of
  // three stars. Usually that's the newest level, with none yet; once every
  // open level has a star, it's the highest one with stars still to win.
  const invite = playable === 0 ? null
    : data.levels.filter(l => l.unlocked && l.stars < 3).pop();
  box.innerHTML = data.levels.map(l => `
    <button class="sg-level woodframe ${l.unlocked ? '' : 'locked'} ${l === invite ? 'invite' : ''}" data-level="${l.level}">
      <span class="sg-level-inner">
        <span class="sg-level-num">${l.level}${l.unlocked ? '' : `<span class="sg-level-lock">${icon('lock')}</span>`}</span>
        <span>
          <span class="sg-level-name">Level ${l.level}</span>
          ${songGameBirdsNeeded(l)}
        </span>
        ${songGameStars(l.stars, 'sg-level-stars')}
      </span>
    </button>`).join('') + (data.message ? `<div class="sg-note">${data.message}</div>` : '');
  box.querySelectorAll('.sg-level').forEach(btn => {
    const level = data.levels.find(l => l.level === +btn.dataset.level);
    if (!level.unlocked || playable === 0) return;
    btn.onclick = () => startSongGameLevel(data, level);
  });
  markSeen('game');
  showTutorial('game', 300);   // only once there's a level to point at
}

// Said only when birds are the one thing a level is waiting for - the
// level before already has its star. Waiting on a star needs no words: the
// level above it is the one pulsing.
function songGameBirdsNeeded(l) {
  if (l.unlocked || l.needs_star || !l.message) return '';
  return `<span class="sg-level-need">${l.message}</span>`;
}

function songGameStars(n, cls) {
  return `<span class="sg-stars ${cls}" aria-label="${n} star${n === 1 ? '' : 's'}">${
    [0, 1, 2].map(i => `<img class="sg-star ${i < n ? 'on' : ''}" style="--d:${i * 220}ms" src="/static/star-v1.webp" alt="">`).join('')}</span>`;
}

function startSongGameLevel(data, level) {
  stopSongGame();
  setSceneFocus(false);
  const playable = data.birds.filter(b => b.call_url);
  // Eight different birds to ask about where there are eight with songs;
  // fewer than that and some come round again, never twice in a row.
  let answers = songGameShuffle(playable);
  while (answers.length < data.rounds) {
    let more = songGameShuffle(playable);
    if (more.length > 1 && more[0] === answers[answers.length - 1]) more.push(more.shift());
    answers = answers.concat(more);
  }
  songGame = { data, level, answers: answers.slice(0, data.rounds), round: 0,
               results: [], noSong: new Set() };
  stage.classList.add('top-aligned');
  stage.innerHTML = `<div class="sg-round" id="sgRound"></div>`;
  renderSongGameRound();
}

// Under the bird tiles rather than at the top of the screen: it's the way
// out of a level part-way through, and down here it's out of the way of the
// play button.
function songGameNavButton(id, art, label, cls = '') {
  return `<button class="sg-navbtn ${cls}" id="${id}" ${cls === 'locked' ? 'disabled' : ''}>
    <img src="/static/${art}.webp" alt=""><span>${label}</span></button>`;
}

function songGameBackButton() {
  return songGameNavButton('sgBack', 'btn-levels-v1', 'Back to levels', 'sg-back');
}

function bindSongGameBack(data) {
  document.getElementById('sgBack').onclick = () => renderSongGame(data);
}

// Shrinks the bird cards until the whole round - play button, cards, the
// answer line and Back to levels - fits on the screen without scrolling.
// Measured rather than guessed, because names wrap differently in narrow
// cards. A level keeps the smallest size it has needed (g.tileMax), so the
// cards don't change size from one round to the next.
// Cards shrink to 80px first; only if the tighter layout still can't fit
// them do they go down to 64px, where long names start to need hyphens.
const SONG_GAME_SMALL_TILE = 80;
const SONG_GAME_MIN_TILE = 64;
function fitSongGameGrid() {
  const g = songGame;
  const grid = document.getElementById('sgGrid');
  const sc = document.getElementById('scroller');
  if (!g || !grid || !sc) return;
  if (g.tileMax) grid.style.setProperty('--tile-max', g.tileMax + 'px');
  else grid.style.removeProperty('--tile-max');
  const root = document.getElementById('sgRound');
  root.classList.toggle('tight', !!g.tight);
  // Measure with the longest answer line this round could show already in
  // place, so a two-line "Not quite - that was a ..." can't tip it over.
  const result = document.getElementById('sgResult');
  const longest = g.choices.reduce((a, b) => birdName(b.common_name).length > a.length ? birdName(b.common_name) : a, '');
  if (result) result.textContent = `Not quite - that was a ${longest}`;
  try { fitSongGameGridNow(g, grid, sc, root); }
  finally { if (result && !g.answered) result.textContent = ''; }
}

function fitSongGameGridNow(g, grid, sc, root) {
  const rows = Math.ceil(g.choices.length / (grid.classList.contains('cols3') ? 3 : 2));
  const shrink = (min) => {
    for (let i = 0; i < 4; i++) {
      const over = sc.scrollHeight - sc.clientHeight;
      if (over <= 0) return true;
      const now = grid.querySelector('.sg-tile').getBoundingClientRect().width;
      const next = Math.max(min, Math.floor(now - over / rows - 1));
      if (next >= now) return false;   // as small as they go
      g.tileMax = next;
      grid.style.setProperty('--tile-max', next + 'px');
    }
    return sc.scrollHeight <= sc.clientHeight;
  };
  // Still too tall with the smallest cards (a small phone): tighten the rest
  // of the round - a smaller play button, less space between things - and
  // size the cards again from the top, since they may now get some back.
  if (shrink(SONG_GAME_SMALL_TILE)) return;
  if (!g.tight) {
    g.tight = true;
    root.classList.add('tight');
    g.tileMax = 0;
    grid.style.removeProperty('--tile-max');
    if (shrink(SONG_GAME_SMALL_TILE)) return;
  }
  shrink(SONG_GAME_MIN_TILE);
}
window.addEventListener('resize', () => {
  if (songGame && !songGame.answered) { songGame.tileMax = 0; songGame.tight = false; fitSongGameGrid(); }
});

function renderSongGameRound() {
  const g = songGame;
  const root = document.getElementById('sgRound');
  if (!g || !root) return stopSongGame();
  const answer = g.answers[g.round];
  // The wrong choices come from every bird heard, songs or not - a picture
  // is all a wrong choice needs.
  const others = songGameShuffle(g.data.birds.filter(b => b !== answer))
    .slice(0, g.level.choices - 1);
  g.choices = songGameShuffle([answer, ...others]);
  g.answered = false;
  g.started = false;
  g.playing = false;
  clearTimeout(g.timer); clearTimeout(g.urgentTimer);
  g.timer = null;   // this round's fifteen seconds start on its first play
  const n = g.choices.length;
  root.innerHTML = `
    <div class="sg-head">Level ${g.level.level} · Round ${g.round + 1} of ${g.data.rounds}</div>
    <button class="photo-icon-btn sg-play invite" id="sgPlay" aria-label="Play the song">
      <img src="/static/btn-play-v1.webp" alt="">
    </button>
    <div class="sg-prompt" id="sgPrompt">Tap play to hear the song</div>
    <div class="sg-timer"><div class="sg-timer-fill" id="sgTimer"></div></div>
    <div class="sg-grid ${n === 2 || n === 4 ? 'cols2' : 'cols3'}" id="sgGrid">
      ${g.choices.map((b, i) => `
        <button class="sg-tile woodframe waiting" data-i="${i}" disabled>
          <span class="sg-photo">
            ${b.own_photo ? `<span class="sg-own" aria-label="Your photo">${icon('camera')}</span>` : ''}
            ${b.image_url
              ? `<img ${b.own_photo ? `src="${escapeFlock(b.image_url)}"` : `class="stock" ${birdImg(b.image_url, 260)}`} alt="">`
              : `<div class="sg-blank">${PAINTED_BIRD}</div>`}
          </span>
          <span class="sg-name">${escapeFlock(birdName(b.common_name))}</span>
        </button>`).join('')}
    </div>
    <div class="sg-result" id="sgResult"></div>
    ${songGameBackButton()}
  `;
  bindSongGameBack(g.data);
  fitSongGameGrid();
  if (g.round === 0) showTutorial('game_round', 300);
  document.getElementById('sgPlay').onclick = playSongGameClip;
  root.querySelectorAll('.sg-tile').forEach(t => {
    t.onclick = () => answerSongGame(g.choices[+t.dataset.i]);
  });
}

// The fifteen seconds start the moment the song first starts playing, and
// listening is part of that time. Replays are allowed but don't reset the
// clock, so a round can't be stretched out forever by replaying it.
function playSongGameClip() {
  const g = songGame;
  if (!g || g.answered || g.playing) return;
  const answer = g.answers[g.round];
  const btn = document.getElementById('sgPlay');
  btn.classList.remove('invite');
  btn.classList.add('playing');
  document.getElementById('sgPrompt').textContent = 'Listen…';
  if (!g.started) {
    g.started = true;
    document.querySelectorAll('.sg-tile').forEach(t => { t.disabled = false; t.classList.remove('waiting'); });
  }
  g.playing = true;
  const audio = new Audio(answer.call_url);
  g.audio = audio;
  // Registered as the app's playing audio, so leaving the screen stops it
  // the same way it stops a call playing on a bird card.
  stopAnyPlayingAudio();
  currentlyPlayingAudio = audio;
  const ended = () => {
    if (songGame !== g || g.audio !== audio) return;
    clearTimeout(g.clipTimer);
    audio.pause();
    g.playing = false;
    if (g.answered) return;
    btn.classList.remove('playing');
    document.getElementById('sgPrompt').textContent = 'Which bird sang that?';
  };
  audio.onended = ended;
  audio.onerror = () => songGameNoSong(answer);
  audio.play().then(() => {
    g.clipTimer = setTimeout(ended, SONG_GAME_CLIP_MS);
    if (!g.timer && songGame === g && !g.answered) startSongGameTimer();
  }).catch(() => songGameNoSong(answer));
}

// A recording that won't play: that bird stops being asked about for the
// rest of this level, and the round starts again with a different one.
function songGameNoSong(bird) {
  const g = songGame;
  if (!g || g.answered || g.answers[g.round] !== bird) return;
  if (g.audio) { g.audio.onended = g.audio.onerror = null; g.audio.pause(); }
  clearTimeout(g.clipTimer);
  clearTimeout(g.timer); clearTimeout(g.urgentTimer);
  g.noSong.add(bird.common_name);
  const left = g.data.birds.filter(b => b.call_url && !g.noSong.has(b.common_name));
  if (!left.length) {
    document.getElementById('sgRound').innerHTML =
      `<div class="sg-note">Warble couldn't play any of the songs just now. Try again later!</div>
       ${songGameBackButton()}`;
    bindSongGameBack(g.data);
    stopSongGame();
    return;
  }
  for (let i = g.round; i < g.answers.length; i++) {
    if (g.noSong.has(g.answers[i].common_name)) g.answers[i] = left[Math.floor(Math.random() * left.length)];
  }
  renderSongGameRound();
}

function startSongGameTimer() {
  const g = songGame;
  const fill = document.getElementById('sgTimer');
  if (!g || !fill) return;
  void fill.offsetWidth;   // let the full bar paint before it starts draining
  fill.style.transitionDuration = fill.style.animationDuration = SONG_GAME_ANSWER_MS + 'ms';
  fill.classList.add('running');
  g.timer = setTimeout(() => { if (songGame === g) answerSongGame(null); }, SONG_GAME_ANSWER_MS);
  // The last five seconds: the bar starts to throb.
  g.urgentTimer = setTimeout(() => {
    if (songGame === g && !g.answered) fill.parentElement.classList.add('urgent');
  }, SONG_GAME_ANSWER_MS - SONG_GAME_URGENT_MS);
}

// `picked` is null when the ten seconds ran out.
function answerSongGame(picked) {
  const g = songGame;
  if (!g || g.answered || !g.started) return;
  g.answered = true;
  clearTimeout(g.timer); clearTimeout(g.urgentTimer);
  clearTimeout(g.clipTimer);
  if (g.audio) { g.audio.onended = g.audio.onerror = null; g.audio.pause(); }
  g.playing = false;
  const answer = g.answers[g.round];
  const right = picked === answer;
  g.results.push(right);

  // Freeze the bar where it got to, rather than letting it finish draining.
  const fill = document.getElementById('sgTimer');
  if (fill) {
    const now = getComputedStyle(fill);
    const transform = now.transform, colour = now.backgroundColor;
    fill.classList.remove('running');
    fill.parentElement.classList.remove('urgent');
    fill.style.transform = transform === 'none' ? '' : transform;
    fill.style.background = colour;   // and keep the colour it had reached
  }
  const btn = document.getElementById('sgPlay');
  if (btn) btn.classList.remove('playing', 'invite');
  document.querySelectorAll('.sg-tile').forEach(t => {
    const b = g.choices[+t.dataset.i];
    t.disabled = true;
    if (b === answer) t.classList.add('right');
    else if (b === picked) t.classList.add('wrong');
    else t.classList.add('out');
    // The painted tick on the bird that sang, and a cross on a wrong pick.
    const mark = b === answer ? 'tick' : b === picked ? 'cross' : null;
    if (mark) t.querySelector('.sg-photo').insertAdjacentHTML('beforeend',
      `<img class="sg-mark ${mark}" src="/static/${mark}-v1.webp" alt="${mark === 'tick' ? 'Right' : 'Wrong'}">`);
  });
  document.getElementById('sgPrompt').textContent = '';
  document.getElementById('sgResult').textContent = right
    ? `Yes! That was a ${birdName(answer.common_name)}!`
    : picked ? `Not quite - that was a ${birdName(answer.common_name)}`
             : `Time's up! That was a ${birdName(answer.common_name)}`;

  setTimeout(() => {
    if (songGame !== g || !document.getElementById('sgRound')) return;
    g.round++;
    if (g.round < g.answers.length) renderSongGameRound();
    else renderSongGameEnd();
  }, right ? 1700 : 2400);
}

// The end screen's stars: a grey socket for each, with the ones won dropping
// in on top a moment after the screen appears, one after another.
function songGameEndStars(n) {
  const src = '/static/star-v1.webp';
  return `<span class="sg-stars sg-end-stars" aria-label="${n} star${n === 1 ? '' : 's'}">${
    [0, 1, 2].map(i => `<span class="sg-slot" style="--d:${350 + i * 450}ms">
      <img class="sg-star" src="${src}" alt="">
      ${i < n ? `<span class="sg-burst"></span><img class="sg-star on" src="${src}" alt="">` : ''}
    </span>`).join('')}</span>`;
}

async function renderSongGameEnd() {
  const g = songGame;
  const root = document.getElementById('sgRound');
  if (!g || !root) return;
  const { data, level } = g;
  const got = g.results.filter(Boolean).length;
  const before = data.levels;
  stopSongGame();
  root.innerHTML = `<div class="sg-head">Level ${level.level}</div>`;

  // The server decides the stars and whether anything new has opened. If it
  // can't be reached, show the stars for this go anyway - only saving them
  // (and so opening the next level) has to wait.
  let stars = Math.max(0, 3 - (g.results.length - got));
  let levels = before;
  let prize = 0, newStars = 0, trophies = [], rankUp = null;   // what this go won
  let challengesDone = [], weekBonus = 0;
  try {
    const form = new FormData();
    form.append('level', level.level);
    form.append('correct', got);
    const res = await fetch('/song-game/result', { method: 'POST', body: form });
    if (res.ok) {
      const out = await res.json();
      stars = out.stars;
      levels = out.levels;
      data.levels = levels;
      prize = out.feathers || 0;
      newStars = out.new_stars || 0;
      trophies = out.newly_earned_trophies || [];
      rankUp = out.rank_up || null;
      challengesDone = out.challenges_done || [];
      weekBonus = out.week_bonus || 0;
      markSeen('game');   // a level it opens is announced right here
    }
  } catch (e) { /* keep the local stars */ }
  if (!document.getElementById('sgRound')) return;   // left while saving

  const next = levels.find(l => l.level === level.level + 1);
  const opened = next && next.unlocked && !before.find(l => l.level === next.level).unlocked;
  const message = opened ? `Level ${next.level} unlocked!`
    : stars === 3 ? 'Every single one!'
    : stars > 0 ? 'Well done!'
    : `Get ${g.results.length - 2} right to earn a star`;
  // A star but the next level still shut: it's waiting on birds, not stars.
  const waiting = stars > 0 && next && !next.unlocked
    ? `<div class="sg-note">Hear ${next.to_go} more bird${next.to_go === 1 ? '' : 's'} to open Level ${next.level}</div>` : '';
  root.innerHTML = `
    <div class="sg-head">Level ${level.level}${stars > 0 ? ' complete!' : ''}</div>
    ${songGameEndStars(stars)}
    <div class="collection-title">You got ${got} of ${g.results.length}</div>
    <div class="sg-message">${message}</div>
    <div class="sg-endnav">
      ${songGameNavButton('sgLevelsBtn', 'btn-levels-v1', 'Back to levels')}
      ${songGameNavButton('sgAgain', 'btn-retry-v1', 'Retry level')}
      ${next ? songGameNavButton('sgNext', 'btn-next-v1', 'Next level', next.unlocked ? 'invite' : 'locked') : ''}
    </div>
    ${waiting}
  `;
  if (next && next.unlocked) document.getElementById('sgNext').onclick = () => startSongGameLevel(data, next);
  document.getElementById('sgAgain').onclick = () => startSongGameLevel(data, levels.find(l => l.level === level.level));
  document.getElementById('sgLevelsBtn').onclick = () => renderSongGame(data);
  // Once the stars have popped in, the moments, in the order they were won:
  // the new stars (they fly back into the stars row), the level they opened
  // (into its button), a challenge, then any trophy.
  if (prize || opened || challengesDone.length || trophies.length || rankUp) setTimeout(() => {
    // Over the score line, so the stars that were just won stay in view.
    const scoreEl = root.querySelector('.collection-title');
    if (!document.getElementById('sgRound')) return;
    if (prize) celebrate({ kicker: newStars === 1 ? 'New star!' : `${newStars} new stars!`,
      name: `Level ${level.level}`, icon: MOMENT_ICONS.star(), feathers: prize,
      from: scoreEl, home: root.querySelector('.sg-end-stars') });
    if (opened) celebrate({ kicker: 'Level unlocked!', name: `Level ${next.level}`,
      icon: MOMENT_ICONS.level(next.level), from: scoreEl, home: document.getElementById('sgNext') });
    celebrateChallenges(challengesDone, weekBonus, scoreEl);
    celebrateTrophies(trophies, scoreEl, rankUp);
  }, reducedMotion() ? 200 : 1400);
}
