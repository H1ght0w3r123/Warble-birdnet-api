<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warble</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk:#2D1B69; --dusk-mid:#3D2A85;
    --terra:#E8845C; --terra-dk:#B85A36;
    --parch:#F5EDD6; --parch-dk:#E9DDBE;
    --gold:#F2C94C; --gold-dk:#B8901F;
    --sage:#7EC8A4; --sage-dk:#3F7C5C;
    --mist:#C4BFDF; --mist-dk:#8E87B8;
    --rose:#E87EA1; --ink:#1A1128;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Space Grotesk',sans-serif;
    color:#fff;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 16px 60px;
    transition:background 1.2s ease;
  }

  /* --- Time-of-day backgrounds, applied globally, every screen --- */
  body.time-dawn{background:linear-gradient(180deg,#3D2A85 0%,#8C6BB0 45%,#F0A868 75%,#F6C98A 100%);}
  body.time-day{background:linear-gradient(180deg,var(--dusk-mid) 0%,var(--mist) 45%,var(--sage) 80%,var(--gold) 100%);}
  body.time-dusk{background:linear-gradient(180deg,var(--dusk) 0%,var(--rose) 45%,var(--terra) 75%,var(--gold) 100%);}
  body.time-night{background:linear-gradient(180deg,var(--ink) 0%,var(--dusk) 60%,var(--dusk-mid) 100%);}

  .top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;}
  .feathers{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--parch-dk);border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px;color:var(--ink);}

  .hero-wordmark{width:100%;max-width:420px;text-align:center;padding:36px 0 18px;}
  .hero-wordmark .wordmark{font-family:'Outfit';font-weight:900;font-size:46px;color:var(--gold);letter-spacing:-0.01em;}

  .stage{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;}

  /* --- Recording screen keeps its pine silhouette as the one
     screen-specific extra, on top of whatever the global time-of-day
     background currently is --- */
  .pines{
    position:fixed; bottom:0; left:0; width:100%; height:70px; background:var(--ink); z-index:0;
    clip-path:polygon(0 100%,0 60%,5% 10%,10% 60%,15% 60%,20% 5%,25% 60%,30% 60%,35% 15%,40% 60%,45% 60%,50% 0%,55% 60%,60% 60%,65% 15%,70% 60%,75% 60%,80% 5%,85% 60%,90% 60%,95% 10%,100% 60%,100% 100%);
  }

  /* --- Idle / Recording --- */
  .mic-btn{
    width:120px;height:120px;border-radius:50%;
    background:var(--terra); color:#fff; font-size:38px;
    border:none; box-shadow:0 8px 0 var(--terra-dk);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; transition:transform .1s; position:relative; z-index:1;
  }
  .mic-btn:active{transform:translateY(6px); box-shadow:0 2px 0 var(--terra-dk);}
  .mic-btn.recording{background:#fff; color:var(--terra-dk); box-shadow:0 8px 0 rgba(0,0,0,0.15); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  .stage-label{margin-top:22px;font-family:'Outfit';font-weight:700;font-size:16px;color:#fff;text-align:center;}
  .stage-sub{margin-top:6px;font-size:13px;color:rgba(255,255,255,0.85);text-align:center;}
  .timer{font-family:'Outfit';font-weight:700;font-size:22px;color:#fff;margin-top:14px;}

  /* --- Card --- */
  .card-wrap{width:100%;display:flex;flex-direction:column;align-items:center;}
  .progress{font-family:'Outfit';font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,0.85);margin-bottom:14px;}
  .card{
    width:100%; max-width:300px; background:#fff; border-radius:20px;
    overflow:hidden; box-shadow:0 12px 30px rgba(45,27,105,0.18);
    border:3px solid var(--tier-color, var(--sage));
  }
  .card-photo{width:100%;height:200px;object-fit:cover;background:var(--parch-dk);display:block;}
  .card-body{padding:16px 18px 20px;}
  .card-name{font-family:'Outfit';font-weight:900;font-size:22px;color:var(--dusk);}
  .card-sci{font-size:12px;font-style:italic;color:var(--mist-dk);margin-top:2px;}
  .card-tags{display:flex;gap:8px;margin-top:10px;}
  .tag{font-family:'Outfit';font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;}
  .tag.tier{background:var(--tier-color, var(--sage)); color:#fff;}
  .tag.new{background:var(--gold); color:var(--ink);}
  .tag.dup{background:var(--parch-dk); color:var(--mist-dk);}
  .feather-row{display:flex;align-items:center;gap:6px;margin-top:14px;font-family:'Outfit';font-weight:700;font-size:15px;color:var(--gold-dk);}
  .next-btn{
    margin-top:22px; width:100%; max-width:300px; padding:15px 0;
    background:var(--terra); color:#fff; font-family:'Outfit'; font-weight:700; font-size:15px;
    border:none; border-radius:30px; box-shadow:0 4px 0 var(--terra-dk); cursor:pointer;
  }

  /* --- Done --- */
  .done-icon{font-size:44px;}
  .done-title{font-family:'Outfit';font-weight:900;font-size:22px;color:#fff;margin-top:10px;}
  .done-sub{color:rgba(255,255,255,0.85);font-size:14px;margin-top:6px;text-align:center;}
  .again-btn{
    margin-top:24px; padding:15px 34px;
    background:var(--dusk); color:#fff; font-family:'Outfit'; font-weight:700; font-size:15px;
    border:none; border-radius:30px; box-shadow:0 4px 0 var(--dusk-mid); cursor:pointer;
  }
  .error{color:#FFD9D2;font-size:13px;margin-top:14px;text-align:center;max-width:320px;}

  /* --- Collection --- */
  .top-btn{background:#fff;border:1px solid var(--parch-dk);border-radius:20px;padding:6px 12px;font-weight:700;font-size:15px;cursor:pointer;color:var(--dusk);}
  .stage.top-aligned{justify-content:flex-start;}
  .collection-header{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .collection-title{font-family:'Outfit';font-weight:900;font-size:20px;color:#fff;}
  .back-btn{background:none;border:none;font-family:'Outfit';font-weight:700;color:#fff;cursor:pointer;font-size:14px;padding:0;}
  .collection-count{font-size:12px;color:rgba(255,255,255,0.85);margin-bottom:14px;}
  .collection-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .collection-item{background:#fff;border-radius:12px;overflow:hidden;border:2px solid var(--tier-color,var(--sage));}
  .collection-item img{width:100%;height:70px;object-fit:cover;display:block;background:var(--parch-dk);}
  .ci-name{font-size:10px;font-weight:700;padding:5px 4px;text-align:center;color:var(--ink);line-height:1.25;}
  .collection-empty{text-align:center;color:rgba(255,255,255,0.85);font-size:13px;margin-top:40px;width:100%;}
  .collection-item{cursor:pointer;}

  /* --- Bird detail --- */
  .detail-card{
    width:100%; max-width:340px; background:#fff; border-radius:20px;
    overflow:hidden; box-shadow:0 12px 30px rgba(45,27,105,0.14);
    border:3px solid var(--tier-color, var(--sage));
  }
  .detail-photo{width:100%;height:220px;object-fit:cover;background:var(--parch-dk);display:block;}
  .detail-body{padding:18px 20px 22px;}
  .detail-name{font-family:'Outfit';font-weight:900;font-size:24px;color:var(--dusk);}
  .detail-sci{font-size:13px;font-style:italic;color:var(--mist-dk);margin-top:2px;}
  .detail-stats{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--parch-dk);}
  .detail-stat-num{font-family:'Outfit';font-weight:900;font-size:18px;color:var(--dusk);}
  .detail-stat-label{font-size:11px;color:var(--mist-dk);}
  .detail-desc{font-size:13px;line-height:1.55;color:var(--ink);margin-top:14px;}

  /* --- Facts dashboard --- */
  .facts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  .fact-tile{background:var(--parch);border-radius:12px;padding:10px 12px;}
  .fact-icon{font-size:20px;}
  .fact-num{font-family:'Outfit';font-weight:900;font-size:17px;color:var(--dusk);margin-top:2px;}
  .fact-label{font-size:10px;color:var(--mist-dk);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
  .fact-compare{font-size:11px;color:var(--ink);margin-top:4px;line-height:1.3;}
  .habitat-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .habitat-tag{display:flex;align-items:center;gap:4px;background:var(--sage);color:#fff;font-family:'Outfit';font-size:11px;font-weight:700;padding:4px 10px;border-radius:12px;}
  .status-badge{display:inline-flex;align-items:center;gap:5px;font-family:'Outfit';font-weight:700;font-size:11px;padding:4px 10px;border-radius:12px;margin-top:10px;}
  .status-badge.status-green{background:#DFF3E6;color:var(--sage-dk);}
  .status-badge.status-amber{background:#FDEBD3;color:var(--terra-dk);}
  .status-badge.status-red{background:#FBDCDC;color:#A83232;}
  .learn-more{display:inline-block;margin-top:14px;font-family:'Outfit';font-weight:700;font-size:12px;color:var(--terra-dk);text-decoration:none;}
  .learn-more:hover{text-decoration:underline;}

  /* --- Trophies --- */
  .trophy-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .trophy-tile{background:#fff;border-radius:14px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .trophy-tile.earned{background:var(--goldbg,#FBF0D8);border:2px solid var(--gold);}
  .trophy-emoji{font-size:32px;}
  .trophy-tile.locked .trophy-emoji{filter:grayscale(1);opacity:.35;}
  .trophy-name{font-family:'Outfit';font-weight:700;font-size:12px;margin-top:6px;color:var(--dusk);}
  .trophy-tile.locked .trophy-name{color:var(--mist-dk);}
  .trophy-banner{
    width:100%;background:var(--goldbg,#FBF0D8);border:2px solid var(--gold);border-radius:16px;
    padding:14px;margin-top:16px;text-align:center;
  }
  .trophy-banner-title{font-family:'Outfit';font-weight:900;font-size:13px;color:var(--gold-dk);text-transform:uppercase;letter-spacing:.04em;}
  .trophy-banner-row{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
  .trophy-banner-emoji{font-size:24px;}
  .trophy-banner-text{text-align:left;}
  .trophy-banner-name{font-family:'Outfit';font-weight:700;font-size:14px;color:var(--dusk);}
  .trophy-banner-citation{font-size:11px;color:var(--mist-dk);}
</style>
</head>
<body>

  <div class="top">
    <button class="top-btn" id="trophiesBtn">🏆</button>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="top-btn" id="collectionBtn">📚</button>
      <div class="feathers">🪶 <span id="featherCount">–</span></div>
    </div>
  </div>

  <div class="hero-wordmark"><div class="wordmark">Warble</div></div>

  <div class="stage" id="stage"></div>

<script>
const stage = document.getElementById('stage');
const featherCountEl = document.getElementById('featherCount');

const TIER_COLORS = { Common: 'var(--sage)', Visitor: 'var(--terra)', Rare: 'var(--gold-dk)' };

let mediaRecorder, audioChunks = [], recordTimerInterval, recordSeconds = 0;
let sessionResults = [], cardIndex = 0;
let allSightingsRaw = [];

async function refreshFeathers() {
  try {
    const res = await fetch('/feathers');
    const data = await res.json();
    featherCountEl.textContent = Math.round(data.total_feathers);
  } catch (e) { /* fine to fail quietly here */ }
}

function renderIdle() {
  stage.innerHTML = `
    <button class="mic-btn" id="recordBtn">🎙</button>
    <div class="stage-label">Go Warbling</div>
    <div class="stage-sub">Tap, then listen for a bird</div>
  `;
  document.getElementById('recordBtn').onclick = startRecording;
}

function renderRecording() {
  stage.innerHTML = `
    <div class="pines"></div>
    <button class="mic-btn recording" id="stopBtn">■</button>
    <div class="timer" id="timer">0:00</div>
    <div class="stage-sub">Tap to stop</div>
  `;
  document.getElementById('stopBtn').onclick = stopRecording;
}

function renderProcessing() {
  stage.innerHTML = `
    <div class="stage-label">Listening back...</div>
    <div class="stage-sub">Working out what you heard</div>
  `;
}

function renderError(message) {
  stage.innerHTML = `
    <div class="stage-label">Hmm, that didn't work</div>
    <div class="error">${message}</div>
    <button class="again-btn" id="retryBtn">Try again</button>
  `;
  document.getElementById('retryBtn').onclick = renderIdle;
}

function renderCard() {
  if (sessionResults.length === 0) { renderNoBirds(); return; }
  const bird = sessionResults[cardIndex];
  const tierColor = TIER_COLORS[bird.tier] || 'var(--sage)';
  stage.innerHTML = `
    <div class="card-wrap">
      <div class="progress">Bird ${cardIndex + 1} of ${sessionResults.length}</div>
      <div class="card" style="--tier-color:${tierColor}">
        ${bird.photo_url ? `<img class="card-photo" src="${bird.photo_url}">` : `<div class="card-photo"></div>`}
        <div class="card-body">
          <div class="card-name">${bird.common_name}</div>
          <div class="card-sci">${bird.scientific_name}</div>
          <div class="card-tags">
            <span class="tag tier">${bird.tier}</span>
            <span class="tag ${bird.is_duplicate ? 'dup' : 'new'}">${bird.is_duplicate ? 'Already found' : 'New!'}</span>
          </div>
          <div class="feather-row">🪶 +${bird.feathers}</div>
          <a class="learn-more" href="${wikipediaUrl(bird.scientific_name)}" target="_blank" rel="noopener">Learn more →</a>
        </div>
      </div>
      <button class="next-btn" id="nextBtn">${cardIndex + 1 < sessionResults.length ? 'Next bird →' : 'Done'}</button>
    </div>
  `;
  document.getElementById('nextBtn').onclick = () => {
    cardIndex++;
    if (cardIndex < sessionResults.length) renderCard(); else renderDone();
  };
}

function wikipediaUrl(scientificName) {
  return `https://en.wikipedia.org/wiki/${scientificName.replace(/ /g, '_')}`;
}

function renderNoBirds() {
  stage.innerHTML = `
    <div class="done-icon">🪹</div>
    <div class="done-title">No birds heard this time</div>
    <div class="done-sub">Try somewhere with more trees, or get a bit closer</div>
    <button class="again-btn" id="againBtn">Go again</button>
  `;
  document.getElementById('againBtn').onclick = renderIdle;
}

function renderCollection() {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="collection-header">
      <button class="back-btn" id="backBtn">← Back</button>
      <div class="collection-title">My Birds</div>
      <div style="width:44px"></div>
    </div>
    <div class="collection-count">Loading...</div>
    <div class="collection-grid" id="collectionGrid"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    renderIdle();
  };
  loadCollection();
}

async function loadCollection() {
  const countEl = stage.querySelector('.collection-count');
  const grid = document.getElementById('collectionGrid');
  try {
    const res = await fetch('/sightings');
    const data = await res.json();
    allSightingsRaw = data.sightings || [];

    // The backend logs every individual sighting — collapse that down
    // to one entry per species for the collection grid, keeping the
    // most recent (the list already arrives newest-first).
    const seen = new Set();
    const uniqueBirds = [];
    for (const s of allSightingsRaw) {
      if (!seen.has(s.common_name)) {
        seen.add(s.common_name);
        uniqueBirds.push(s);
      }
    }

    if (countEl) countEl.textContent = `${uniqueBirds.length} species found`;

    if (uniqueBirds.length === 0) {
      if (grid) grid.outerHTML = `<div class="collection-empty">Nothing found yet — go warbling!</div>`;
      return;
    }

    if (grid) {
      grid.innerHTML = uniqueBirds.map(bird => {
        const tierColor = TIER_COLORS[bird.tier] || 'var(--sage)';
        const photo = bird.image_url
          ? `<img src="${bird.image_url}">`
          : `<div style="height:70px;background:var(--parch-dk);"></div>`;
        return `
          <div class="collection-item" style="--tier-color:${tierColor}" data-name="${bird.common_name}">
            ${photo}
            <div class="ci-name">${bird.common_name}</div>
          </div>
        `;
      }).join('');
      grid.querySelectorAll('.collection-item').forEach(el => {
        el.onclick = () => renderBirdDetail(el.dataset.name);
      });
    }
  } catch (e) {
    if (countEl) countEl.textContent = '';
    if (grid) grid.outerHTML = `<div class="collection-empty">Couldn't load your collection right now.</div>`;
  }
}

function renderBirdDetail(commonName) {
  const matches = allSightingsRaw.filter(s => s.common_name === commonName);
  if (matches.length === 0) return;

  const latest = matches[0]; // list arrives newest-first
  const firstFound = matches[matches.length - 1];
  const tierColor = TIER_COLORS[latest.tier] || 'var(--sage)';
  const firstDate = new Date(firstFound.created_at).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });

  stage.innerHTML = `
    <div style="width:100%;margin-bottom:14px;">
      <button class="back-btn" id="backBtn">← Back</button>
    </div>
    <div class="detail-card" style="--tier-color:${tierColor}">
      ${latest.image_url ? `<img class="detail-photo" src="${latest.image_url}">` : `<div class="detail-photo"></div>`}
      <div class="detail-body">
        <div class="detail-name">${latest.common_name}</div>
        <div class="detail-sci">${latest.scientific_name}</div>
        <div class="card-tags" style="margin-top:10px;">
          <span class="tag tier">${latest.tier}</span>
        </div>
        <div class="detail-stats">
          <div>
            <div class="detail-stat-num">${matches.length}</div>
            <div class="detail-stat-label">Time${matches.length === 1 ? '' : 's'} found</div>
          </div>
          <div>
            <div class="detail-stat-num">${firstDate}</div>
            <div class="detail-stat-label">First found</div>
          </div>
        </div>
        ${buildFactsDashboard(latest.facts)}
        ${(!latest.facts && latest.description) ? `<div class="detail-desc">${latest.description}</div>` : ''}
        <a class="learn-more" href="${wikipediaUrl(latest.scientific_name)}" target="_blank" rel="noopener">Learn more →</a>
      </div>
    </div>
  `;
  document.getElementById('backBtn').onclick = renderCollection;
}

const HABITAT_ICONS = {
  'Garden & Parks': '🌳', 'Woodland': '🌲', 'Wetland & Coast': '🌊',
  'Farmland': '🌾', 'Towns & Cities': '🏘️',
};

function buildFactsDashboard(facts) {
  if (!facts) return '';
  const habitatTags = (facts.habitats || [])
    .map(h => `<span class="habitat-tag">${HABITAT_ICONS[h] || '📍'} ${h}</span>`)
    .join('');
  const statusClass = facts.conservation_status === 'Green' ? 'status-green'
    : facts.conservation_status === 'Amber' ? 'status-amber' : 'status-red';
  return `
    <div class="facts-grid">
      <div class="fact-tile">
        <div class="fact-icon">⚖️</div>
        <div class="fact-num">${facts.weight_g}g</div>
        <div class="fact-label">Weight</div>
        ${facts.weight_comparison ? `<div class="fact-compare">${facts.weight_comparison}</div>` : ''}
      </div>
      <div class="fact-tile">
        <div class="fact-icon">📏</div>
        <div class="fact-num">${facts.wingspan_cm}cm</div>
        <div class="fact-label">Wingspan</div>
        ${facts.size_comparison ? `<div class="fact-compare">${facts.size_comparison}</div>` : ''}
      </div>
    </div>
    ${habitatTags ? `<div class="habitat-tags">${habitatTags}</div>` : ''}
    <div class="status-badge ${statusClass}">🛡️ ${facts.conservation_status} status</div>
  `;
}

function renderDone() {
  const total = sessionResults.reduce((sum, b) => sum + b.feathers, 0);
  const trophyBanners = newlyEarnedTrophies.map(t => `
    <div class="trophy-banner">
      <div class="trophy-banner-title">🏆 Trophy earned!</div>
      <div class="trophy-banner-row">
        <div class="trophy-banner-emoji">${t.emoji}</div>
        <div class="trophy-banner-text">
          <div class="trophy-banner-name">${t.name}</div>
          <div class="trophy-banner-citation">${t.citation}</div>
        </div>
      </div>
    </div>
  `).join('');
  stage.innerHTML = `
    <div class="done-icon">✨</div>
    <div class="done-title">Nice warble!</div>
    <div class="done-sub">You earned ${total} feathers this session</div>
    ${trophyBanners}
    <button class="again-btn" id="againBtn">Go again</button>
  `;
  document.getElementById('againBtn').onclick = renderIdle;
  newlyEarnedTrophies = [];
  refreshFeathers();
}

let currentLat = null, currentLng = null, newlyEarnedTrophies = [];

function requestGpsPosition() {
  // Fire-and-forget — recording shouldn't wait on this. A recording is
  // several seconds long at minimum, plenty of time for GPS to resolve
  // before Stop is actually pressed. If it fails or isn't available,
  // currentLat/currentLng just stay null and the backend's own default
  // location is used instead.
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      currentLat = pos.coords.latitude;
      currentLng = pos.coords.longitude;
    },
    (err) => {
      console.log('GPS unavailable, using default location:', err.message);
    },
    { timeout: 8000 }
  );
}

async function startRecording() {
  try {
    requestGpsPosition();
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.start();
    recordSeconds = 0;
    renderRecording();
    recordTimerInterval = setInterval(() => {
      recordSeconds++;
      const m = Math.floor(recordSeconds / 60), s = recordSeconds % 60;
      const timerEl = document.getElementById('timer');
      if (timerEl) timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }, 1000);
  } catch (e) {
    renderError("Couldn't access your microphone. Check your browser's permission settings.");
  }
}

function stopRecording() {
  clearInterval(recordTimerInterval);
  mediaRecorder.onstop = async () => {
    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
    renderProcessing();
    try {
      const formData = new FormData();
      formData.append('file', audioBlob, 'recording.webm');
      if (currentLat !== null && currentLng !== null) {
        formData.append('lat', currentLat);
        formData.append('lng', currentLng);
      }
      const res = await fetch('/analyze-session', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(`Server responded with ${res.status}`);
      const data = await res.json();
      sessionResults = data.detections || [];
      newlyEarnedTrophies = data.newly_earned_trophies || [];
      cardIndex = 0;
      renderCard();
    } catch (e) {
      renderError(e.message || 'Something went wrong talking to the server.');
    }
  };
  mediaRecorder.stop();
  mediaRecorder.stream.getTracks().forEach(t => t.stop());
}

function applyTimeOfDayBackground() {
  const hour = new Date().getHours();
  let band;
  if (hour >= 5 && hour < 8) band = 'time-dawn';
  else if (hour >= 8 && hour < 17) band = 'time-day';
  else if (hour >= 17 && hour < 21) band = 'time-dusk';
  else band = 'time-night';
  document.body.classList.add(band);
}

applyTimeOfDayBackground();
renderIdle();
refreshFeathers();
document.getElementById('collectionBtn').onclick = renderCollection;
document.getElementById('trophiesBtn').onclick = renderTrophies;

async function renderTrophies() {
  stage.classList.add('top-aligned');
  stage.innerHTML = `
    <div class="collection-header">
      <button class="back-btn" id="backBtn">← Back</button>
      <div class="collection-title">Trophies</div>
      <div style="width:44px"></div>
    </div>
    <div class="collection-count">Loading...</div>
    <div class="trophy-grid" id="trophyGrid"></div>
  `;
  document.getElementById('backBtn').onclick = () => {
    stage.classList.remove('top-aligned');
    renderIdle();
  };

  const countEl = stage.querySelector('.collection-count');
  const grid = document.getElementById('trophyGrid');
  try {
    const res = await fetch('/trophies');
    const data = await res.json();
    const trophies = data.trophies || [];
    const earnedCount = trophies.filter(t => t.earned).length;
    if (countEl) countEl.textContent = `${earnedCount} of ${trophies.length} earned`;
    if (grid) {
      grid.innerHTML = trophies.map(t => `
        <div class="trophy-tile ${t.earned ? 'earned' : 'locked'}">
          <div class="trophy-emoji">${t.earned ? t.emoji : '❔'}</div>
          <div class="trophy-name">${t.earned ? t.name : '???'}</div>
        </div>
      `).join('');
    }
  } catch (e) {
    if (countEl) countEl.textContent = '';
    if (grid) grid.outerHTML = `<div class="collection-empty">Couldn't load trophies right now.</div>`;
  }
}
</script>
